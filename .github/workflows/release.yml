name: Instaladores macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            java-arch: aarch64
          - runner: macos-15-intel
            arch: x64
            java-arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.java-arch }}
          cache: maven
      - name: Comprobar arquitectura y versión
        id: version
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "$EXPECTED_ARCH:$actual" in arm64:arm64|x64:x86_64) ;; *) echo "Arquitectura incorrecta: $actual" >&2; exit 1 ;; esac
          version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión de release no válida: $version" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            git fetch --no-tags origin "refs/tags/v$version:refs/tags/v$version"
            test "$(git rev-list -n 1 "v$version")" = "$GITHUB_SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compilar y pasar tests sin interfaz
        run: mvn -B clean package -DrunUiTests=false
      - name: Crear DMG con runtime incluido
        shell: bash
        env:
          PACKAGE_TYPE: dmg
          PACKAGE_SKIP_BUILD: 'true'
          PACKAGE_OUTPUT_DIR: dist/release
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash package_macos.sh
          mv "dist/release/CryptoCarver-${RELEASE_VERSION}.dmg" "dist/release/CryptoCarver-${RELEASE_VERSION}-macos-${RELEASE_ARCH}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Crear release en borrador
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: installers
          merge-multiple: true
      - name: Preparar notas y checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          set -euo pipefail
          test -f "installers/CryptoCarver-${RELEASE_VERSION}-macos-arm64.dmg"
          test -f "installers/CryptoCarver-${RELEASE_VERSION}-macos-x64.dmg"
          (cd installers && sha256sum *.dmg > SHA256SUMS)
          cat > release-notes.md <<'NOTES'
          Instaladores macOS con Java incluido. Apple Silicon: arm64; Intel: x64.
          Arrastra CryptoCarver a Aplicaciones. La aplicación no está firmada con
          Developer ID ni notarizada. En la primera apertura usa clic derecho → Abrir.
          Si macOS mantiene la cuarentena, tras verificar el origen del instalador:
          `xattr -dr com.apple.quarantine /Applications/CryptoCarver.app`
          Revisa ambos instaladores y los checksums antes de publicar este borrador.
          NOTES
      - name: Crear o actualizar solamente un borrador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          # workflow_dispatch requiere una etiqueta existente; nunca crea etiquetas.
          gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null
          if gh release view "$tag" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "La release ya está publicada; no se modifica"'
          else
            gh release create "$tag" --verify-tag --draft --title "CryptoCarver $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$tag" installers/*.dmg installers/SHA256SUMS --clobber
