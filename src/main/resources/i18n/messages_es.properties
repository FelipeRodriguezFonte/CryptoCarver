help.option.op_gen_batch.operation.utf8-to-hex=Codifica cada cadena como bytes UTF-8 y devuelve dos dígitos Hex por byte.
help.option.op_gen_batch.operation.utf8-to-hex.example=Con input=Hola, result=486f6c61; la ñ ocupa dos bytes UTF-8.
help.option.op_gen_batch.operation.utf8-to-hex.error=Texto vacío es válido y produce salida vacía; si falta la columna input, la fila falla en el runner.
help.option.op_gen_batch.operation.hex-to-utf8=Interpreta la celda como Hex de bytes y decodifica esos bytes como UTF-8.
help.option.op_gen_batch.operation.hex-to-utf8.example=Con input=486f6c61, result=Hola.
help.option.op_gen_batch.operation.hex-to-utf8.error=input=48Z0 falla como Hex mal formado; no se sustituye por texto literal.
help.option.op_gen_batch.operation.utf8-to-base64=Codifica los bytes UTF-8 de la celda con Base64 estándar, con padding cuando corresponda.
help.option.op_gen_batch.operation.utf8-to-base64.example=Con input=Hi, result=SGk=.
help.option.op_gen_batch.operation.utf8-to-base64.error=Cualquier texto UTF-8, incluso vacío, se puede codificar; la fila falla si falta input.
help.option.op_gen_batch.operation.base64-to-utf8=Decodifica Base64 estándar y convierte los bytes obtenidos a texto UTF-8.
help.option.op_gen_batch.operation.base64-to-utf8.example=Con input=SGk=, result=Hi.
help.option.op_gen_batch.operation.base64-to-utf8.error=input=SGk! falla por caracteres Base64 no válidos; bytes no válidos como UTF-8 pueden reemplazarse por el decoder Java.
help.option.op_gen_batch.operation.hexadecimal-to-base64=Interpreta Hex como bytes y codifica esos bytes en Base64 estándar.
help.option.op_gen_batch.operation.hexadecimal-to-base64.example=Con input=4869, result=SGk=.
help.option.op_gen_batch.operation.hexadecimal-to-base64.error=input=48Z0 falla en el parser Hex antes de Base64.
help.option.op_gen_batch.operation.base64-to-hexadecimal=Decodifica Base64 estándar y devuelve los bytes como Hex minúsculo.
help.option.op_gen_batch.operation.base64-to-hexadecimal.example=Con input=SGk=, result=4869.
help.option.op_gen_batch.operation.base64-to-hexadecimal.error=input=SGk! se rechaza como Base64 inválido.
help.option.op_gen_batch.operation.utf8-to-base64url=Codifica texto UTF-8 con Base64URL, usando el alfabeto seguro para URL y sin padding final.
help.option.op_gen_batch.operation.utf8-to-base64url.example=Con input=Hi, result=SGk (sin el = final de Base64 estándar).
help.option.op_gen_batch.operation.utf8-to-base64url.error=Texto UTF-8 se puede codificar; si falta input, falla la validación común de fila.
help.option.op_gen_batch.operation.base64url-to-utf8=Decodifica Base64URL (no Base64 estándar) y presenta los bytes como texto UTF-8.
help.option.op_gen_batch.operation.base64url-to-utf8.example=Con input=SGk, result=Hi.
help.option.op_gen_batch.operation.base64url-to-utf8.error=input=SGk+ se rechaza: + pertenece a Base64 estándar, no al alfabeto Base64URL admitido.
help.option.op_gen_batch.operation.luhn-mod-10-to-calculate-check-digit=Exige una base no vacía de cifras ASCII; devuelve solo el dígito Luhn, no concatena la base.
help.option.op_gen_batch.operation.luhn-mod-10-to-calculate-check-digit.example=Con input=7992739871, result=3; el número completo sería 79927398713.
help.option.op_gen_batch.operation.luhn-mod-10-to-calculate-check-digit.error=input=79927A falla: el calculador Batch requiere cifras ASCII solamente.
help.option.op_gen_batch.operation.luhn-mod-10-to-validate-check-digit=Exige al menos dos cifras ASCII; interpreta la última como control y devuelve true o false.
help.option.op_gen_batch.operation.luhn-mod-10-to-validate-check-digit.example=Con input=79927398713, result=true; cambiar el último dígito a 4 devuelve false.
help.option.op_gen_batch.operation.luhn-mod-10-to-validate-check-digit.error=input=79927A se rechaza porque la entrada solo admite cifras ASCII.
help.option.op_gen_batch.operation.verhoeff-to-calculate-check-digit=Calcula el control Verhoeff para una base no vacía de cifras ASCII y devuelve solo el dígito.
help.option.op_gen_batch.operation.verhoeff-to-calculate-check-digit.example=Con input=572, result=7; el valor completo sería 5727.
help.option.op_gen_batch.operation.verhoeff-to-calculate-check-digit.error=input=57x falla porque esta entrada exige cifras ASCII.
help.option.op_gen_batch.operation.verhoeff-to-validate-check-digit=Valida el último dígito con Verhoeff; requiere al menos dos cifras ASCII y devuelve true/false.
help.option.op_gen_batch.operation.verhoeff-to-validate-check-digit.example=Con input=5727, result=true; 5728 devuelve false.
help.option.op_gen_batch.operation.verhoeff-to-validate-check-digit.error=input=572 falla por incluir una única cifra de base sin dígito separador/control.
help.option.op_gen_batch.operation.damm-to-calculate-check-digit=Calcula el dígito Damm para una base no vacía de cifras ASCII y devuelve solo ese dígito.
help.option.op_gen_batch.operation.damm-to-calculate-check-digit.example=Con input=572, result=4; el valor completo sería 5724.
help.option.op_gen_batch.operation.damm-to-calculate-check-digit.error=input=57x se rechaza; no se eliminan separadores ni letras en Batch.
help.option.op_gen_batch.operation.damm-to-validate-check-digit=Comprueba el último dígito con Damm; requiere al menos dos cifras ASCII y devuelve true/false.
help.option.op_gen_batch.operation.damm-to-validate-check-digit.example=Con input=5724, result=true; 5725 devuelve false.
help.option.op_gen_batch.operation.damm-to-validate-check-digit.error=input=57x se rechaza por no ser cifras ASCII; 5725 tiene formato válido y devuelve false.
help.option.op_gen_batch.operation.sha-1=Calcula SHA-1 sobre UTF-8 y devuelve el digest de 20 bytes en Hex minúsculo; se conserva por compatibilidad.
help.option.op_gen_batch.operation.sha-1.example=Con input=abc, result=a9993e364706816aba3e25717850c26c9cd0d89d.
help.option.op_gen_batch.operation.sha-1.error=Una cadena vacía es válida; si la fila omite input, el runner informa la columna origen ausente.
help.option.op_gen_batch.operation.sha-224=Calcula SHA-224 sobre UTF-8 y devuelve 28 bytes (56 dígitos Hex) en minúscula.
help.option.op_gen_batch.operation.sha-224.example=Con input=abc, result=23097d223405d8228642a477bda255b32aadbce4bda0b3f7e36c9da7.
help.option.op_gen_batch.operation.sha-224.error=La entrada es texto UTF-8, no Hex; una fila sin input falla antes del digest.
help.option.op_gen_batch.operation.sha3-256=Calcula SHA3-256 (familia SHA-3) sobre UTF-8 y devuelve 32 bytes en Hex minúsculo.
help.option.op_gen_batch.operation.sha3-256.example=Con input=abc, result=3a985da74fe225b2045c172d6bd390bd855f086e3e9d525b46bfe24511431532.
help.option.op_gen_batch.operation.sha3-256.error=No se parsea el input como Hex; una celda vacía se hashea como cero bytes y una columna ausente falla.
help.option.op_gen_batch.operation.sha3-512=Calcula SHA3-512 sobre bytes UTF-8 y devuelve 64 bytes (128 dígitos Hex) en minúscula.
help.option.op_gen_batch.operation.sha3-512.example=Con input=abc, el digest empieza b751850b y tiene 128 dígitos Hex.
help.option.op_gen_batch.operation.sha3-512.error=La operación acepta texto libre; la ausencia de input se informa por fila antes del hash.
help.option.op_gen_batch.operation.md5=Calcula MD5 de bytes UTF-8 y devuelve 16 bytes en Hex minúsculo; el catálogo lo marca como heredado.
help.option.op_gen_batch.operation.md5.example=Con input=abc, result=900150983cd24fb0d6963f7d28e17f72.
help.option.op_gen_batch.operation.md5.error=Se acepta texto vacío; una columna input ausente genera un error de fila, no un resumen vacío.
help.option.op_gen_batch.operation.crc32=Calcula CRC-32/ISO-HDLC sobre bytes UTF-8 y devuelve cuatro bytes como Hex minúsculo.
help.option.op_gen_batch.operation.crc32.example=Con input=123456789, result=cbf43926.
help.option.op_gen_batch.operation.crc32.error=Es un checksum de UTF-8, no un CRC sobre bytes Hex; fila sin input falla por columna ausente.
help.option.op_gen_batch.operation.crc32c=Calcula CRC-32C/Castagnoli (CRC-32/ISCSI), distinto de CRC-32/ISO-HDLC, sobre UTF-8.
help.option.op_gen_batch.operation.crc32c.example=Con input=123456789, result=e3069283; CRC32 produciría cbf43926.
help.option.op_gen_batch.operation.crc32c.error=Una fila JSONL sin input falla en la comprobación común de columna origen; con input presente, toda cadena UTF-8 se calcula.
help.option.op_gen_batch.operation.utf8-to-base32=Codifica bytes UTF-8 con Base32 RFC 4648 y conserva el padding = emitido por el codec.
help.option.op_gen_batch.operation.utf8-to-base32.example=Con input=foo, result=MZXW6===.
help.option.op_gen_batch.operation.utf8-to-base32.error=Texto vacío se codifica como salida vacía; si falta la columna fuente, falla el runner.
help.option.op_gen_batch.operation.base32-to-utf8=Decodifica Base32 con el alfabeto/padding admitido por el codec y convierte bytes a UTF-8.
help.option.op_gen_batch.operation.base32-to-utf8.example=Con input=MZXW6===, result=foo.
help.option.op_gen_batch.operation.base32-to-utf8.error=input=MZXW6=! se rechaza como Base32 mal formado.
help.option.op_gen_batch.operation.utf8-to-base58=Convierte bytes UTF-8 a Base58 con el alfabeto del codec; no añade checksum Base58Check.
help.option.op_gen_batch.operation.utf8-to-base58.example=Con input=Hello World, result=JxF12TrwUP45BMd.
help.option.op_gen_batch.operation.utf8-to-base58.error=Una fila sin input falla antes de codificar; con texto presente, esta operación Base58 siempre codifica y no añade checksum.
help.option.op_gen_batch.operation.base58-to-utf8=Decodifica Base58 sin checksum y presenta los bytes resultantes como UTF-8.
help.option.op_gen_batch.operation.base58-to-utf8.example=Con input=JxF12TrwUP45BMd, result=Hello World.
help.option.op_gen_batch.operation.base58-to-utf8.error=input=0 se rechaza porque 0 no forma parte del alfabeto Base58 del codec.
help.option.op_gen_batch.operation.utf8-to-base94=Codifica los bytes UTF-8 como Base94 con el alfabeto imprimible definido por el codec.
help.option.op_gen_batch.operation.utf8-to-base94.example=Con input=foo, result=)(h".
help.option.op_gen_batch.operation.utf8-to-base94.error=Una fila sin input falla en el control de columna origen; cualquier texto UTF-8 presente se puede codificar.
help.option.op_gen_batch.operation.base94-to-utf8=Decodifica la representación Base94 del codec y convierte los bytes resultantes a UTF-8.
help.option.op_gen_batch.operation.base94-to-utf8.example=Con input=)(h", result=foo.
help.option.op_gen_batch.operation.base94-to-utf8.error=input= ! se rechaza porque incluye espacio, fuera del alfabeto Base94 admitido.
help.option.op_gen_batch.operation.decimal-to-packed-bcd-hex=Lee solo cifras decimales ASCII; empaqueta cada nibble y devuelve bytes Hex mayúsculos, con F de relleno si hace falta.
help.option.op_gen_batch.operation.decimal-to-packed-bcd-hex.example=Con input=12345, result=012345; el nibble F completa el último byte internamente.
help.option.op_gen_batch.operation.decimal-to-packed-bcd-hex.error=input=12x falla porque no todas las posiciones son cifras decimales.
help.option.op_gen_batch.operation.packed-bcd-hex-to-decimal=Interpreta la celda como bytes Hex con nibbles BCD; devuelve las cifras como texto decimal.
help.option.op_gen_batch.operation.packed-bcd-hex-to-decimal.example=Con input=012345, result=012345; conserva el cero inicial representado.
help.option.op_gen_batch.operation.packed-bcd-hex-to-decimal.error=input=0 falla por longitud Hex impar; nibbles no decimales también se rechazan.
help.option.op_gen_batch.operation.amex-se-to-calculate-check-digit=Calcula solo el dígito usando el mismo cálculo Luhn/Mod 10; el nombre AMEX SE no comprueba emisor ni rango.
help.option.op_gen_batch.operation.amex-se-to-calculate-check-digit.example=Con input=7992739871, result=3; no valida que el prefijo pertenezca a American Express.
help.option.op_gen_batch.operation.amex-se-to-calculate-check-digit.error=input=12x se rechaza por caracteres no numéricos; no es un validador de cuenta AMEX.
help.option.op_gen_batch.operation.pan-to-validate-luhn-13-19-digits=Solo devuelve true si hay 13–19 cifras ASCII y el control Luhn es válido; no valida emisor ni cuenta.
help.option.op_gen_batch.operation.pan-to-validate-luhn-13-19-digits.example=Con input=4111111111111111, result=true; 4111111111111112 devuelve false.
help.option.op_gen_batch.operation.pan-to-validate-luhn-13-19-digits.error=input=4111x... devuelve false por longitud/caracteres, no un diagnóstico de formato.
help.option.op_gen_batch.operation.track-2-to-analyze-json=Acepta Track 2 con o sin sentinelas; convierte D/d a =, quita relleno F final y extrae PAN, caducidad YYMM y servicio.
help.option.op_gen_batch.operation.track-2-to-analyze-json.example=Con input=1234567890123456D2512101F, JSON contiene pan=1234567890123456, expiry=2512 y serviceCode=101.
help.option.op_gen_batch.operation.track-2-to-analyze-json.error=input=not-track-data falla al faltar separador y campos mínimos de Track 2.
help.option.op_gen_batch.operation.emv-tlv-to-json=Lee TLV EMV en Hex y devuelve el árbol/parámetros interpretados como JSON; no valida una transacción completa.
help.option.op_gen_batch.operation.emv-tlv-to-json.example=Con input=9F0206000000000100, el JSON incluye la etiqueta 9F02 con longitud 6.
help.option.op_gen_batch.operation.emv-tlv-to-json.error=input=ZZ falla antes del análisis: la representación esperada son dígitos Hex pares.
help.option.op_gen_batch.operation.apdu-status-to-inspect=Interpreta una palabra SW1/SW2 de dos bytes Hex y devuelve el significado conocido como JSON.
help.option.op_gen_batch.operation.apdu-status-to-inspect.example=Con input=9000, el JSON clasifica el estado como SUCCESS.
help.option.op_gen_batch.operation.apdu-status-to-inspect.error=input=900 es Hex válido pero solo tiene tres dígitos; el estado APDU requiere dos bytes.
help.option.op_gen_batch.operation.asn-1-to-inspect=Prueba primero Hex y, si falla, Base64; analiza ASN.1 y devuelve el árbol como JSON, sin verificar firmas.
help.option.op_gen_batch.operation.asn-1-to-inspect.example=Con input=3003020101 (SEQUENCE con INTEGER 1), el JSON contiene INTEGER.
help.option.op_gen_batch.operation.asn-1-to-inspect.error=input=ZZ no se puede decodificar como Hex/Base64 ni parsear como ASN.1.
help.option.op_gen_batch.operation.tlv-to-inspect=Interpreta bytes TLV desde Hex y devuelve las etiquetas/valores en JSON; no aplica semántica EMV de transacción.
help.option.op_gen_batch.operation.tlv-to-inspect.example=Con input=5A081234567890123456, el JSON incluye la etiqueta 5A.
help.option.op_gen_batch.operation.tlv-to-inspect.error=input=ZZ falla en la decodificación Hex antes de analizar la estructura TLV.
help.option.op_gen_batch.operation.tr-31-to-header-json=Analiza solo la cabecera TR-31 y los campos que contiene; no descifra ni autentica el bloque ni usa una KBPK.
help.option.op_gen_batch.operation.tr-31-to-header-json.example=Con input=B0016P0TE00E0000, JSON indica versión B y uso PIN Encryption Key.
help.option.op_gen_batch.operation.tr-31-to-header-json.error=Una cabecera con versión Z se rechaza como versión TR-31 no compatible; no se verifica el MAC del bloque.
help.field.op_gen_batch.input.label=Texto de entrada del lote
help.field.op_gen_batch.input.description=CSV requiere una cabecera; JSON Lines, un objeto con campos escalares por línea no vacía. La ayuda no lee el texto. CSV y JSONL rechazan nombres de campo sensibles; cada celda admite hasta 100.000 caracteres, la entrada total hasta 100.000.000 y el parser hasta 10.000 filas.
help.field.op_gen_batch.input_format.description=Elige el parser del texto pegado. CSV usa comas, campos entre comillas dobles, comillas escapadas y una cabecera obligatoria sin duplicados. JSON Lines lee un objeto por línea no vacía; rechaza arrays y valores anidados. Ambos formatos requieren nombres de columna seguros, no sensibles.
help.field.op_gen_batch.source_column.description=Debe coincidir exactamente con una cabecera/propiedad presente en todas las filas. No puede estar vacío; las filas deben incluirla. CSV/JSONL rechazan nombres que identifiquen secretos o datos sensibles (por ejemplo key, password, PIN, PAN, IV, nonce, AAD, token, certificate, signature o MAC).
help.field.op_gen_batch.destination_column.description=Nombra la propiedad de salida que se añade al resultado de cada fila correcta. Origen y destino son nombres independientes; la operación lee solo el valor origen y la vista muestra hasta 50 filas.
help.field.op_gen_batch.results.description=Muestra como máximo 50 resultados terminados con número de fila, OK/ERR y salida o error. Un informe completado se puede exportar íntegro; una tarea cancelada no deja informe exportable.
help.field.op_gen_batch.progress.description=El progreso cuenta las filas que terminan con éxito o error de operación. No cuenta filas pendientes omitidas por cancelación o por detenerse ante un error.
help.field.op_gen_batch.compact.description=Esta casilla solo la usa la rama oculta Encrypt Record/Decrypt Record, que no figura en el catálogo seleccionable. No afecta a ninguna de las 40 operaciones disponibles.
help.field.op_gen_batch.record_encoding.description=Este selector solo representa la salida cifrada de la rama oculta Encrypt Record/Decrypt Record. Ninguna de las 40 operaciones seleccionables lo utiliza.
help.action.op_gen_batch.load_input.description=Lee el fichero elegido como UTF-8. El diálogo acepta CSV, JSONL, NDJSON o TXT: .csv selecciona CSV y las demás extensiones, JSON Lines. El texto pegado se interpreta según el selector visible de formato.
help.action.op_gen_batch.load_input.example=Al cargar filas.csv se selecciona CSV; filas.ndjson selecciona JSON Lines. Otras extensiones también usan JSON Lines por defecto: revisa el selector antes de Simular.
help.action.op_gen_batch.dry_run.description=Parsea y valida cantidad de filas, columnas origen/destino y operación seleccionada. No invoca BatchOperationCatalog.execute, no escribe ficheros ni crea historial, y conserva el texto de entrada. Presenta el plan en resultados.
help.action.op_gen_batch.dry_run.example=Con columna origen payload y filas que solo contienen input, Simular señala que falta el campo origen y no invoca la conversión elegida.
help.action.op_gen_batch.run.description=Parsea el formato elegido, comprueba que cada fila tenga la columna origen y ejecuta la operación sin estado permitida sobre cada cadena origen. Cada fila intentada conserva su número y obtiene salida o error propio; ninguna operación seleccionable lee key/IV/AAD.
help.action.op_gen_batch.run.example=Con Hexadecimal → UTF-8 y filas input=4869, ZZ y 776f, el informe contiene Hi, error Hex y wo si Detener ante error está desactivado. Si está activado, el primer fallo solicita cancelación cooperativa; las filas que ya se ejecutan pueden terminar.
help.action.op_gen_batch.cancel.description=Solicita cancelar la tarea cooperativamente. El coordinador descarta el informe cancelado y limpia resultados; no se pueden exportar resultados parciales.
help.action.op_gen_batch.cancel.example=Cancela mientras se procesan filas; al terminar, el estado indica Cancelado, los resultados visibles se limpian y Exportar no tiene un informe completado.
help.action.op_gen_batch.reset.description=Cancela el trabajo activo y limpia entrada, resultados visibles, progreso, estado del informe y controles temporales key/IV/AAD. No ejecuta ni exporta ninguna operación.
help.action.op_gen_batch.reset.example=Tras introducir filas de ejemplo, Reiniciar vacía entrada/resultados, pone el progreso a cero, borra campos criptográficos temporales y elimina cualquier informe terminado.
help.action.op_gen_batch.export.description=Escribe el último informe completado como CSV o JSON Lines UTF-8, según el selector independiente de exportación. No se exporta si no existe informe o fue cancelado; BatchOutputCodec serializa comillas CSV y escalares JSON.
help.action.op_gen_batch.export.example=Tras completar dos filas, elige JSON Lines para guardar un objeto resultado por fila: número, estado, campos originales, destino si tuvo éxito o texto del error.
help.field.op_gen_batch.export_format.description=Solo controla la serialización del informe exportado; no cambia el parser de entrada. CSV separa por comas y escapa celdas entre comillas; JSON Lines escribe un objeto por fila.


help.node.ports.console_input=Sin puerto de entrada. Salida: TEXT_UTF8.




help.node.ports.file_input=Sin puerto de entrada. Salida: BINARY.




help.node.ports.console_output=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida contrato BINARY no se usa en el nodo de salida.




help.node.ports.file_output=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida contrato BINARY no se usa en el nodo de salida.




help.node.ports.base64=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.base64_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BASE64.




help.node.ports.base64_decode=Entrada obligatoria admite BASE64 o TEXT_UTF8; salida BINARY.



module.process.desc.base64urlEncode=Codifica bytes con el alfabeto Base64URL sin relleno.

help.node.ports.base64url_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BASE64URL.



module.process.desc.base64urlDecode=Decodifica texto Base64URL a bytes.

help.node.ports.base64url_decode=Entrada obligatoria admite BASE64URL o TEXT_UTF8; salida BINARY.




help.node.ports.hex_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida HEX.




help.node.ports.hex_decode=Entrada obligatoria admite HEX o TEXT_UTF8; salida BINARY.




help.node.ports.utf8_encode=Entrada obligatoria admite TEXT_UTF8; salida BINARY.




help.node.ports.utf8_decode=Entrada obligatoria admite BINARY; salida TEXT_UTF8.




help.node.ports.base32_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.




help.node.ports.base32_decode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.base58_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.




help.node.ports.base58_decode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.



module.process.desc.base58checkEncode=Codifica bytes en Base58Check con checksum.

help.node.ports.base58check_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.



module.process.desc.base58checkDecode=Decodifica Base58Check y verifica el checksum.

help.node.ports.base58check_decode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.ebcdic_encode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.ebcdic_decode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.




help.node.ports.compress=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.decompress=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.charset_convert=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.




help.node.ports.concat=Las entradas obligatorias a y b admiten BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.slice=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.pad=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.unpad=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.xor=Las entradas obligatorias a y b admiten BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.assert_equals=Las entradas obligatorias actual y expected admiten BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida BINARY.




help.node.ports.asn1_decode=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.




help.node.ports.check_digit_calc=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.




help.node.ports.check_digit_verify=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.








help.node.ports.uuid_generate=Sin puerto de entrada. Salida: TEXT_UTF8.




help.node.ports.byte_statistics=Entrada obligatoria admite BASE64, BASE64URL, BINARY, HEX o TEXT_UTF8; salida TEXT_UTF8.



help.node.parameter.compress.format=Wrapper de compresión; predeterminado gzip. gzip añade cabecera/tráiler gzip, zlib usa envoltura zlib y deflate usa flujo DEFLATE sin esa envoltura. El nodo emite bytes; DECOMPRESS debe usar el mismo formato.

help.node.parameter.decompress.format=Wrapper esperado; predeterminado gzip. Debe coincidir con COMPRESS/origen: gzip, zlib o deflate. Un wrapper incorrecto o datos truncados fallan al descomprimir.

help.node.parameter.uuid_generate.format=Presentación del UUID v4 aleatorio; predeterminada STANDARD (minúsculas y guiones). WITHOUT_HYPHENS quita guiones; UPPERCASE usa mayúsculas. El formato no aporta secreto criptográfico.




help.action.op_gen_process_designer.node.file_output.example=Conecta `OK`, usa BINARY y escribe `4F 4B`. Caso de error: si la carpeta padre de la ruta no existe, la escritura produce error de E/S.


help.action.op_gen_process_designer.node.base64_encode.example=Los bytes `4D 61 6E` producen `TWFu`. Caso de error: sin conexión a `input`, la validación previa informa el puerto obligatorio; la entrada vacía sí es válida y produce texto vacío.

help.action.op_gen_process_designer.node.base64_decode.example=`SGk=` se decodifica a bytes `48 69` (`Hi`). Caso de error: `SG!k` contiene `!`, fuera del alfabeto Base64.

help.action.op_gen_process_designer.node.base64url_encode.example=Los bytes `FB FF` producen `-_8`. Caso de error: deja `input` sin conexión; la validación informa el puerto obligatorio. `-_8` requiere el decoder Base64URL.

help.action.op_gen_process_designer.node.base64url_decode.example=`-_8` devuelve bytes `FB FF`. Caso de error: `+` y `/` pertenecen al alfabeto estándar, no al URL-safe que valida este decoder.

help.action.op_gen_process_designer.node.hex_encode.example=Los bytes `00 A5 FF` producen `00A5FF`. Caso de error: un `input` sin conexión falla durante la validación; la salida vacía para entrada vacía es válida.

help.action.op_gen_process_designer.node.hex_decode.example=`4869` produce bytes `48 69` (`Hi`). Caso de error: `48G1` contiene una cifra no hexadecimal; una longitud impar también falla al parsear pares.



help.action.op_gen_process_designer.node.base32_encode.example=El byte `66` (`f`) produce `MY======`, con el relleno del codec. Caso de error: si falta la conexión obligatoria `input`, la validación la señala.

help.action.op_gen_process_designer.node.base32_decode.example=`MY======` devuelve el byte `66`. Caso de error: `M0======` usa `0`, fuera del alfabeto Base32.



help.action.op_gen_process_designer.node.base58check_encode.example=Codifica el payload y agrega checksum de cuatro bytes; el decoder recupera exactamente el payload. Caso de error: sin `input`, la validación previa informa el puerto requerido.

help.action.op_gen_process_designer.node.base58check_decode.example=Decodifica y valida el checksum antes de devolver el payload. Caso de error: `1` no contiene un payload y checksum completos y el decoder lo rechaza.


help.action.op_gen_process_designer.node.ebcdic_decode.example=El byte `C1` con IBM037 produce `A`. Caso de error reproducible: una configuración importada con una página fuera de las opciones expuestas falla como página EBCDIC no compatible.

help.action.op_gen_process_designer.node.compress.example=Comprime bytes UTF-8 de `hello` con gzip; DECOMPRESS/gzip recupera los mismos cinco bytes. zlib y deflate son wrappers distintos. Caso de error: un formato no admitido falla en validación.

help.action.op_gen_process_designer.node.decompress.example=Un flujo gzip producido por COMPRESS/gzip recupera los bytes originales. Caso de error: seleccionar zlib para ese flujo causa un fallo de wrapper/datos comprimidos.

help.action.op_gen_process_designer.node.charset_convert.example=El byte `E9` con ISO-8859-1 representa `é`; a UTF-8 produce `C3 A9`. Caso límite real: con destino US-ASCII, el handler devuelve `?` (byte `3F`) por sustitución; la operación termina con SUCCESS.

help.action.op_gen_process_designer.node.concat.example=`a=41`, `b=42` produce `41 42` en ese orden. Caso de error: si falta cualquiera de los puertos requeridos, la validación nombra el puerto ausente.

help.action.op_gen_process_designer.node.slice.example=En `00 11 22 33`, offset 1 y length 2 (bytes, base cero) producen `11 22`. Caso de error: offset 5 excede la longitud de cuatro bytes.

help.action.op_gen_process_designer.node.pad.example=Con `41`, PKCS7 y bloque 4 produce `41 03 03 03`; blockSize admite 1–256. PKCS5 fija 8 bytes; ZERO/ISO-M1 no llevan marca. Caso de error: blockSize 0 se rechaza.

help.action.op_gen_process_designer.node.unpad.example=PKCS7 retira `03 03 03` de `41 03 03 03` y devuelve `41`. ISO-M1/ZERO recortan ceros finales; M2/7816-4 buscan `80`. Caso de error: `41 02 03` no tiene bytes PKCS7 coherentes.

help.action.op_gen_process_designer.node.xor.example=`A0 XOR 0F` produce `AF`. Caso de error: entradas de longitudes distintas se rechazan con ambas longitudes en el diagnóstico.

help.action.op_gen_process_designer.node.assert_equals.example=`actual=CAFE` y `expected=CAFE` completa la aserción y conserva el actual. Caso de error: `CAFE` frente a `CAFF` falla con `Assertion failed`.

help.action.op_gen_process_designer.node.asn1_decode.example=DER `020101` se parsea como INTEGER 1; JSON devuelve estructura de máquina y MARKDOWN una jerarquía legible. Caso de error: `0202FF` declara dos bytes y entrega solo uno.


help.action.op_gen_process_designer.node.check_digit_verify.example=Luhn `79927398713` devuelve `true`; caso límite: `79927398714` devuelve `false` sin excepción porque el dígito no coincide.

help.action.op_gen_process_designer.node.modular_arithmetic.example=ADD con a=`03`, b=`04`, módulo hex `0B` produce 7. Caso de error: la inversa multiplicativa de 6 módulo 9 no existe porque no son coprimos.

help.action.op_gen_process_designer.node.uuid_generate.example=STANDARD genera UUID v4 hexadecimal con guiones; versión nibble 4 y variante RFC. Caso límite: cada llamada es aleatoria; no se puede predecir un valor fijo ni tratar como clave secreta.

help.action.op_gen_process_designer.node.byte_statistics.example=Para `00 00 FF`, el informe cuenta tres bytes y dos valores distintos. Caso de error: falta `input` obligatorio y ProcessEngine lo detecta antes de ejecutar el handler.

help.action.op_gen_process_designer.run.title=Ejecutar proceso

help.action.op_gen_process_designer.run.description=Ejecuta el grafo validado en orden de dependencias. Los handlers pueden leer archivos y escribir resultados; consultar ayuda no inicia la ejecución.

help.action.op_gen_process_designer.run.example=Conecta CONSOLE_INPUT → BASE64_ENCODE → CONSOLE_OUTPUT y pulsa Run; `Hi` llega como `SGk=`. Puertos o parámetros obligatorios ausentes detienen la validación.

help.action.op_gen_process_designer.dry_run.title=Simular

help.action.op_gen_process_designer.dry_run.description=Comprueba conexiones y configuración obligatoria y muestra el plan sin llamar a handlers ni generar la salida final.

help.action.op_gen_process_designer.dry_run.example=Simula CONSOLE_INPUT → HEX_ENCODE: el plan muestra ambos nodos, pero no genera salida de archivo. Informa si falta un puerto obligatorio.

help.action.op_gen_process_designer.cancel.title=Cancelar

help.action.op_gen_process_designer.cancel.description=Solicita cancelar una ejecución activa en un punto de cancelación del motor; solo aplica mientras hay trabajo.

help.action.op_gen_process_designer.cancel.example=Inicia un grafo de varios nodos y pulsa Cancel; las filas terminadas permanecen en el informe y los nodos posteriores se detienen en un punto seguro.

help.action.op_gen_process_designer.load.title=Abrir proceso

help.action.op_gen_process_designer.load.description=Abre una definición de proceso guardada y sustituye el grafo/configuración al seleccionar el archivo.

help.action.op_gen_process_designer.load.example=Abre un proceso guardado para restaurar grafo y parámetros compatibles; los secretos temporales deben introducirse otra vez.

help.action.op_gen_process_designer.save.title=Guardar proceso

help.action.op_gen_process_designer.save.description=Guarda en un archivo elegido el grafo y la configuración de nodos compatibles. Omite secretos temporales.

help.action.op_gen_process_designer.save.example=Guarda CONSOLE_INPUT → HEX_ENCODE; al reabrir se restaura la configuración, pero no las entradas secretas temporales.

help.action.op_gen_process_designer.undo.title=Deshacer

help.action.op_gen_process_designer.undo.description=Restaura la edición anterior del grafo desde el historial.

help.action.op_gen_process_designer.undo.example=Añade un nodo y pulsa Undo para quitarlo. Sin historial de edición no hay cambios que aplicar.

help.action.op_gen_process_designer.redo.title=Rehacer

help.action.op_gen_process_designer.redo.description=Reaplica la edición del grafo revertida más recientemente con Undo.

help.action.op_gen_process_designer.redo.example=Deshaz la creación de un nodo y pulsa Redo para recuperarlo. No aplica si no hay una edición deshecha.

help.action.op_gen_process_designer.duplicate.title=Duplicar nodo

help.action.op_gen_process_designer.duplicate.description=Duplica el nodo seleccionado y su configuración como nodo independiente; no presupone conexiones.

help.action.op_gen_process_designer.duplicate.example=Duplica HEX_ENCODE y conecta sus puertos explícitamente. Sin nodo seleccionado no hay nada que duplicar.

help.action.op_gen_process_designer.layout.title=Ordenar grafo

help.action.op_gen_process_designer.layout.description=Reordena visualmente los nodos; no cambia su configuración ni las conexiones.

help.action.op_gen_process_designer.layout.example=Ordena un grafo de tres nodos: cambian posiciones, pero se conservan los enlaces.

help.action.op_gen_process_designer.clear.title=Limpiar lienzo

help.action.op_gen_process_designer.clear.description=Elimina del lienzo los nodos y conexiones. Reset Defaults restaura el grafo inicial de ejemplo.

help.action.op_gen_process_designer.clear.example=Limpia un grafo de prueba y deja el lienzo vacío. La acción descarta las ediciones actuales del grafo.

help.action.op_gen_process_designer.reset.title=Restablecer valores

help.action.op_gen_process_designer.reset.description=Limpia el grafo actual y carga el ejemplo SHA-256 integrado como predeterminado.

help.action.op_gen_process_designer.reset.example=Reset Defaults sustituye un grafo personalizado por input → SHA-256 → output.

help.action.op_gen_process_designer.reverse_connection.title=Invertir conexión

help.action.op_gen_process_designer.reverse_connection.description=Invierte los extremos de la conexión seleccionada si los contratos de puertos resultan válidos; requiere una conexión seleccionada.

help.action.op_gen_process_designer.reverse_connection.example=Selecciona un enlace y reviértelo: cambia origen/destino. Si los puertos no son compatibles, se rechaza el cambio.

help.action.op_gen_process_designer.connect.title=Conectar puertos

help.action.op_gen_process_designer.connect.description=Conecta los nodos seleccionados o permite elegir el puerto destino si hay varios compatibles.

help.action.op_gen_process_designer.connect.example=Conecta CONSOLE_INPUT a HEX_ENCODE; se rechaza un puerto con representación incompatible.

help.action.op_gen_process_designer.create_node.title=Crear nodo

help.action.op_gen_process_designer.create_node.description=Añade un nodo desde la paleta filtrable; haz doble clic en una entrada para colocarla en el lienzo.

help.action.op_gen_process_designer.create_node.example=Busca HEX_ENCODE y haz doble clic en su entrada; aparece el nodo en el lienzo.

help.action.op_gen_process_designer.configure_node.title=Configurar nodo seleccionado

help.action.op_gen_process_designer.configure_node.description=Muestra puertos, parámetros, valores iniciales, opciones y condiciones del nodo seleccionado desde NodeCatalog.

help.action.op_gen_process_designer.configure_node.example=Selecciona FILE_INPUT y cambia readMode a TEXT para aplicar charset. Los valores secretos no se copian al contexto de ayuda.

help.action.op_gen_process_designer.edit_menu.title=Menú Edición

help.action.op_gen_process_designer.edit_menu.description=Reúne Undo/Redo, duplicar, ordenar, limpiar y restaurar el lienzo. Con el lienzo enfocado: Delete/Backspace borra la selección; atajo+Z deshace, atajo+Shift+Z o atajo+Y rehace y atajo+D duplica. Las flechas mueven el nodo; Shift+flecha mueve 10 px; Escape quita la selección/cancela el cableado.

help.action.op_gen_process_designer.edit_menu.example=Selecciona un nodo y pulsa Delete para quitarlo con sus enlaces; usa Undo o el atajo+Z para restaurarlo. El atajo depende del sistema: Cmd en macOS y Ctrl en otros sistemas.

help.action.op_gen_process_designer.presets.title=Preajustes

help.action.op_gen_process_designer.presets.description=Sustituye el grafo actual por uno de cuatro flujos de ejemplo: SHA-256, Base64, AES-GCM ida/vuelta o AES-CMAC.

help.action.op_gen_process_designer.presets.example=Elige Base64 text encode para cargar ese grafo; seleccionar un preset reemplaza el grafo actual.

help.action.op_gen_process_designer.sha256_preset.title=Resumen de texto SHA-256

help.action.op_gen_process_designer.sha256_preset.description=Carga el flujo texto → SHA-256 → salida de consola.

help.action.op_gen_process_designer.sha256_preset.example=Selecciona el preset y ejecútalo con texto de ejemplo; el nodo final informa el resumen.

help.action.op_gen_process_designer.base64_preset.title=Codificar texto Base64

help.action.op_gen_process_designer.base64_preset.description=Carga el flujo texto → codificación Base64 → salida de consola.

help.action.op_gen_process_designer.base64_preset.example=El texto de ejemplo `Hello` se codifica como `SGVsbG8=`.

help.action.op_gen_process_designer.aes_gcm_preset.title=Preajuste AES-GCM

help.action.op_gen_process_designer.aes_gcm_preset.description=Carga un ejemplo de cifrado/descifrado AES-GCM. Revisa material de clave y nonce en cada nodo antes de ejecutar.

help.action.op_gen_process_designer.aes_gcm_preset.example=El preset conecta la salida de cifrado con la entrada de descifrado; el handler informa si falta una clave o nonce válido.

help.action.op_gen_process_designer.aes_cmac_preset.title=Preajuste AES-CMAC

help.action.op_gen_process_designer.aes_cmac_preset.description=Carga un ejemplo AES-CMAC que calcula un código de autenticación con clave compartida.

help.action.op_gen_process_designer.aes_cmac_preset.example=Ejecuta el ejemplo configurado; cambiar la clave cambia el MAC.

help.action.op_gen_process_designer.zoom_in.title=Acercar

help.action.op_gen_process_designer.zoom_in.description=Aumenta la escala del lienzo sin cambiar coordenadas ni datos.

help.action.op_gen_process_designer.zoom_in.example=Zoom in agranda las etiquetas; el grafo no cambia.

help.action.op_gen_process_designer.zoom_out.title=Alejar

help.action.op_gen_process_designer.zoom_out.description=Reduce la escala para mostrar más grafo.

help.action.op_gen_process_designer.zoom_out.example=Zoom out muestra más nodos; la configuración no cambia.

help.action.op_gen_process_designer.zoom_reset.title=Restablecer zoom

help.action.op_gen_process_designer.zoom_reset.description=Devuelve la escala del lienzo al 100%.


help.action.op_gen_process_designer.zoom_fit.title=Ajustar al contenido

help.action.op_gen_process_designer.zoom_fit.description=Ajusta el grafo al lienzo visible; si está vacío vuelve al 100%.

help.action.op_gen_process_designer.zoom_fit.example=Fit to content encuadra los nodos; en un lienzo vacío aplica 100%.

help.action.op_gen_process_designer.snap_to_grid.title=Ajustar a cuadrícula

help.action.op_gen_process_designer.snap_to_grid.description=Al activarlo, los nodos colocados o movidos se alinean con la cuadrícula.

help.action.op_gen_process_designer.snap_to_grid.example=Mueve un nodo con Snap to grid activo y su posición se ajusta a la cuadrícula.

help.action.op_gen_process_designer.toggle_inspector.title=Mostrar/ocultar inspector

help.action.op_gen_process_designer.toggle_inspector.description=Muestra u oculta el inspector sin eliminar el nodo ni sus ajustes.

help.action.op_gen_process_designer.toggle_inspector.example=Oculta y vuelve a mostrar el inspector; se conservan el nodo y sus campos.

help.action.op_gen_process_designer.focus_mode.title=Modo de enfoque

help.action.op_gen_process_designer.focus_mode.description=Activa o desactiva el modo de enfoque para dar espacio al lienzo reduciendo paneles periféricos.

help.action.op_gen_process_designer.focus_mode.example=Activa Focus mode para revisar conexiones; desactívalo para volver al espacio habitual.

help.action.op_gen_process_designer.expand_results.title=Ampliar resultados

help.action.op_gen_process_designer.expand_results.description=Abre la traza de ejecución actual en una vista ampliada; no ejecuta el proceso.

help.action.op_gen_process_designer.expand_results.example=Tras ejecutar, amplía la traza para revisar mensajes. Antes puede no haber resultados.

help.action.op_gen_process_designer.open_window.title=Abrir en ventana

help.action.op_gen_process_designer.open_window.description=Abre Process Designer en una ventana independiente conservando el espacio de trabajo.

help.action.op_gen_process_designer.open_window.example=Abre la ventana, edita un nodo y ciérrala; el grafo sigue en el espacio principal.

help.action.op_gen_process_designer.save_node_settings.title=Guardar ajustes del bloque

help.action.op_gen_process_designer.save_node_settings.description=Aplica a la configuración del nodo los campos actuales del inspector.

help.action.op_gen_process_designer.save_node_settings.example=Cambia readMode de FILE_INPUT y pulsa Save block settings para guardar ese modo en el nodo.

help.action.op_gen_process_designer.search_palette.title=Buscar en la paleta

help.action.op_gen_process_designer.search_palette.description=Filtra la paleta por nombre, categoría o descripción sin modificar el grafo.

help.action.op_gen_process_designer.search_palette.example=Busca `Base58` para mostrar conversiones coincidentes; al borrar la búsqueda vuelve la paleta completa.

help.field.op_gen_process_designer.process_name.description=Nombre guardado en la definición del proceso; es metadato descriptivo, no parámetro de ejecución.

help.field.op_gen_process_designer.palette.description=El texto filtra la paleta; el contexto de ayuda no incluye la búsqueda escrita.

help.field.op_gen_process_designer.zoom.description=Escala actual del lienzo. Los controles solo cambian el tamaño de visualización.

help.field.op_gen_process_designer.snap_to_grid.description=Interruptor que alinea los nodos con la cuadrícula al colocarlos o moverlos.

help.field.op_gen_process_designer.inspector.description=Panel de detalles del nodo seleccionado; ocultarlo conserva grafo y ajustes.

help.field.op_gen_process_designer.focus_mode.description=Alterna la disposición del espacio para priorizar el lienzo.

help.field.op_gen_process_designer.status.description=Estado de ejecución e informe por nodo; consultarlo no inicia otra ejecución.

help.field.op_gen_process_designer.validation.description=Hallazgos de validación previa y simulación sobre estructura y configuración requerida.

help.field.op_gen_process_designer.process_name.label=Nombre del proceso

help.field.op_gen_process_designer.palette.label=Buscar en paleta

help.field.op_gen_process_designer.zoom.label=Zoom del lienzo

help.field.op_gen_process_designer.snap_to_grid.label=Ajustar a cuadrícula

help.field.op_gen_process_designer.inspector.label=Inspector

help.field.op_gen_process_designer.focus_mode.label=Modo de enfoque

help.field.op_gen_process_designer.status.label=Estado de ejecución

help.action.op_gen_process_designer.open_results.title=Abrir resultados

help.action.op_gen_process_designer.open_results.description=Abre el informe de ejecución seleccionado; no ejecuta el grafo.

help.action.op_gen_process_designer.open_results.example=Abre el informe de ejecución seleccionado; no ejecuta el grafo.

help.action.op_gen_process_designer.configure_process.title=Configurar metadatos del proceso

help.action.op_gen_process_designer.configure_process.description=El nombre se guarda con el grafo y no altera la ejecución de nodos.

help.action.op_gen_process_designer.configure_process.example=El nombre se guarda con el grafo y no altera la ejecución de nodos.

module.process.desc.consoleInput=Proporciona texto fijo codificado como bytes con el charset elegido.

module.process.desc.consoleOutput=Muestra el valor de entrada en el resultado del proceso; es un destino.

module.process.desc.fileInput=Describe la operativa FILE_INPUT y el resultado de sus puertos.

module.process.desc.fileOutput=Escribe los bytes de entrada en el destino en modo binario o como texto.


module.process.desc.base64Encode=Codifica bytes con el alfabeto Base64 estándar.


module.process.desc.base64UrlEncode=Codifica bytes con el alfabeto Base64URL sin relleno.

module.process.desc.base64UrlDecode=Decodifica texto Base64URL a bytes.

module.process.desc.hexEncode=Representa cada byte con dos dígitos hexadecimales.




module.process.desc.concat=Concatena a continuación de b los bytes de a y b en ese orden.

module.process.desc.slice=Extrae un rango de bytes desde offset y length.

module.process.desc.pad=Añade el relleno seleccionado hasta el tamaño de bloque.

module.process.desc.unpad=Valida y retira el relleno seleccionado.

module.process.desc.xor=Aplica XOR posición por posición a dos entradas.

module.process.desc.assertEquals=Compara los bytes actual y expected e informa si son iguales.

module.process.desc.base32Encode=Codifica bytes con alfabeto Base32.

module.process.desc.base32Decode=Decodifica texto Base32 a bytes.

module.process.desc.base58Encode=Codifica bytes con el alfabeto Bitcoin Base58.

module.process.desc.base58Decode=Decodifica el alfabeto Bitcoin Base58 a bytes.

module.process.desc.base58CheckEncode=Codifica bytes en Base58Check con checksum.

module.process.desc.base58CheckDecode=Decodifica Base58Check y verifica el checksum.

module.process.desc.ebcdicEncode=Codifica texto usando la página EBCDIC IBM seleccionada.

module.process.desc.ebcdicDecode=Decodifica bytes con la página EBCDIC IBM seleccionada.

module.process.desc.compress=Comprime bytes usando gzip, zlib o deflate.

module.process.desc.decompress=Descomprime bytes usando gzip, zlib o deflate.

module.process.desc.charsetConvert=Decodifica bytes desde un charset y los vuelve a codificar a otro.

module.process.desc.asn1Decode=Interpreta bytes ASN.1 y presenta JSON o Markdown.

module.process.desc.checkDigitCalc=Calcula y añade el dígito de control seleccionado.

module.process.desc.checkDigitVerify=Comprueba el dígito final según el algoritmo seleccionado.

module.process.desc.modularArithmetic=Calcula la operación entera elegida usando el módulo cuando corresponde.

module.process.desc.uuidGenerate=Genera un UUID aleatorio de versión 4.

module.process.desc.byteStatistics=Resume conteos y distribución descriptiva de los bytes.

module.process.desc.fileInput=Lee el archivo como bytes o lo decodifica como texto según el modo y el charset elegido.

module.process.type.consoleInput=Entrada de consola

module.process.type.fileInput=Entrada de archivo

help.action.op_gen_process_designer.zoom_reset.example=Después de acercar, Restablecer zoom devuelve la escala al 100 % y conserva intacto el grafo.
module.process.category.walletEidas=Cartera / eIDAS

help.option.op_gen_process_designer.menu.edit_menu.undo=Restaura la edición anterior del grafo desde el historial.

help.option.op_gen_process_designer.menu.edit_menu.redo=Reaplica la edición del grafo revertida más recientemente con Undo.

help.option.op_gen_process_designer.menu.edit_menu.duplicate=Duplica el nodo seleccionado y su configuración como nodo independiente; no presupone conexiones.

help.option.op_gen_process_designer.menu.edit_menu.layout=Reordena visualmente los nodos; no cambia su configuración ni las conexiones.

help.option.op_gen_process_designer.menu.edit_menu.clear=Elimina del lienzo los nodos y conexiones. Reset Defaults restaura el grafo inicial de ejemplo.

help.option.op_gen_process_designer.menu.edit_menu.reset=Limpia el grafo actual y carga el ejemplo SHA-256 integrado como predeterminado.

help.option.op_gen_process_designer.menu.presets.sha256_preset=Carga el flujo texto → SHA-256 → salida de consola.

help.option.op_gen_process_designer.menu.presets.base64_preset=Carga el flujo texto → codificación Base64 → salida de consola.

help.option.op_gen_process_designer.menu.presets.aes_gcm_preset=Carga un ejemplo de cifrado/descifrado AES-GCM. Revisa material de clave y nonce en cada nodo antes de ejecutar.

help.option.op_gen_process_designer.menu.presets.aes_cmac_preset=Carga un ejemplo AES-CMAC que calcula un código de autenticación con clave compartida.

module.process.desc.base64=Nodo Base64 heredado del catálogo. CodecNodeHandler no tiene una rama de ejecución BASE64; se ofrecen nodos separados de codificar/decodificar con handlers definidos.

help.action.op_gen_process_designer.node.base64.example=El descriptor heredado anuncia `input` y salida BINARY. Caso de error reproducible: con cualquier entrada conectada, `execute` falla con `Unknown codec type: BASE64`; usa BASE64_ENCODE o BASE64_DECODE.


help.node.parameter.base64_decode.charset=Selector heredado, predeterminado UTF-8. El handler decodifica el alfabeto Base64 a bytes BINARY y no consulta este campo; ninguna opción cambia los bytes.

help.node.parameter.base64url_decode.charset=Selector heredado, predeterminado UTF-8. El handler decodifica el alfabeto URL-safe a bytes BINARY y no consulta este campo; ninguna opción cambia los bytes.

help.node.parameter.hex_decode.charset=Selector heredado, predeterminado UTF-8. HEX_DECODE parsea pares hexadecimales a BINARY y no consulta este campo; ninguna opción cambia los bytes.

help.node.parameter.utf8_encode.charset=Selector de catálogo predeterminado UTF-8, ignorado por el handler. UTF8_ENCODE decodifica según el charset que ya trae el FlowValue de entrada (UTF-8 si falta) y recodifica como UTF-8.

help.node.parameter.utf8_decode.charset=Selector de catálogo predeterminado UTF-8, ignorado por el handler. UTF8_DECODE usa siempre UTF-8; secuencias inválidas se sustituyen con U+FFFD en vez de rechazarse.

help.node.parameter.charset_convert.sourcecharset=Charset de origen para decodificar bytes; predeterminado ISO-8859-1. Secuencias mal formadas se sustituyen; comprueba que la página del productor coincide con los bytes.


help.node.parameter.pad.blocksize=Tamaño de bloque en bytes para PKCS7 y los esquemas ISO/ceros; predeterminado 16, rango aceptado 1–256 inclusive. PKCS5 conserva su bloque fijo de 8, aunque este valor se valida.

help.action.op_gen_process_designer.node.check_digit_calc.example=Luhn con `7992739871` produce el dígito `3`. Caso de error: entrada vacía falla; el handler elimina caracteres no numéricos antes del cálculo.


help.node.ports.modular_arithmetic=La entrada obligatoria a admite representaciones estándar. b se requiere para ADD/SUBTRACT/MULTIPLY/EXPONENTIATE/GCD y se omite para ADDITIVE_INVERSE/MULTIPLICATIVE_INVERSE. Salida: TEXT_UTF8.

help.node.option.check_digit_calc.algorithm.luhn_mod_10=Dígito mod-10 con duplicación alterna desde la derecha y suma de cifras.

help.node.option.check_digit_calc.algorithm.amex_se_luhn_mod_10=Esta implementación usa el mismo cálculo Luhn que Luhn (Mod 10); no valida emisor.

help.node.option.check_digit_calc.algorithm.verhoeff=Usa las tablas de multiplicación/permutación diédricas de Verhoeff.

help.node.option.check_digit_calc.algorithm.damm=Usa la tabla de cuasigrupo de Damm para calcular el dígito.

help.node.option.check_digit_verify.algorithm.luhn_mod_10=Dígito mod-10 con duplicación alterna desde la derecha y suma de cifras.

help.node.option.check_digit_verify.algorithm.amex_se_luhn_mod_10=Esta implementación usa el mismo cálculo Luhn que Luhn (Mod 10); no valida emisor.

help.node.option.check_digit_verify.algorithm.verhoeff=Usa las tablas de multiplicación/permutación diédricas de Verhoeff.

help.node.option.check_digit_verify.algorithm.damm=Usa la tabla de cuasigrupo de Damm para calcular el dígito.

help.node.option.modular_arithmetic.operation.add=Suma a y b y reduce módulo m.

help.node.option.modular_arithmetic.operation.subtract=Resta b de a y reduce módulo m.

help.node.option.modular_arithmetic.operation.multiply=Multiplica a por b y reduce módulo m.

help.node.option.modular_arithmetic.operation.exponentiate=Calcula a elevado al exponente b módulo m.

help.node.option.modular_arithmetic.operation.additive_inverse=Calcula el inverso aditivo de a módulo m; solo requiere el puerto a.

help.node.option.modular_arithmetic.operation.multiplicative_inverse=Calcula el inverso multiplicativo de a; existe solo si a y m son coprimos. Solo requiere el puerto a.

help.node.option.modular_arithmetic.operation.gcd=Calcula gcd(a,b); el handler no usa el parámetro módulo en esta operación.

help.action.op_gen_process_designer.node.console_input.example=El literal `A` con UTF-8 emite el byte `41`. Caso límite real: `ñ` con US-ASCII emite `3F` porque `String.getBytes` sustituye; no lanza error.


help.action.op_gen_process_designer.node.file_input.example=Lee bytes `41 42` en BINARY y emite esos dos bytes. Caso de error: una ruta inexistente detiene el nodo con un error de E/S.

help.action.op_gen_process_designer.node.console_output.example=Conecta bytes `48 69` (texto UTF-8 `Hi`); la salida renderizada es `4869`. Caso de error: sin conexión a `input`, ProcessEngine valida y señala ese puerto obligatorio.

help.action.op_gen_process_designer.node.ebcdic_encode.example=El texto `A` con IBM037 produce `C1`. Caso límite real: un carácter no representable se sustituye por el encoder Java; no se informa como error estricto.


help.action.op_gen_process_designer.node.utf8_encode.example=El texto `Hi` con metadatos de entrada UTF-8 produce `48 69`. Caso límite: el selector charset del nodo se ignora; una entrada creada con US-ASCII ya puede haber sustituido `ñ` por `3F` antes de llegar aquí.

help.action.op_gen_process_designer.node.utf8_decode.example=`48 69` produce `Hi`. Caso límite real, no excepción: bytes malformados `C3 28` se decodifican como `�(` por sustitución Java.


help.node.parameter.console_input.charset=Charset que convierte el literal `value` a bytes; predeterminado UTF-8. La codificación Java sustituye caracteres no representables (p. ej., `ñ` en US-ASCII produce `?`).

help.node.parameter.file_input.charset=Charset para decodificar el archivo cuando `readMode=TEXT`; predeterminado UTF-8. Oculto en BINARY. Secuencias inválidas se sustituyen por Java; no es decodificación estricta.

help.node.parameter.file_output.charset=Charset usado para codificar la representación de texto (`render()`) cuando `writeMode=TEXT`; predeterminado UTF-8. Oculto en BINARY; Java sustituye caracteres no representables.

help.node.parameter.charset_convert.targetcharset=Charset de destino para codificar el texto decodificado; predeterminado UTF-8. Java sustituye caracteres no representables en vez de fallar: ISO-8859-1 `E9` → US-ASCII produce `3F` (`?`).

module.process.desc.base64Decode=Decodifica Base64 estándar a bytes; el handler actual no lee el selector charset expuesto.

module.process.desc.hexDecode=Interpreta Hex como bytes; el handler actual no lee el selector charset expuesto.

module.process.desc.utf8Encode=Normaliza bytes de texto a UTF-8 según los metadatos charset del FlowValue; no lee el selector charset del nodo.

module.process.desc.utf8Decode=Decodifica bytes como UTF-8 con sustituciones Java; no lee el selector charset del nodo.

help.field.op_gen_process_designer.process_file.label=Archivo de proceso

help.field.op_gen_process_designer.process_file.description=Archivo de definición elegido para abrir/guardar; la ayuda no lee ni expone su ruta.

help.field.op_gen_process_designer.node_name.label=Nombre del nodo

help.field.op_gen_process_designer.node_name.description=Nombre descriptivo guardado en el nodo seleccionado; no se incluye en el contexto de ayuda.

help.field.op_gen_process_designer.target_port.label=Puerto destino

help.field.op_gen_process_designer.target_port.description=Puerto de entrada elegido al conectar; solo se utiliza su ID público.

help.field.op_gen_process_designer.connection.label=Conexión seleccionada

help.field.op_gen_process_designer.connection.description=Enlace dirigido seleccionado para invertir; la ayuda no cambia origen ni destino.

help.field.op_gen_process_designer.clear_canvas.label=Limpiar lienzo

help.field.op_gen_process_designer.clear_canvas.description=Elimina el grafo actual cuando se activa explícitamente; consultar la ayuda no lo ejecuta.

help.field.op_gen_process_designer.status_summary.label=Estado de ejecución

help.field.op_gen_process_designer.status_summary.description=Texto de estado actual; se muestra para explicar y no se copia al contexto de ayuda.

help.action.op_gen_process_designer.node.base58_encode.example=Los bytes `00 61` producen `12g`; el cero inicial se conserva como `1`. Caso de error: sin `input`, falla la validación previa; Base58 requiere su decoder propio.

help.action.op_gen_process_designer.node.base58_decode.example=`12g` devuelve bytes `00 61`. Caso de error: `0OIl` incluye caracteres excluidos del alfabeto Base58.

help.action.op_gen_process_designer.delete.title=Borrar selección
help.action.op_gen_process_designer.delete.description=Borra la conexión seleccionada si se eligió una conexión; en caso contrario borra el nodo seleccionado y todas sus conexiones incidentes. La operación queda registrada en Undo; no borra otros nodos ni ejecuta el proceso.
help.action.op_gen_process_designer.delete.example=Selecciona una conexión y bórrala para quitar solo ese enlace; Undo la restaura. Selecciona un nodo y bórralo para quitarlo junto con sus enlaces entrantes/salientes; Undo recupera la edición.
help.field.op_gen_process_designer.selection.label=Selección
help.field.op_gen_process_designer.selection.description=Define qué elimina la acción: conexión activa, o nodo activo con todos sus enlaces incidentes. Sin una selección borrable, la acción no cambia el grafo.
help.operation.op_gen_clipboard.title=Clipboard Shelf
# module-help:op_auth_sig begin
help.operation.op_auth_sig.title=Firmas digitales
help.operation.op_auth_sig.purpose=Firma el mensaje con una clave privada o verifica una firma existente con la clave pública. Una firma válida demuestra que el titular de la clave privada firmó exactamente estos bytes; no dice nada sobre a quién pertenece la clave.
help.action.op_auth_sig.sign.title=Firmar
help.action.op_auth_sig.sign.description=Firma los bytes del mensaje con la clave privada y el algoritmo seleccionado y escribe la firma en Resultado. Antes, el mensaje se decodifica con el formato global del payload.
help.action.op_auth_sig.verify.title=Verificar firma
help.action.op_auth_sig.verify.description=Comprueba la firma pegada contra el mensaje, la clave pública y el algoritmo seleccionado. El mensaje, el algoritmo y la clave deben ser los usados al firmar; cualquier diferencia hace fallar la verificación.
help.action.op_auth_sig.load_private_key.title=Cargar clave privada
help.action.op_auth_sig.load_private_key.description=Rellena la clave privada desde el portapapeles, un archivo o el Clipboard Shelf. La clave permanece en este formulario; la ayuda nunca la lee.
help.action.op_auth_sig.load_public_key.title=Cargar clave pública
help.action.op_auth_sig.load_public_key.description=Rellena la clave pública desde el portapapeles, un archivo o el Clipboard Shelf.
help.action.op_auth_sig.apply_template.title=Aplicar plantilla o restablecer
help.action.op_auth_sig.apply_template.description=Aplicar deja el formulario como indica la plantilla seleccionada; Restablecer valores predeterminados lo devuelve a los valores iniciales. Las plantillas guardan ajustes de selectores, nunca material de clave.
help.field.op_auth_sig.input.label=Mensaje
help.field.op_auth_sig.input.description=Datos que se firman o verifican. Se interpretan con el formato global del payload, así que el mismo texto en Hex y en UTF-8 produce firmas distintas.
help.field.op_auth_sig.algorithm.label=Algoritmo
help.field.op_auth_sig.algorithm.description=Esquema de firma y hash: Ed25519, RSA con PKCS#1 v1.5 o PSS, o ECDSA. El tipo de clave debe corresponder al esquema. RSA-SHA1-PKCS1 se ofrece solo por compatibilidad con sistemas heredados.
help.field.op_auth_sig.private_key.label=Clave privada
help.field.op_auth_sig.private_key.description=Clave privada en PEM, necesaria para firmar. Es material sensible: quien la tenga puede firmar en tu nombre.
help.field.op_auth_sig.public_key.label=Clave pública
help.field.op_auth_sig.public_key.description=Clave pública en PEM, necesaria para verificar. Debe ser la pareja de la clave privada que generó la firma.
help.field.op_auth_sig.signature.label=Firma a verificar
help.field.op_auth_sig.signature.description=Firma existente, escrita en el formato seleccionado como formato global de salida.
help.field.op_auth_sig.template.label=Plantilla
help.field.op_auth_sig.template.description=Combinación guardada de ajustes para esta pantalla. Las plantillas personales se guardan, exportan, importan y eliminan desde Gestionar plantilla.
help.field.op_auth_sig.output.label=Resultado
help.field.op_auth_sig.output.description=Firma generada en el formato global de salida, o el resultado de la verificación.
# module-help:op_auth_sig end
# module-help:op_auth_mac begin
help.operation.op_auth_mac.title=Códigos de autenticación de mensajes
help.operation.op_auth_mac.purpose=Calcula o verifica un MAC sobre el mensaje con una clave secreta compartida. Un MAC prueba la integridad y que el emisor conocía la clave; como ambas partes comparten la clave, no prueba cuál de ellas lo generó.
help.action.op_auth_mac.generate.title=Generar MAC
help.action.op_auth_mac.generate.description=Calcula el MAC del mensaje con el algoritmo, la clave y la longitud de salida seleccionados y lo escribe en Resultado.
help.action.op_auth_mac.verify.title=Verificar MAC
help.action.op_auth_mac.verify.description=Recalcula el MAC con el mismo mensaje, algoritmo, clave y longitud de salida y lo compara con el valor esperado.
help.action.op_auth_mac.load_key.title=Cargar clave
help.action.op_auth_mac.load_key.description=Rellena la clave desde el portapapeles, un archivo o el Clipboard Shelf.
help.action.op_auth_mac.key_lab.title=Key Lab
help.action.op_auth_mac.key_lab.description=Guarda la clave escrita en el inventario de Key Lab, o abre para inspección la clave de Key Lab seleccionada.
help.field.op_auth_mac.input.label=Mensaje
help.field.op_auth_mac.input.description=Datos que se autentican, interpretados con el formato global del payload.
help.field.op_auth_mac.algorithm.label=Algoritmo
help.field.op_auth_mac.algorithm.description=Construcción del MAC: HMAC, CMAC, CBC-MAC, las variantes ISO 9797-1, GMAC-AES o Poly1305. La nota bajo el selector indica el tamaño de clave y las cautelas del elegido.
help.field.op_auth_mac.output_length.label=Longitud de salida
help.field.op_auth_mac.output_length.description=Número de bytes que se conservan del MAC; 0 conserva el valor completo. Un MAC más corto es más fácil de falsificar por tanteo, así que trunca solo si el protocolo lo exige.
help.field.op_auth_mac.key_source.label=Origen de la clave
help.field.op_auth_mac.key_source.description=Manual Input usa la clave hexadecimal escrita; Simulated HSM y PKCS#11 Token usan una clave elegida de la lista, sin mostrar su valor.
help.field.op_auth_mac.key.label=Clave
help.field.op_auth_mac.key.description=Clave secreta en hexadecimal. El tamaño requerido depende del algoritmo y se indica bajo el campo.
help.field.op_auth_mac.nonce.label=Nonce / IV
help.field.op_auth_mac.nonce.description=Solo aparece con los algoritmos que lo necesitan, como GMAC. Debe ser único para cada mensaje autenticado con la misma clave.
help.field.op_auth_mac.expected_mac.label=MAC esperado
help.field.op_auth_mac.expected_mac.description=MAC recibido junto al mensaje, para compararlo con el recalculado.
help.field.op_auth_mac.output.label=Resultado
help.field.op_auth_mac.output.description=MAC generado en el formato global de salida, o el resultado de la verificación.
# module-help:op_auth_mac end
# module-help:op_keys_lab begin
help.operation.op_keys_lab.title=Key Lab
help.operation.op_keys_lab.purpose=Inventario local de claves simétricas de laboratorio, que también hace de Simulated HSM. Cada entrada guarda nombre, algoritmo, tamaño, usos permitidos, exportabilidad, KCV, origen y estado, para que otras pantallas usen una clave por referencia.
help.action.op_keys_lab.find.title=Buscar una clave
help.action.op_keys_lab.find.description=Filtra el inventario por texto y estado; al seleccionar una fila se muestran sus detalles debajo.
help.action.op_keys_lab.generate.title=Generar clave
help.action.op_keys_lab.generate.description=Crea una clave aleatoria del algoritmo y tamaño elegidos y la añade al inventario con el nombre indicado.
help.action.op_keys_lab.import.title=Importar clave
help.action.op_keys_lab.import.description=Añade una clave que ya tienes, pegada como bytes hexadecimales, con el nombre y el algoritmo indicados.
help.action.op_keys_lab.save_metadata.title=Editar metadatos
help.action.op_keys_lab.save_metadata.description=Guarda el nombre y los usos permitidos de la clave seleccionada. Copiar ID copia su identificador, no su valor.
help.action.op_keys_lab.reveal.title=Revelar valor
help.action.op_keys_lab.reveal.description=Muestra en claro el valor de la clave seleccionada. Hazlo solo cuando nadie más pueda ver la pantalla.
help.action.op_keys_lab.use.title=Usar en otra pantalla
help.action.op_keys_lab.use.description=Abre Cifrado simétrico o MAC con la clave seleccionada elegida como clave de Simulated HSM. Los usos permitidos deciden cuál de los dos está disponible.
help.action.op_keys_lab.archive_delete.title=Archivar o eliminar
help.action.op_keys_lab.archive_delete.description=Archivar oculta la clave de la lista activa pero la conserva; Eliminar la borra del inventario definitivamente.
help.action.op_keys_lab.transfer_metadata.title=Importar o exportar metadatos
help.action.op_keys_lab.transfer_metadata.description=Lee o escribe un archivo con los metadatos de las entradas del inventario.
help.field.op_keys_lab.search.label=Buscar
help.field.op_keys_lab.search.description=Texto que se compara con los nombres y algoritmos de las claves.
help.field.op_keys_lab.status_filter.label=Filtro de estado
help.field.op_keys_lab.status_filter.description=Muestra las claves activas, las archivadas o todas.
help.field.op_keys_lab.table.label=Inventario
help.field.op_keys_lab.table.description=Una fila por clave: nombre, algoritmo, bits, KCV, origen y estado. El valor de la clave no se muestra aquí.
help.field.op_keys_lab.name.label=Nombre
help.field.op_keys_lab.name.description=Alias con el que reconocerás la clave en otras pantallas.
help.field.op_keys_lab.algorithm.label=Algoritmo
help.field.op_keys_lab.algorithm.description=AES, 3DES, DES o ChaCha20. Determina los tamaños que se ofrecen.
help.field.op_keys_lab.size.label=Tamaño de clave
help.field.op_keys_lab.size.description=Tamaño en bits. En 3DES, 128 es de dos claves y 192 de tres.
help.field.op_keys_lab.import_bytes.label=Bytes de la clave
help.field.op_keys_lab.import_bytes.description=Clave en bruto en hexadecimal, oculta mientras escribes. Su longitud debe corresponder al algoritmo.
help.field.op_keys_lab.detail_name.label=Nombre de la clave seleccionada
help.field.op_keys_lab.detail_name.description=Alias editable de la clave seleccionada en el inventario.
help.field.op_keys_lab.usages.label=Usos permitidos
help.field.op_keys_lab.usages.description=Operaciones para las que puede usarse esta clave. Las pantallas que toman una clave del Simulated HSM respetan estas marcas.
help.field.op_keys_lab.value.label=Valor de la clave
help.field.op_keys_lab.value.description=Oculto hasta que pulsas Revelar valor.
help.field.op_keys_lab.kcv_length.label=Longitud del KCV
help.field.op_keys_lab.kcv_length.description=Muestra los valores de comprobación de clave con 4 bytes en lugar de 3. Solo cambia cuántos bytes se muestran, no la clave.
# module-help:op_keys_lab end
# module-help:op_keys_gen begin
help.operation.op_keys_gen.title=Generación de claves
help.operation.op_keys_gen.purpose=Genera una clave simétrica aleatoria del tipo seleccionado y muestra su KCV y su huella para identificarla sin revelarla.
help.action.op_keys_gen.generate.title=Generar clave
help.action.op_keys_gen.generate.description=Crea una clave aleatoria nueva y rellena el resumen: longitud, KCV, huella SHA-256 y paridad.
help.action.op_keys_gen.save_to_lab.title=Guardar en Key Lab
help.action.op_keys_gen.save_to_lab.description=Registra la clave generada en Key Lab con un nombre, usos permitidos y exportabilidad.
help.action.op_keys_gen.copy.title=Copiar
help.action.op_keys_gen.copy.description=Copia la clave, solo su KCV o el resumen. El KCV y el resumen pueden compartirse; la clave no.
help.action.op_keys_gen.open_validation.title=Abrir Validación y KCV
help.action.op_keys_gen.open_validation.description=Lleva la clave generada a Validación y KCV para comprobar su paridad y sus valores de comprobación.
help.field.op_keys_gen.type.label=Tipo
help.field.op_keys_gen.type.description=Algoritmo y longitud de la clave que se genera.
help.field.op_keys_gen.odd_parity.label=Forzar paridad impar
help.field.op_keys_gen.odd_parity.description=Ajusta el bit más bajo de cada byte para que todos tengan paridad impar, como exigen tradicionalmente las claves DES y 3DES. No se aplica a otros algoritmos.
help.field.op_keys_gen.generated_key.label=Clave generada
help.field.op_keys_gen.generated_key.description=La clave nueva en hexadecimal. Es material secreto: cópiala solo a donde se vaya a usar.
help.field.op_keys_gen.kcv_length.label=Longitud del KCV
help.field.op_keys_gen.kcv_length.description=Muestra los valores de comprobación de clave con 4 bytes en lugar de 3. Solo cambia cuántos bytes se muestran, no la clave.
