# module-help:op_pqc_gen begin
help.operation.op_pqc_gen.title=Generación de claves PQC
help.operation.op_pqc_gen.purpose=Genera pares de claves poscuánticas con los algoritmos estandarizados por el NIST y demuestra el encapsulado de claves. Las claves de firma (ML-DSA, SLH-DSA) y las de encapsulado (ML-KEM) son de clases distintas y no son intercambiables.
help.action.op_pqc_gen.generate.title=Generar par de claves
help.action.op_pqc_gen.generate.description=Crea un par de claves para el algoritmo seleccionado.
help.action.op_pqc_gen.import_export.title=Importar o exportar
help.action.op_pqc_gen.import_export.description=Carga claves desde archivos PEM o el Clipboard Shelf, o escribe las claves actuales en archivos PEM.
help.action.op_pqc_gen.kem.title=Demostración KEM
help.action.op_pqc_gen.kem.description=Bob encapsula un secreto compartido hacia la clave pública de Alice y Alice lo desencapsula con su clave privada; ambos acaban con el mismo secreto. Ilustra el mecanismo y no es un protocolo de comunicación.
help.action.op_pqc_gen.benchmark.title=Benchmark
help.action.op_pqc_gen.benchmark.description=Mide en esta máquina los tiempos de generación de claves y de operación de un algoritmo.
help.field.op_pqc_gen.algorithm.label=Algoritmo
help.field.op_pqc_gen.algorithm.description=Algoritmo y conjunto de parámetros. Los conjuntos superiores dan más margen de seguridad a cambio de claves y firmas mayores.
help.field.op_pqc_gen.public_key.label=Clave pública
help.field.op_pqc_gen.public_key.description=Clave pública del par.
help.field.op_pqc_gen.private_key.label=Clave privada
help.field.op_pqc_gen.private_key.description=Clave privada del par. Material sensible.
help.field.op_pqc_gen.details.label=Detalles de la clave
help.field.op_pqc_gen.details.description=Tamaños y parámetros de las claves generadas.
help.field.op_pqc_gen.kem_algorithm.label=Algoritmo KEM
help.field.op_pqc_gen.kem_algorithm.description=Conjunto de parámetros ML-KEM de la demostración. Necesita un par de claves ML-KEM generado arriba.
help.field.op_pqc_gen.kem_ciphertext.label=Texto cifrado del encapsulado
help.field.op_pqc_gen.kem_ciphertext.description=Lo que Bob envía a Alice. Puede viajar en abierto.
help.field.op_pqc_gen.kem_secrets.label=Secretos compartidos
help.field.op_pqc_gen.kem_secrets.description=Los secretos de Bob y de Alice. Deben ser iguales si el intercambio funcionó.
help.field.op_pqc_gen.benchmark_algorithm.label=Algoritmo
help.field.op_pqc_gen.benchmark_algorithm.description=Algoritmo que se mide.
help.field.op_pqc_gen.benchmark.label=Resultados
help.field.op_pqc_gen.benchmark.description=Tiempos medidos. Dependen de esta máquina y de su carga.
# module-help:op_pqc_gen end
