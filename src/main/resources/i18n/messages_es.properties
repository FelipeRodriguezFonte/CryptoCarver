module.keys.keyBlock.title=🧱 Key Block de Thales
module.keys.keyBlock.help=Mismo esqueleto que un bloque ANSI X9.143 / TR-31, con tres diferencias que hacen que un lector TR-31 corriente lo rechace: el identificador de versión es un dígito y no una letra, Thales añade sus propios códigos de uso de clave, y añade sus propios bloques de cabecera opcionales. La tabla de usos no es una lista de nombres: dice qué algoritmos y qué modos permite cada uso, que es lo que permite llamar malformada a una cabecera malformada. Si le das la LMK de Key Block también descifra la clave y comprueba el autenticador, que ata la cabecera a la clave: cambia un carácter de cualquiera de las dos y deja de cuadrar.
