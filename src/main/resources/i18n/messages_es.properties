help.action.op_gen_file.choose_destination.description=Selecciona la ruta local donde se guardará el archivo convertido. No sobrescribe ni convierte hasta ejecutar la acción correspondiente.
help.action.op_gen_file.choose_destination.example=Elija un destino distinto del origen para una prueba reversible y revise el formato antes de convertir.
help.action.op_gen_file.choose_destination.title=Elegir archivo de destino
help.action.op_gen_file.choose_source.description=Selecciona el archivo local de origen. Elegirlo no inicia una conversión ni incorpora su ruta a la ayuda.
help.action.op_gen_file.choose_source.example=Elija un archivo de prueba pequeño para convertir. La vista previa usa como máximo los primeros 4 KiB.
help.action.op_gen_file.choose_source.title=Elegir archivo de origen
help.action.op_gen_file.compare.description=Compara los archivos origen y comparación byte a byte, sin depender de los selectores de formato; informa igualdad o primer offset distinto.
help.action.op_gen_file.compare.example=Dos copias idénticas resultan iguales; si el segundo byte difiere, el resultado señala offset 1. Se requieren ambos archivos.
help.action.op_gen_file.compare.title=Comparar archivos
help.action.op_gen_file.convert.description=Convierte el archivo entre Binary, Text, Hex o Base64. Text usa la codificación seleccionada; Hex elimina espacios del texto fuente.
help.action.op_gen_file.convert.example=Los bytes «AB» como Text UTF-8 se convierten a Hex 4142. Texto Base64 mal formado o Hex impar detiene la conversión.
help.action.op_gen_file.convert.title=Convertir
help.action.op_gen_file.hash_file.description=Calcula SHA-256 leyendo el archivo en bloques e informa el tamaño procesado. La ruta y el contenido permanecen locales.
help.action.op_gen_file.hash_file.example=SHA-256 de un archivo vacío es e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855. Se requiere un origen legible.
help.action.op_gen_file.hash_file.title=Calcular SHA-256 del archivo
help.action.op_gen_file.preview.description=Muestra una vista Hex de los primeros 4096 bytes del archivo origen; no convierte ni escribe el destino.
help.action.op_gen_file.preview.example=Un archivo mayor de 4 KiB se limita a ese prefijo. Sin un origen legible no hay vista previa.
help.action.op_gen_file.preview.title=Vista previa (4 KiB)
help.action.op_gen_hash.apply_template.description=Aplica a los controles ajustes predefinidos no secretos; esta acción no calcula la huella.
help.action.op_gen_hash.apply_template.example=Una plantilla incorporada puede dejar SHA-256 y Texto→Hex seleccionados. Después revise la entrada y pulse Calcular.
help.action.op_gen_hash.apply_template.title=Aplicar plantilla
help.action.op_gen_hash.calculate.description=Calcula la huella de los bytes interpretados según el formato de entrada; no modifica el texto de entrada.
help.action.op_gen_hash.calculate.example=Con SHA-256 y entrada Texto UTF-8 «abc», la salida Hex es ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad. Un Hex impar o inválido no forma bytes válidos.
help.action.op_gen_hash.calculate.title=Calcular
help.action.op_gen_hash.manage_templates.description=Abre los controles para guardar o administrar preferencias no secretas. Los nombres personales no forman parte del contexto de ayuda.
help.action.op_gen_hash.manage_templates.example=Guarde una combinación de algoritmo y formatos para reutilizarla; no incluya claves ni datos de entrada en el nombre.
help.action.op_gen_hash.manage_templates.title=Administrar plantillas
help.action.op_gen_hash.select_algorithm.description=La selección cambia el algoritmo y el tamaño de salida. MD4, MD5 y SHA-1 son heredados; CRC32 solo detecta errores accidentales.
help.action.op_gen_hash.select_algorithm.example=SHA-256 produce 32 bytes (64 dígitos Hex); SHA-512 produce 64 bytes. No use CRC ni hashes heredados para autenticar.
help.action.op_gen_hash.select_algorithm.title=Elegir algoritmo
help.action.op_gen_manual.base32_decode.description=Decodifica Base32 y convierte los bytes resultantes en texto UTF-8.
help.action.op_gen_manual.base32_decode.example=IE====== decodifica a «A». Una entrada con símbolos fuera del alfabeto Base32 no es válida.
help.action.op_gen_manual.base32_decode.title=Decodificar Base32
help.action.op_gen_manual.base32_encode.description=Codifica el texto UTF-8 con el alfabeto Base32. Esta acción usa su propio parser y no los selectores de la barra.
help.action.op_gen_manual.base32_encode.example=El texto «A» se codifica como IE======. La salida incluye padding Base32.
help.action.op_gen_manual.base32_encode.title=Codificar Base32
help.action.op_gen_manual.base64url_decode.description=Decodifica Base64URL a texto UTF-8; la entrada debe usar el alfabeto Base64URL y tener longitud válida.
help.action.op_gen_manual.base64url_decode.example=QUI decodifica a «AB». Un carácter fuera del alfabeto, como «+», se rechaza.
help.action.op_gen_manual.base64url_decode.title=Decodificar Base64URL
help.action.op_gen_manual.base64url_encode.description=Codifica el texto UTF-8 como Base64URL, con alfabeto seguro para URL y sin padding final. Esta acción usa su propio parser.
help.action.op_gen_manual.base64url_encode.example=El texto «AB» produce QUI. No se aplican los selectores globales de formato.
help.action.op_gen_manual.base64url_encode.title=Codificar Base64URL
help.action.op_gen_manual.bcd_decode.description=Desempaqueta nibbles BCD y devuelve dígitos decimales; cada nibble debe estar entre 0 y 9.
help.action.op_gen_manual.bcd_decode.example=Hex 012345 se convierte en 012345. Un nibble A–F no es un dígito BCD válido.
help.action.op_gen_manual.bcd_decode.title=Decodificar BCD
help.action.op_gen_manual.bcd_encode.description=Empaqueta dígitos decimales en BCD: dos dígitos por byte; si hay una cantidad impar, antepone un cero.
help.action.op_gen_manual.bcd_encode.example=12345 se empaqueta como Hex 012345. No admite signo, punto decimal ni letras.
help.action.op_gen_manual.bcd_encode.title=Codificar BCD
help.action.op_gen_manual.comp3_decode.description=Decodifica COMP-3 validando los nibbles decimales y el nibble final de signo.
help.action.op_gen_manual.comp3_decode.example=12345C se convierte en 12345. Un nibble de signo desconocido o un dígito A–F se rechaza.
help.action.op_gen_manual.comp3_decode.title=Decodificar COMP-3
help.action.op_gen_manual.comp3_encode.description=Codifica un entero decimal en COMP-3 con nibble de signo al final: C positivo, D negativo.
help.action.op_gen_manual.comp3_encode.example=12345 produce 12345C y -12345 produce 12345D. Solo admite un entero con signo opcional.
help.action.op_gen_manual.comp3_encode.title=Codificar COMP-3
help.action.op_gen_manual.compress.description=Comprime los bytes interpretados por los formatos locales con gzip, zlib o deflate. La compresión no cifra ni autentica.
help.action.op_gen_manual.compress.example=Texto «abc» puede comprimirse con gzip y salida Hex. Al descomprimir, seleccione el mismo envoltorio.
help.action.op_gen_manual.compress.title=Comprimir
help.action.op_gen_manual.convert.description=Interpreta la entrada con los formatos locales y vuelve a representar los mismos bytes. La casilla EBCDIC activa la conversión de página seleccionada.
help.action.op_gen_manual.convert.example=Texto UTF-8 «AB» se convierte a Hex 4142. Un Hex con un dígito impar no representa bytes completos.
help.action.op_gen_manual.convert.title=Convertir
help.action.op_gen_manual.decompress.description=Descomprime con el envoltorio seleccionado y representa los bytes recuperados en el formato de salida. La expansión está limitada a 64 MiB.
help.action.op_gen_manual.decompress.example=Una entrada gzip completa se restaura a «abc». Bytes truncados, formato incompatible o salida superior al límite se rechazan.
help.action.op_gen_manual.decompress.title=Descomprimir
help.action.op_gen_manual.endian.description=Invierte el orden de bytes dentro de cada palabra seleccionada; el tamaño debe dividir exactamente la entrada.
help.action.op_gen_manual.endian.example=Con palabra de 32 bits, Hex 01020304 pasa a 04030201. Tres bytes no forman una palabra de 32 bits.
help.action.op_gen_manual.endian.title=Invertir bytes por palabra
help.action.op_gen_manual.extract_trace_hex.description=Busca secuencias Hex en texto de traza: ignora offsets convencionales y grupos cortos, y devuelve corridas de al menos cuatro bytes.
help.action.op_gen_manual.extract_trace_hex.example=Una línea «00000100: DE AD BE EF» aporta DEADBEEF. Una traza sin una corrida de cuatro bytes produce aviso/error.
help.action.op_gen_manual.extract_trace_hex.title=Extraer Hex de traza
help.action.op_gen_manual.manage_templates.description=Abre los controles de plantillas de conversión. La ayuda no lee nombres ni valores guardados.
help.action.op_gen_manual.manage_templates.example=Una plantilla puede recordar formato de entrada y salida; no ejecuta ninguna conversión al aplicarla.
help.action.op_gen_manual.manage_templates.title=Administrar plantillas
help.action.op_gen_manual.shift_left.description=Desplaza a la izquierda los bits del Hex conservando el ancho; los bits que salen se pierden y entran ceros.
help.action.op_gen_manual.shift_left.example=Hex 12 desplazado 1 bit resulta 24. Se acepta un número entero de bits no negativo; entrada no Hex se rechaza.
help.action.op_gen_manual.shift_left.title=Desplazar bits a la izquierda
help.action.op_gen_manual.shift_right.description=Desplaza a la derecha los bits del Hex conservando el ancho; entran ceros por la izquierda.
help.action.op_gen_manual.shift_right.example=Hex 12 desplazado 1 bit resulta 09 al conservar dos dígitos. No introduzca prefijo 0x ni un desplazamiento negativo.
help.action.op_gen_manual.shift_right.title=Desplazar bits a la derecha
help.action.op_gen_manual.url_decode.description=Decodifica un componente de formulario URL como UTF-8; + se interpreta como espacio.
help.action.op_gen_manual.url_decode.example=a+b produce «a b». Un escape porcentual incompleto, como %2, genera error.
help.action.op_gen_manual.url_decode.title=Decodificar componente URL
help.action.op_gen_manual.url_encode.description=Codifica un componente de formulario URL usando UTF-8; el espacio se representa como +.
help.action.op_gen_manual.url_encode.example=«a b» produce a+b. Para un espacio literal + en la entrada, la salida codifica el signo más.
help.action.op_gen_manual.url_encode.title=Codificar componente URL
help.action.op_gen_mod.calculate.description=Calcula la operación elegida. Los operandos se interpretan en Hex salvo XOR decimal; cada operación exige solo sus operandos aplicables.
help.action.op_gen_mod.calculate.example=En Hex, (03 + 04) mod 0B = 7. Inversa de 6 módulo 9 falla porque no son coprimos.
help.action.op_gen_mod.calculate.title=Calcular
help.action.op_gen_mod.select_operation.description=La operación determina qué operandos son necesarios y si se usa módulo. Las operaciones estándar leen Hex; las dos opciones XOR declaran su base.
help.action.op_gen_mod.select_operation.example=GCD(a,b) requiere A y B, sin módulo; suma modular requiere A, B y m. XOR decimal exige dígitos decimales y muestra el resultado en Hex.
help.action.op_gen_mod.select_operation.title=Elegir operación
help.action.op_gen_process_designer.node.example=Conecta un nodo de entrada de texto, uno de conversión y uno de salida; la simulación comprueba el grafo sin ejecutarlo. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_gen_random.generate.description=Genera entre 1 y 1024 bytes con SecureRandom y los representa en el formato seleccionado. El valor concreto cambia en cada ejecución.
help.action.op_gen_random.generate.example=16 bytes producen 32 caracteres Hex, 24 caracteres Base64 o 16 valores decimales separados. Cero, 1025 o texto no entero se rechazan.
help.action.op_gen_random.generate.title=Generar
help.action.op_gen_random.select_format.description=Elige la representación de la próxima generación: Hexadecimal, Decimal, Base64 o Binary. Cambiar el selector no reformatea la salida existente.
help.action.op_gen_random.select_format.example=Si 16 bytes ya aparecen como 32 dígitos Hex, seleccionar Base64 conserva esos dígitos. Pulsa Generar para obtener otra secuencia de 16 bytes en 24 caracteres Base64.
help.action.op_gen_random.select_format.title=Elegir formato
help.action.op_keys_format_workbench.convert.description=Usa el parser y los formatos propios de esta acción; las acciones especializadas pueden no seguir los selectores globales.
help.action.op_keys_format_workbench.convert.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.convert.title=Convertir
help.action.op_keys_format_workbench.copy.description=Aplica la acción copy con los controles pertinentes de esta pantalla.
help.action.op_keys_format_workbench.copy.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.copy.title=Copy
help.action.op_keys_format_workbench.load_file.description=Aplica la acción load file con los controles pertinentes de esta pantalla.
help.action.op_keys_format_workbench.load_file.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.load_file.title=Cargar archivo
help.action.op_keys_format_workbench.load_shelf.description=Aplica la acción load shelf con los controles pertinentes de esta pantalla.
help.action.op_keys_format_workbench.load_shelf.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.load_shelf.title=Cargar desde Clipboard Shelf
help.action.op_keys_format_workbench.parse.description=Detecta el formato y extrae los metadatos disponibles; no establece confianza ni valida una cadena.
help.action.op_keys_format_workbench.parse.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.parse.title=Detectar y analizar
help.action.op_keys_format_workbench.send_to_shelf.description=Aplica la acción send to shelf con los controles pertinentes de esta pantalla.
help.action.op_keys_format_workbench.send_to_shelf.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.send_to_shelf.title=Enviar a Clipboard Shelf
help.action.op_keys_format_workbench.validate.description=Comprueba el valor con la regla seleccionada; no certifica su origen.
help.action.op_keys_format_workbench.validate.example=Analiza un certificado público de ejemplo, inspecciona sus metadatos y convierte entre los formatos DER y PEM admitidos. El ejemplo es ilustrativo; se aplican los requisitos del control activo.
help.action.op_keys_format_workbench.validate.title=Validar
