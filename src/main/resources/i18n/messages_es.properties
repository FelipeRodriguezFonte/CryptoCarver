# module-help:op_keys_val begin
help.operation.op_keys_val.title=Validación y KCV
help.operation.op_keys_val.purpose=Comprueba una clave simétrica escrita en hexadecimal y calcula sus valores de comprobación, que permiten a dos partes confirmar que tienen la misma clave sin intercambiarla.
help.action.op_keys_val.validate.title=Validar y calcular KCV
help.action.op_keys_val.validate.description=Analiza la clave y escribe el informe con su longitud, paridad y valores de comprobación.
help.field.op_keys_val.key.label=Clave
help.field.op_keys_val.key.description=Clave en hexadecimal.
help.field.op_keys_val.result.label=Informe
help.field.op_keys_val.result.description=Resultado de la validación y valores de comprobación calculados.
help.field.op_keys_val.kcv_length.label=Longitud del KCV
help.field.op_keys_val.kcv_length.description=Muestra los valores de comprobación de clave con 4 bytes en lugar de 3. Solo cambia cuántos bytes se muestran, no la clave.
# module-help:op_keys_val end
# module-help:op_keys_share begin
help.operation.op_keys_share.title=Reparto de claves (XOR)
help.operation.op_keys_share.purpose=Divide una clave en componentes cuyo XOR es la clave, o combina componentes para recuperarla. Hacen falta todos los componentes: si falta uno, los demás no revelan nada de la clave.
help.action.op_keys_share.split.title=Dividir clave
help.action.op_keys_share.split.description=Genera el número elegido de componentes aleatorios para la clave.
help.action.op_keys_share.combine.title=Combinar componentes
help.action.op_keys_share.combine.description=Aplica XOR a los componentes introducidos y muestra la clave resultante. Todos los componentes deben tener la misma longitud.
help.field.op_keys_share.key.label=Clave a dividir
help.field.op_keys_share.key.description=Clave en hexadecimal.
help.field.op_keys_share.parts.label=Partes
help.field.op_keys_share.parts.description=Número de componentes que se crean.
help.field.op_keys_share.components.label=Componentes
help.field.op_keys_share.components.description=Componentes en hexadecimal. Los dos primeros son obligatorios; el resto, opcionales.
help.field.op_keys_share.result.label=Resultado
help.field.op_keys_share.result.description=Componentes generados al dividir, o clave recuperada al combinar.
# module-help:op_keys_share end
# module-help:op_keys_kdf begin
help.operation.op_keys_kdf.title=Derivación de claves (KDF)
help.operation.op_keys_kdf.purpose=Deriva bytes de clave a partir de material de entrada con la función de derivación seleccionada. Las mismas entradas dan siempre la misma salida, así que todos los parámetros deben coincidir en ambos lados.
help.action.op_keys_kdf.derive.title=Derivar clave
help.action.op_keys_kdf.derive.description=Ejecuta la derivación y escribe los bytes derivados en el resultado.
help.action.op_keys_kdf.generate_salt.title=Generar salt
help.action.op_keys_kdf.generate_salt.description=Rellena el salt con bytes aleatorios. Guárdalo junto al resultado: hace falta para volver a derivar la misma clave.
help.field.op_keys_kdf.algorithm.label=Algoritmo
help.field.op_keys_kdf.algorithm.description=Función de derivación. Decide cuáles de los campos siguientes se aplican; los que no, se ocultan.
help.field.op_keys_kdf.input_format.label=Formato de entrada
help.field.op_keys_kdf.input_format.description=Cómo se decodifica en bytes el material de entrada antes de derivar.
help.field.op_keys_kdf.input.label=Material de entrada
help.field.op_keys_kdf.input.description=Contraseña o secreto del que se deriva la clave, escrito en el formato de entrada seleccionado.
help.field.op_keys_kdf.iterations.label=Iteraciones
help.field.op_keys_kdf.iterations.description=Factor de trabajo de las funciones basadas en contraseña. Más iteraciones hacen más lento adivinar la contraseña, y también la derivación.
help.field.op_keys_kdf.output_length.label=Longitud de salida
help.field.op_keys_kdf.output_length.description=Número de bytes que se derivan.
help.field.op_keys_kdf.salt.label=Salt
help.field.op_keys_kdf.salt.description=Valor no secreto que hace distintas las derivaciones de una misma entrada. El selector indica el formato en que está escrito.
help.field.op_keys_kdf.info.label=Info
help.field.op_keys_kdf.info.description=Etiqueta de contexto que usa HKDF para derivar claves independientes del mismo material. Otras funciones la ignoran.
help.field.op_keys_kdf.result.label=Clave derivada
help.field.op_keys_kdf.result.description=Bytes derivados. Trátalos como una clave secreta.
# module-help:op_keys_kdf end
# module-help:op_keys_wrap begin
help.operation.op_keys_wrap.title=AES Key Wrap
help.operation.op_keys_wrap.purpose=Envuelve una clave bajo una clave AES de cifrado de claves (KEK), o la desenvuelve, con RFC 3394 o RFC 5649. La forma envuelta lleva una comprobación de integridad, así que una KEK incorrecta o unos datos alterados se rechazan.
help.action.op_keys_wrap.execute.title=Ejecutar key wrap
help.action.op_keys_wrap.execute.description=Envuelve los datos de clave, o los desenvuelve si Unwrap está marcado, y escribe el resultado.
help.field.op_keys_wrap.mode.label=Modo
help.field.op_keys_wrap.mode.description=RFC 3394 exige datos de clave en múltiplos de 8 bytes; RFC 5649 añade relleno y admite cualquier longitud.
help.field.op_keys_wrap.direction.label=Desenvolver
help.field.op_keys_wrap.direction.description=Sin marcar envuelve; marcado desenvuelve.
help.field.op_keys_wrap.kek.label=KEK
help.field.op_keys_wrap.kek.description=Clave AES de cifrado de claves en hexadecimal: 16, 24 o 32 bytes.
help.field.op_keys_wrap.data.label=Datos de clave
help.field.op_keys_wrap.data.description=Clave que se envuelve, o datos envueltos que se desenvuelven, en hexadecimal.
help.field.op_keys_wrap.result.label=Resultado
help.field.op_keys_wrap.result.description=Datos envueltos, o la clave recuperada.
# module-help:op_keys_wrap end
# module-help:op_keys_tr31 begin
help.operation.op_keys_tr31.title=Bloques de claves TR-31
help.operation.op_keys_tr31.purpose=Construye y abre bloques de claves TR-31 (ANSI X9.143): una clave envuelta bajo una Key Block Protection Key junto con una cabecera que indica para qué puede usarse la clave. La cabecera está autenticada, así que no puede cambiarse sin invalidar el bloque.
help.action.op_keys_tr31.export.title=Envolver clave (exportar)
help.action.op_keys_tr31.export.description=Envuelve la clave bajo la KBPK con los atributos de cabecera seleccionados y escribe el bloque de claves.
help.action.op_keys_tr31.import.title=Desenvolver clave
help.action.op_keys_tr31.import.description=Verifica el bloque con la KBPK y recupera la clave y sus atributos de cabecera.
help.action.op_keys_tr31.parse_header.title=Analizar cabecera
help.action.op_keys_tr31.parse_header.description=Lee la cabecera del bloque sin KBPK. Muestra los atributos declarados pero no verifica el bloque.
help.action.op_keys_tr31.clear_reset.title=Limpiar o restablecer
help.action.op_keys_tr31.clear_reset.description=Limpiar vacía los campos de exportación; Restablecer valores predeterminados devuelve los selectores a sus valores iniciales.
help.field.op_keys_tr31.kbpk_export.label=KBPK
help.field.op_keys_tr31.kbpk_export.description=Key Block Protection Key en hexadecimal. Protege el bloque; no es la clave que se transporta.
help.field.op_keys_tr31.key.label=Clave a envolver
help.field.op_keys_tr31.key.description=Clave que se transporta, en hexadecimal.
help.field.op_keys_tr31.version.label=Versión
help.field.op_keys_tr31.version.description=Versión del bloque, que fija el método de protección y el algoritmo de KBPK que espera.
help.field.op_keys_tr31.usage.label=Uso
help.field.op_keys_tr31.usage.description=Para qué sirve la clave envuelta, por ejemplo cifrado de PIN o MAC.
help.field.op_keys_tr31.algorithm.label=Algoritmo
help.field.op_keys_tr31.algorithm.description=Algoritmo al que pertenece la clave envuelta.
help.field.op_keys_tr31.mode.label=Modo de uso
help.field.op_keys_tr31.mode.description=Operaciones permitidas con la clave, por ejemplo solo cifrar o ambos sentidos.
help.field.op_keys_tr31.exportability.label=Exportabilidad
help.field.op_keys_tr31.exportability.description=Si el receptor puede volver a exportar la clave.
help.field.op_keys_tr31.optional_blocks.label=Bloques opcionales
help.field.op_keys_tr31.optional_blocks.description=Bloques de cabecera adicionales en forma compacta. Déjalo vacío salvo que el receptor los espere.
help.field.op_keys_tr31.export_result.label=Resultado de exportación
help.field.op_keys_tr31.export_result.description=El bloque de claves generado.
help.field.op_keys_tr31.kbpk_import.label=KBPK
help.field.op_keys_tr31.kbpk_import.description=Key Block Protection Key con la que se creó el bloque, en hexadecimal.
help.field.op_keys_tr31.key_block.label=Bloque TR-31
help.field.op_keys_tr31.key_block.description=Bloque de claves que se abre, como texto.
help.field.op_keys_tr31.expected_length.label=Longitud esperada
help.field.op_keys_tr31.expected_length.description=Longitud opcional de la clave en bytes, para comprobar la clave recuperada.
help.field.op_keys_tr31.import_result.label=Resultado de importación
help.field.op_keys_tr31.import_result.description=Clave recuperada y atributos de cabecera, o la cabecera analizada.
# module-help:op_keys_tr31 end
# module-help:op_keys_compare begin
help.operation.op_keys_compare.title=Comparar clave pública y privada
help.operation.op_keys_compare.purpose=Comprueba si una clave pública, o la de un certificado, y una clave privada pertenecen al mismo par. Lo demuestra criptográficamente con un reto de firma temporal, en lugar de comparar el texto PEM.
help.action.op_keys_compare.compare.title=Comparar par
help.action.op_keys_compare.compare.description=Firma un reto desechable con la clave privada y lo verifica con la clave pública.
help.field.op_keys_compare.public.label=Clave pública o certificado
help.field.op_keys_compare.public.description=PEM de clave pública, o PEM de un certificado X.509 del que se usa su clave pública.
help.field.op_keys_compare.private.label=Clave privada
help.field.op_keys_compare.private.description=PEM de clave privada. Se usa solo para el reto.
help.field.op_keys_compare.result.label=Resultado
help.field.op_keys_compare.result.description=Si las dos claves forman un par.
# module-help:op_keys_compare end
# module-help:op_keys_material begin
help.operation.op_keys_material.title=Inspector de material de clave
help.operation.op_keys_material.purpose=Lee una clave pública, una clave privada o un certificado X.509 en PEM e informa de su tipo, tamaño y huella junto con indicaciones de seguridad. Inspecciona; no valida la confianza.
help.action.op_keys_material.inspect.title=Inspeccionar material
help.action.op_keys_material.inspect.description=Analiza el PEM pegado y escribe el informe.
help.field.op_keys_material.input.label=Material
help.field.op_keys_material.input.description=Bloque PEM que se inspecciona.
help.field.op_keys_material.report.label=Informe
help.field.op_keys_material.report.description=Huella, tamaño e indicaciones sobre el material.
# module-help:op_keys_material end
# module-help:op_keys_store begin
help.operation.op_keys_store.title=Inspector de KeyStore
help.operation.op_keys_store.purpose=Abre un keystore PKCS#12, JKS o JCEKS y lista sus entradas. Por defecto muestra solo metadatos y nunca exporta claves privadas ni secretas.
help.action.op_keys_store.inspect.title=Inspeccionar KeyStore
help.action.op_keys_store.inspect.description=Abre el archivo con la contraseña y lista sus entradas.
help.action.op_keys_store.choose.title=Examinar
help.action.op_keys_store.choose.description=Elige el archivo de keystore.
help.action.op_keys_store.profile.title=Cargar o guardar perfil
help.action.op_keys_store.profile.description=Un perfil recuerda la ruta y el tipo del archivo bajo un nombre. La contraseña nunca se guarda.
help.field.op_keys_store.path.label=Archivo
help.field.op_keys_store.path.description=Ruta del archivo de keystore.
help.field.op_keys_store.type.label=Tipo
help.field.op_keys_store.type.description=Auto detecta el formato; elige PKCS12, JKS o JCEKS para forzar uno.
help.field.op_keys_store.password.label=Contraseña del almacén
help.field.op_keys_store.password.description=Contraseña del keystore. Se usa solo para esta inspección.
help.field.op_keys_store.unsafe_extract.label=Extracción insegura
help.field.op_keys_store.unsafe_extract.description=Muestra en claro las claves privadas y secretas exportables. Pensado solo para keystores de laboratorio.
help.field.op_keys_store.profile.label=Perfil guardado
help.field.op_keys_store.profile.description=Perfil que se carga.
help.field.op_keys_store.profile_name.label=Nombre del perfil
help.field.op_keys_store.profile_name.description=Nombre con el que se guardan la ruta y el tipo actuales.
help.field.op_keys_store.report.label=Informe
help.field.op_keys_store.report.description=Entradas encontradas en el keystore.
