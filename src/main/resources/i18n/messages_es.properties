module.keys.thales.title=🏛 LMK de variante Thales
module.keys.thales.help=Aquí hay dos cosas distintas que se llaman igual. La variante de tipo de clave impone qué clase de clave es y cae en el primer byte de la LMK; la variante de esquema impone el orden de una clave de varias partes y cae en el primer byte de la mitad derecha de la LMK. Las dos se aplican a la clave que cifra, y cada parte de 8 bytes se cifra por separado en ECB.
