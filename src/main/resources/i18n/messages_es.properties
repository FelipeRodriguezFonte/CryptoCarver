help.action.op_sym_file.select_profile.description=Selecciona AES-256-GCM, AES-256-CTR, AES-256-CBC o ChaCha20-Poly1305 y los requisitos asociados de autenticación y parámetros.
help.action.op_sym_file.select_profile.example=Ejemplo: elige GCM para cifrado autenticado de archivo completo y conserva su etiqueta separada.
