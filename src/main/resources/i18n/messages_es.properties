# module-help:op_keys_icsf_token begin
help.operation.op_keys_icsf_token.title=Analizador de key tokens ICSF / CCA
help.operation.op_keys_icsf_token.purpose=Analiza un key token nativo de IBM z/OS ICSF / CCA y explica lo que declara: ámbito, algoritmo, tipo de clave, longitud y fortaleza efectiva. No descifra nada; el material de clave protegido solo es recuperable dentro del coprocesador.
help.action.op_keys_icsf_token.analyze.title=Analizar token
help.action.op_keys_icsf_token.analyze.description=Decodifica el token y rellena la tarjeta resumen y el detalle campo a campo.
help.action.op_keys_icsf_token.load_save.title=Cargar archivo o guardar informe
help.action.op_keys_icsf_token.load_save.description=Carga un token desde un archivo binario, o guarda el análisis como informe.
help.action.op_keys_icsf_token.examples.title=Ejemplos
help.action.op_keys_icsf_token.examples.description=Carga un token de ejemplo del tipo indicado para ver cómo se interpreta cada uno.
help.action.op_keys_icsf_token.clear_reset.title=Limpiar o restablecer
help.action.op_keys_icsf_token.clear_reset.description=Limpiar vacía el token y los resultados; Restablecer valores predeterminados devuelve además los selectores a sus valores iniciales.
help.field.op_keys_icsf_token.origin.label=Procedencia
help.field.op_keys_icsf_token.origin.description=De dónde procede el token. No puede deducirse de los bytes, así que se declara; cambia cómo se interpreta un patrón de verificación de clave maestra ausente.
help.field.op_keys_icsf_token.format.label=Formato de entrada
help.field.op_keys_icsf_token.format.description=Cómo se lee el texto pegado: hexadecimal corriente, o las dos filas del host con los dígitos altos arriba y los bajos debajo.
help.field.op_keys_icsf_token.input.label=Key token
help.field.op_keys_icsf_token.input.description=El token en hexadecimal.
help.field.op_keys_icsf_token.summary.label=Tarjeta resumen
help.field.op_keys_icsf_token.summary.description=Los datos principales del token de un vistazo.
help.field.op_keys_icsf_token.detail.label=Detalle
help.field.op_keys_icsf_token.detail.description=Cada campo del token, con notas de procedencia y avisos.
# module-help:op_keys_icsf_token end
# module-help:op_keys_icsf_batch begin
help.operation.op_keys_icsf_batch.title=Análisis por lotes ICSF / CCA
help.operation.op_keys_icsf_batch.purpose=Analiza muchos key tokens ICSF / CCA a la vez y produce estadísticas, hallazgos de auditoría y un inventario normalizado. Igual que el analizador individual, no descifra nada.
help.action.op_keys_icsf_batch.analyze.title=Analizar lote
help.action.op_keys_icsf_batch.analyze.description=Lee todos los tokens de la entrada y rellena las cuatro pestañas de resultados.
help.action.op_keys_icsf_batch.load.title=Cargar archivo o ejemplo
help.action.op_keys_icsf_batch.load.description=Carga los tokens desde un archivo, o un lote de ejemplo para probar la pantalla.
help.action.op_keys_icsf_batch.save.title=Guardar informe o inventario
help.action.op_keys_icsf_batch.save.description=Guarda el informe como texto, o el inventario como CSV para una hoja de cálculo.
help.action.op_keys_icsf_batch.filter.title=Filtrar el inventario
help.action.op_keys_icsf_batch.filter.description=Acota el inventario por texto. Un doble clic en un hallazgo filtra por él; Limpiar filtro vuelve a mostrarlo todo.
help.action.op_keys_icsf_batch.clear_reset.title=Limpiar o restablecer
help.action.op_keys_icsf_batch.clear_reset.description=Limpiar vacía la entrada y los resultados; Restablecer valores predeterminados devuelve además los selectores a sus valores iniciales.
help.field.op_keys_icsf_batch.origin.label=Procedencia
help.field.op_keys_icsf_batch.origin.description=De dónde procede el token. No puede deducirse de los bytes, así que se declara; cambia cómo se interpreta un patrón de verificación de clave maestra ausente.
help.field.op_keys_icsf_batch.reading.label=Lectura
help.field.op_keys_icsf_batch.reading.description=Cómo se divide la entrada en tokens. La lectura automática decide bloque a bloque y se queda con la forma que produce tokens.
help.field.op_keys_icsf_batch.input.label=Key tokens
help.field.op_keys_icsf_batch.input.description=Un token por línea, opcionalmente precedido de una etiqueta y una barra, o dos filas del host por token, o un bloque de hexadecimal apilado. Las líneas en blanco separan bloques.
help.field.op_keys_icsf_batch.include_detail.label=Incluir detalle por token
help.field.op_keys_icsf_batch.include_detail.description=Añade al informe de texto guardado el detalle completo de cada token. Desactívalo en lotes grandes, donde el archivo sería muy voluminoso.
help.field.op_keys_icsf_batch.statistics.label=Estadísticas
help.field.op_keys_icsf_batch.statistics.description=Recuentos del lote por algoritmo, tipo de clave y otros atributos.
help.field.op_keys_icsf_batch.findings.label=Hallazgos
help.field.op_keys_icsf_batch.findings.description=Hallazgos de auditoría. Selecciona uno para leer qué significa y qué hacer al respecto.
help.field.op_keys_icsf_batch.filter.label=Filtro
help.field.op_keys_icsf_batch.filter.description=Texto que se compara con la etiqueta, el tipo de clave y el hallazgo.
help.field.op_keys_icsf_batch.inventory.label=Inventario
help.field.op_keys_icsf_batch.inventory.description=Una fila normalizada por token.
help.field.op_keys_icsf_batch.report.label=Informe
help.field.op_keys_icsf_batch.report.description=El informe tal como se guarda, sin el detalle por token.
# module-help:op_keys_icsf_batch end
# module-help:op_keys_icsf_keywrap begin
help.operation.op_keys_icsf_keywrap.title=Exportación e importación de claves ICSF / CCA
help.operation.op_keys_icsf_keywrap.purpose=Reproduce en claro lo que hace el host con los verbos CCA Key Export y Key Import, para poder contrastar un token con valores conocidos. Aquí el material de clave se maneja en claro: usa solo claves de prueba.
help.action.op_keys_icsf_keywrap.export.title=Exportar
help.action.op_keys_icsf_keywrap.export.description=Cifra la clave bajo la clave EXPORTER con el Control Vector y construye el token externo.
help.action.op_keys_icsf_keywrap.import.title=Importar
help.action.op_keys_icsf_keywrap.import.description=Recupera la clave de un token o de un criptograma suelto con la clave IMPORTER.
help.action.op_keys_icsf_keywrap.inspect.title=Inspeccionar sin KEK
help.action.op_keys_icsf_keywrap.inspect.description=Lee todo lo que el token dice de sí mismo cuando no se dispone de la KEK.
help.action.op_keys_icsf_keywrap.resolve.title=Resolver esquema
help.action.op_keys_icsf_keywrap.resolve.description=Prueba las combinaciones razonables de variante de KEK, modo de cifrado y Control Vector e indica cuál reproduce la clave esperada.
help.action.op_keys_icsf_keywrap.result_actions.title=Guardar, copiar o restablecer
help.action.op_keys_icsf_keywrap.result_actions.description=Guarda el informe, copia el token o la clave obtenidos, o devuelve todas las pestañas a sus valores predeterminados.
help.field.op_keys_icsf_keywrap.export_key.label=Clave a exportar
help.field.op_keys_icsf_keywrap.export_key.description=Clave en claro en hexadecimal: 8, 16 o 24 bytes.
help.field.op_keys_icsf_keywrap.export_kek.label=KEK / EXPORTER
help.field.op_keys_icsf_keywrap.export_kek.description=Clave de transporte en claro, en hexadecimal.
help.field.op_keys_icsf_keywrap.export_type.label=Tipo de clave
help.field.op_keys_icsf_keywrap.export_type.description=Tipo de clave CCA, que selecciona el Control Vector por defecto.
help.field.op_keys_icsf_keywrap.export_cv.label=Control Vector
help.field.op_keys_icsf_keywrap.export_cv.description=Opcional. En blanco, se usa el valor por defecto del tipo de clave.
help.field.op_keys_icsf_keywrap.export_variant.label=Variante de KEK
help.field.op_keys_icsf_keywrap.export_variant.description=Cómo se combina el Control Vector con la KEK antes de cifrar.
help.field.op_keys_icsf_keywrap.export_mode.label=Modo de cifrado
help.field.op_keys_icsf_keywrap.export_mode.description=Modo de bloque con el que se cifra la clave.
help.field.op_keys_icsf_keywrap.export_rn.label=Número aleatorio
help.field.op_keys_icsf_keywrap.export_rn.description=8 bytes opcionales para el patrón de verificación; en blanco se usan ceros.
help.field.op_keys_icsf_keywrap.export_options.label=Opciones del token
help.field.op_keys_icsf_keywrap.export_options.description=Escribe el byte de versión como lo hacen los hosts reales, y marca el token NOCV cuando la clave se exporta sin Control Vector.
help.field.op_keys_icsf_keywrap.import_input.label=Token o criptograma
help.field.op_keys_icsf_keywrap.import_input.description=Un token de 64 bytes, o un criptograma suelto de 8, 16 o 24 bytes, en hexadecimal.
help.field.op_keys_icsf_keywrap.import_kek.label=KEK / IMPORTER
help.field.op_keys_icsf_keywrap.import_kek.description=Clave de transporte en claro, en hexadecimal.
help.field.op_keys_icsf_keywrap.import_type.label=Tipo de clave
help.field.op_keys_icsf_keywrap.import_type.description=Tipo de clave CCA esperado.
help.field.op_keys_icsf_keywrap.import_cv.label=Control Vector
help.field.op_keys_icsf_keywrap.import_cv.description=Opcional. En blanco, se lee del token.
help.field.op_keys_icsf_keywrap.import_variant.label=Variante de KEK
help.field.op_keys_icsf_keywrap.import_variant.description=Debe coincidir con la usada al exportar.
help.field.op_keys_icsf_keywrap.import_mode.label=Modo de cifrado
help.field.op_keys_icsf_keywrap.import_mode.description=Debe coincidir con el usado al exportar.
help.field.op_keys_icsf_keywrap.inspect_input.label=Token
help.field.op_keys_icsf_keywrap.inspect_input.description=El token de 64 bytes en hexadecimal.
help.field.op_keys_icsf_keywrap.resolve_input.label=Token o criptograma
help.field.op_keys_icsf_keywrap.resolve_input.description=Valor cuyo esquema quieres averiguar, en hexadecimal.
help.field.op_keys_icsf_keywrap.resolve_kek.label=KEK
help.field.op_keys_icsf_keywrap.resolve_kek.description=Clave de transporte en claro, en hexadecimal.
help.field.op_keys_icsf_keywrap.resolve_expected_key.label=Clave esperada
help.field.op_keys_icsf_keywrap.resolve_expected_key.description=Opcional. Con ella la respuesta es concluyente.
help.field.op_keys_icsf_keywrap.resolve_expected_kcv.label=KCV esperado
help.field.op_keys_icsf_keywrap.resolve_expected_kcv.description=Opcional, 3 o 4 bytes, para cuando no se dispone de la clave.
help.field.op_keys_icsf_keywrap.resolve_type.label=Tipo de clave
help.field.op_keys_icsf_keywrap.resolve_type.description=Opcional. Acota los Control Vectors que se prueban.
help.field.op_keys_icsf_keywrap.report.label=Resultado
help.field.op_keys_icsf_keywrap.report.description=Informe de la última operación.
# module-help:op_keys_icsf_keywrap end
# module-help:op_cert_gen begin
help.operation.op_cert_gen.title=Generar certificado
help.operation.op_cert_gen.purpose=Crea un certificado X.509 autofirmado con un par de claves nuevo, o una solicitud de firma de certificado (CSR) PKCS#10 para enviar a una CA. Los certificados autofirmados son para laboratorio: nadie más confía en ellos salvo que decida hacerlo.
help.action.op_cert_gen.generate.title=Generar certificado
help.action.op_cert_gen.generate.description=Genera un par de claves y un certificado autofirmado con el sujeto y las opciones indicados.
help.action.op_cert_gen.generate_csr.title=Generar CSR
help.action.op_cert_gen.generate_csr.description=Crea una solicitud de firma para una CA, con un par de claves nuevo o con la clave existente seleccionada en Key Type. La CSR lleva la clave pública y el sujeto; la clave privada se queda contigo.
help.field.op_cert_gen.subject.label=Sujeto
help.field.op_cert_gen.subject.description=Identidad que se escribe en el certificado. CN es el nombre común; Country es el código ISO de dos letras. Los demás campos son opcionales.
help.field.op_cert_gen.validity.label=Validez (días)
help.field.op_cert_gen.validity.description=Días durante los que el certificado es válido, contados desde ahora.
help.field.op_cert_gen.key_type.label=Tipo de clave
help.field.op_cert_gen.key_type.description=Algoritmo y tamaño del par de claves que se genera. Para una CSR también puede ser una clave existente: la clave privada pegada en el área de Analizar certificado, o una clave dentro del token PKCS#11 conectado.
help.field.op_cert_gen.sign_algorithm.label=Algoritmo de firma
help.field.op_cert_gen.sign_algorithm.description=Algoritmo que firma el certificado o la CSR. Debe corresponder al tipo de clave.
help.field.op_cert_gen.san.label=Nombres alternativos del sujeto
help.field.op_cert_gen.san.description=Nombres de host y direcciones IP para los que vale el certificado, separados por comas. Los clientes comprueban estos, no el CN.
help.field.op_cert_gen.root_ca.label=Root CA de laboratorio
help.field.op_cert_gen.root_ca.description=Marca el certificado como CA autorizada a firmar otros certificados, para poder usarlo en Emitir certificado desde CSR.
help.field.op_cert_gen.output.label=Salida
help.field.op_cert_gen.output.description=El certificado o la CSR en PEM. Cuando se genera un par de claves, también se muestra su clave privada: guárdala en lugar seguro.
# module-help:op_cert_gen end
# module-help:op_cert_issue begin
help.operation.op_cert_issue.title=Emitir certificado desde CSR
help.operation.op_cert_issue.purpose=Actúa como CA de laboratorio: comprueba la firma de una CSR y emite un certificado para ella, firmado con la clave de la CA. Usa aquí solo una clave de CA de laboratorio.
help.action.op_cert_issue.issue.title=Emitir certificado
help.action.op_cert_issue.issue.description=Verifica la CSR y emite el certificado con el perfil seleccionado.
help.field.op_cert_issue.csr.label=CSR
help.field.op_cert_issue.csr.description=Solicitud PKCS#10 en PEM.
help.field.op_cert_issue.ca_cert.label=Certificado de la CA
help.field.op_cert_issue.ca_cert.description=Certificado de la CA emisora, en PEM.
help.field.op_cert_issue.ca_key.label=Clave privada de la CA
help.field.op_cert_issue.ca_key.description=Clave privada de la CA emisora, en PEM. Firma el certificado nuevo.
help.field.op_cert_issue.validity.label=Validez (días)
help.field.op_cert_issue.validity.description=Días durante los que es válido el certificado emitido.
help.field.op_cert_issue.signature.label=Algoritmo de firma
help.field.op_cert_issue.signature.description=Automatic elige uno adecuado a la clave de la CA; si no, escribe el algoritmo que se usa.
help.field.op_cert_issue.profile.label=Perfil
help.field.op_cert_issue.profile.description=Clase de certificado que se emite, que fija sus usos de clave y si es una CA.
help.field.op_cert_issue.path_length.label=Longitud de ruta
help.field.op_cert_issue.path_length.description=En perfiles de CA, cuántos niveles más de CA pueden colgar de esta. 0 significa que solo puede emitir certificados de entidad final.
help.field.op_cert_issue.result.label=Resultado
help.field.op_cert_issue.result.description=El certificado emitido en PEM.
# module-help:op_cert_issue end
# module-help:op_cert_parse begin
help.operation.op_cert_parse.title=Analizar certificado
help.operation.op_cert_parse.purpose=Decodifica un certificado X.509 y muestra su sujeto, emisor, validez, clave, extensiones y huellas. Lee lo que dice el certificado; no comprueba si es de confianza.
help.action.op_cert_parse.parse.title=Analizar certificado
help.action.op_cert_parse.parse.description=Decodifica el certificado y escribe sus campos.
help.action.op_cert_parse.apply_template.title=Aplicar plantilla o restablecer
help.action.op_cert_parse.apply_template.description=Aplicar deja el formulario como indica la plantilla seleccionada; Restablecer valores predeterminados lo devuelve a los valores iniciales.
help.field.op_cert_parse.template.label=Plantilla
help.field.op_cert_parse.template.description=Ajustes guardados para esta pantalla.
help.field.op_cert_parse.format.label=Formato del certificado
help.field.op_cert_parse.format.description=Cómo está codificado el certificado pegado.
help.field.op_cert_parse.input.label=Certificado
help.field.op_cert_parse.input.description=Certificado que se decodifica.
help.field.op_cert_parse.result.label=Resultado
help.field.op_cert_parse.result.description=Campos decodificados del certificado.
# module-help:op_cert_parse end
# module-help:op_cert_compare begin
help.operation.op_cert_compare.title=Comparar certificados
help.operation.op_cert_compare.purpose=Compara dos certificados X.509 campo a campo e indica en qué difieren, lo que ayuda a distinguir una renovación de un certificado distinto.
help.action.op_cert_compare.compare.title=Comparar certificados
help.action.op_cert_compare.compare.description=Decodifica ambos certificados y lista sus diferencias.
help.field.op_cert_compare.left.label=Certificado izquierdo
help.field.op_cert_compare.left.description=Primer certificado, en PEM.
help.field.op_cert_compare.right.label=Certificado derecho
help.field.op_cert_compare.right.description=Segundo certificado, en PEM.
help.field.op_cert_compare.result.label=Resultado
help.field.op_cert_compare.result.description=Campos que coinciden y campos que difieren.
# module-help:op_cert_compare end
# module-help:op_cert_val begin
help.operation.op_cert_val.title=Validar certificado
help.operation.op_cert_val.purpose=Comprueba un certificado por sí solo: fechas de validez y, si se aporta el emisor, que el emisor lo firmó realmente. No construye una cadena hasta una raíz de confianza; para eso usa Cadena de certificados.
help.action.op_cert_val.validate.title=Validar certificado
help.action.op_cert_val.validate.description=Ejecuta las comprobaciones y escribe el informe de validación.
help.field.op_cert_val.certificate.label=Certificado
help.field.op_cert_val.certificate.description=Certificado que se comprueba, en PEM.
help.field.op_cert_val.issuer.label=Certificado del emisor
help.field.op_cert_val.issuer.description=Opcional. Con él, la firma del certificado se verifica con la clave del emisor.
help.field.op_cert_val.result.label=Informe de validación
help.field.op_cert_val.result.description=Resultado de cada comprobación.
# module-help:op_cert_val end
# module-help:op_cert_chain begin
help.operation.op_cert_chain.title=Cadena de certificados
help.operation.op_cert_chain.purpose=Valida una cadena de certificados desde la entidad final hacia arriba, comprobando cada firma y, si se aportan CRL, la revocación. También genera y actualiza CRL sin conexión para una CA de laboratorio.
help.action.op_cert_chain.validate_chain.title=Validar cadena
help.action.op_cert_chain.validate_chain.description=Valida la cadena y escribe el resultado, que puede exportarse como informe Markdown.
help.action.op_cert_chain.generate_crl.title=Generar CRL vacía
help.action.op_cert_chain.generate_crl.description=Crea una CRL firmada por la CA sin certificados revocados.
help.action.op_cert_chain.revoke.title=Revocar y actualizar CRL
help.action.op_cert_chain.revoke.description=Añade el número de serie a la CRL con el motivo indicado y firma la lista actualizada.
help.field.op_cert_chain.chain.label=Cadena de certificados
help.field.op_cert_chain.chain.description=Certificados en PEM, uno tras otro, con la entidad final primero.
help.field.op_cert_chain.crls.label=CRL
help.field.op_cert_chain.crls.description=Listas de revocación opcionales en PEM. Sin ellas, no se comprueba la revocación.
help.field.op_cert_chain.result.label=Resultado
help.field.op_cert_chain.result.description=Resultado de cada eslabón de la cadena.
help.field.op_cert_chain.crl_issuer_cert.label=Certificado del emisor de la CRL
help.field.op_cert_chain.crl_issuer_cert.description=Certificado de la CA que emite la CRL, en PEM.
help.field.op_cert_chain.crl_issuer_key.label=Clave del emisor de la CRL
help.field.op_cert_chain.crl_issuer_key.description=Clave privada de esa CA, en PEM. Firma la CRL.
help.field.op_cert_chain.existing_crl.label=CRL existente
help.field.op_cert_chain.existing_crl.description=CRL opcional que se amplía. Si se deja vacía, se empieza una nueva.
help.field.op_cert_chain.serial.label=Número de serie
help.field.op_cert_chain.serial.description=Número de serie del certificado que se revoca, en hexadecimal.
help.field.op_cert_chain.reason.label=Motivo
help.field.op_cert_chain.reason.description=Motivo de revocación que queda registrado en la CRL.
help.field.op_cert_chain.crl_result.label=CRL
help.field.op_cert_chain.crl_result.description=La CRL generada o actualizada en PEM.
# module-help:op_cert_chain end
# module-help:op_cert_cms begin
help.operation.op_cert_cms.title=Operaciones CMS / PKCS#7
help.operation.op_cert_cms.purpose=Firma y verifica CMS SignedData y cifra y descifra CMS EnvelopedData. La firma prueba quién generó el contenido; el ensobrado lo deja legible solo para el destinatario. Son independientes y pueden combinarse.
help.action.op_cert_cms.sign.title=Firmar
help.action.op_cert_cms.sign.description=Crea un SignedData sobre la entrada con la clave y el certificado del firmante.
help.action.op_cert_cms.verify.title=Verificar
help.action.op_cert_cms.verify.description=Verifica las firmas del SignedData pegado en la entrada. Si la firma es separada, aporta los datos originales.
help.action.op_cert_cms.add_lt.title=Añadir evidencia LT
help.action.op_cert_cms.add_lt.description=Amplía una firma CAdES con el material de validación necesario para verificarla a largo plazo.
help.action.op_cert_cms.encrypt.title=Cifrar
help.action.op_cert_cms.encrypt.description=Crea un EnvelopedData que solo puede abrir quien tenga la clave privada del destinatario.
help.action.op_cert_cms.decrypt.title=Descifrar
help.action.op_cert_cms.decrypt.description=Abre el EnvelopedData pegado en la entrada con la clave privada del destinatario.
help.action.op_cert_cms.load_token_keys.title=Cargar claves del token
help.action.op_cert_cms.load_token_keys.description=Lista las claves del token PKCS#11 conectado. Conéctalo antes en Token PKCS#11.
help.field.op_cert_cms.input.label=Entrada
help.field.op_cert_cms.input.description=Datos en bruto para firmar o cifrar, o una estructura PKCS#7 en PEM para verificar o descifrar.
help.field.op_cert_cms.sign_source.label=Origen de la firma
help.field.op_cert_cms.sign_source.description=Firma con una clave PEM pegada aquí, o con una clave que permanece dentro de un token PKCS#11.
help.field.op_cert_cms.signer_cert.label=Certificado del firmante
help.field.op_cert_cms.signer_cert.description=Certificado que se incluye en la firma, en PEM.
help.field.op_cert_cms.signer_key.label=Clave privada del firmante
help.field.op_cert_cms.signer_key.description=Clave privada que firma, en PEM.
help.field.op_cert_cms.token_alias.label=Alias de clave del token
help.field.op_cert_cms.token_alias.description=Clave de firma dentro del token.
help.field.op_cert_cms.detached_data.label=Datos separados
help.field.op_cert_cms.detached_data.description=Datos originales, necesarios solo para verificar una firma separada.
help.field.op_cert_cms.detached.label=Firma separada
help.field.op_cert_cms.detached.description=Deja el contenido fuera de la firma. El verificador necesita entonces el contenido por separado.
help.field.op_cert_cms.cades.label=Nivel CAdES
help.field.op_cert_cms.cades.description=CAdES-BES añade los atributos firmados que exige el estándar; CAdES-T añade además un sello de tiempo RFC 3161 de una TSA.
help.field.op_cert_cms.tsa_url.label=URL de la TSA
help.field.op_cert_cms.tsa_url.description=Autoridad de sellado de tiempo a la que se consulta para CAdES-T. Se le envía por red el hash de la firma.
help.field.op_cert_cms.encrypt_source.label=Origen de la clave
help.field.op_cert_cms.encrypt_source.description=Usa material PEM pegado aquí, o una clave dentro de un token PKCS#11.
help.field.op_cert_cms.recipient_cert.label=Certificado del destinatario
help.field.op_cert_cms.recipient_cert.description=Certificado para el que se cifra el contenido, en PEM.
help.field.op_cert_cms.recipient_key.label=Clave privada del destinatario
help.field.op_cert_cms.recipient_key.description=Clave privada que descifra, en PEM.
help.field.op_cert_cms.encrypt_token_alias.label=Alias de clave del token
help.field.op_cert_cms.encrypt_token_alias.description=Clave de descifrado dentro del token.
help.field.op_cert_cms.output.label=Salida
help.field.op_cert_cms.output.description=La estructura CMS generada, o el resultado de verificar o descifrar.
# module-help:op_cert_cms end
# module-help:op_pades begin
help.operation.op_pades.title=Firmas PDF PAdES
help.operation.op_pades.purpose=Firma archivos PDF con PAdES e inspecciona o valida las firmas que ya tenga un PDF. Firma de forma incremental y escribe un archivo nuevo; el PDF de entrada nunca se sobrescribe.
help.action.op_pades.sign.title=Firmar PDF
help.action.op_pades.sign.description=Firma el PDF como Baseline-B, o Baseline-T si el sello de tiempo está activado, y lo escribe en la ruta de salida.
help.action.op_pades.inspect.title=Inspeccionar firmas
help.action.op_pades.inspect.description=Lista las firmas del PDF y qué cubre cada una, sin valorar la confianza.
help.action.op_pades.validate.title=Validar PDF
help.action.op_pades.validate.description=Valida las firmas contra el truststore local y la evidencia CRL. Los informes detallados pueden guardarse.
help.action.op_pades.choose_files.title=Elegir archivos
help.action.op_pades.choose_files.description=Elige los archivos con los que trabaja esta pantalla, o lista las claves del token conectado.
help.action.op_pades.clear_reset.title=Limpiar o restablecer
help.action.op_pades.clear_reset.description=Limpiar vacía el formulario y el resultado; Restablecer valores predeterminados devuelve además las opciones a sus valores iniciales.
help.field.op_pades.input.label=PDF de entrada
help.field.op_pades.input.description=PDF que se firma, inspecciona o valida.
help.field.op_pades.output.label=PDF de salida
help.field.op_pades.output.description=Ruta del nuevo PDF firmado.
help.field.op_pades.key_source.label=Origen de la clave de firma
help.field.op_pades.key_source.description=Un archivo PKCS#12 local, o una clave dentro de un token PKCS#11.
help.field.op_pades.pkcs12.label=PKCS#12 y contraseña
help.field.op_pades.pkcs12.description=Archivo de la clave de firma y su contraseña. La contraseña no se guarda.
help.field.op_pades.token_alias.label=Alias del token
help.field.op_pades.token_alias.description=Clave de firma dentro del token.
help.field.op_pades.timestamp.label=Sello de tiempo de la firma
help.field.op_pades.timestamp.description=Añade un sello de tiempo RFC 3161 de la TSA de la URL indicada, lo que convierte la firma en PAdES-T. El hash de la firma se envía por red.
help.field.op_pades.visible.label=Firma visible
help.field.op_pades.visible.description=Dibuja un recuadro de texto en la página elegida. La posición y el tamaño van en puntos PDF desde la esquina inferior izquierda. El recuadro es estético; la firma criptográfica es la misma sin él.
help.field.op_pades.truststore.label=Truststore
help.field.op_pades.truststore.description=Keystore opcional con los certificados en los que confías, y su contraseña. Sin él, la validación no puede concluir que un firmante es de confianza.
help.field.op_pades.crl_evidence.label=Evidencia CRL
help.field.op_pades.crl_evidence.description=Archivos CRL locales con los que se comprueba la revocación. Aquí la validación no se conecta a la red.
help.field.op_pades.result.label=Resultado
help.field.op_pades.result.description=Resultado de firmar, inspeccionar o validar.
# module-help:op_pades end
# module-help:op_asic_s begin
help.operation.op_asic_s.title=Contenedores ASiC
help.operation.op_asic_s.purpose=Crea y verifica contenedores ASiC: un ZIP que guarda archivos junto con su firma CAdES o XAdES. ASiC-S contiene un archivo; ASiC-E, varios más un manifiesto con sus hashes.
help.action.op_asic_s.create.title=Crear ASiC-S
help.action.op_asic_s.create.description=Firma el archivo de entrada y lo empaqueta en un contenedor ASiC-S nuevo.
help.action.op_asic_s.create_e.title=Crear ASiC-E
help.action.op_asic_s.create_e.description=Firma varios archivos a la vez mediante un manifiesto SHA-256 y los empaqueta en un contenedor ASiC-E.
help.action.op_asic_s.inspect.title=Inspeccionar o verificar
help.action.op_asic_s.inspect.description=Abre el contenedor, lista su contenido y verifica sus firmas.
help.action.op_asic_s.choose_files.title=Elegir archivos
help.action.op_asic_s.choose_files.description=Elige los archivos con los que trabaja esta pantalla, o lista las claves del token conectado.
help.action.op_asic_s.clear_reset.title=Limpiar o restablecer
help.action.op_asic_s.clear_reset.description=Limpiar vacía el formulario y el resultado; Restablecer valores predeterminados devuelve además las opciones a sus valores iniciales.
help.field.op_asic_s.input.label=Archivo de entrada
help.field.op_asic_s.input.description=Archivo que se firma, o un contenedor existente que se inspecciona.
help.field.op_asic_s.output.label=Archivo de salida
help.field.op_asic_s.output.description=Ruta del contenedor nuevo.
help.field.op_asic_s.key_source.label=Origen de la clave de firma
help.field.op_asic_s.key_source.description=Un archivo PKCS#12 local, o una clave dentro de un token PKCS#11.
help.field.op_asic_s.pkcs12.label=PKCS#12 y contraseña
help.field.op_asic_s.pkcs12.description=Archivo de la clave de firma y su contraseña. La contraseña no se guarda.
help.field.op_asic_s.token_alias.label=Alias del token
help.field.op_asic_s.token_alias.description=Clave de firma dentro del token.
help.field.op_asic_s.format.label=Formato de firma
help.field.op_asic_s.format.description=Firma CAdES o XAdES dentro del contenedor.
help.field.op_asic_s.level.label=Nivel baseline
help.field.op_asic_s.level.description=B es la firma básica. T añade un sello de tiempo; LT añade evidencia de revocación; LTA añade un sello de archivo. T, LT y LTA necesitan una TSA, y LT y LTA además evidencia CRL u OCSP.
help.field.op_asic_s.tsa_url.label=URL de la TSA
help.field.op_asic_s.tsa_url.description=Autoridad de sellado de tiempo que se usa en los niveles T y superiores.
help.field.op_asic_s.revocation.label=Evidencia CRL / OCSP
help.field.op_asic_s.revocation.description=Archivos de revocación locales que se usan en LT y LTA y al verificar.
help.field.op_asic_s.online_revocation.label=Revocación en línea
help.field.op_asic_s.online_revocation.description=Permite que la verificación consulte servidores OCSP y CRL. Está desactivado por defecto porque contacta con terceros.
help.field.op_asic_s.payloads.label=Archivos de ASiC-E
help.field.op_asic_s.payloads.description=Archivos que entran en el contenedor ASiC-E.
help.field.op_asic_s.truststore.label=Truststore
help.field.op_asic_s.truststore.description=Keystore opcional con los certificados en los que confías, y su contraseña.
help.field.op_asic_s.result.label=Resultado
help.field.op_asic_s.result.description=Resultado de crear o verificar.
# module-help:op_asic_s end
# module-help:op_cms_inspector begin
help.operation.op_cms_inspector.title=Inspector CMS
help.operation.op_cms_inspector.purpose=Muestra la estructura de un mensaje CMS / PKCS#7 y valida su SignedData. Inspeccionar describe lo que contiene; validar comprueba las firmas y, con un truststore, la ruta de certificación.
help.action.op_cms_inspector.inspect.title=Inspeccionar CMS
help.action.op_cms_inspector.inspect.description=Decodifica el mensaje y lista su tipo de contenido, firmantes, certificados y atributos.
help.action.op_cms_inspector.validate.title=Validar SignedData
help.action.op_cms_inspector.validate.description=Verifica cada firma; con un truststore valida además la ruta de certificación del firmante.
help.action.op_cms_inspector.load.title=Cargar archivos
help.action.op_cms_inspector.load.description=Carga desde un archivo el CMS, el contenido separado o el truststore.
help.action.op_cms_inspector.export.title=Exportar informe
help.action.op_cms_inspector.export.description=Guarda en un archivo los resultados de la inspección.
help.action.op_cms_inspector.clear_reset.title=Limpiar o restablecer
help.action.op_cms_inspector.clear_reset.description=Limpiar vacía el formulario y el resultado; Restablecer valores predeterminados devuelve además las opciones a sus valores iniciales.
help.field.op_cms_inspector.input.label=Origen del CMS
help.field.op_cms_inspector.input.description=Mensaje CMS en Base64 o PEM, o cargado desde un archivo DER.
help.field.op_cms_inspector.detached.label=Contenido separado
help.field.op_cms_inspector.detached.description=Márcalo cuando la firma no contiene el contenido firmado.
help.field.op_cms_inspector.content.label=Contenido
help.field.op_cms_inspector.content.description=El contenido firmado, necesario para verificar una firma separada.
help.field.op_cms_inspector.truststore_password.label=Contraseña del truststore
help.field.op_cms_inspector.truststore_password.description=Contraseña del truststore seleccionado. No se guarda.
help.field.op_cms_inspector.report.label=Resultados
help.field.op_cms_inspector.report.description=Estructura del mensaje y resultado de la validación.
# module-help:op_cms_inspector end
# module-help:op_jose_jwt begin
help.operation.op_jose_jwt.title=JWT (firmado)
help.operation.op_jose_jwt.purpose=Crea JSON Web Tokens firmados y los verifica. Un JWT va firmado, no cifrado: cualquiera puede leer sus claims, y la firma solo prueba quién los emitió y que no se alteraron.
help.action.op_jose_jwt.generate.title=Generar JWT firmado
help.action.op_jose_jwt.generate.description=Firma el payload con la clave y el algoritmo seleccionados y escribe el token.
help.action.op_jose_jwt.apply_claims.title=Aplicar claims al payload
help.action.op_jose_jwt.apply_claims.description=Escribe emisor, sujeto, audiencia y caducidad en el JSON del payload, para no tener que teclearlos a mano.
help.action.op_jose_jwt.load_signing_key.title=Cargar clave de firma
help.action.op_jose_jwt.load_signing_key.description=Rellena la clave de firma desde un archivo o el Clipboard Shelf.
help.action.op_jose_jwt.validate.title=Verificar y decodificar
help.action.op_jose_jwt.validate.description=Verifica la firma con la clave indicada, contrasta los claims con lo que esperas y muestra la cabecera y el payload decodificados.
help.action.op_jose_jwt.load_verification_key.title=Cargar clave de verificación
help.action.op_jose_jwt.load_verification_key.description=Rellena la clave de verificación desde un archivo o el Clipboard Shelf.
help.action.op_jose_jwt.detached.title=JWS separado
help.action.op_jose_jwt.detached.description=Firma o verifica un payload que viaja fuera del token: el token conserva la cabecera y la firma, con la parte del payload vacía.
help.action.op_jose_jwt.clear_reset.title=Limpiar o restablecer
help.action.op_jose_jwt.clear_reset.description=Limpiar vacía el formulario y los resultados; Restablecer valores predeterminados devuelve además las opciones a sus valores iniciales.
help.field.op_jose_jwt.algorithm.label=Algoritmo
help.field.op_jose_jwt.algorithm.description=Algoritmo JWS. Los HS* usan un secreto compartido; RS*, PS*, ES* y EdDSA usan una clave privada para firmar y la pública para verificar. «none» produce un token sin firma.
help.field.op_jose_jwt.template.label=Plantilla
help.field.op_jose_jwt.template.description=Payload y ajustes predefinidos para un tipo habitual de token.
help.field.op_jose_jwt.serialization.label=Serialización
help.field.op_jose_jwt.serialization.description=Compact es el token habitual de tres partes. Las serializaciones JSON pueden llevar cabeceras no protegidas, y General JSON más de una firma.
help.field.op_jose_jwt.unencoded.label=Payload sin codificar
help.field.op_jose_jwt.unencoded.description=Firma el payload tal cual en lugar de su forma Base64URL (b64=false, RFC 7797). El verificador debe entender esa cabecera.
help.field.op_jose_jwt.signing_key.label=Clave de firma
help.field.op_jose_jwt.signing_key.description=Secreto compartido para los algoritmos HMAC, o una clave privada en PEM para los demás.
help.field.op_jose_jwt.secret_format.label=Formato del secreto
help.field.op_jose_jwt.secret_format.description=Cómo se convierte en bytes el texto de un secreto HMAC: UTF-8, Hex o Base64. No afecta a las claves PEM.
help.field.op_jose_jwt.second_signer.label=Segundo firmante
help.field.op_jose_jwt.second_signer.description=Algoritmo y clave de una segunda firma. Solo se usa con General JSON.
help.field.op_jose_jwt.claims.label=Constructor de claims
help.field.op_jose_jwt.claims.description=Emisor, sujeto, audiencia y validez en horas para el payload.
help.field.op_jose_jwt.payload.label=Payload
help.field.op_jose_jwt.payload.description=Claims del token, como objeto JSON.
help.field.op_jose_jwt.protected_header.label=Cabecera protegida adicional
help.field.op_jose_jwt.protected_header.description=JSON opcional con parámetros de cabecera adicionales, como kid o typ. Quedan cubiertos por la firma.
help.field.op_jose_jwt.output.label=Salida
help.field.op_jose_jwt.output.description=El token firmado.
help.field.op_jose_jwt.token.label=JWT
help.field.op_jose_jwt.token.description=Token que se verifica.
help.field.op_jose_jwt.verification_key.label=Clave de verificación
help.field.op_jose_jwt.verification_key.description=Secreto compartido para los algoritmos HMAC, o la clave pública en PEM para los demás.
help.field.op_jose_jwt.validate_secret_format.label=Formato del secreto
help.field.op_jose_jwt.validate_secret_format.description=Cómo se convierte en bytes el texto de un secreto HMAC. Debe ser el formato usado al firmar.
help.field.op_jose_jwt.expected_claims.label=Emisor y audiencia esperados
help.field.op_jose_jwt.expected_claims.description=Valores que deben tener los claims iss y aud. Si se dejan vacíos, no se comprueban.
help.field.op_jose_jwt.time_checks.label=Comprobaciones de tiempo
help.field.op_jose_jwt.time_checks.description=Comprueba exp, nbf e iat contra la hora actual, admitiendo el desfase de reloj indicado en segundos.
help.field.op_jose_jwt.policy.label=Política de aceptación
help.field.op_jose_jwt.policy.description=Lo que acepta el verificador: la lista de algoritmos permitidos, si pasan los tokens sin firma (alg=none) y los perfiles más estrictos de OpenID Connect y de token de acceso RFC 9068. Aceptar tokens sin firma elimina toda protección.
help.field.op_jose_jwt.header_trust.label=Claves de cabecera y parámetros críticos
help.field.op_jose_jwt.header_trust.description=Si puede usarse una clave que viaja en la propia cabecera del token, las anclas de confianza y la fecha con que se valida una cadena x5c, y qué parámetros crit entiende el verificador. Una clave de la cabecera no prueba nada salvo que encadene con un ancla en la que confías.
help.field.op_jose_jwt.profile_checks.label=Valores esperados
help.field.op_jose_jwt.profile_checks.description=Valores opcionales que se contrastan con el token: typ, cty y nonce, el token de acceso y el código de autorización tras at_hash y c_hash, y las huellas de clave de cnf. Los campos vacíos no se comprueban.
help.field.op_jose_jwt.decoded.label=Cabecera y payload decodificados
help.field.op_jose_jwt.decoded.description=Contenido del token. Se muestran aunque la verificación falle, así que no los des por fiables.
help.field.op_jose_jwt.findings.label=Comprobaciones de claims
help.field.op_jose_jwt.findings.description=Resultado de cada comprobación sobre emisor, audiencia, tiempo y cabeceras críticas.
help.field.op_jose_jwt.detached_algorithm.label=Algoritmo
help.field.op_jose_jwt.detached_algorithm.description=Algoritmo JWS de la firma separada.
help.field.op_jose_jwt.detached_serialization.label=Serialización
help.field.op_jose_jwt.detached_serialization.description=Serialización del JWS separado, y si el payload se firma sin codificar (b64=false).
help.field.op_jose_jwt.detached_payload.label=Payload externo
help.field.op_jose_jwt.detached_payload.description=Contenido que se firma pero no se incluye en el token. El verificador debe tener exactamente los mismos bytes.
help.field.op_jose_jwt.detached_keys.label=Claves
help.field.op_jose_jwt.detached_keys.description=Clave de firma y clave de verificación, con el formato de un secreto HMAC.
help.field.op_jose_jwt.detached_header.label=Cabecera protegida adicional
help.field.op_jose_jwt.detached_header.description=JSON opcional con parámetros de cabecera adicionales.
help.field.op_jose_jwt.detached_token.label=JWS separado
help.field.op_jose_jwt.detached_token.description=Token con la parte del payload vacía: lo produce Generar, o se pega para verificar.
# module-help:op_jose_jwt end
# module-help:op_jose_jwk begin
help.operation.op_jose_jwk.title=JWK (claves)
help.operation.op_jose_jwk.purpose=Convierte claves entre PEM y JSON Web Key, calcula huellas JWK y gestiona JWK Sets. Un JWK privado es tan sensible como una clave privada en PEM.
help.action.op_jose_jwk.pem_to_jwk.title=PEM a JWK
help.action.op_jose_jwk.pem_to_jwk.description=Convierte la clave pegada en un JWK con los metadatos indicados.
help.action.op_jose_jwk.jwk_to_pem.title=JWK a PEM
help.action.op_jose_jwk.jwk_to_pem.description=Convierte el JWK pegado en PEM, o en el secreto en bruto si la clave es oct.
help.action.op_jose_jwk.thumbprint.title=Calcular huella
help.action.op_jose_jwk.thumbprint.description=Calcula la huella RFC 7638, un identificador estable de la clave que suele usarse como kid.
help.action.op_jose_jwk.inspect.title=Inspeccionar metadatos
help.action.op_jose_jwk.inspect.description=Describe el JWK: tipo, tamaño o curva, uso declarado y si contiene partes privadas.
help.action.op_jose_jwk.jwks.title=JWK Set
help.action.op_jose_jwk.jwks.description=Empieza o carga un set, le añade una clave recién generada, o muestra el set sin las partes privadas, que es lo que se publica.
help.field.op_jose_jwk.key_type.label=Tipo de clave
help.field.op_jose_jwk.key_type.description=RSA, EC, OKP (Ed25519, Ed448, X25519, X448) u OCT para un secreto simétrico.
help.field.op_jose_jwk.curve.label=Curva OKP
help.field.op_jose_jwk.curve.description=Curva de una clave OKP. Solo se aplica a ese tipo de clave.
help.field.op_jose_jwk.kid.label=Key ID
help.field.op_jose_jwk.kid.description=Identificador que se escribe como kid. Si se deja vacío, se deriva uno automáticamente.
help.field.op_jose_jwk.use.label=use
help.field.op_jose_jwk.use.description=Uso previsto: sig para firmas o enc para cifrado.
help.field.op_jose_jwk.key_ops.label=key_ops
help.field.op_jose_jwk.key_ops.description=Lista opcional de operaciones permitidas, como sign y verify.
help.field.op_jose_jwk.secret_format.label=Formato del secreto
help.field.op_jose_jwk.secret_format.description=Cómo se escribe o se lee un secreto OCT: UTF-8, Hex o Base64.
help.field.op_jose_jwk.input.label=Entrada
help.field.op_jose_jwk.input.description=Clave PEM o JSON de JWK, según el sentido.
help.field.op_jose_jwk.output.label=Salida
help.field.op_jose_jwk.output.description=Resultado de la conversión o la inspección.
help.field.op_jose_jwk.jwks.label=JWK Set
help.field.op_jose_jwk.jwks.description=El set de trabajo. Puede contener claves privadas hasta que exportes la versión pública.
help.field.op_jose_jwk.rotate_algorithm.label=Algoritmo de la clave nueva
help.field.op_jose_jwk.rotate_algorithm.description=Algoritmo para el que se genera la clave que se añade al set.
# module-help:op_jose_jwk end
# module-help:op_jose_jwa begin
help.operation.op_jose_jwa.title=JWA (algoritmos)
help.operation.op_jose_jwa.purpose=Tabla de referencia de los algoritmos JOSE que admite esta aplicación para firma, gestión de claves y cifrado de contenido.
help.action.op_jose_jwa.browse.title=Consultar algoritmos
help.action.op_jose_jwa.browse.description=Consulta el nombre, la función y la descripción de cada algoritmo.
help.field.op_jose_jwa.table.label=Algoritmos
help.field.op_jose_jwa.table.description=Cada fila es un identificador de algoritmo o una familia de ellos.
# module-help:op_jose_jwa end
# module-help:op_jose_insp begin
help.operation.op_jose_insp.title=Inspector de tokens
help.operation.op_jose_insp.purpose=Descompone cualquier token JOSE, JWS o JWE, en sus partes y decodifica lo que puede leerse sin clave. No verifica ni descifra nada.
help.action.op_jose_insp.analyze.title=Analizar token
help.action.op_jose_insp.analyze.description=Divide el token y muestra un desglose visual de sus componentes.
help.action.op_jose_insp.report.title=Acciones del informe
help.action.op_jose_insp.report.description=Abre el informe en una ventana mayor, lo copia, o limpia el inspector.
help.field.op_jose_insp.input.label=Token
help.field.op_jose_insp.input.description=JWS o JWE que se inspecciona, en forma compacta o JSON.
# module-help:op_jose_insp end
# module-help:op_cose_sign1 begin
help.operation.op_cose_sign1.title=COSE_Sign1
help.operation.op_cose_sign1.purpose=Firma y verifica mensajes COSE_Sign1, la firma de un solo firmante de COSE (RFC 9052), equivalente en CBOR a un JWS compacto.
help.action.op_cose_sign1.sign.title=Firmar
help.action.op_cose_sign1.sign.description=Firma el payload y escribe el mensaje COSE_Sign1 en hexadecimal.
help.action.op_cose_sign1.verify.title=Verificar
help.action.op_cose_sign1.verify.description=Verifica la firma del mensaje con la clave pública.
help.action.op_cose_sign1.clear_reset.title=Limpiar o restablecer
help.action.op_cose_sign1.clear_reset.description=Limpiar vacía el formulario y los resultados; Restablecer valores predeterminados devuelve además las opciones a sus valores iniciales.
help.field.op_cose_sign1.algorithm.label=Algoritmo
help.field.op_cose_sign1.algorithm.description=Algoritmo de firma COSE. El tipo de clave debe corresponderle.
help.field.op_cose_sign1.private_key.label=Clave privada
help.field.op_cose_sign1.private_key.description=Clave de firma en PEM, EC o RSA.
help.field.op_cose_sign1.public_key.label=Clave pública
help.field.op_cose_sign1.public_key.description=Opcional pero recomendable: la clave pública correspondiente en PEM.
help.field.op_cose_sign1.payload.label=Payload
help.field.op_cose_sign1.payload.description=Texto que se firma.
help.field.op_cose_sign1.output.label=Mensaje COSE_Sign1
help.field.op_cose_sign1.output.description=El mensaje firmado en hexadecimal.
help.field.op_cose_sign1.verify_public_key.label=Clave pública
help.field.op_cose_sign1.verify_public_key.description=Clave pública del firmante, en PEM.
help.field.op_cose_sign1.message.label=Mensaje COSE_Sign1
help.field.op_cose_sign1.message.description=Mensaje que se verifica, en hexadecimal.
help.field.op_cose_sign1.result.label=Resultado
help.field.op_cose_sign1.result.description=Resultado de la verificación.
# module-help:op_cose_sign1 end
# module-help:op_cose_mac0 begin
help.operation.op_cose_mac0.title=COSE_Mac0
help.operation.op_cose_mac0.purpose=Crea y verifica mensajes COSE_Mac0: un payload autenticado con un MAC bajo una clave que ambas partes ya comparten.
help.action.op_cose_mac0.create.title=Crear MAC
help.action.op_cose_mac0.create.description=Calcula el MAC sobre el payload y escribe el mensaje COSE_Mac0. Generar clave rellena una clave aleatoria del tamaño adecuado.
help.action.op_cose_mac0.verify.title=Verificar MAC
