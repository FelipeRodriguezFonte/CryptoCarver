help.action.op_asn1_dec.clear_reset.description=Limpiar vacía el formulario y los resultados; Restablecer valores predeterminados devuelve además las opciones a sus valores iniciales.
help.field.op_asn1_dec.input_format.label=Formato de entrada
help.field.op_asn1_dec.input_format.description=Cómo están codificados los datos pegados: Hex, Base64 o PEM.
