help.action.op_sym_file.select_line_options.description=Selecciona procesamiento de líneas independientes, codificación, charset e interpretación CBC compacta sin cabecera.
help.action.op_sym_file.select_line_options.example=Ejemplo: elige UTF-8 y Base64URL y conserva estos ajustes al descifrar.
help.fpe.implementationLimit=Longitud máxima de entrada de la implementación
help.field.op_fpe.input.description=Símbolos que se cifran o descifran. Cada carácter debe estar en el alfabeto y radix^longitud debe contener al menos 1.000.000 de valores. El máximo actual de la implementación se muestra por separado.

# B04 textos contextualizados ES para FPE, archivos, RSA y análisis
help.operation.op_fpe.purpose=Aplica FF1 o FF3-1 a símbolos de un alfabeto ordenado. La salida conserva longitud y alfabeto; FPE no autentica el resultado ni oculta el alfabeto.
help.operation.op_sym_file.purpose=Cifra o descifra archivos en streaming o registros independientes por línea. Los datos requieren conservar la receta de parámetros y, para AEAD de archivo completo, la etiqueta separada.
help.operation.op_openpgp.purpose=Usa la implementación OpenPGP Java para claves, mensajes con armadura, archivos y firmas. Las comprobaciones GnuPG son acciones externas opcionales.
help.operation.op_asym_ciphers.purpose=Cifra con una clave pública RSA y descifra con la clave privada correspondiente. El padding determina el tamaño máximo; RSA/ECB es una etiqueta JCE, no ECB simétrico.
help.operation.aux_encrypted_file_analysis.purpose=Prueba hipótesis explícitas sobre una muestra cifrada. Una sugerencia o un candidato plausible no demuestra el algoritmo original ni una recuperación autenticada.
help.action.op_fpe.encrypt.title=Cifrar símbolos
help.action.op_fpe.encrypt.description=Cifra la entrada con FF1 o FF3-1, la clave AES, el tweak y el alfabeto ordenado elegidos. La salida conserva longitud y alfabeto; FPE no autentica el resultado.
help.action.op_fpe.encrypt.example=Ejemplo: elige Decimal, FF1, una clave AES de prueba de 16 bytes y una entrada decimal válida; descifra con los mismos parámetros.
help.action.op_fpe.decrypt.title=Descifrar símbolos
help.action.op_fpe.decrypt.description=Descifra con el mismo algoritmo, clave, tweak y orden exacto del alfabeto utilizados al cifrar. Otros parámetros no recuperan el original.
help.action.op_fpe.decrypt.example=Ejemplo: descifra un resultado decimal FF1 aceptado con la misma clave y tweak y compáralo con la entrada.
help.action.op_fpe.select_algorithm.title=Elegir algoritmo
help.action.op_fpe.select_algorithm.description=FF1 permite un tweak opcional sujeto al límite de implementación; FF3-1 exige siete bytes y un máximo de entrada dependiente del radix.
help.action.op_fpe.select_algorithm.example=Ejemplo: con FF3-1, un tweak de seis bytes no es válido; el máximo mostrado depende del radix público actual.
help.action.op_fpe.select_alphabet.title=Elegir alfabeto
help.action.op_fpe.select_alphabet.description=Cada preset define un orden de símbolos. Custom permite indicar el orden; los símbolos deben ser únicos y de un byte, y la entrada debe pertenecer al alfabeto.
help.action.op_fpe.select_alphabet.example=Ejemplo: 0123456789 tiene radix 10; símbolos duplicados se rechazan y cambiar el orden cambia el dominio.
help.action.op_sym_file.encrypt_file.title=Cifrar archivo completo
help.action.op_sym_file.encrypt_file.description=Procesa los bytes de origen en streaming. GCM y ChaCha20-Poly1305 generan un archivo separado de etiqueta de 16 bytes; CTR y CBC no autentican el texto cifrado.
help.action.op_sym_file.decrypt_file.title=Descifrar archivo completo
help.action.op_sym_file.decrypt_file.description=Procesa el descifrado en una salida temporal. AEAD requiere la etiqueta separada correspondiente; una autenticación fallida no deja una salida clara completada.
help.action.op_sym_file.encrypt_lines.title=Cifrar registros por línea
help.action.op_sym_file.encrypt_lines.description=Trata cada línea como registro de texto independiente. AEAD genera nonce y etiqueta por registro; CBC reutiliza el IV indicado y no autentica.
help.action.op_sym_file.decrypt_lines.title=Descifrar registros por línea
help.action.op_sym_file.decrypt_lines.description=Interpreta la codificación y charset seleccionados y descifra cada línea. AEAD autentica por registro; CBC compacto requiere el mismo ajuste y IV.
help.action.op_asym_ciphers.encrypt.title=Cifrar con clave pública
help.action.op_asym_ciphers.encrypt.description=Cifra los bytes de entrada decodificados con padding RSA y clave pública RSA. El límite efectivo OAEP depende del hash y de MGF1.
help.action.op_asym_ciphers.decrypt.title=Descifrar con clave privada
help.action.op_asym_ciphers.decrypt.description=Descifra con la clave privada correspondiente y el padding elegido. Una clave o familia distinta falla; NoPadding no aporta integridad.
help.action.op_asym_ciphers.select_padding.title=Elegir padding RSA
help.action.op_asym_ciphers.select_padding.description=Cambia el esquema RSA y recalcula el límite público a partir del módulo y los parámetros efectivos. ECB en la etiqueta JCE no es ECB simétrico.
help.action.aux_encrypted_file_analysis.analyze.title=Analizar muestra cifrada
help.action.aux_encrypted_file_analysis.analyze.description=Ejecuta el analizador explícito y puede crear informes junto al archivo de entrada. Abrir ayuda no lee archivos ni inicia el análisis.
