help.field.aux_json.output.label=Salida
help.field.aux_uuid.identifier.description=Identificador generado en forma canónica 8-4-4-4-12. Copiar no lo vuelve a generar.
help.field.aux_uuid.identifier.label=UUID
help.field.op_gen_batch.aad.description=Preparados solo para cifrado de registros. AEAD autentica estos datos sin cifrarlos; la rama no se puede seleccionar ahora.
help.field.op_gen_batch.aad.label=Datos autenticados adicionales (inactivos)
help.field.op_gen_batch.algorithm.description=Preparado para Encrypt Record/Decrypt Record, ramas que no están disponibles en el selector de operaciones actual.
help.field.op_gen_batch.algorithm.label=Algoritmo criptográfico (inactivo)
help.field.op_gen_batch.charset.description=Elige el charset de registros cifrados en la rama criptográfica no disponible; no cambia las operaciones sin estado del catálogo.
help.field.op_gen_batch.charset.label=Charset de registro (inactivo)
help.field.op_gen_batch.compact.label=Registros compactos (inactivo)
help.field.op_gen_batch.destination_column.label=Columna destino
help.field.op_gen_batch.export_format.label=Formato de exportación
help.field.op_gen_batch.input_format.label=Formato de entrada
help.field.op_gen_batch.iv_nonce.description=Preparado solo para la rama criptográfica de registros; ninguna operación seleccionable del catálogo lo utiliza.
help.field.op_gen_batch.iv_nonce.label=IV / nonce (inactivo)
help.field.op_gen_batch.key.description=Preparada solo para las ramas Encrypt Record/Decrypt Record no disponibles. La ayuda contextual nunca lee ni muestra la clave.
help.field.op_gen_batch.key.label=Clave secreta (inactiva)
help.field.op_gen_batch.operation.description=Elige una transformación del catálogo seguro activo. Cada opción indica la representación que acepta y el resultado.
help.field.op_gen_batch.operation.label=Operación
help.field.op_gen_batch.progress.label=Progreso
help.field.op_gen_batch.results.label=Resultados
help.field.op_gen_batch.source_column.label=Columna origen
help.field.op_gen_batch.status.description=Indica validación, ejecución, finalización, cancelación o fallo. Una ejecución cancelada no se puede exportar.
help.field.op_gen_batch.status.label=Estado
help.field.op_gen_batch.stop_on_error.description=Activado, el primer error solicita cancelar el trabajo en cola; las filas ya en ejecución pueden terminar. Desactivado, las filas restantes continúan.
help.field.op_gen_batch.stop_on_error.label=Detener ante error
help.field.op_gen_check_digits.algorithm.description=Regla seleccionada: Luhn, AMEX SE (misma familia Mod 10), Verhoeff o Damm.
help.field.op_gen_check_digits.algorithm.label=Algoritmo
help.field.op_gen_check_digits.input.description=Solo dígitos ASCII. Calcular acepta una base de al menos un dígito; validar recibe el valor completo con al menos una cifra de base y su dígito final. El texto conserva los ceros iniciales.
help.field.op_gen_check_digits.input.label=Entrada
help.field.op_gen_check_digits.result.description=Dígito calculado o estado válido/no válido. No es una prueba de titularidad.
help.field.op_gen_check_digits.result.label=Resultado
help.field.op_gen_clipboard.comparison.description=Comparison que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_clipboard.comparison.label=Comparación
help.field.op_gen_clipboard.details.description=Details que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_clipboard.details.label=Detalles
help.field.op_gen_clipboard.entry.description=Shelf entry que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_clipboard.entry.label=Entrada del estante
help.field.op_gen_clipboard.filter.description=Filters que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_clipboard.filter.label=Filtros
help.field.op_gen_clipboard.note.description=Note que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
