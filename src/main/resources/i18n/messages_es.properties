help.operation.op_pqc_sign.title=Firma y verificación PQC
help.operation.op_pqc_sign.purpose=Firma datos y verifica firmas con la clave de firma poscuántica generada o importada en Generación de claves PQC.
help.action.op_pqc_sign.sign.title=Firmar datos
help.action.op_pqc_sign.sign.description=Firma el texto con la clave privada actual.
help.action.op_pqc_sign.verify.title=Verificar firma
help.action.op_pqc_sign.verify.description=Verifica la firma pegada sobre el mismo texto con la clave pública actual.
help.field.op_pqc_sign.algorithm.label=Algoritmo
help.field.op_pqc_sign.algorithm.description=Algoritmo de firma. Debe ser aquel para el que se generó el par de claves actual.
help.field.op_pqc_sign.input.label=Datos a firmar
help.field.op_pqc_sign.input.description=Texto, que se toma como UTF-8.
help.field.op_pqc_sign.signature.label=Firma
help.field.op_pqc_sign.signature.description=Firma en hexadecimal. Las firmas poscuánticas son mucho más largas que las de RSA o ECDSA.
