help.openpgp.gnupgAvailable=La disponibilidad de GnuPG es una comprobación externa independiente de OpenPGP Java.
help.openpgp.gnupgUnavailable=GnuPG no está confirmado; las acciones OpenPGP de Java siguen disponibles independientemente.
help.analysis.noRecoveryGuarantee=Un candidato, sugerencia de formato, salida legible o descifrado sin autenticación no demuestra el algoritmo o contenido originales. AEAD requiere clave, nonce, etiqueta y AAD coincidentes.
help.analysis.current.format=Hipótesis de formato actual
help.analysis.current.mode=Hipótesis de modo actual
help.analysis.current.padding=Hipótesis de padding actual
help.unit.bytes=bytes
help.field.op_openpgp.user_id.description=Identidad asociada al material OpenPGP generado. La acción de generación elegida la procesa.
help.field.op_openpgp.passphrase.description=Protege la clave secreta generada y se necesita para firmar o descifrar con ella. La ayuda solo indica si está vacía.
help.field.op_openpgp.public_key.description=Clave OpenPGP pública usada para cifrar o verificar firmas. La ayuda no la analiza ni valida.
help.field.op_openpgp.secret_key.description=Clave OpenPGP secreta usada para descifrar o firmar. Debe mantenerse privada; la ayuda no la lee.
help.field.op_openpgp.input.description=Entrada de texto/armadura para acciones de texto o bytes de un archivo elegido en acciones explícitas. La verificación separada usa los bytes firmados exactos.
help.field.op_openpgp.signature.description=Firma separada con armadura, combinada con los datos originales exactos y la clave pública para verificar.
help.field.op_openpgp.output.description=Mensaje, firma, texto recuperado o estado generado. Un resultado legible no demuestra confianza por sí solo.
help.field.op_openpgp.gnupg_status.description=Estado de comprobaciones opcionales del GnuPG externo; no determina si OpenPGP Java está disponible.
help.option.op_asym_ciphers.input_format.base64=Decodifica bytes Base64.
help.option.op_asym_ciphers.output_format.base64=Muestra bytes en Base64.
help.option.op_asym_ciphers.input_format.binary=Usa la representación binaria admitida por el panel.
help.option.op_asym_ciphers.output_format.binary=Muestra la salida según la representación binaria del panel.
help.action.op_openpgp.inspect_detached_signature.title=Inspeccionar firma separada
help.action.op_openpgp.inspect_detached_signature.description=Muestra metadatos públicos sin comprobar la firma frente a los datos.
help.action.op_openpgp.inspect_detached_signature.example=Ejemplo: inspecciona una firma con armadura y después verifícala con los datos exactos y la clave pública.
help.operation.op_fpe.title=Cifrado que conserva el formato
help.operation.op_sym_file.title=Cifrado de archivos (Streaming)
help.operation.op_openpgp.title=Laboratorio OpenPGP / GPG
help.operation.op_asym_ciphers.title=Cifrados asimétricos (RSA)
help.operation.aux_encrypted_file_analysis.title=Análisis de archivo cifrado
help.fpe.currentDirection=Dirección seleccionada
help.analysis.presence.key.present=El formulario de File Cipher contiene texto de clave; la ayuda no lo lee ni valida.
help.analysis.presence.key.absent=El campo de clave del formulario File Cipher está vacío; el análisis solo requiere clave al ejecutarse explícitamente.
help.analysis.presence.iv.present=El campo IV/nonce de File Cipher contiene texto; la ayuda no lo lee.
help.analysis.presence.iv.absent=El campo IV/nonce de File Cipher está vacío.
help.analysis.presence.tag.present=El formulario contiene una referencia de archivo de etiqueta; no se comprueba ni lee el archivo.
help.analysis.presence.tag.absent=No hay una referencia de archivo de etiqueta en el formulario.
help.analysis.presence.aad.present=El campo AAD de File Cipher contiene texto; la ayuda no lo lee.
help.analysis.presence.aad.absent=El campo AAD de File Cipher está vacío.
help.field.op_fpe.algorithm.description=FF1 o FF3-1 según la implementación. FF3-1 es una construcción heredada con tweak propio de siete bytes y límite de longitud según el radix.
help.field.op_fpe.alphabet_preset.description=Decimal, alfanumérico, ASCII imprimible o personalizado. Los presets fijan una lista ordenada de símbolos; el modo personalizado permite definir el orden.
help.field.op_fpe.operation.description=Selecciona cifrar o descifrar; determina la transformación FPE que ejecuta la acción Run FPE.
help.field.op_fpe.output.description=La cadena transformada conserva longitud y alfabeto. Esto no aporta integridad: comprueba el resultado descifrando con los parámetros originales exactos.
help.option.op_fpe.algorithm.ff1=FF1; tweak opcional de hasta 1024 bytes.
help.option.op_fpe.algorithm.ff3_1=Construcción heredada FF3-1; tweak de exactamente 7 bytes y longitud máxima según el radix.
help.option.op_fpe.alphabet_preset.alphanumeric=Dígitos, letras latinas mayúsculas y luego minúsculas, en ese orden; radix 62.
help.option.op_fpe.alphabet_preset.ascii_printable=ASCII imprimible desde espacio hasta virgulilla, en orden de punto de código; radix 95.
help.option.op_fpe.alphabet_preset.custom=Usa el orden exacto de los símbolos personalizados; exige símbolos únicos de un byte y radix de 2 a 256.
help.option.op_fpe.alphabet_preset.decimal_0_9=Símbolos ordenados de 0 a 9; radix 10.
help.option.op_fpe.operation.decrypt=Descifra los símbolos de entrada.
help.option.op_fpe.operation.encrypt=Cifra los símbolos de entrada.
help.action.op_sym_file.choose_destination.title=Elegir destino
help.action.op_sym_file.choose_destination.description=Selecciona dónde se preparará y aplicará la salida. Reemplazar un destino existente requiere confirmación; cancelar no inicia el trabajo.
help.action.op_sym_file.choose_destination.example=Ejemplo: cancela la confirmación de reemplazo y comprueba que el archivo existente no cambió.
help.action.op_sym_file.choose_source.title=Elegir archivo de origen
help.action.op_sym_file.choose_source.description=Selecciona el archivo que leerá la siguiente operación. La ayuda no abre ni inspecciona la ruta.
help.action.op_sym_file.choose_source.example=Ejemplo: selecciona un fixture binario pequeño y conserva sus bytes mientras consultas la ayuda.
help.action.op_sym_file.choose_tag.title=Elegir archivo de etiqueta
help.action.op_sym_file.choose_tag.description=Selecciona la ruta de etiqueta separada para GCM y ChaCha20-Poly1305 en modo de archivo completo. En modo por líneas, cada registro AEAD lleva su propia etiqueta.
help.action.op_sym_file.choose_tag.example=Ejemplo: al descifrar, elige la etiqueta generada por la operación de cifrado de archivo completo correspondiente.
help.action.op_sym_file.decrypt_file.example=Ejemplo: descifra la salida GCM con la misma clave, nonce, AAD y etiqueta separada; cambiar la etiqueta hace fallar la autenticación.
help.action.op_sym_file.decrypt_lines.example=Ejemplo: descifra registros Base64URL y UTF-8 con la misma clave y AAD; modificar un registro autenticado hace que falle.
help.action.op_sym_file.encrypt_file.example=Ejemplo: AES-256-GCM cifra un origen binario y crea una etiqueta separada; conserva la clave, el nonce y cualquier AAD para descifrar.
help.action.op_sym_file.encrypt_lines.example=Ejemplo: elige UTF-8 y Base64URL, cifra dos líneas y observa que cada registro AEAD tiene su propio nonce y etiqueta.
help.action.op_sym_file.export_recipe.title=Exportar receta
help.action.op_sym_file.export_recipe.description=Exporta el perfil, los ajustes de líneas y, si están definidos, IV/nonce, AAD y referencia a etiqueta. Nunca incluye la clave secreta; puede crear un archivo local tras confirmar.
help.action.op_sym_file.export_recipe.example=Ejemplo: exporta la receta sin la clave y proporciona esta por separado al repetir la operación.
help.action.op_sym_file.generate_nonce.title=Generar IV / nonce
help.action.op_sym_file.generate_nonce.description=Genera bytes aleatorios nuevos: 12 bytes para GCM o ChaCha20-Poly1305 y 16 bytes para CTR o CBC. En líneas AEAD se genera un nonce por registro; en CBC por líneas se usa el IV indicado.
help.action.op_sym_file.generate_nonce.example=Ejemplo: genera un nonce nuevo para cifrar con GCM y conserva los parámetros necesarios para descifrar.
help.action.op_sym_file.import_recipe.title=Importar receta
help.action.op_sym_file.import_recipe.description=Carga el perfil y los parámetros de una receta en sus controles. Revisa los ajustes y proporciona la clave secreta por separado; la ayuda no lee la receta.
help.action.op_sym_file.import_recipe.example=Ejemplo: importa una receta y confirma el perfil y el modo por líneas antes de iniciar la operación.
help.field.op_sym_file.aad.description=AAD Hex opcional, solo para perfiles AEAD. Se autentica, pero no se cifra; la otra parte debe proporcionar los mismos bytes.
help.field.op_sym_file.charset.description=Selecciona UTF-8 o una de las páginas de códigos EBCDIC admitidas para texto por líneas. No convierte el modo binario de archivo completo.
help.field.op_sym_file.compact_cbc.description=Usa registros CBC por líneas compactos y sin cabecera. Solo aplica al modo por líneas con CBC; para descifrar se necesita la misma opción y el mismo IV.
help.field.op_sym_file.destination.description=Ruta para la salida preparada. Si el destino existe, la confirmación controla su reemplazo; cancelar evita aplicarlo.
help.field.op_sym_file.iv_nonce.description=Valor de inicialización Hex para el perfil. El modo de archivo completo lo requiere; el cifrado AEAD por líneas genera un nonce nuevo por registro. Conserva los valores aplicables para descifrar.
help.field.op_sym_file.key.description=Clave Hex del perfil seleccionado. AES-256 y ChaCha20-Poly1305 requieren 32 bytes. El texto de clave nunca se copia al contexto de ayuda.
help.field.op_sym_file.line_encoding.description=Selecciona Base64URL o Hexadecimal para representar cada registro. Es una representación, no un algoritmo de cifrado.
help.field.op_sym_file.lines_mode.description=Si está marcado, procesa cada línea de texto como un registro independiente. Charset y codificación solo aplican aquí; el modo de archivo completo conserva bytes arbitrarios.
help.field.op_sym_file.profile.description=Selecciona AES-256-GCM, AES-256-CTR, AES-256-CBC o ChaCha20-Poly1305. El perfil determina IV/nonce, autenticación y requisitos de etiqueta.
help.field.op_sym_file.result.description=Muestra el estado y el recuento de bytes o registros; no certifica la integridad del texto cifrado. AEAD comprueba la etiqueta; CTR y CBC no autentican.
help.field.op_sym_file.source.description=Ruta cuyos bytes o líneas leerá una acción explícita. La ayuda nunca abre ni guarda la ruta.
help.field.op_sym_file.tag_file.description=Etiqueta de autenticación separada de 16 bytes para GCM o ChaCha20-Poly1305 en archivo completo. Es necesaria para descifrar y no forma parte del archivo cifrado.
help.option.op_sym_file.line_encoding.base64url=Representa cada registro con Base64URL.
help.option.op_sym_file.line_encoding.hexadecimal=Representa cada registro con hexadecimal.
help.option.op_sym_file.profile.aes_256_cbc=AES-256-CBC: clave de 32 bytes e IV de 16 bytes; el texto cifrado no lleva autenticación.
help.option.op_sym_file.profile.aes_256_ctr=AES-256-CTR: clave de 32 bytes e IV de 16 bytes; el texto cifrado no lleva autenticación.
help.option.op_sym_file.profile.aes_256_gcm=AES-256-GCM: clave de 32 bytes, nonce de 12 recomendado/generado, AAD opcional y etiqueta separada de 16 bytes en archivo completo.
help.option.op_sym_file.profile.chacha20_poly1305=ChaCha20-Poly1305: clave de 32 bytes, nonce de 12 recomendado/generado, AAD opcional y etiqueta separada de 16 bytes en archivo completo.
help.action.op_asym_ciphers.decrypt.example=Ejemplo: descifra texto cifrado creado con la clave pública y los parámetros OAEP correspondientes; una clave distinta falla.
help.action.op_asym_ciphers.encrypt.example=Ejemplo: una entrada dentro del límite OAEP indicado se cifra con la clave pública RSA y se descifra con su clave privada correspondiente.
help.action.op_asym_ciphers.load_private_key.title=Cargar o pegar clave privada
help.action.op_asym_ciphers.load_private_key.description=Acepta material RSA privado en los formatos que procesa el panel. Permanece en el formulario; la ayuda contextual no lo lee.
help.action.op_asym_ciphers.load_private_key.example=Ejemplo: carga la clave privada PKCS#8 que corresponde a la clave pública usada para cifrar.
help.action.op_asym_ciphers.load_public_key.title=Cargar o pegar clave pública
help.action.op_asym_ciphers.load_public_key.description=Acepta los formatos de clave pública RSA del panel: PEM y DER en Hex o Base64. Un certificado solo se admite si lo acepta el parser actual.
help.action.op_asym_ciphers.load_public_key.example=Ejemplo: carga una clave pública RSA en PEM SubjectPublicKeyInfo y confirma su familia antes de cifrar.
help.action.op_asym_ciphers.select_padding.example=Ejemplo: con un módulo de 2048 bits, PKCS#1 v1.5 admite 245 bytes, OAEP-SHA-1 admite 214 y OAEP-SHA-256 admite 190.
help.action.op_asym_ciphers.use_private_key_shelf.title=Usar clave privada de Shelf
help.action.op_asym_ciphers.use_private_key_shelf.description=Copia una clave privada seleccionada de la Shelf local a este panel para una acción explícita de descifrado.
help.action.op_asym_ciphers.use_private_key_shelf.example=Ejemplo: selecciona la clave privada RSA correspondiente y descifra un texto compatible.
help.action.op_asym_ciphers.use_public_key_shelf.title=Usar clave pública de Shelf
help.action.op_asym_ciphers.use_public_key_shelf.description=Copia la clave pública seleccionada de la Shelf local; no importa una clave privada.
help.action.op_asym_ciphers.use_public_key_shelf.example=Ejemplo: elige una clave pública RSA de la Shelf y cifra una entrada dentro del límite del padding.
help.field.op_asym_ciphers.input.description=Bytes decodificados según la representación de entrada. Al cifrar, deben caber en el límite del padding; al descifrar, deben corresponder al módulo y padding RSA.
help.field.op_asym_ciphers.input_format.description=Representación que el parser asimétrico decodifica antes de RSA. Consulta las opciones reales del selector; no es un algoritmo de cifrado.
help.field.op_asym_ciphers.max_plaintext.description=Tamaño del módulo público en bytes menos el sobrecoste: 11 para PKCS#1 v1.5, 42 para OAEP-SHA-1 y 66 para OAEP-SHA-256. NoPadding tiene otra regla y no se muestra como límite con relleno.
help.field.op_asym_ciphers.output.description=Texto cifrado después de cifrar o bytes recuperados tras descifrar, representados según la selección de salida. Descifrar correctamente no comprueba autenticidad.
help.field.op_asym_ciphers.output_format.description=Representación aplicada a los bytes de salida después de RSA. Se limita a los formatos aceptados por este panel, no a una lista universal.
help.field.op_asym_ciphers.padding.description=PKCS#1 v1.5, OAEP-SHA-1, OAEP-SHA-256 o NoPadding. La transformación BC usa SHA-1/MGF1-SHA-1 para OAEP-SHA-1 y SHA-256/MGF1-SHA-256 para OAEP-SHA-256. v1.5 y NoPadding muestran aviso heredado.
help.field.op_asym_ciphers.private_key.description=Clave privada RSA correspondiente para descifrar; el texto del panel prevalece sobre el par generado. Formatos admitidos: PEM PKCS#8, DER PKCS#8 en Hex o DER PKCS#8 en Base64, en ese orden. La ayuda nunca analiza el texto.
help.field.op_asym_ciphers.public_key.description=Clave pública RSA usada para cifrar; el texto del panel prevalece sobre el par del módulo Keys. Formatos admitidos: PEM SubjectPublicKeyInfo, DER X.509 en Hex o DER X.509 en Base64, en ese orden. La ayuda solo usa metadatos públicos ya cargados y no analiza el texto.
help.option.op_asym_ciphers.padding.rsa_ecb_nopadding=RSA sin padding; se muestra un aviso de modo heredado y el llamador debe gestionar la estructura del texto claro.
help.option.op_asym_ciphers.padding.rsa_ecb_oaepwithsha_1andmgf1padding=RSA OAEP con digest SHA-1 y MGF1-SHA-1, según la transformación BC actual.
help.option.op_asym_ciphers.padding.rsa_ecb_oaepwithsha_256andmgf1padding=RSA OAEP con digest SHA-256 y MGF1-SHA-256, según la transformación BC actual.
help.option.op_asym_ciphers.padding.rsa_ecb_pkcs1padding=Padding de cifrado RSA PKCS#1 v1.5; se muestra un aviso de uso heredado.
help.action.aux_encrypted_file_analysis.analyze.example=Ejemplo: ejecuta el fixture del tutorial 24 con sus parámetros conocidos y compara las hipótesis y evidencias del informe.
help.field.aux_encrypted_file_analysis.aad.description=AAD opcional de una hipótesis autenticada. Se autentica, pero no se cifra, y debe coincidir exactamente.
help.field.aux_encrypted_file_analysis.aad.label=Datos autenticados adicionales
help.field.aux_encrypted_file_analysis.algorithm.description=Algoritmo simétrico candidato evaluado contra la muestra. Un texto aparentemente legible no confirma el resultado.
help.field.aux_encrypted_file_analysis.algorithm.label=Hipótesis de algoritmo
help.field.aux_encrypted_file_analysis.candidates.description=Hipótesis ordenadas con las evidencias y limitaciones de cada intento. Un candidato no se aplica ni verifica automáticamente.
help.field.aux_encrypted_file_analysis.candidates.label=Candidatos
help.field.aux_encrypted_file_analysis.expected_result.description=Criterio opcional para evaluar un candidato. Que el texto sea legible o coincida no sustituye la autenticación criptográfica.
help.field.aux_encrypted_file_analysis.expected_result.label=Resultado esperado
help.field.aux_encrypted_file_analysis.file_representation.description=Bytes del archivo de origen o representación textual admitida explícitamente. Una sugerencia de formato no identifica el cifrado.
help.field.aux_encrypted_file_analysis.file_representation.label=Archivo / representación
help.field.aux_encrypted_file_analysis.iv_nonce.description=Parámetro público de la hipótesis de modo. Es distinto de la clave y debe coincidir con el valor original del cifrado.
help.field.aux_encrypted_file_analysis.iv_nonce.label=IV / nonce
help.field.aux_encrypted_file_analysis.key.description=Clave proporcionada para un análisis explícito. La ayuda contextual nunca la lee ni almacena.
help.field.aux_encrypted_file_analysis.key.label=Clave
help.field.aux_encrypted_file_analysis.mode.description=Modo candidato evaluado por el analizador. Solo los perfiles autenticados admitidos pueden autenticar, y necesitan la etiqueta y parámetros correctos.
help.field.aux_encrypted_file_analysis.mode.label=Hipótesis de modo
help.field.aux_encrypted_file_analysis.padding.description=Padding candidato para modos que lo usan. CTR y perfiles autenticados no usan este padding tipo CBC.
help.field.aux_encrypted_file_analysis.padding.label=Hipótesis de padding
help.field.aux_encrypted_file_analysis.report.description=Los informes resumen intentos y evidencia; pueden incluir contenido recuperado solo cuando la política actual del informe lo permite.
help.field.aux_encrypted_file_analysis.report.label=Informe
help.field.aux_encrypted_file_analysis.tag.description=Etiqueta esperada para modos autenticados. Solo verificar correctamente la etiqueta autentica ese intento.
help.field.aux_encrypted_file_analysis.tag.label=Etiqueta de autenticación
help.fileCipher.ff1TweakLimit=FF1 admite un tweak opcional de hasta 1024 bytes.
help.rsa.inputFormats=Entrada admitida: Text (UTF-8), Hexadecimal, Base64 y Binary. Hexadecimal y Base64 se decodifican primero; los demás formatos se interpretan según el selector.
help.rsa.outputFormats=Salida admitida: Text (UTF-8), Hexadecimal, Base64 y Binary.
help.option.op_asym_ciphers.input_format.text_utf_8=Interpreta la entrada seleccionada como bytes UTF-8.
help.option.op_asym_ciphers.output_format.text_utf_8=Muestra los bytes de salida como texto UTF-8.
help.option.op_asym_ciphers.input_format.hexadecimal=Decodifica bytes Hexadecimales.
help.option.op_asym_ciphers.output_format.hexadecimal=Muestra bytes en Hexadecimal.
help.rsa.inputFormats=Entrada admitida: Text (UTF-8), Hexadecimal, Base64 y Binary. Hexadecimal y Base64 se decodifican a bytes; Text se codifica en UTF-8 y Binary usa el parser de cadenas de bits del panel.
help.rsa.outputFormats=Salida admitida: Text (UTF-8), Hexadecimal, Base64 y Binary. Text decodifica bytes como UTF-8; Binary genera una cadena de bits.
help.fpe.ff1TweakLimit=Límite máximo del tweak FF1 (bytes)
help.fileCipher.nonceGeneration=El generador crea valores de 12 bytes para GCM o ChaCha20-Poly1305 y de 16 bytes para CTR o CBC. Un valor proporcionado se valida según las reglas del modo seleccionado.
help.fileCipher.ebcdicCodePages=En modo por líneas se ofrecen UTF-8 y las páginas EBCDIC disponibles en el conversor; estas opciones solo se aplican al texto de las líneas.
help.analysis.route=Analyze se ejecuta directamente con el archivo, perfil, clave y parámetros actuales. Prueba hipótesis admitidas con valores predeterminados del analizador; no abre un diálogo de configuración.
help.option.op_sym_file.charset.utf_8=Interpreta cada línea como texto UTF-8.
help.option.op_sym_file.charset.ibm037_us_canada=Interpreta cada línea con la página EBCDIC IBM037 para Estados Unidos y Canadá.
help.option.op_sym_file.charset.ibm273_germany=Interpreta cada línea con la página EBCDIC IBM273 para Alemania.
help.option.op_sym_file.charset.ibm277_denmark_norway=Interpreta cada línea con la página EBCDIC IBM277 para Dinamarca y Noruega.
help.option.op_sym_file.charset.ibm278_finland_sweden=Interpreta cada línea con la página EBCDIC IBM278 para Finlandia y Suecia.
help.option.op_sym_file.charset.ibm280_italy=Interpreta cada línea con la página EBCDIC IBM280 para Italia.
help.option.op_sym_file.charset.ibm284_spain=Interpreta cada línea con la página EBCDIC IBM284 para España.
help.option.op_sym_file.charset.ibm285_united_kingdom=Interpreta cada línea con la página EBCDIC IBM285 para Reino Unido.
help.option.op_sym_file.charset.ibm297_france=Interpreta cada línea con la página EBCDIC IBM297 para Francia.
help.option.op_sym_file.charset.ibm420_arabic=Interpreta cada línea con la página EBCDIC IBM420 para árabe.
help.option.op_sym_file.charset.ibm424_hebrew=Interpreta cada línea con la página EBCDIC IBM424 para hebreo.
help.option.op_sym_file.charset.ibm500_international=Interpreta cada línea con la página EBCDIC IBM500 para internacional.
help.option.op_sym_file.charset.ibm838_thai=Interpreta cada línea con la página EBCDIC IBM838 para tailandés.
help.option.op_sym_file.charset.ibm870_latin_2_central_europe=Interpreta cada línea con la página EBCDIC IBM870 para Europa central (Latin-2).
help.option.op_sym_file.charset.ibm871_iceland=Interpreta cada línea con la página EBCDIC IBM871 para Islandia.
help.option.op_sym_file.charset.ibm875_greek=Interpreta cada línea con la página EBCDIC IBM875 para griego.
help.option.op_sym_file.charset.ibm918_pakistan_urdu=Interpreta cada línea con la página EBCDIC IBM918 para Pakistán/urdu.
help.option.op_sym_file.charset.ibm1025_cyrillic=Interpreta cada línea con la página EBCDIC IBM1025 para cirílico.
help.option.op_sym_file.charset.ibm1026_turkish=Interpreta cada línea con la página EBCDIC IBM1026 para turco.
help.option.op_sym_file.charset.ibm1047_latin_1_open_systems=Interpreta cada línea con la página EBCDIC IBM1047 para Latin-1 Open Systems.
