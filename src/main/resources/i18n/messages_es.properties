# B04 OpenPGP contextual action groups
help.action.op_openpgp.generate_key_pair.title=Generar par RSA
help.action.op_openpgp.generate_key_pair.description=Crea un par OpenPGP RSA de 3072 bits con el identificador de usuario y la frase de paso indicados.
help.action.op_openpgp.generate_key_pair.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.public_key.title=Acciones de clave pública
help.action.op_openpgp.public_key.description=Permite pegar, cargar, guardar, inspeccionar o elegir material público OpenPGP. Inspeccionar no establece confianza.
help.action.op_openpgp.public_key.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.secret_key.title=Acciones de clave secreta
help.action.op_openpgp.secret_key.description=Permite pegar, cargar, guardar, inspeccionar o elegir una clave secreta. La ayuda no la lee.
help.action.op_openpgp.secret_key.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.encrypt_text.title=Cifrar texto
help.action.op_openpgp.encrypt_text.description=Cifra la entrada con la clave pública elegida y produce salida OpenPGP con armadura.
help.action.op_openpgp.encrypt_text.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.decrypt_text.title=Descifrar texto
help.action.op_openpgp.decrypt_text.description=Descifra la entrada con armadura usando la clave secreta y frase de paso.
help.action.op_openpgp.decrypt_text.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.sign_detached.title=Crear firma separada
help.action.op_openpgp.sign_detached.description=Firma los bytes exactos de entrada y escribe una firma separada con armadura.
help.action.op_openpgp.sign_detached.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.sign_attached.title=Crear firma adjunta
help.action.op_openpgp.sign_attached.description=Produce un mensaje firmado con armadura que contiene datos y firma.
help.action.op_openpgp.sign_attached.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.clear_sign.title=Firmar texto en claro
help.action.op_openpgp.clear_sign.description=Crea un mensaje firmado en claro con armadura; se aplican reglas de normalización de texto.
help.action.op_openpgp.clear_sign.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.verify_detached.title=Verificar firma separada
help.action.op_openpgp.verify_detached.description=Verifica los bytes exactos de entrada con la firma separada y la clave pública.
help.action.op_openpgp.verify_detached.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.verify_attached.title=Verificar firma adjunta
help.action.op_openpgp.verify_attached.description=Verifica el mensaje firmado adjunto y muestra su contenido.
help.action.op_openpgp.verify_attached.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.verify_clear_signed.title=Verificar mensaje firmado en claro
help.action.op_openpgp.verify_clear_signed.description=Verifica el mensaje. No evalúa Web-of-Trust.
help.action.op_openpgp.verify_clear_signed.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.inspect_signature.title=Inspeccionar firma separada
help.action.op_openpgp.inspect_signature.description=Muestra metadatos públicos sin comprobar la firma frente a los datos.
help.action.op_openpgp.inspect_signature.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.encrypt_file.title=Cifrar archivo
help.action.op_openpgp.encrypt_file.description=Cifra el archivo binario elegido y crea salida OpenPGP con armadura ASCII.
help.action.op_openpgp.encrypt_file.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
help.action.op_openpgp.decrypt_file.title=Descifrar archivo
help.action.op_openpgp.decrypt_file.description=Descifra el archivo con armadura elegido usando la clave secreta y frase actuales.
help.action.op_openpgp.decrypt_file.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
