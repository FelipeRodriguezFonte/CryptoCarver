module.emv.oda.help=Cada clave se recupera del certificado que tiene encima: la clave de la CA abre la etiqueta 90, la clave del emisor que sale de ahí abre la 9F46, y la clave del ICC que sale de esa comprueba la firma dinámica. Los datos estáticos forman parte del hash del propio certificado del ICC, así que un AFL mal compuesto falla al recuperar la clave, no donde uno lo busca. El SDA prueba que un emisor firmó estos datos alguna vez, y nada sobre la tarjeta que tienes delante.
