icsf.keywrap.mode.ECB=cada parte de 8 bytes por separado, TDES ECB (WRAP-ECB, p. 1713)
icsf.keywrap.note.VERSION_SAYS_DOUBLE=El byte 4 (version) es X''01'' (doble o triple) pero la clave es simple segun {1}.
icsf.keywrap.note.VERSION_SAYS_SINGLE=El byte 4 (version) es X''00'', que en la Tabla 616 corresponde a una clave simple, pero la clave es de {0} bytes segun {1}. Es lo normal en tokens de hosts reales: la version no es un dato fiable de longitud y aqui manda el Control Vector.
icsf.keywrap.note.clearKey.text=El flag del byte 6 dice que la clave no esta cifrada, asi que lo que hay en los offsets 16, 24 y 48 es el propio material de clave. No hace falta KEK para leerla, y ninguno la protegio.
icsf.keywrap.note.clearKey.title=La clave viaja EN CLARO dentro del token
icsf.keywrap.note.collapses.text=TDES EDE con dos componentes iguales se reduce a una sola operacion DES, asi que la fortaleza efectiva son 56 bits por larga que parezca la clave. En ECB se ve en el propio criptograma.
icsf.keywrap.note.collapses.title=La clave {0} colapsa a DES simple
icsf.keywrap.note.cvHalvesEqual.text=Normal en claves triples, donde la p. 20 dice que los dos control vectors son iguales. En una clave doble conviene revisarlo, porque las dos mitades suelen diferir en los bits key-form.
icsf.keywrap.note.cvHalvesEqual.title=Las dos mitades del CV son iguales
icsf.keywrap.note.cvSwapped.text=Esto no es un esquema de CCA: reproduce el error tipico de aplicar el CV derecho a la parte izquierda y al reves. Sirve para confirmar una sospecha, no para entregar una clave.
icsf.keywrap.note.cvSwapped.title=Mitades del CV intercambiadas
icsf.keywrap.note.enhancedNothing.text=No hay esquema que probar: los metodos mejorados no se pueden reproducir fuera del coprocesador.
icsf.keywrap.note.enhancedNothing.title=Envoltura mejorada: {0}
icsf.keywrap.note.enhancedWhatNow.text=Con envoltura mejorada la clave solo la abre un coprocesador CCA. Para entregarla fuera hay que re-envolverla con WRAP-ECB (por ejemplo regenerando o traduciendo el token con la palabra clave WRAP-ECB) o pasar a X9.143/TR-31, que es lo que si entiende un sistema ajeno a CCA.
icsf.keywrap.note.enhancedWhatNow.title=Que se puede hacer
icsf.keywrap.note.internalToken.text=Un token interno esta cifrado bajo la master key del host, no bajo una clave de transporte. Reproducir eso aqui exige la master key en claro, que es justo lo que un coprocesador no entrega: este panel es para el token externo que produce Key Export.
icsf.keywrap.note.internalToken.title=Es un token interno
icsf.keywrap.note.kcvVsVp.text=El KCV de la industria son los 3 primeros bytes de cifrar 8 bytes de ceros con la clave ({0}); CSNBKYT lo llama ENC-ZERO y da 4 bytes ({1}). El verification pattern por defecto de CSNBKYT es OTRO numero ({2} con RN={3}, p. 1720). Si cada uno mira un numero distinto, la comparacion nunca va a cuadrar.
icsf.keywrap.note.kcvVsVp.title=Como cuadrar el KCV con el otro equipo
icsf.keywrap.note.noKek.text=El token esta cifrado, asi que aqui solo se lee lo que el token dice de si mismo. Para recuperar la clave, da el KEK en claro en la pestana de Importar, o usa Resolver si no sabes que esquema se aplico.
icsf.keywrap.note.noKek.title=Sin el KEK no sale ninguna clave
icsf.keywrap.note.noParity.text=Cuando salen bytes con paridad par lo normal es que el esquema no sea el correcto: KEK equivocado, CV que no toca, o el criptograma se envolvio sin variante (NOCV) y lo estas abriendo con variante, o al reves. Usa Resolver para probar todas las combinaciones de golpe.
icsf.keywrap.note.noParity.title=La clave recuperada no tiene paridad DES
icsf.keywrap.note.noScheme.text=Ni con variante ni sin ella, ni en ECB ni en CBC. Entonces no es un problema de CV: revisa que el KEK en claro sea el mismo que tiene el host (compara el KCV del KEK), que el criptograma se haya copiado entero y que el token no venga con envoltura mejorada.
icsf.keywrap.note.noScheme.title=Ningun esquema reproduce la referencia
icsf.keywrap.note.nocv.text=La clave de transporte se usa tal cual en vez de XOR con el Control Vector. Es lo que hace el bit NOCV de un EXPORTER/IMPORTER (p. 207), y es como se suelen entregar claves a un sistema que no entiende de control vectors. Tambien significa que el CV ya no ata la clave a su uso.
icsf.keywrap.note.nocv.title=Envuelto sin variante (NOCV)
icsf.keywrap.note.onlyOne.text=Sale la clave {0} (KCV {1}). Que los {2} bytes compartan paridad no pasa por casualidad, asi que ese es el esquema. Para dejarlo cerrado del todo, vuelve a pasarlo poniendo esa clave como referencia.
icsf.keywrap.note.onlyOne.title=Solo un esquema da una clave con paridad coherente: {0}
icsf.keywrap.note.parityEven.text=Que todos los bytes compartan paridad no pasa por casualidad, asi que es una clave de verdad a la que nadie ajusto la paridad, no un descifrado erroneo. Algunas herramientas ajenas a CCA la rechazan, o la ''arreglan'' en silencio. Ajustada a paridad impar seria {0}.
icsf.keywrap.note.parityEven.title=Paridad DES {0}: par en los {1} bytes (clave sin ajustar)
icsf.keywrap.note.parityMixed.text=La paridad mezclada suele ser senal de un esquema equivocado mucho mas que de una clave rara: KEK equivocado, CV que no toca, o material envuelto sin variante y abierto con ella. Ajustada a paridad impar seria {0}.
icsf.keywrap.note.parityMixed.title=Paridad DES {0}: incorrecta en {1} de {2} bytes
icsf.keywrap.note.parityOnly.text=La paridad de los 8/16/24 bytes es un buen indicio pero no una prueba. Cuenta tanto la impar (la que espera DES) como la par en TODOS los bytes: esa es una clave escrita a mano a la que nadie ajusto la paridad, no un descifrado erroneo. Dale la clave esperada o su KCV y la respuesta pasa a ser concluyente.
icsf.keywrap.note.parityOnly.title=Sin referencia solo se puede filtrar por paridad
icsf.keywrap.note.schemeFound.text=Con ese esquema el criptograma da la clave {0} (KCV {1}). Eso es exactamente lo que hay que decirle al otro equipo que aplique.
icsf.keywrap.note.schemeFound.title=Encaja: {0}
icsf.keywrap.note.singleDesKek.text=Un KEK simple protege con 56 bits, asi que lo que envuelva vale 56 bits en transito por larga que sea la clave envuelta.
icsf.keywrap.note.singleDesKek.title=El KEK es DES simple
icsf.keywrap.note.tokenCoherence.title=Coherencia del token
icsf.keywrap.note.tokenNocv.text=El bit 2 del byte 6 esta puesto, asi que este token espera la clave de transporte tal cual y no su variante con el Control Vector. Solo las claves de transporte llevan ese bit.
icsf.keywrap.note.tokenNocv.title=El token esta marcado NOCV
icsf.keywrap.note.tvvAbsent.text=Los bytes 60-63 estan a cero, asi que no hay con que comprobar la integridad del token.
icsf.keywrap.note.tvvAbsent.title=El token no lleva TVV
icsf.keywrap.note.tvvInvalid.text=El token verification value no cuadra con los bytes que cubre. O el token se altero o se trunco por el camino, o se edito un campo sin recalcularlo. Todo lo que se lea de el hay que tomarlo con reservas.
icsf.keywrap.note.tvvInvalid.title=El TVV no cuadra
icsf.keywrap.note.versionHost.text=El token sale con la version que escribe un host de verdad para una clave doble, no la de la Tabla 616. Es lo que hay que usar para comparar byte a byte con lo que te llego del host. Ojo: una herramienta que deduzca la longitud de ese byte creera que la clave es simple y partira el criptograma por la mitad.
icsf.keywrap.note.versionHost.title=Byte 4 a X''00'', como los hosts reales
icsf.keywrap.note.versionTable616.text=Aqui se pone X''01'' porque es lo que dice la Tabla 616 para una clave doble o triple, pero los hosts reales dejan ese byte a X''00''. Si comparas este token con el del host van a salir DOS bytes distintos: el 4 y el primero del TVV, que suma ese byte y cambia con el. El criptograma es identico, que es lo que importa. Para que salgan iguales, marca la casilla del byte de version.
icsf.keywrap.note.versionTable616.title=El host va a escribir X''00'' en el byte 4, no X''01''
icsf.keywrap.note.weakKek.text=La proteccion en transito vale lo que valga el KEK, no la clave. Envolver una clave triple bajo un KEK doble no hace el traspaso mas fuerte que el KEK.
icsf.keywrap.note.weakKek.title=El KEK ({0} bytes) es mas corto que la clave que envuelve ({1} bytes)
