help.operation.op_keys_rsa.purpose=Genera un par de claves RSA para cifrado, firmas y certificados, y muestra su huella y sus tamaños.
help.action.op_keys_rsa.generate.title=Generar par de claves
help.action.op_keys_rsa.generate.description=Crea un par de claves nuevo y rellena el resumen y las dos pestañas PEM.
