help.operation.aux_byte_inspector.purpose=Muestra los bytes seleccionados en las representaciones disponibles e indica desplazamientos y longitudes. Una vista de texto no es un descifrado.
help.operation.aux_epoch.purpose=Convierte entre timestamp Unix y fecha/hora con la unidad y la zona seleccionadas en el diálogo.
help.operation.aux_json.purpose=Cambia los espacios y la indentación del JSON e informa de los errores del parser. No valida un esquema de negocio ni afirmaciones criptográficas.
help.operation.aux_uuid.purpose=Genera un identificador UUID versión 4 aleatorio con formato canónico. Los bits de versión y variante forman parte de sus 128 bits; no es una clave secreta de 128 bits.
help.operation.op_gen_batch.purpose=Aplica una operación sin estado seleccionada a cada registro CSV o JSON Lines e informa de resultados y errores por registro.
help.operation.op_gen_check_digits.purpose=Calcula o valida dígitos decimales con Luhn, AMEX SE, Verhoeff o Damm. Detectan algunos errores de transcripción; no prueban identidad ni autenticidad.
help.operation.op_gen_clipboard.purpose=Guarda entradas de la sesión con metadatos y notas opcionales. La visibilidad y la reutilización dependen de la clasificación de la entrada y del destino seleccionado.
help.operation.op_gen_compressed_hex.purpose=Interconvierte Hex convencional y el diseño de dos filas de nibbles altos y bajos. «Comprimido» describe el formato visual, no compresión de datos.
help.operation.op_gen_envelope_inspector.purpose=Muestra la estructura del envelope y sus metadatos públicos. Desenvolver es una operación explícita aparte que requiere una clave privada de destinatario compatible.
help.operation.op_gen_file.purpose=Convierte archivos entre formatos, compara bytes, calcula SHA-256 y muestra una vista previa acotada. La ayuda no lee rutas ni contenidos.
help.operation.op_gen_hash.purpose=Calcula una huella sobre bytes. CRC32 detecta errores accidentales; MD4, MD5 y SHA-1 son algoritmos heredados y no deben usarse para diseños nuevos resistentes a colisiones.
help.operation.op_gen_manual.purpose=Convierte representaciones y aplica transformaciones con parser propio. Las acciones especializadas pueden ignorar los formatos globales; consulta los detalles de cada botón.
help.operation.op_gen_mod.purpose=Opera con enteros grandes. Los operandos se interpretan en Hex, salvo XOR Decimal; algunas operaciones requieren módulo y otras no.
help.operation.op_gen_process_designer.purpose=Conecta nodos tipados en un flujo. La compatibilidad de puertos, los parámetros obligatorios y las condiciones de cada nodo determinan si el grafo puede ejecutarse.
help.operation.op_gen_random.purpose=Genera de 1 a 1024 bytes aleatorios y los presenta en el formato seleccionado. Esto no equivale a UUID v4 ni certifica una clave.
help.operation.op_keys_format_workbench.purpose=Detecta, analiza, convierte o compara los formatos de clave y certificado admitidos. El análisis no establece confianza ni validez del certificado.
help.option.op_gen_check_digits.algorithm.amex_se_luhn_mod_10=La aplicación implementa esta etiqueta AMEX SE con el mismo cálculo Luhn que Luhn (Mod 10); no comprueba emisor, rango de tarjeta ni validez específica de AMEX.
help.option.op_gen_check_digits.algorithm.damm=Damm pliega las cifras de izquierda a derecha mediante una tabla de cuasigrupo; la regla implementada detecta todo error de una cifra y toda transposición adyacente. Ejemplo: base 572 → valor completo 5724.
help.option.op_gen_check_digits.algorithm.luhn_mod_10=Luhn duplica cifras alternas de la base desde la derecha, resta 9 a los resultados mayores que 9 y elige una cifra para que el total sea múltiplo de 10. Ejemplo: base 7992739871 → 79927398713.
help.option.op_gen_check_digits.algorithm.verhoeff=Verhoeff combina tablas de multiplicación, permutación dependiente de la posición e inversa; la regla implementada detecta todo error de una cifra y la mayoría de transposiciones. Ejemplo: base 572 → valor completo 5727.
help.option.op_gen_hash.algorithm.crc32=CRC-32/ISO-HDLC (reflected, init/xor FFFFFFFF). Checksum de 4 bytes, no autenticación. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.crc_32_bzip2=BZIP2 no refleja; init y xorout FFFFFFFF. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.crc_32_iscsi=iSCSI usa polinomio Castagnoli reflejado; init y xorout FFFFFFFF. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.crc_32_iso_hdlc=ISO-HDLC refleja entrada/salida; init y xorout FFFFFFFF. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.crc_32_jamcrc=JAMCRC refleja; init FFFFFFFF y xorout 00000000. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.crc_32_mpeg_2=MPEG-2 no refleja; init FFFFFFFF y xorout 00000000. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.crc_32_posix=POSIX no refleja; init 00000000 y xorout FFFFFFFF. Detecta cambios accidentales, no autentica.
help.option.op_gen_hash.algorithm.md4=MD4 devuelve 16 bytes. Hash heredado; no ofrece resistencia actual a colisiones.
help.option.op_gen_hash.algorithm.md5=MD5 devuelve 16 bytes. Hash heredado; no lo uses en diseños nuevos resistentes a colisiones.
help.option.op_gen_hash.algorithm.sha3_256=SHA3-256 devuelve 32 bytes. SHA-3 con digest de 32 bytes.
help.option.op_gen_hash.algorithm.sha3_512=SHA3-512 devuelve 64 bytes. SHA-3 con digest de 64 bytes.
help.option.op_gen_hash.algorithm.sha_1=SHA-1 devuelve 20 bytes. Hash heredado; las colisiones prácticas impiden recomendarlo para seguridad.
help.option.op_gen_hash.algorithm.sha_224=SHA-224 devuelve 28 bytes. SHA-2 con digest de 28 bytes.
help.option.op_gen_hash.algorithm.sha_256=SHA-256 devuelve 32 bytes. SHA-2 con digest de 32 bytes.
help.option.op_gen_hash.algorithm.sha_384=SHA-384 devuelve 48 bytes. SHA-2 con digest de 48 bytes.
help.option.op_gen_hash.algorithm.sha_512=SHA-512 devuelve 64 bytes. SHA-2 con digest de 64 bytes.
help.option.op_gen_hash.algorithm.tiger_192=TIGER-192 devuelve 24 bytes. Hash de 24 bytes; evalúa compatibilidad antes de elegirlo.
help.option.op_gen_hash.algorithm.whirlpool=WHIRLPOOL devuelve 64 bytes. Hash de 64 bytes; evalúa compatibilidad antes de elegirlo.
help.option.op_gen_mod.operation.addition_a_b_mod_m=Calcula (a+b) mod m; requiere A, B y m.
help.option.op_gen_mod.operation.exponentiation_a_b_mod_m=Calcula a^b mod m; requiere exponente B no negativo y m mayor que 1.
help.option.op_gen_mod.operation.extended_gcd=Devuelve gcd y coeficientes de Bézout para A y B; no usa módulo.
help.option.op_gen_mod.operation.gcd_a_b=Máximo común divisor de A y B; no usa módulo.
help.option.op_gen_mod.operation.inverse_a_mod_m=Calcula el inverso aditivo (-a) mod m; requiere m mayor que 1.
help.option.op_gen_mod.operation.lcm_a_b=Mínimo común múltiplo de A y B; no usa módulo.
help.option.op_gen_mod.operation.multiplication_a_b_mod_m=Calcula (a*b) mod m; requiere A, B y m.
help.option.op_gen_mod.operation.reciprocal_1_a_mod_m=Existe solo si gcd(a,m)=1; requiere m mayor que 1.
help.option.op_gen_mod.operation.subtraction_a_b_mod_m=Calcula (a-b) mod m; requiere A, B y m.
help.option.op_gen_mod.operation.xor_decimal_input=XOR de dos enteros decimales; resultado mostrado en Hex.
help.option.op_gen_mod.operation.xor_hex_input=XOR bit a bit de dos operandos Hex; no usa módulo.

