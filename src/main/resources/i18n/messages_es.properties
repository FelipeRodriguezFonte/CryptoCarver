help.action.op_keys_atalla_akb.unwrap.description=Comprueba el MAC con la MFK y recupera la clave y el significado de su cabecera.
help.action.op_keys_atalla_akb.example.title=Cargar ejemplo
help.action.op_keys_atalla_akb.example.description=Rellena el formulario con un ejemplo publicado para ver un bloque completo.
help.field.op_keys_atalla_akb.template.label=Plantilla de clave de trabajo
