icsf.format.AUTO=automatico (se decide bloque a bloque)
icsf.format.LINE=un token por linea (hex lineal)
icsf.format.TWO_ROW=dos filas del host por token (fila alta + fila baja)
icsf.finding.ENTRADA_NO_RECONOCIDA.title=La entrada no se ha podido leer o analizar
icsf.finding.ENTRADA_NO_RECONOCIDA.detail=O el hexadecimal no es valido, o el identificador y la version no corresponden a ningun formato documentado. Revisar el recorte: lo mas habitual es un copiar-pegar parcial o una conversion EBCDIC/ASCII.
icsf.finding.TVV_INVALIDO.title=TVV con valor pero incorrecto
icsf.finding.TVV_INVALIDO.detail=Los bytes 60-63 tienen contenido y no cuadran con la suma de los bytes 0-59. Eso NO es el caso normal del CKDS no-KDSR (ahi el TVV llega a cero): apunta a token alterado o truncado por el camino.
icsf.finding.DES_56_BITS.title=Clave DES de longitud simple (56 bits efectivos)
icsf.finding.DES_56_BITS.detail=Una clave DES single-length son 56 bits. Es el material que tumban los controles de retirada del DES simple, asi que conviene tener la lista completa antes de un salto de nivel del host.
icsf.finding.DES_FUERZA_SIMPLE.title=Clave estructuralmente doble/triple que colapsa a DES simple
icsf.finding.DES_FUERZA_SIMPLE.detail=Los componentes coinciden de forma que el EDE se reduce a un solo DES (K1=K2=K3, K1=K2 o K2=K3). Declara 112 o 168 bits y vale 56. Solo se reporta cuando la comparacion de componentes es FIABLE.
icsf.finding.MATERIAL_EN_CLARO.title=El material de clave viaja en claro dentro del token
icsf.finding.MATERIAL_EN_CLARO.detail=El propio token lleva la clave sin cifrar. Cualquiera que tenga el token tiene la clave: tratar el fichero como material sensible.
icsf.finding.CV_INVALIDO.title=Control Vector que incumple sus reglas estructurales
icsf.finding.CV_INVALIDO.detail=El CV no cumple lo que exige la p. 1678 (paridad par de ceros por byte, bit 30 = 0, bit 38 = 1). Si el CV no es valido, la lectura de tipo, usos y exportabilidad de ese token no es fiable.
icsf.finding.DES_FUERZA_DOBLE.title=Clave estructuralmente triple que equivale a doble
icsf.finding.DES_FUERZA_DOBLE.detail=Forma K1|K2|K1: es 2-key TDES (112 bits) aunque ocupe 24 bytes. No es un fallo, pero no cuenta como triple en un inventario de fortaleza.
icsf.finding.BYTE59_FUERA_DE_TABLA.title=Byte 59 con un valor que la Tabla 615 actual no define
icsf.finding.BYTE59_FUERA_DE_TABLA.detail=Hoy el byte 59 solo admite X'00', X'10' y X'20' (simple/doble/triple). En niveles antiguos de ICSF ese byte estaba SUBDIVIDIDO y llevaba tambien el algoritmo, asi que un token creado entonces puede llevar legitimamente un valor fuera de la tabla de hoy. Merece contrastarse con la documentacion vigente cuando se creo la clave, antes de darlo por corrupto: el token se puede sanear en sitio recalculando el TVV, sin tocar la clave.
icsf.finding.BYTE59_INCOHERENTE.title=El byte 59 no cuadra con la version del token
icsf.finding.BYTE59_INCOHERENTE.detail=La Tabla 615 ata cada valor a una version: single = version X'00', double y triple = version X'01'. Aqui no coinciden.
icsf.finding.WRAP_ECB.title=Envoltura heredada ECB (metodo CCA original)
icsf.finding.WRAP_ECB.detail=Es el unico metodo interoperable fuera de CCA, pero tambien el mas debil: sin confounder ni encadenamiento. En una revision de nivel del host es la lista de claves candidatas a re-envolver.
icsf.finding.NOCV.title=Clave NOCV (de transporte)
icsf.finding.NOCV.detail=Se usa sin variante del Control Vector. Es lo que hace interoperable un EXPORTER con un tercero no-CCA, y a la vez lo que quita los controles que da el CV: conviene saber cuantas hay y por que.
icsf.finding.CV_CERO.title=Control Vector a ceros (clave DATA heredada)
icsf.finding.CV_CERO.detail=Sin bits de control: ni tipo, ni usos, ni exportabilidad. El token no dice lo que se puede hacer con la clave.
icsf.finding.MKVP_AUSENTE.title=Token interno con clave cifrada y sin MKVP
icsf.finding.MKVP_AUSENTE.detail=Normal si es una copia CRUDA de un CKDS no-KDSR (p. 1560): el MKVP se copia de la cabecera del CKDS antes de usar el token. Anomalo si el token viene de Key Record Read.
icsf.finding.HISTORIA_DEBIL.title=El token declara una historia de seguridad degradada
icsf.finding.HISTORIA_DEBIL.detail=Los campos de gestion dicen que la clave estuvo cifrada con un KEK no confiable, en modo ECB, con una clave mas debil, o en un formato sin atributos de tipo y uso. La clave arrastra ese pasado aunque ahora este bien envuelta.
icsf.finding.LONGITUD_INESPERADA.title=El token no mide lo que deberia
icsf.finding.LONGITUD_INESPERADA.detail=Un token fixed-length son exactamente 64 bytes y uno variable-length declara su longitud en los bytes 2-3. Aqui no cuadra.
icsf.finding.DUPLICADO.title=Token repetido en el lote
icsf.finding.DUPLICADO.detail=Los mismos bytes aparecen mas de una vez. Puede ser un volcado con duplicados, o la misma clave guardada con dos etiquetas.
icsf.finding.AVISOS_PARSER.title=El analizador ha emitido avisos sobre este token
icsf.finding.AVISOS_PARSER.detail=Incoherencias detectadas al leerlo campo a campo. El detalle completo de cada token, al final del informe, los lista uno a uno.
icsf.finding.WRAP_MEJORADO.title=Envoltura mejorada (WRAP-ENH / WRAPENH2 / WRAPENH3)
icsf.finding.WRAP_MEJORADO.detail=Bien desde el punto de vista de seguridad, pero NADIE fuera de un CCA abre estos tokens: si esta clave hay que entregarla a un tercero, no es por esta via.
icsf.finding.ENH_ONLY.title=ENH-ONLY (bit 56 del CV) activo
icsf.finding.ENH_ONLY.detail=El coprocesador ya no devolvera un token WRAP-ECB de esta clave: no se puede volver al metodo heredado.
icsf.finding.NO_EXPORTABLE.title=La clave no se puede exportar
icsf.finding.NO_EXPORTABLE.detail=En DES lo decide el bit 17 del CV (NO-XPORT) o el flag byte; en variable-length, los campos de gestion; en PKA, NO-XLATE. Importa al planificar una migracion por exportacion: estas claves no salen.
icsf.finding.COMP_TAG.title=Clave compliant-tagged
icsf.finding.COMP_TAG.detail=Uso restringido a aplicaciones PCI-HSM compliant.
icsf.finding.TVV_AUSENTE.title=TVV a cero (token sin materializar)
icsf.finding.TVV_AUSENTE.detail=Bytes 60-63 a cero: no es corrupcion, es el registro tal como se guarda en un CKDS no-KDSR.
icsf.finding.PKA_EN_PRUEBAS.title=Lectura de token PKA en pruebas
icsf.finding.PKA_EN_PRUEBAS.detail=La decodificacion PKA esta contrastada con el manual y probada con tokens sinteticos, pero todavia no contra un token real de un PKDS. Tratar sus campos como provisionales.

# ICSF / CCA batch analysis view
icsf.batch.title=🖥 Analisis en lote ICSF / CCA
icsf.batch.help=Analiza muchos key tokens ICSF / CCA a la vez y produce estadisticas, hallazgos de auditoria e inventario normalizado. No reinterpreta nada: cada veredicto sale del analizador de un token, asi que las dos vistas no pueden contradecirse.
icsf.batch.security=⚠ Este lote no descifra nada: el material de clave protegido solo es recuperable dentro del coprocesador criptografico, bajo su master key. Sus salidas si llevan los tokens enteros en hexadecimal, asi que los ficheros que genera hay que tratarlos con el mismo cuidado que el volcado del que salieron.
icsf.batch.reading=Lectura:
icsf.batch.readingHelp=La lectura automatica decide bloque a bloque, probando las tres formas y quedandose con la que produce tokens que de verdad se analizan. Fuerza una forma cuando un bloque se este leyendo mal.
icsf.batch.inputLabel=Key tokens — uno por linea, dos filas del host por token, o un bloque de hex apilado. Las lineas en blanco separan bloques; las que empiezan por # se ignoran; se acepta ETIQUETA|hex.
