help.action.op_openpgp.clear_secret_material.description=Borra el campo de clave secreta y la frase de paso como acción explícita.
help.action.op_openpgp.clear_secret_material.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
