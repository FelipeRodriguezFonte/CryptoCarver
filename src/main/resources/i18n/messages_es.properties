help.action.op_openpgp.use_public_key_shelf.example=Ejemplo: selecciona de Shelf una clave de destinatario de prueba antes de cifrar.
help.action.op_openpgp.paste_secret_key.title=Pegar clave secreta
help.action.op_openpgp.paste_secret_key.description=Pega texto del portapapeles en el campo de clave secreta; mantenlo privado.
help.action.op_openpgp.paste_secret_key.example=Ejemplo: pega una clave desechable de prueba y úsala solo al firmar explícitamente.
help.action.op_openpgp.load_secret_key.title=Cargar clave secreta
help.action.op_openpgp.load_secret_key.description=Abre un selector de archivos y carga el material OpenPGP secreto elegido.
help.action.op_openpgp.load_secret_key.example=Ejemplo: carga la clave secreta correspondiente antes de descifrar explícitamente.
help.action.op_openpgp.save_secret_key.title=Guardar clave secreta
help.action.op_openpgp.save_secret_key.description=Escribe el campo de clave secreta en un archivo elegido; protégelo como material privado.
help.action.op_openpgp.save_secret_key.example=Ejemplo: guarda una clave de laboratorio en una ubicación protegida y limita el acceso.
help.action.op_openpgp.inspect_secret_key.title=Inspeccionar clave secreta
help.action.op_openpgp.inspect_secret_key.description=Analiza la clave y muestra metadatos; la ayuda no expone componentes privados.
help.action.op_openpgp.inspect_secret_key.example=Ejemplo: consulta la huella de una clave de prueba sin copiar el secreto a la ayuda.
help.action.op_openpgp.use_secret_key_shelf.title=Usar clave secreta de Shelf
help.action.op_openpgp.use_secret_key_shelf.description=Copia al campo una clave secreta seleccionada de Shelf local para firmar o descifrar explícitamente.
help.action.op_openpgp.use_secret_key_shelf.example=Ejemplo: selecciona de Shelf la clave correspondiente antes de firmar un mensaje de prueba.

