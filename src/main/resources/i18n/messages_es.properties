help.field.aux_epoch.zone.label=Zona horaria
help.field.aux_json.error_position.description=Posición indicada por el parser de sintaxis cuando está disponible; no es un error de esquema.
help.field.aux_json.error_position.label=Posición del error
help.field.aux_json.formatting.description=La indentación o el modo compacto conservan los valores JSON y no equivalen a validar un esquema.
help.field.aux_json.formatting.label=Formato
help.field.aux_json.input.description=Se interpreta con el parser de esta acción y la representación seleccionada. La ayuda nunca lee su valor.
