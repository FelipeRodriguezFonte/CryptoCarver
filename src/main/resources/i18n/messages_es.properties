# module-help:op_keys_kex_rsa begin
help.operation.op_keys_kex_rsa.title=Intercambio de claves RSA
help.operation.op_keys_kex_rsa.purpose=Transporta una clave simétrica cifrándola con la clave pública RSA del destinatario; solo la clave privada correspondiente la recupera. Da confidencialidad, no prueba de quién envió la clave.
help.action.op_keys_kex_rsa.export.title=Envolver clave (exportar)
help.action.op_keys_kex_rsa.export.description=Cifra la clave para el destinatario en el perfil seleccionado.
help.action.op_keys_kex_rsa.import.title=Desenvolver clave
help.action.op_keys_kex_rsa.import.description=Recupera la clave con la clave privada del destinatario.
help.action.op_keys_kex_rsa.clear_reset.title=Limpiar o restablecer
help.action.op_keys_kex_rsa.clear_reset.description=Limpiar vacía los campos de exportación; Restablecer valores predeterminados devuelve los selectores a sus valores iniciales.
help.field.op_keys_kex_rsa.recipient.label=Clave pública o certificado del destinatario
help.field.op_keys_kex_rsa.recipient.description=Clave pública en PEM, o un certificado del que se usa su clave pública.
help.field.op_keys_kex_rsa.key.label=Clave a envolver
help.field.op_keys_kex_rsa.key.description=Clave simétrica en hexadecimal.
help.field.op_keys_kex_rsa.export_profile.label=Perfil
help.field.op_keys_kex_rsa.export_profile.description=Forma de la salida: Raw OAEP da el texto cifrado RSA sin más, JWE Compact un token JOSE y CMS EnvelopedData una estructura CMS.
help.field.op_keys_kex_rsa.envelope.label=Crypto Envelope
help.field.op_keys_kex_rsa.envelope.description=Envuelve el resultado en un Crypto Envelope cuya cabecera lleva el algoritmo, el id de clave, el KCV y la marca de tiempo. Key ID y Key Version son etiquetas opcionales.
help.field.op_keys_kex_rsa.export_result.label=Resultado de exportación
help.field.op_keys_kex_rsa.export_result.description=La clave envuelta.
help.field.op_keys_kex_rsa.private_key.label=Clave privada del destinatario
help.field.op_keys_kex_rsa.private_key.description=Clave privada en PEM que corresponde a la clave pública usada para envolver.
help.field.op_keys_kex_rsa.wrapped.label=Datos envueltos
help.field.op_keys_kex_rsa.wrapped.description=Clave envuelta en el perfil seleccionado, o un Crypto Envelope.
help.field.op_keys_kex_rsa.import_profile.label=Perfil
help.field.op_keys_kex_rsa.import_profile.description=Forma de los datos pegados. Se ignora cuando los datos son un Crypto Envelope, del que se usa su propia cabecera.
help.field.op_keys_kex_rsa.import_result.label=Resultado de importación
help.field.op_keys_kex_rsa.import_result.description=La clave recuperada.
# module-help:op_keys_kex_rsa end
# module-help:op_keys_tr34 begin
help.operation.op_keys_tr34.title=Distribución de claves TR-34
help.operation.op_keys_tr34.purpose=Distribución de claves de laboratorio inspirada en TR-34: el emisor firma la clave y la ensobra para el receptor con CMS y RSA, de modo que el receptor obtiene confidencialidad y prueba del emisor. No es una implementación TR-34 certificada.
help.action.op_keys_tr34.distribute.title=Distribuir clave
help.action.op_keys_tr34.distribute.description=Firma la clave con la clave del emisor y cifra el resultado para el certificado del receptor.
help.action.op_keys_tr34.receive.title=Recibir clave
help.action.op_keys_tr34.receive.description=Descifra los datos con la clave del receptor, verifica la firma del emisor y recupera la clave.
help.action.op_keys_tr34.challenge.title=Generar reto
help.action.op_keys_tr34.challenge.description=Crea un nonce aleatorio para el flujo en dos pasos. Genéralo antes de distribuir y cópialo en Binding Nonce.
help.action.op_keys_tr34.clear_reset.title=Limpiar o restablecer
help.action.op_keys_tr34.clear_reset.description=Limpiar vacía los campos del emisor; Restablecer valores predeterminados devuelve las opciones a sus valores iniciales.
help.field.op_keys_tr34.sender_private_key.label=Clave privada del emisor
help.field.op_keys_tr34.sender_private_key.description=Clave privada en PEM que firma la distribución.
help.field.op_keys_tr34.sender_cert.label=Certificado del emisor
help.field.op_keys_tr34.sender_cert.description=Certificado que corresponde a la clave privada del emisor.
help.field.op_keys_tr34.receiver_cert.label=Certificado del receptor
help.field.op_keys_tr34.receiver_cert.description=Certificado para el que se cifra la clave.
help.field.op_keys_tr34.key.label=Clave a distribuir
help.field.op_keys_tr34.key.description=Clave simétrica en hexadecimal.
help.field.op_keys_tr34.key_id.label=ID de clave
help.field.op_keys_tr34.key_id.description=Etiqueta opcional de la clave. Va autenticada, así que el receptor puede fiarse de ella.
help.field.op_keys_tr34.binding_nonce.label=Nonce de vinculación
help.field.op_keys_tr34.binding_nonce.description=Nonce tomado del reto del receptor, que vincula esta distribución a esa petición. Déjalo vacío para el flujo en un paso.
help.field.op_keys_tr34.envelope.label=Crypto Envelope
help.field.op_keys_tr34.envelope.description=Envuelve la clave como Crypto Envelope antes de distribuirla.
help.field.op_keys_tr34.distribute_result.label=Resultado de la distribución
help.field.op_keys_tr34.distribute_result.description=Datos que se envían al receptor.
help.field.op_keys_tr34.receiver_private_key.label=Clave privada del receptor
help.field.op_keys_tr34.receiver_private_key.description=Clave privada en PEM que descifra la distribución.
help.field.op_keys_tr34.expected_sender_cert.label=Certificado esperado del emisor
help.field.op_keys_tr34.expected_sender_cert.description=Certificado contra el que se verifica la firma. Una distribución firmada por otro se rechaza.
help.field.op_keys_tr34.distributed_data.label=Datos distribuidos
help.field.op_keys_tr34.distributed_data.description=Datos recibidos del emisor, o un Crypto Envelope.
help.field.op_keys_tr34.challenge_nonce.label=Nonce del reto
help.field.op_keys_tr34.challenge_nonce.description=Nonce del flujo en dos pasos, en hexadecimal. La distribución recibida debe llevar el mismo valor.
help.field.op_keys_tr34.receive_result.label=Resultado de la recepción
help.field.op_keys_tr34.receive_result.description=Clave recuperada y resultado de las comprobaciones.
# module-help:op_keys_tr34 end
# module-help:op_keys_pkcs11 begin
help.operation.op_keys_pkcs11.title=Token PKCS#11
help.operation.op_keys_pkcs11.purpose=Se conecta a un token o HSM de laboratorio mediante su biblioteca PKCS#11 nativa y usa sus claves donde están. Las claves privadas nunca se leen ni se exportan; el PIN se usa solo en esta sesión y no se guarda.
help.action.op_keys_pkcs11.connect.title=Conectar o desconectar
help.action.op_keys_pkcs11.connect.description=Abre una sesión con el token y lista los metadatos públicos de sus objetos, o cierra la sesión.
help.action.op_keys_pkcs11.profile.title=Perfiles de token
help.action.op_keys_pkcs11.profile.description=Un perfil recuerda la ruta de la biblioteca, el slot y el nombre. El PIN nunca forma parte de él.
help.action.op_keys_pkcs11.sign.title=Firmar o verificar
help.action.op_keys_pkcs11.sign.description=Firma los datos dentro del token con el objeto de clave privada seleccionado, o verifica una firma.
help.action.op_keys_pkcs11.certificate.title=Cadena de certificados
help.action.op_keys_pkcs11.certificate.description=Muestra la cadena pública de certificados guardada para un alias, o la sustituye por la cadena PEM pegada.
help.action.op_keys_pkcs11.jwt.title=Crear JWT firmado
help.action.op_keys_pkcs11.jwt.description=Crea un JWS compacto firmado por la clave del token seleccionada.
help.action.op_keys_pkcs11.cms.title=Crear CMS SignedData
help.action.op_keys_pkcs11.cms.description=Crea una firma CMS/PKCS#7 con la clave del token seleccionada y su certificado.
help.action.op_keys_pkcs11.wrap.title=Envolver clave
help.action.op_keys_pkcs11.wrap.description=Envuelve un objeto de clave del token bajo otra clave del token, dentro del propio token. Los bytes de la clave nunca llegan a esta aplicación.
help.action.op_keys_pkcs11.unwrap.title=Desenvolver clave
help.action.op_keys_pkcs11.unwrap.description=Desenvuelve una clave dentro del token. El resultado es un resumen; el material de la clave nunca se muestra.
help.field.op_keys_pkcs11.saved_profile.label=Perfiles guardados
help.field.op_keys_pkcs11.saved_profile.description=Perfil que se carga en el formulario.
help.field.op_keys_pkcs11.name.label=Nombre del perfil
help.field.op_keys_pkcs11.name.description=Nombre de esta configuración de token.
help.field.op_keys_pkcs11.library.label=Biblioteca PKCS#11
help.field.op_keys_pkcs11.library.description=Ruta de la biblioteca nativa del fabricante (.dylib, .so o .dll).
help.field.op_keys_pkcs11.slot.label=Slot
help.field.op_keys_pkcs11.slot.description=Índice del slot donde está el token.
help.field.op_keys_pkcs11.pin.label=PIN de usuario
help.field.op_keys_pkcs11.pin.description=PIN del token. No se guarda. Varios PIN erróneos seguidos pueden bloquear un token real.
help.field.op_keys_pkcs11.report.label=Informe del token
help.field.op_keys_pkcs11.report.description=Proveedor y metadatos públicos de los objetos. Las claves no se muestran.
help.field.op_keys_pkcs11.signing_key.label=Alias de clave privada
help.field.op_keys_pkcs11.signing_key.description=Objeto de clave privada del token con el que se firma.
help.field.op_keys_pkcs11.signature_algorithm.label=Algoritmo de firma
help.field.op_keys_pkcs11.signature_algorithm.description=Algoritmo de la prueba de firma. Debe corresponder al tipo de la clave seleccionada.
help.field.op_keys_pkcs11.data.label=Datos a firmar
help.field.op_keys_pkcs11.data.description=Datos en hexadecimal.
help.field.op_keys_pkcs11.signature.label=Firma
help.field.op_keys_pkcs11.signature.description=Firma en hexadecimal: la produce Firmar, o se pega para verificarla.
help.field.op_keys_pkcs11.certificate_alias.label=Alias de certificado
help.field.op_keys_pkcs11.certificate_alias.description=Alias cuya cadena de certificados se muestra o se actualiza.
help.field.op_keys_pkcs11.certificate.label=Cadena PEM
help.field.op_keys_pkcs11.certificate.description=Cadena de certificados en PEM.
help.field.op_keys_pkcs11.jwt_algorithm.label=Algoritmo del JWT
help.field.op_keys_pkcs11.jwt_algorithm.description=Algoritmo JWS, que debe corresponder al tipo de la clave del token.
help.field.op_keys_pkcs11.jwt_payload.label=Claims
help.field.op_keys_pkcs11.jwt_payload.description=Claims del token, como objeto JSON.
help.field.op_keys_pkcs11.jwt_output.label=JWS compacto
help.field.op_keys_pkcs11.jwt_output.description=El token firmado.
help.field.op_keys_pkcs11.cms_data.label=Contenido a firmar
help.field.op_keys_pkcs11.cms_data.description=Contenido en hexadecimal.
help.field.op_keys_pkcs11.cms_detached.label=CMS separado
help.field.op_keys_pkcs11.cms_detached.description=Deja el contenido fuera del CMS; al verificador hay que darle entonces el contenido por separado.
help.field.op_keys_pkcs11.cms_output.label=Salida CMS
help.field.op_keys_pkcs11.cms_output.description=La estructura CMS/PKCS#7 en Base64.
help.field.op_keys_pkcs11.wrapping_key.label=Clave de envoltura
help.field.op_keys_pkcs11.wrapping_key.description=Clave del token cuya parte pública envuelve la otra clave.
help.field.op_keys_pkcs11.key_to_wrap.label=Clave a envolver
help.field.op_keys_pkcs11.key_to_wrap.description=Objeto de clave del token que se envuelve.
help.field.op_keys_pkcs11.wrap_transformation.label=Transformación
help.field.op_keys_pkcs11.wrap_transformation.description=Transformación de cifrado con la que se envuelve. El token debe admitirla.
help.field.op_keys_pkcs11.wrap_result.label=Clave envuelta
help.field.op_keys_pkcs11.wrap_result.description=Clave envuelta en hexadecimal.
help.field.op_keys_pkcs11.unwrapping_key.label=Clave de desenvoltura
help.field.op_keys_pkcs11.unwrapping_key.description=Clave del token cuya parte privada desenvuelve.
help.field.op_keys_pkcs11.unwrap_transformation.label=Transformación
help.field.op_keys_pkcs11.unwrap_transformation.description=Debe ser la transformación usada al envolver.
help.field.op_keys_pkcs11.wrapped_data.label=Clave envuelta
help.field.op_keys_pkcs11.wrapped_data.description=Clave envuelta en hexadecimal.
help.field.op_keys_pkcs11.unwrap_algorithm.label=Algoritmo de la clave recuperada
help.field.op_keys_pkcs11.unwrap_algorithm.description=Algoritmo de la clave que se recupera, por ejemplo AES.
help.field.op_keys_pkcs11.unwrap_type.label=Tipo de clave
help.field.op_keys_pkcs11.unwrap_type.description=Si el objeto recuperado es una clave secreta, privada o pública.
help.field.op_keys_pkcs11.unwrap_result.label=Resultado
help.field.op_keys_pkcs11.unwrap_result.description=Resumen del objeto recuperado.
# module-help:op_keys_pkcs11 end
# module-help:op_pay_thales_lmk begin
help.operation.op_pay_thales_lmk.title=Thales Variant LMK
help.operation.op_pay_thales_lmk.purpose=Reproduce cómo un payShield protege una clave bajo un par LMK variante. Se llama variante a dos cosas distintas: la variante de tipo de clave, que fija qué clase de clave es, y la variante de esquema, que fija cómo se cifran sus mitades.
help.action.op_pay_thales_lmk.encrypt.title=Cifrar bajo LMK
help.action.op_pay_thales_lmk.encrypt.description=Cifra la clave en claro bajo el par LMK para el tipo de clave y el esquema indicados.
help.action.op_pay_thales_lmk.decrypt.title=Descifrar bajo LMK
help.action.op_pay_thales_lmk.decrypt.description=Recupera la clave en claro a partir de su criptograma bajo el par LMK.
help.action.op_pay_thales_lmk.describe.title=Explicar la envoltura
help.action.op_pay_thales_lmk.describe.description=Describe paso a paso qué par LMK y qué variantes se aplican, sin necesitar valores de clave.
help.action.op_pay_thales_lmk.lookup.title=Buscar tipo de clave
help.action.op_pay_thales_lmk.lookup.description=Prueba los tipos de clave para encontrar cuál descifra el criptograma a una clave con el valor de comprobación esperado.
help.action.op_pay_thales_lmk.example.title=Cargar ejemplo del manual
help.action.op_pay_thales_lmk.example.description=Rellena el formulario con un ejemplo de prueba publicado.
help.field.op_pay_thales_lmk.lmk.label=Par LMK
help.field.op_pay_thales_lmk.lmk.description=Par LMK en hexadecimal: 32 caracteres para longitud doble o 48 para triple. Usa solo LMK de prueba.
help.field.op_pay_thales_lmk.key_type.label=Código de tipo de clave
help.field.op_pay_thales_lmk.key_type.description=Código de tres dígitos: el primero es la variante y los otros dos el código del par LMK.
help.field.op_pay_thales_lmk.scheme.label=Esquema de clave
help.field.op_pay_thales_lmk.scheme.description=Etiqueta de esquema de la clave cifrada, que indica su longitud y cómo se cifra.
help.field.op_pay_thales_lmk.clear_key.label=Clave en claro
help.field.op_pay_thales_lmk.clear_key.description=Clave que se protege, en hexadecimal.
help.field.op_pay_thales_lmk.cryptogram.label=Clave bajo LMK
help.field.op_pay_thales_lmk.cryptogram.description=Clave cifrada, con o sin su etiqueta de esquema.
help.field.op_pay_thales_lmk.check_value.label=Valor de comprobación esperado
help.field.op_pay_thales_lmk.check_value.description=Valor de comprobación de la clave en claro, que usa la búsqueda de tipo de clave.
help.field.op_pay_thales_lmk.component.label=Componente de clave
help.field.op_pay_thales_lmk.component.description=Márcalo cuando el valor es un componente y no una clave completa.
help.field.op_pay_thales_lmk.result.label=Resultado
help.field.op_pay_thales_lmk.result.description=Resultado de la operación, con los pasos intermedios.
