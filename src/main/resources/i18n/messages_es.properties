help.operation.op_keys_atalla_akb.purpose=Construye y abre Atalla Key Blocks: cabecera, clave cifrada bajo la Master File Key y MAC. La cabecera de 8 caracteres indica para qué puede usarse la clave y está cubierta por el MAC.
