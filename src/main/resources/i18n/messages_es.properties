# module-help:op_asn1_dec begin
help.operation.op_asn1_dec.title=Decodificar ASN.1
help.operation.op_asn1_dec.purpose=Analiza datos ASN.1 codificados en BER o DER y los muestra como un árbol, con los OID nombrados cuando se conocen. Es la herramienta para mirar dentro de certificados, claves y mensajes CMS.
help.action.op_asn1_dec.parse.title=Analizar ASN.1
help.action.op_asn1_dec.parse.description=Decodifica los datos y rellena el árbol de estructura; selecciona un nodo para ver sus detalles.
help.action.op_asn1_dec.export.title=Exportar
help.action.op_asn1_dec.export.description=Guarda la estructura decodificada como árbol de texto, JSON o Markdown.
help.action.op_asn1_dec.canonicalize.title=Canonicalizar DER
help.action.op_asn1_dec.canonicalize.description=Recodifica los datos como DER, la única codificación canónica. Útil cuando una firma depende de los bytes exactos.
help.action.op_asn1_dec.load_oids.title=Cargar registro de OID
help.action.op_asn1_dec.load_oids.description=Carga un archivo de nombres de OID para etiquetar identificadores que la lista interna no conoce.
