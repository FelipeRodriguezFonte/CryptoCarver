help.action.op_openpgp.verify_with_gnupg.description=Ejecuta la verificación externa opcional de entrada, firma y clave pública.
help.action.op_openpgp.verify_with_gnupg.example=Ejemplo: usa una clave y un mensaje de prueba; comprueba con la clave correspondiente.
