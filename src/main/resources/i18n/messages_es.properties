help.field.op_keys_atalla_akb.header_bytes.label=Bytes de cabecera B0–B7
help.field.op_keys_atalla_akb.header_bytes.description=Cada selector fija un carácter de la cabecera: versión, uso de la clave, algoritmo, modo de uso, exportabilidad, reservado, tratamiento especial y otra información.
help.field.op_keys_atalla_akb.header.label=Cabecera
help.field.op_keys_atalla_akb.header.description=Los ocho caracteres resultantes, con su significado detallado debajo.
help.field.op_keys_atalla_akb.mfk.label=MFK
help.field.op_keys_atalla_akb.mfk.description=Master File Key en hexadecimal: 32 caracteres para una clave TDES de dos claves o 48 para una de tres.
help.field.op_keys_atalla_akb.key.label=Clave a proteger
help.field.op_keys_atalla_akb.key.description=Clave de trabajo en hexadecimal: 16, 32 o 48 caracteres.
help.field.op_keys_atalla_akb.block.label=AKB
help.field.op_keys_atalla_akb.block.description=Bloque que se abre, escrito como cabecera, clave y MAC separados por comas.
help.field.op_keys_atalla_akb.result.label=Resultado
help.field.op_keys_atalla_akb.result.description=Bloque generado, o la clave y los atributos recuperados.
