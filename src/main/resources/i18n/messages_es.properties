icsf.warn.aesCvFlagWithoutZeroCv=El flag dice que hay Control Vector aplicado, pero el CV no esta a ceros ({0}). En un token AES de longitud fija todas las claves son DATA y su CV debe ser todo ceros (p. 1560).
icsf.warn.aesClearLength=Longitud de clave en claro no valida en el offset 56: {0} bits. El manual solo admite 0, 128, 192 o 256 (Tabla 614).
icsf.warn.aesEncryptedLength=Longitud de clave cifrada no valida en el offset 58: {0} bytes. El manual solo admite 0 o 32 (Tabla 614).
icsf.warn.byte59Version=Incoherencia con la Tabla 615: el byte 59 = X''{0}'' exige version de token X''{1}'' (sencilla = version 0; doble/triple = version 1) y el token declara version X''{2}''.
icsf.warn.cvStructure=El Control Vector no cumple las reglas estructurales del manual (paridad par de ceros por byte, bit 30 = 0, bit 38 = 1; p. 1678). Puede no ser un CV valido, y entonces la lectura de sus bits no es fiable.
icsf.warn.cvHalves=Las dos mitades del Control Vector discrepan en el bit 17 (izq={0}, der={1}): token incoherente.
icsf.warn.adlMismatch=La longitud declarada de los datos asociados (adl = {0}, offset 32) no cuadra con la suma de sus campos ({1} = 16 + kuf*2 + kmf*2 + kl + iead + uad). El token puede estar truncado o alterado.
icsf.warn.adOverflow=Los datos asociados declarados (30 + adl = {0}) se salen del token ({1} bytes).
icsf.warn.payloadOverflow=El payload declarado ({0} bits desde el offset {1}) no cabe en el token ({2} bytes).
icsf.warn.managementTruncated=Token truncado: se declaran {0} campos de gestion ({1} bytes desde el offset {2}) pero solo hay {3}.
icsf.warn.desusecvReserved=Token DESUSECV con campos de gestion distintos de cero ({0}). La Tabla 630 los define como reservados y a cero.
icsf.warn.pkaSectionLength=La seccion X''{0}'' en el offset {1} declara longitud {2}: no cabe en el token ({3} bytes). El recorrido se detiene ahi.
icsf.warn.pkaSectionUndocumented=La seccion X''{0}'' no esta documentada en la Tabla 637 (offset {1}). Se muestra su cabecera pero no se interpreta su contenido.
icsf.warn.pkaTrailing=Quedan {0} bytes despues de la ultima seccion (offset {1}). Un token PKA es la concatenacion exacta de sus secciones.
icsf.warn.pkaMixedAlgorithms=El token mezcla secciones de algoritmos distintos ({0}); un token PKA es de un solo algoritmo.
icsf.warn.pkaModulusMismatch=Las secciones declaran longitudes de modulo distintas ({0} bits). En un token RSA coherente la publica y la privada describen el mismo modulo.
icsf.warn.pkaInternalNoKvp=Token PKA interno con clave privada cifrada pero con el verification pattern a ceros. Un token interno con clave cifrada deberia llevar el MKVP de la master key que protege la OPK.
icsf.warn.pkaKeySourceExternal=Key source flag activo en un token externo, donde las Tablas 642/645 lo reservan.
icsf.warn.pkaOrderRsa=Orden de secciones: la publica X'04' aparece ANTES que la privada. El manual (p. 1605) exige el orden prescrito: cabecera, privada opcional, publica, y despues las opcionales.
icsf.warn.pkaOrderEcc=Orden de secciones: la publica ECC X'21' aparece ANTES que la privada X'20'.
icsf.prov.label.raw=copia cruda del data set {0} (leido a pelo del fichero)
icsf.prov.label.krr={0} Key Record Read ({1})
icsf.prov.label.infer=inferida del estado del token (no declarada)
icsf.prov.raw.intro=Copia cruda del data set CKDS: el token llega TAL COMO ESTA GUARDADO, sin que ICSF lo haya materializado. La p. 1560 dice "a fixed-length symmetric key token that is STORED IN a non-KDSR CKDS does not have an MKVP or TVV. Before such a key token is used, the MKVP is copied from the CKDS header record and the TVV is calculated and placed in the token".
icsf.prov.raw.externalImpossible=PROCEDENCIA INCOHERENTE: el CKDS solo guarda tokens INTERNOS. Este es EXTERNO (X'02'), asi que no puede salir de un registro del CKDS.
icsf.prov.raw.expectedState=MKVP a cero Y TVV a cero: es exactamente el estado esperado de un registro guardado en un CKDS no-KDSR. No falta nada ni hay corrupcion; ICSF pondra el MKVP y calculara el TVV al materializar la clave.
icsf.prov.raw.kdsr=MKVP y TVV presentes y correctos: coherente con un CKDS en formato KDSR, donde el registro guardado ya los lleva.
icsf.prov.raw.mkvpOnlyMissing=MKVP a cero pero TVV presente: en un CKDS no-KDSR faltarian los dos y en uno KDSR estarian los dos. Revisa si la clave esta en claro o si el registro se ha manipulado.
icsf.prov.raw.tvvOnlyMissing=TVV a cero pero MKVP presente: en un CKDS no-KDSR faltarian los dos y en uno KDSR estarian los dos. Estado incoherente para un registro guardado.
icsf.prov.tvvWrong=TVV PRESENTE pero incorrecto: no es el caso del CKDS no-KDSR, donde el TVV esta AUSENTE (a ceros). Un TVV con valor que no cuadra apunta a registro corrupto o alterado.
icsf.prov.krr.intro=CKDS Key Record Read/Read2 (CSNBKRR/CSNBKRR2), pp. 1257-1262: copia el token INTERNO desde el CKDS in-storage a la aplicacion, y otros servicios criptograficos "can then use the copied key token directly", asi que se espera un token completo y utilizable. No requiere hardware criptografico (Read2 solo lo exige para opciones como PROTKEY).
icsf.prov.krr.externalImpossible=PROCEDENCIA INCOHERENTE: CSNBKRR devuelve "the 64-byte INTERNAL key token retrieved from the in-storage CKDS" (p. 1258). Este token es EXTERNO (X'02'); no puede venir de un KRR.
icsf.prov.krr.unmaterialized=MKVP y TVV a cero: ese es el estado del registro TAL COMO SE GUARDA en un CKDS no-KDSR, no el de un token entregado por KRR para usarse. Si has sacado el token del data set a pelo, declara la procedencia como copia cruda del CKDS.
icsf.prov.krr.tvvAbsent=TVV a cero en un token entregado por KRR: deberia venir ya calculado.
icsf.prov.krr.mkvpAbsent=MKVP a cero en un token interno entregado por KRR: salvo que sea una clave en claro, deberia venir ya con el MKVP.
icsf.prov.krr.tvvWrong=TVV invalido en un token entregado por KRR: indica token corrupto o alterado, ya que deberia venir con un TVV correcto.
icsf.prov.infer.intro=Modo inferir: la procedencia NO es deducible de los bytes con certeza (el mismo token copiado del CKDS puede entregarlo despues una capa lectora). Lo que si se puede acotar es el ESTADO del token:
icsf.prov.infer.rawNonKdsr=\  compatible con: copia cruda de un CKDS no-KDSR (MKVP y TVV aun sin poner)
icsf.prov.infer.notKrr=\  descartado: CSNBKRR/KRR2, que entrega el token ya utilizable
icsf.prov.infer.krrOrService=\  compatible con: CSNBKRR/KRR2 u otro servicio que entregue el token materializado
icsf.prov.infer.rawKdsr=\  compatible con: copia cruda de un CKDS en formato KDSR
icsf.prov.infer.noneCleanly=\  compatible con: ninguna limpiamente - el token tiene MKVP y TVV en estados que no casan entre si
icsf.prov.infer.notCkds=\  descartado: cualquier via sobre el CKDS, que solo guarda tokens INTERNOS
icsf.prov.infer.externalDelivery=\  compatible con: entrega de un token externo por la aplicacion o por un servicio de export
icsf.prov.infer.allRuledOut=\  descartado: todas las vias legitimas - un TVV con valor que no cuadra es token corrupto o alterado
icsf.prov.rkxNotInCkds=Los tokens RKX (version X'10') NO se almacenan en el CKDS; CKDS Key Record Read/Write no los soportan. Por tanto un token RKX legitimo procede de un flujo de key-storage o de un lector, nunca de un CSNBKRR sobre el CKDS.
icsf.prov.pka.raw=Copia cruda del data set: para un token PKA el data set es el PKDS, no el CKDS. A diferencia del CKDS, el manual no documenta ningun estado 'sin materializar' para el PKDS: la nota de MKVP/TVV ausentes es de tokens de longitud fija en un CKDS no-KDSR, y los tokens PKA no llevan TVV.
icsf.prov.pka.rawZeroKvp=Verification pattern a ceros en un token interno: el manual lo describe para claves EN CLARO y para esqueletos, no como un estado pendiente de materializar.
icsf.prov.pka.krr=Key Record Read sobre el PKDS: CSNDKRR / CSNDKRR2 (p. 1311) copia un token PKA o un trusted block desde el PKDS in-storage al almacenamiento de la aplicacion. CSNBKRR / CSNBKRR2 no sirve aqui: es del CKDS y solo copia tokens AES/DES/HMAC.
icsf.prov.pka.krrExternal=Token EXTERNO (X'1E'): el PKDS guarda tanto tokens internos como externos, asi que no hay incoherencia, pero un token externo es formato de intercambio y puede venir igualmente de otro sistema.
icsf.prov.pka.infer=Modo inferir: la procedencia no es deducible de los bytes con certeza. Lo que si se sabe es que un token PKA vive en el PKDS, nunca en el CKDS, asi que queda descartada cualquier via sobre el CKDS (CSNBKRR/KRR2 y la copia cruda del CKDS).
icsf.prov.pka.inferInternal=\  compatible con: el PKDS de este sistema (la privada esta ligada a su master key), por copia cruda del data set o por CSNDKRR/KRR2
icsf.prov.pka.inferExternal=\  compatible con: el PKDS de este sistema, o formato de intercambio recibido de otro sistema; un token externo no esta ligado a esta master key
