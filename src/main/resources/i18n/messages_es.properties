help.action.op_openpgp.save_public_key.example=Ejemplo: guarda la clave pública generada para una verificación independiente.
help.action.op_openpgp.inspect_public_key.title=Inspeccionar clave pública
help.action.op_openpgp.inspect_public_key.description=Analiza el material público y muestra metadatos; no demuestra propiedad ni confianza.
help.action.op_openpgp.inspect_public_key.example=Ejemplo: consulta la huella y verifícala por un canal de confianza.
help.action.op_openpgp.use_public_key_shelf.title=Usar clave pública de Shelf
