module.wallet.scaHelp=Enlace dinamico de PSD2: lo que autentica el pagador tiene que ser este pago, para que una autenticacion capturada no pueda reproducirse contra otro. La cartera firma el hash de la transaccion dentro del Key Binding JWT; verificar ese hash es verificar lo que el usuario acepto. Los dos factores de autenticacion se cuentan por categorias, no por tokens.
module.wallet.adesHelp=XAdES, PAdES, CAdES y ASiC con un solo validador. El nivel baseline es la respuesta, no un detalle: B-B prueba quien firmo, B-T anade cuando, B-LT lleva consigo la evidencia de revocacion y sobrevive a la caducidad del certificado, y B-LTA mantiene eso demostrable segun envejecen los algoritmos. Sin ancla de confianza la cadena no acaba en ninguna parte y el resultado se queda en INDETERMINATE.
module.wallet.mdocHelp=Los claims se toman como JSON, que no puede expresar tags CBOR, asi que los elementos se emiten sin tag. Una fecha de nacimiento real lleva el tag 1004: los documentos de aqui ejercitan la maquinaria de digests y firma y no son identicos byte a byte a los de un emisor.
module.wallet.eidasCertHelp=Lee los qcStatements (EN 319 412-5), los roles PSD2 (TS 119 495), los identificadores de proveedor PID, Wallet y PSBEAA de TS 119 412-6, y las politicas de acceso de Relying Party de TS 119 411-8. Cada hallazgo lleva la clausula de la que sale. Esto describe el certificado; la cualificacion la decide una lista de confianza.
module.wallet.trustedListHelp=Comprobar aqui la firma establece que la lista esta integra, no que quien la publica tuviera derecho a hacerlo: una lista falsificada verifica igual de bien contra su propia clave. La autoridad viene de contrastar el certificado firmante con la lista de listas y el Diario Oficial, a mano.
