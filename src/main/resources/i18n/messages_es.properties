# B01 contextual help: symmetric ciphers and global format contracts
help.operation.op_sym_ciphers.purpose=Cifra o descifra bytes con una clave compartida. La autenticación depende del algoritmo/modo; consulta la aplicabilidad de la selección actual.
help.symmetric.current=Selección actual
help.symmetric.iv.recommended=recomendado
help.unit.bytes=bytes
help.symmetric.rule.stream=Algoritmo de flujo: los selectores de modo y padding no intervienen; se conservan visualmente sus selecciones previas.
help.symmetric.rule.block=Algoritmo por bloques: la compatibilidad de transformación la determina el motor criptográfico/proveedor; la lista del selector no filtra combinaciones.
help.symmetric.rule.ecb=ECB no utiliza IV y la interfaz muestra una advertencia.
help.symmetric.rule.iv=La variante usa IV/nonce.
help.symmetric.rule.padding.selectable=El modo permite elegir padding.
help.symmetric.rule.padding.fixed=Padding no configurable: el selector queda fijado en NoPadding o no aplica al algoritmo de flujo.
help.symmetric.rule.aead=La variante genera/verifica una etiqueta de autenticación de 16 bytes.
help.symmetric.rule.no_aead=Esta variante no autentica el ciphertext; un descifrado correcto no verifica integridad.
help.symmetric.rule.aad.used=AAD se pasa al modo GCM de bloques.
help.symmetric.rule.aad.visible_only=La interfaz muestra AAD, pero el handler dedicado actual no lo pasa a esta operación.
help.format.selected=Formato seleccionado
help.format.availableOptions=Formatos admitidos por esta operativa
help.format.selection.memory=La selección de entrada se recuerda por operativa durante esta sesión; la preferencia de salida se guarda por perfil.
help.field.op_sym_ciphers.algorithm.label=Algoritmo
help.field.op_sym_ciphers.algorithm.description=Elige un cifrado por bloques o de flujo registrado. El tamaño de clave pertenece al algoritmo y es independiente del formato del payload.
help.field.op_sym_ciphers.mode.label=Modo
help.field.op_sym_ciphers.mode.description=Construcción aplicada al algoritmo por bloques. Los algoritmos de flujo no usan este selector; la interfaz lo deshabilita y conserva el valor anterior.
help.field.op_sym_ciphers.padding.label=Padding
help.field.op_sym_ciphers.padding.description=Relleno de bloques cuando el modo lo admite. CTR, CFB, OFB y GCM usan NoPadding; los algoritmos de flujo ignoran este relleno.
help.field.op_sym_ciphers.key_source.label=Origen de clave
help.field.op_sym_ciphers.key_source.description=Elige una clave Hex manual o una referencia al Key Lab simulado local. La referencia solo sirve si el material está disponible.
help.field.op_sym_ciphers.manual_key.label=Clave manual
help.field.op_sym_ciphers.manual_key.description=Introduce bytes de clave como hexadecimal, dos dígitos por byte. AES-128/192/256 requiere 16/24/32 bytes; DES 8; 3DES 16 o 24; Salsa20 y variantes ChaCha20, 32. La clave es independiente de los formatos globales del payload; la ayuda nunca la copia.
help.field.op_sym_ciphers.key_lab_key.label=Clave de Key Lab
help.field.op_sym_ciphers.key_lab_key.description=Selecciona una entrada local de Simulated HSM/Key Lab. El algoritmo elegido sigue determinando el tamaño de clave requerido. La ayuda registra solo si hay selección/material disponible, nunca el identificador ni los bytes.
help.field.op_sym_ciphers.iv_nonce.label=IV / nonce
help.field.op_sym_ciphers.iv_nonce.description=Introduce bytes hexadecimales para el modo activo. ECB no necesita IV. AES CBC/CTR/CFB/OFB usa IV de 16 bytes; DES/3DES, de 8. Salsa20 usa nonce de 8 bytes; ChaCha20 acepta 8 o 12 (la interfaz genera 12); ChaCha20-Poly1305 exige 12; XChaCha20-Poly1305 exige 24. GCM acepta 8, 12 o 16 y la interfaz genera 12. Las variantes de flujo y AEAD requieren las longitudes indicadas.
help.field.op_sym_ciphers.aad.label=Datos adicionales autenticados (AAD)
help.field.op_sym_ciphers.aad.description=Dato autenticado opcional para la ruta GCM por bloques. El handler primero interpreta hexadecimal y, si falla, usa bytes US-ASCII. Los handlers de interfaz ChaCha20-Poly1305 y XChaCha20-Poly1305 muestran el campo, pero actualmente no lo pasan a la operación; los demás modos no usan AAD.
help.field.op_sym_ciphers.tag.label=Etiqueta de autenticación
help.field.op_sym_ciphers.tag.description=Etiqueta de autenticación separada, mostrada como hexadecimal. GCM y las variantes Poly1305 usan tag de 16 bytes en esta interfaz. El descifrado necesita el tag correspondiente; si no coincide, falla la autenticación. Los algoritmos sin AEAD no lo usan.
help.field.op_sym_ciphers.payload.label=Datos de entrada
help.field.op_sym_ciphers.payload.description=Datos que se cifran o descifran. El formato global de entrada los decodifica a bytes; no altera cómo se interpreta la clave.
help.field.op_sym_ciphers.output.label=Resultado de salida
help.field.op_sym_ciphers.output.description=La representación global de salida codifica el resultado. AEAD también expone la etiqueta por separado; conserva ciphertext, nonce, tag y AAD aplicable para descifrar.
help.action.op_sym_ciphers.encrypt.title=Cifrar
help.action.op_sym_ciphers.encrypt.description=Cifra los bytes de entrada con la clave y los parámetros elegidos. GCM y variantes Poly1305 autentican; ECB/CBC/CTR/CFB/OFB y Salsa20/ChaCha20 sin Poly1305 no autentican. No reutilices nonce con la misma clave en GCM ni en cifrados de flujo.
help.action.op_sym_ciphers.encrypt.example=Ejemplo sintético AES-256/GCM: clave 000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F, nonce de 12 bytes 000102030405060708090A0B, AAD 101112 y payload UTF-8 «test». Guarda ciphertext y tag de 16 bytes con nonce/AAD. Descifrar esos valores con la misma clave debe recuperar «test».
help.action.op_sym_ciphers.decrypt.title=Descifrar
help.action.op_sym_ciphers.decrypt.description=Descifra con el mismo algoritmo, clave, modo, IV/nonce y padding. AEAD necesita el tag de 16 bytes y el AAD donde el handler lo use; clave incorrecta o tag alterado falla la autenticación.
help.action.op_sym_ciphers.decrypt.example=Prueba negativa: usa el ciphertext AES-GCM del ejemplo, pero cambia un byte del tag. El descifrado debe fallar autenticación y no producirse como texto recuperado.
help.action.op_sym_ciphers.generate_iv.title=Generar IV / nonce
help.action.op_sym_ciphers.generate_iv.description=Genera bytes Hex aleatorios según la recomendación del algoritmo/modo actual. No cifra ni modifica el payload. ECB no usa IV.
help.action.op_sym_ciphers.generate_iv.example=Para AES/GCM, la interfaz genera 12 bytes aleatorios, mostrados como 24 dígitos hexadecimales. GCM también acepta nonces de 8 y 16 bytes; sigue los requisitos del algoritmo seleccionado.
help.action.op_sym_ciphers.select_key_source.title=Seleccionar origen de clave
help.action.op_sym_ciphers.select_key_source.description=Cambia entre entrada manual y HSM simulado. HSM remite a una entrada local de Key Lab; no transmite el material.
help.action.op_sym_ciphers.select_key_source.example=Elige Manual Input y proporciona bytes hexadecimales sintéticos en el campo de clave; luego selecciona Simulated HSM para elegir una entrada local almacenada.
help.action.op_sym_ciphers.paste_key.title=Pegar clave
help.action.op_sym_ciphers.paste_key.description=Pega texto del portapapeles en el campo de clave manual; se mantienen las comprobaciones Hex y de tamaño. Ayuda no lee el portapapeles.
help.action.op_sym_ciphers.paste_key.example=Una clave sintética AES-128 de 16 bytes se representa con 32 dígitos hexadecimales.
help.action.op_sym_ciphers.load_key.title=Cargar archivo de clave
help.action.op_sym_ciphers.load_key.description=Carga texto de un archivo elegido por el usuario al campo manual. Se aplican las comprobaciones de tamaño de la operación.
help.action.op_sym_ciphers.load_key.example=Carga un archivo local de prueba que contenga 32 dígitos hexadecimales para AES-128.
help.action.op_sym_ciphers.inspect_key.title=Inspeccionar clave
help.action.op_sym_ciphers.inspect_key.description=En modo Simulated HSM, abre los metadatos y la disponibilidad de la clave local. En Manual Input esta acción está oculta. Inspeccionar no cifra y la ayuda nunca revela bytes de clave.
help.action.op_sym_ciphers.inspect_key.example=Selecciona una entrada de prueba y consulta su algoritmo y disponibilidad.
help.action.op_sym_ciphers.save_key_lab.title=Guardar en Key Lab
help.action.op_sym_ciphers.save_key_lab.description=Guarda la clave manual mediante el flujo local existente de Key Lab; es una acción de gestión de claves.
help.action.op_sym_ciphers.save_key_lab.example=Usa material sintético de prueba y confirma que la nueva entrada local se puede seleccionar.
help.action.op_sym_ciphers.use_key_shelf.title=Usar estante de claves
help.action.op_sym_ciphers.use_key_shelf.description=Selecciona una clave del estante local para el flujo manual. El material no se incluye en el contexto de ayuda.
help.action.op_sym_ciphers.use_key_shelf.example=Elige una clave AES sintética del estante y comprueba que sus bytes aparecen solo en el campo de clave.
help.action.op_sym_ciphers.copy_result.title=Copiar resultado
help.action.op_sym_ciphers.copy_result.description=Copia el resultado actual mediante la acción existente. Consultar ayuda no lo copia ni lo modifica.
help.action.op_sym_ciphers.copy_result.example=Copia un ciphertext sintético ya generado desde los controles de resultado.
help.action.op_sym_ciphers.shelf_result.title=Guardar resultado en estante
help.action.op_sym_ciphers.shelf_result.description=Guarda el resultado actual en el estante local sin cambiar parámetros.
help.action.op_sym_ciphers.shelf_result.example=Guarda un ciphertext sintético y comprueba que aparece como elemento del estante.
help.action.op_sym_ciphers.expand_result.title=Ampliar resultado
help.action.op_sym_ciphers.expand_result.description=Abre la vista completa si el resultado excede la presentación compacta.
help.action.op_sym_ciphers.expand_result.example=Amplía un ciphertext sintético largo y compara el texto completo.
help.action.op_sym_ciphers.save_result.title=Guardar resultado
help.action.op_sym_ciphers.save_result.description=Exporta el resultado actual mediante la acción existente. Ayuda no crea archivos.
help.action.op_sym_ciphers.save_result.example=Guarda un ciphertext sintético en una ubicación temporal de prueba.
help.action.op_sym_ciphers.reuse_result.title=Reutilizar resultado
help.action.op_sym_ciphers.reuse_result.description=Carga un resultado previo compatible y sus metadatos empaquetados si están disponibles; revisa los parámetros antes de descifrar.
help.action.op_sym_ciphers.reuse_result.example=Reutiliza un paquete de resultado autenticado y comprueba que ciphertext y tag siguen emparejados.
help.option.op_sym_ciphers.algorithm.des=Cifrado por bloques heredado con clave de 8 bytes; aparece para compatibilidad con material existente.
help.option.op_sym_ciphers.algorithm.3des_triple_des=Cifrado por bloques Triple DES; el núcleo acepta claves de 16 o 24 bytes (la de 16 se expande internamente).
help.option.op_sym_ciphers.algorithm.aes_128=Cifrado AES por bloques con clave de 16 bytes.
help.option.op_sym_ciphers.algorithm.aes_192=Cifrado AES por bloques con clave de 24 bytes.
help.option.op_sym_ciphers.algorithm.aes_256=Cifrado AES por bloques con clave de 32 bytes.
help.option.op_sym_ciphers.algorithm.salsa20=Cifrado de flujo sin autenticación; clave 32 bytes y nonce 8. Modo y padding no aplican.
help.option.op_sym_ciphers.algorithm.chacha20=Cifrado de flujo sin autenticación; clave de 32 bytes. El núcleo acepta nonces de 8 o 12 bytes; la interfaz genera 12. Modo y padding no aplican.
help.option.op_sym_ciphers.algorithm.chacha20_poly1305=Cifrado de flujo autenticado: clave 32 bytes, nonce 12 y tag 16. El handler dedicado actual no usa AAD visible.
help.option.op_sym_ciphers.algorithm.xchacha20_poly1305=Cifrado de flujo autenticado: clave 32 bytes, nonce 24 y tag 16. El handler dedicado actual no usa AAD visible.
help.option.op_sym_ciphers.mode.ecb=No requiere IV; bloques de texto claro iguales producen bloques cifrados iguales, por eso la interfaz muestra advertencia. Padding solo si la transformación lo admite.
help.option.op_sym_ciphers.mode.cbc=Requiere IV (recomendado: 16 bytes AES, 8 DES/3DES). Puede admitir padding. CBC no autentica ciphertext.
help.option.op_sym_ciphers.mode.ctr=Usa IV/contador y esta interfaz no usa padding. No autentica ciphertext.
help.option.op_sym_ciphers.mode.gcm=Modo autenticado: nonce, AAD opcional en la ruta de bloques y tag de 16 bytes. Interfaz genera nonce de 12; el núcleo acepta 8/12/16.
help.option.op_sym_ciphers.mode.cfb=Usa IV y no usa padding en esta interfaz. No autentica ciphertext.
help.option.op_sym_ciphers.mode.ofb=Usa IV y no usa padding en esta interfaz. No autentica ciphertext.
help.option.op_sym_ciphers.padding.nopadding=No añade bytes. La interfaz fuerza esta opción para CTR, CFB, OFB, GCM y cifrados de flujo. En transformaciones por bloques ECB/CBC, el texto claro debe estar alineado al bloque.
help.option.op_sym_ciphers.padding.pkcs5padding=En transformaciones por bloques ECB/CBC compatibles, añade un bloque completo si los datos ya están alineados; cada byte de relleno contiene la longitud. Lo gestiona el proveedor de la transformación.
help.option.op_sym_ciphers.padding.pkcs7padding=En transformaciones por bloques ECB/CBC compatibles, añade N bytes con valor N hasta completar el bloque. Esta aplicación asigna el nombre PKCS7Padding a la transformación PKCS5Padding.
help.option.op_sym_ciphers.padding.iso10126padding=En transformaciones por bloques ECB/CBC compatibles, rellena con bytes aleatorios y termina con la longitud del padding.
help.option.op_sym_ciphers.padding.iso7816_4padding=En transformaciones por bloques ECB/CBC compatibles, añade 0x80 y luego ceros hasta completar el siguiente bloque.
help.option.op_sym_ciphers.padding.zerobytepadding=En transformaciones por bloques ECB/CBC compatibles, añade ceros solo si hacen falta para completar el bloque. Al descifrar se eliminan los ceros finales, por lo que los datos originales acabados en cero son ambiguos.
help.option.op_sym_ciphers.key_source.manual_input=Clave introducida como Hex en el campo manual.
help.option.op_sym_ciphers.key_source.simulated_hsm=Referencia a una clave almacenada localmente en el HSM simulado.

help.operation.op_jose_jwe.title=JWE (cifrado)
help.operation.op_jose_jwe.purpose=Cifra un contenido con opciones separadas de gestión de claves y cifrado, o descifra un JWE recibido. La ayuda solo lee selectores públicos e indicadores de presencia; nunca inspecciona claves ni contenido.
help.action.op_jose_jwe.encrypt.title=Cifrar y generar JWE
help.action.op_jose_jwe.encrypt.description=Crea un JWE con el algoritmo de gestión de claves (alg), el cifrado de contenido (enc), el contenido, la serialización y los valores opcionales de cabecera autenticada.
help.action.op_jose_jwe.encrypt.example=Elige RSA-OAEP-256, A256GCM y Compact para un destinatario; después cifra un mensaje de prueba.
help.action.op_jose_jwe.decrypt.title=Descifrar JWE
help.action.op_jose_jwe.decrypt.description=Analiza un JWE Compact o JSON, recibe la clave privada, secreto o contraseña correspondiente y autentica y descifra el contenido.
help.action.op_jose_jwe.decrypt.example=Pega un token de prueba y proporciona la clave privada o el secreto compatible con la codificación elegida.
help.action.op_jose_jwe.choose_serialization.title=Elegir serialización
help.action.op_jose_jwe.choose_serialization.description=Selecciona Compact, Flattened JSON o General JSON. El AAD externo solo está disponible con las serializaciones JSON.
help.action.op_jose_jwe.choose_serialization.example=Elige General JSON para varios destinatarios; usa Compact solo con un destinatario y sin AAD externo.
help.action.op_jose_jwe.select_recipients.title=Elegir destinatarios
help.action.op_jose_jwe.select_recipients.description=Elige el material de las claves destinatarias. General JSON admite varios destinatarios si cada JWK indica su alg.
help.action.op_jose_jwe.select_recipients.example=Para probar varios destinatarios, proporciona un JWKS con al menos dos claves compatibles y selecciona General JSON.
help.action.op_jose_jwe.inspect_breakdown.title=Inspeccionar valores y desglose
help.action.op_jose_jwe.inspect_breakdown.description=Revisa la cabecera y el contenido decodificados y el desglose de cabecera protegida, clave cifrada, IV, ciphertext y etiqueta de autenticación.
help.action.op_jose_jwe.inspect_breakdown.example=Descifra un token de prueba y compara su cabecera protegida con los campos del cifrado de contenido.
help.action.op_jose_jwe.import_public_key.title=Importar clave destinataria
help.action.op_jose_jwe.import_public_key.description=Carga material público desde un archivo con el flujo de importación existente. Consultar la ayuda no abre el selector de archivos.
help.action.op_jose_jwe.import_public_key.example=Importa una clave pública RSA o EC de prueba antes de cifrar.
help.action.op_jose_jwe.use_public_key_shelf.title=Usar clave destinataria de la colección
help.action.op_jose_jwe.use_public_key_shelf.description=Selecciona material público guardado con el menú existente. La ayuda no lee el texto de la clave.
help.action.op_jose_jwe.use_public_key_shelf.example=Selecciona una clave pública de prueba y confirma su formato en el campo destinatario.
help.action.op_jose_jwe.import_private_key.title=Importar clave de descifrado
help.action.op_jose_jwe.import_private_key.description=Carga una clave privada o secreto compatible mediante el flujo de importación existente. La ayuda no abre el selector de archivos.
help.action.op_jose_jwe.import_private_key.example=Importa una clave privada de prueba que corresponda al destinatario del JWE.
help.action.op_jose_jwe.use_private_key_shelf.title=Usar material de descifrado de la colección
help.action.op_jose_jwe.use_private_key_shelf.description=Selecciona material de descifrado guardado. La ayuda nunca lee ni copia su valor.
help.action.op_jose_jwe.use_private_key_shelf.example=Selecciona una clave de prueba de la colección y usa su formato de secreto correspondiente.
help.action.op_jose_jwe.copy_result.title=Copiar resultado
help.action.op_jose_jwe.copy_result.description=Usa la acción existente para copiar el JWE generado. Abrir esta ayuda no copia nada.
help.action.op_jose_jwe.copy_result.example=Copia un JWE sintético ya generado desde los controles del resultado.
help.action.op_jose_jwe.expand_result.title=Ampliar resultado
help.action.op_jose_jwe.expand_result.description=Abre la vista completa si el JWE supera el espacio de su vista compacta.
help.action.op_jose_jwe.expand_result.example=Amplía una serialización JSON larga para revisar su estructura completa.

help.field.op_jose_jwe.key_algorithm.label=Gestión de claves (alg)
help.field.op_jose_jwe.key_algorithm.description=Elige cómo se proporciona o protege la clave de cifrado de contenido: RSA, ECDH-ES, AES-KW, AES-GCMKW, PBES2 o directo (dir).
help.field.op_jose_jwe.content_encryption.label=Cifrado de contenido (enc)
help.field.op_jose_jwe.content_encryption.description=Elige el cifrado autenticado del contenido. El tamaño de su clave es independiente del algoritmo de gestión de claves.
help.field.op_jose_jwe.compression.label=Compresión (zip)
help.field.op_jose_jwe.compression.description=Si se activa, aplica la compresión DEF disponible antes del cifrado. Evítala si se combinan secretos y contenido controlado por un atacante.
help.field.op_jose_jwe.secret_format.label=Formato del secreto
help.field.op_jose_jwe.secret_format.description=Es local al cifrado: controla cómo se decodifica el secreto compartido o contraseña PBES2, independientemente del selector de formato del secreto para descifrar. Se ignora al usar una clave RSA o EC.
help.field.op_jose_jwe.pbes2_iterations.label=Iteraciones PBES2
help.field.op_jose_jwe.pbes2_iterations.description=Se usa con PBES2-HS256+A128KW, PBES2-HS384+A192KW y PBES2-HS512+A256KW. Si está vacío, se usan 600000 iteraciones; si contiene un valor, debe ser un entero de al menos 1000. La interfaz valida este campo para todos los algoritmos de cifrado, incluso cuando alg no es PBES2.
help.field.op_jose_jwe.public_key.label=Material de clave destinataria
help.field.op_jose_jwe.public_key.description=Para cifrar, el material asimétrico puede ser PEM, un certificado X.509, DER en Base64, un JWK o un JWKS con una sola clave. General JSON con varios destinatarios acepta un JWKS de al menos dos JWK destinatarias, cada una con alg. El secreto/contraseña se interpreta según el formato del secreto. La ayuda nunca lee el texto del material.
help.field.op_jose_jwe.payload.label=Contenido
help.field.op_jose_jwe.payload.description=Texto que se cifrará. La ayuda solo informa si el campo está vacío y nunca lee ni incluye su contenido.
help.field.op_jose_jwe.serialization.label=Serialización
help.field.op_jose_jwe.serialization.description=Compact usa cinco segmentos separados por puntos y un destinatario. Flattened JSON representa uno; General JSON admite listas de destinatarios y AAD externo.
help.field.op_jose_jwe.aad.label=Datos autenticados externos (AAD)
help.field.op_jose_jwe.aad.description=Texto UTF-8 opcional que se autentica junto al ciphertext, pero queda fuera del contenido cifrado. Requiere Flattened JSON o General JSON.
help.field.op_jose_jwe.kid.label=Identificador de clave (kid)
help.field.op_jose_jwe.kid.description=Identificador opcional de clave destinataria en la cabecera. General JSON con varios destinatarios rechaza cualquier kid, apu o apv global no vacío; aporta esos valores en cada JWK destinataria.
help.field.op_jose_jwe.typ.label=Tipo (typ)
help.field.op_jose_jwe.typ.description=Valor opcional de cabecera que identifica el tipo de medio del objeto JWE.
help.field.op_jose_jwe.cty.label=Tipo de contenido (cty)
help.field.op_jose_jwe.cty.description=Valor opcional que describe el contenido cifrado. Usa JWT si el contenido es un JWT, por ejemplo, un token firmado anidado.
help.field.op_jose_jwe.apu.label=Información de parte U (apu)
help.field.op_jose_jwe.apu.description=Información opcional de ECDH-ES, introducida como texto y codificada en Base64URL para la cabecera. General JSON con varios destinatarios rechaza cualquier kid, apu o apv global no vacío; aporta esos valores en cada JWK destinataria.
help.field.op_jose_jwe.apv.label=Información de parte V (apv)
help.field.op_jose_jwe.apv.description=Información opcional de ECDH-ES, introducida como texto y codificada en Base64URL para la cabecera. General JSON con varios destinatarios rechaza cualquier kid, apu o apv global no vacío; aporta esos valores en cada JWK destinataria.
help.field.op_jose_jwe.custom_header.label=Parámetros de cabecera personalizados
help.field.op_jose_jwe.custom_header.description=Objeto JSON opcional con parámetros JOSE adicionales. El composer rechaza estos nombres reservados: alg, enc, zip, epk, iv, tag, p2s y p2c. Por ejemplo, {\"note\":\"demo\"} se acepta; {\"alg\":\"dir\"} y {\"p2c\":600000} se rechazan.
help.field.op_jose_jwe.output.label=Resultado JWE generado
help.field.op_jose_jwe.output.description=Muestra el JWE Compact o JSON generado. El contexto de ayuda no lee ni copia el resultado.
help.field.op_jose_jwe.input.label=Entrada del token JWE
help.field.op_jose_jwe.input.description=Pega un JWE Compact, Flattened JSON o General JSON recibido para descifrar. Al abrirla, la ayuda contextual no analiza el token ni lee sus cabeceras; consulta el resultado de cabecera decodificada después de descifrar para inspeccionar sus valores.
help.field.op_jose_jwe.private_key.label=Material de clave de descifrado
help.field.op_jose_jwe.private_key.description=Proporciona la clave privada RSA/EC, secreto compartido o contraseña PBES2 que requiere el token recibido. La clave privada puede ser PEM, DER en Base64 o un JWK privado en formato JWK/JWKS de una sola clave; un certificado X.509 aporta una clave pública y no sustituye la clave privada de descifrado. La ayuda solo informa si este campo está vacío y nunca lee su contenido.
help.field.op_jose_jwe.decrypt_key_format.label=Formato del secreto de descifrado
help.field.op_jose_jwe.decrypt_key_format.description=Es un selector local al descifrado: controla cómo se decodifica el secreto o contraseña PBES2, independientemente del selector de formato del secreto al cifrar. UTF-8 conserva el texto; Hex ignora espacios y el prefijo 0x opcional; Base64/Base64URL ignora espacios. No cambia el alg del token.
help.field.op_jose_jwe.decoded_header.label=Cabecera decodificada
help.field.op_jose_jwe.decoded_header.description=Muestra la cabecera tras analizar o descifrar correctamente. Trata sus valores como entrada no confiable.
help.field.op_jose_jwe.decoded_payload.label=Contenido decodificado
help.field.op_jose_jwe.decoded_payload.description=Muestra el texto claro tras autenticar y descifrar. Es un dato sensible; el servicio de ayuda no lo lee.
help.field.op_jose_jwe.breakdown_header.label=Cabecera protegida
help.field.op_jose_jwe.breakdown_header.description=En Compact, la cabecera JOSE protegida se codifica en Base64URL; en JSON aparece como valor protegido.
help.field.op_jose_jwe.breakdown_encrypted_key.label=Clave cifrada
help.field.op_jose_jwe.breakdown_encrypted_key.description=Resultado de gestión de claves del destinatario. dir y ECDH-ES directo no envuelven una clave de contenido separada.
help.field.op_jose_jwe.breakdown_decrypted_cek.label=Clave de cifrado de contenido recuperada (CEK)
help.field.op_jose_jwe.breakdown_decrypted_cek.description=La CEK es material criptográfico sensible. La ayuda nunca la recupera ni muestra; consulta solo el comportamiento existente del desglose.
help.field.op_jose_jwe.breakdown_content_iv.label=Vector de inicialización del contenido
help.field.op_jose_jwe.breakdown_content_iv.description=IV usado por el cifrado del contenido; es distinto del IV de envoltura AES-GCMKW.
help.field.op_jose_jwe.breakdown_ciphertext.label=Texto cifrado
help.field.op_jose_jwe.breakdown_ciphertext.description=Bytes del contenido cifrado; el desglose existente suele mostrarlos truncados.
help.field.op_jose_jwe.breakdown_content_tag.label=Etiqueta de autenticación del contenido
help.field.op_jose_jwe.breakdown_content_tag.description=Etiqueta de autenticación del contenido. AES-GCMKW tiene otra etiqueta independiente para la envoltura.

help.jwe.current.algorithm=alg seleccionado
help.jwe.current.contentEncryption=enc seleccionado
help.jwe.current.serialization=Serialización seleccionada
help.jwe.current.compression=Compresión
help.jwe.compression.enabled=activada
help.jwe.compression.disabled=desactivada
help.jwe.rule.pbes2=PBES2-HS256+A128KW, PBES2-HS384+A192KW y PBES2-HS512+A256KW derivan una clave de envoltura desde una contraseña y una sal. Si el campo de iteraciones está vacío se usan 600000; si no, debe ser un entero de al menos 1000. La interfaz aplica esta validación a cualquier alg de cifrado, también a los que no son PBES2; describe la regla de entrada de la aplicación, no una política universal.
help.jwe.rule.gcmkw=AES-GCM para envolver claves tiene su propio IV y etiqueta, separados del IV y la etiqueta del cifrado de contenido.
help.jwe.rule.ecdh=ECDH-ES deriva material desde una clave destinataria EC u OKP; apu y apv son datos opcionales. ECDH-ES directo se limita a un destinatario.
help.jwe.rule.direct.bytes=dir usa directamente el secreto como CEK; enc requiere {0} bytes ({1} bits).
help.jwe.rule.direct.generic=dir usa directamente el secreto como CEK; su tamaño requerido depende de enc.
help.jwe.rule.serialization.compact=Compact admite un destinatario y no incluye AAD externo.
help.jwe.rule.serialization.compact.aad=Compact no admite AAD externo; el valor AAD actual no vacío es incompatible y el cifrado se rechaza.
help.jwe.rule.serialization.flattened=Flattened JSON representa un destinatario y puede incluir AAD externo.
help.jwe.rule.serialization.general=General JSON puede incluir AAD externo y varios destinatarios cuando los algoritmos lo admiten.
help.jwe.material.public.present=El campo de material destinatario no está vacío. La ayuda no inspeccionó su contenido.
help.jwe.material.public.absent=El campo de material destinatario está vacío. La ayuda no inspeccionó su contenido.
help.jwe.material.private.present=El campo de material de descifrado no está vacío. La ayuda no inspeccionó su contenido.
help.jwe.material.private.absent=El campo de material de descifrado está vacío. La ayuda no inspeccionó su contenido.
help.jwe.material.payload.present=El campo de contenido no está vacío. La ayuda no inspeccionó su contenido.
help.jwe.material.payload.absent=El campo de contenido está vacío. La ayuda no inspeccionó su contenido.
help.option.op_jose_jwe.key_algorithm.rsa1_5=Transporte RSA con el esquema heredado PKCS#1 v1.5; consérvalo solo si hace falta por compatibilidad.
help.option.op_jose_jwe.key_algorithm.rsa_oaep=Transporte RSA-OAEP con SHA-1 según este identificador JWA.
help.option.op_jose_jwe.key_algorithm.rsa_oaep_256=Transporte RSA-OAEP con SHA-256.
help.option.op_jose_jwe.key_algorithm.rsa_oaep_384=Transporte RSA-OAEP con SHA-384.
help.option.op_jose_jwe.key_algorithm.rsa_oaep_512=Transporte RSA-OAEP con SHA-512.
help.option.op_jose_jwe.key_algorithm.ecdh_es=ECDH-ES deriva directamente la clave de contenido; requiere una clave EC u OKP compatible y un destinatario.
help.option.op_jose_jwe.key_algorithm.ecdh_es_a128kw=ECDH-ES deriva una clave AES de 128 bits para envolver claves.
help.option.op_jose_jwe.key_algorithm.ecdh_es_a192kw=ECDH-ES deriva una clave AES de 192 bits para envolver claves.
help.option.op_jose_jwe.key_algorithm.ecdh_es_a256kw=ECDH-ES deriva una clave AES de 256 bits para envolver claves.
help.option.op_jose_jwe.key_algorithm.a128kw=AES Key Wrap con clave de envoltura de 128 bits.
help.option.op_jose_jwe.key_algorithm.a192kw=AES Key Wrap con clave de envoltura de 192 bits.
help.option.op_jose_jwe.key_algorithm.a256kw=AES Key Wrap con clave de envoltura de 256 bits.
help.option.op_jose_jwe.key_algorithm.a128gcmkw=Envoltura AES-GCM con clave de 128 bits y su propio IV y etiqueta.
help.option.op_jose_jwe.key_algorithm.a192gcmkw=Envoltura AES-GCM con clave de 192 bits y su propio IV y etiqueta.
help.option.op_jose_jwe.key_algorithm.a256gcmkw=Envoltura AES-GCM con clave de 256 bits y su propio IV y etiqueta.
help.option.op_jose_jwe.key_algorithm.pbes2_hs256_a128kw=PBES2-HS256 deriva una clave de envoltura AES de 128 bits desde una contraseña.
help.option.op_jose_jwe.key_algorithm.pbes2_hs384_a192kw=PBES2-HS384 deriva una clave de envoltura AES de 192 bits desde una contraseña.
help.option.op_jose_jwe.key_algorithm.pbes2_hs512_a256kw=PBES2-HS512 deriva una clave de envoltura AES de 256 bits desde una contraseña.
help.option.op_jose_jwe.key_algorithm.dir=Usa directamente el secreto simétrico como CEK; su tamaño debe coincidir con enc.
help.option.op_jose_jwe.content_encryption.a128gcm=AES-GCM con una clave de contenido de 128 bits.
help.option.op_jose_jwe.content_encryption.a192gcm=AES-GCM con una clave de contenido de 192 bits.
help.option.op_jose_jwe.content_encryption.a256gcm=AES-GCM con una clave de contenido de 256 bits.
help.option.op_jose_jwe.content_encryption.a128cbc_hs256=Cifrado autenticado AES-CBC-HMAC-SHA-256; CEK de 256 bits.
help.option.op_jose_jwe.content_encryption.a192cbc_hs384=Cifrado autenticado AES-CBC-HMAC-SHA-384; CEK de 384 bits.
help.option.op_jose_jwe.content_encryption.a256cbc_hs512=Cifrado autenticado AES-CBC-HMAC-SHA-512; CEK de 512 bits.
help.option.op_jose_jwe.serialization.compact=Formato compacto de cinco partes para un destinatario; no admite AAD externo.
help.option.op_jose_jwe.serialization.flattened_json=Formato JSON para un destinatario; admite AAD externo.
help.option.op_jose_jwe.serialization.general_json=Formato JSON con lista de destinatarios; admite AAD externo y varios destinatarios compatibles.
help.option.op_jose_jwe.secret_format.utf_8=Codifica el texto del secreto como bytes UTF-8.
help.option.op_jose_jwe.secret_format.hex=Decodifica como bytes hexadecimales; ignora espacios y un prefijo 0x opcional.
help.option.op_jose_jwe.secret_format.base64_base64url=Decodifica como bytes Base64 o Base64URL; ignora espacios.
help.option.op_jose_jwe.decrypt_key_format.utf_8=Codifica el texto del secreto como bytes UTF-8.
help.option.op_jose_jwe.decrypt_key_format.hex=Decodifica como bytes hexadecimales; ignora espacios y un prefijo 0x opcional. Este selector de descifrado es independiente del selector de cifrado.
help.option.op_jose_jwe.decrypt_key_format.base64_base64url=Decodifica como bytes Base64 o Base64URL; ignora espacios. Este selector de descifrado es independiente del selector de cifrado.
help.option.op_jose_jwe.compression.enabled=Comprime el contenido con la opción DEF disponible antes del cifrado.
help.option.op_jose_jwe.compression.disabled=Cifra el contenido sin el paso opcional de compresión DEF.
help.format.contract.hashing=Hashing consume bytes de entrada y devuelve bytes de digest. Los selectores controlan representaciones; no el algoritmo hash.
help.format.contract.manual_conversion=Conversión manual es un conjunto de rutas, no una sola cadena de codecs. La acción Convert estándar valida la entrada antes de su conversión; EBCDIC y otras acciones especializadas pueden llamar directamente a codecs compartidos. Comprueba la acción seleccionada: sus reglas de aceptación pueden variar. Cada ruta aplica su propio formato de salida.
help.format.contract.symmetric_ciphers=Cifrados simétricos decodifica el payload a bytes, aplica el cifrado y codifica el resultado. Clave/IV/tag tienen representación Hex propia.
help.format.contract.file_cipher_streaming=Cifrado de archivos (streaming) lee y escribe archivos directamente. Los selectores globales no aplican.
help.format.contract.asymmetric_ciphers=Cifrados asimétricos decodifica bytes del payload, aplica la operación RSA seleccionada y codifica el resultado.
help.format.contract.digital_signatures=Firmas digitales firma o verifica bytes. La representación de entrada y la codificación de firma son independientes.
help.format.contract.message_authentication_codes=MAC calcula o verifica un código de autenticación sobre bytes; los formatos son representaciones.
help.format.contract.jwt_signed=JWT firmado procesa un token estructurado; no usa selectores globales de formato.
help.format.contract.jwe_encrypted=JWE cifrado procesa un token cifrado estructurado; no usa selectores globales de formato.
help.format.contract.decode_asn_1=Decodificar ASN.1 consume bytes codificados y presenta un árbol estructurado con sus propios controles.
help.format.contract.encode_asn_1=Codificar ASN.1 consume una descripción textual/estructurada y produce bytes codificados.
help.format.contract.sign_xml_xades=Firmar XML opera sobre una estructura XML y su política de firma; los selectores globales no aplican.
help.format.contract.verify_xml_xades=Verificar XML analiza y comprueba una firma XML; los selectores globales no aplican.
help.format.contract.sign_soap_wss=Firmar SOAP opera sobre una estructura SOAP y su configuración WS-Security.
help.format.contract.verify_soap_wss=Verificar SOAP analiza y comprueba una estructura WS-Security.
help.format.contract.random_number_generator=El generador crea bytes; solo se aplica el selector de representación de salida.
help.format.type.input.bytes=bytes
help.format.type.output.bytes=bytes
help.format.type.input.file=archivo
help.format.type.output.file=archivo
help.format.type.input.structure=datos estructurados
help.format.type.output.structure=datos estructurados
help.format.type.input.text=texto
help.format.type.output.text=texto
help.format.type.input.none=sin bytes de entrada
help.format.type.output.none=sin bytes de entrada
help.format.option.text_utf_8.input=Decodifica texto UTF-8 válido a bytes; rechaza entradas UTF-8 mal formadas.
help.format.option.text_utf_8.output=Decodifica los bytes del resultado como texto UTF-8 estricto; rechaza secuencias de bytes no válidas.
help.format.option.hexadecimal.input=Decodifica pares hexadecimales; ignora espacios, dos puntos y guiones y exige un número par de dígitos hexadecimales.
help.format.option.hexadecimal.output=Codifica cada byte con dos dígitos hexadecimales en mayúscula y sin separadores.
help.format.option.base64.input=Decodifica texto Base64 estándar mediante el codec registrado. Ignora espacios y elimina las líneas BEGIN/END PEM en mayúsculas que reconoce el codec; rechaza otras etiquetas o Base64 no válido.
help.format.option.base64.output=Codifica los bytes como Base64 estándar con padding.
help.format.option.base64url.input=Decodifica Base64 seguro para URL con letras, dígitos, guion bajo y guion; no admite padding ni espacios.
help.format.option.base64url.output=Codifica los bytes como Base64 seguro para URL sin padding.
help.format.option.base94.input=Decodifica la representación reversible Base94 con caracteres ASCII imprimibles de ! a ~.
help.format.option.base94.output=Codifica bytes con la representación reversible Base94 y caracteres ASCII imprimibles de ! a ~.
help.format.option.binary.input=Decodifica dígitos 0 y 1 a bytes; ignora espacios, dos puntos y guiones y exige que los bits sean múltiplo de ocho.
help.format.option.binary.output=Codifica cada byte con ocho dígitos binarios separados por espacios.
help.format.option.decimal.input=Decodifica valores de byte sin signo entre 0 y 255 separados por comas o espacios.
help.format.option.decimal.output=Codifica los bytes como valores decimales sin signo entre 0 y 255 separados por espacios.
help.format.disabled.fallback=Esta operativa no usa selectores de formato globales.
help.format.disabled.file_cipher_streaming=El archivo se procesa como archivo, sin conversión global de bytes.
help.format.disabled.jwt_signed=JWT utiliza su propio editor estructurado.
help.format.disabled.jwe_encrypted=JWE utiliza sus propios campos estructurados.
help.format.disabled.decode_asn_1=La entrada ASN.1 tiene controles locales en esta operativa.
help.format.disabled.encode_asn_1=La entrada ASN.1 tiene controles locales en esta operativa.
help.format.disabled.sign_xml_xades=La operativa procesa XML directamente.
help.format.disabled.verify_xml_xades=La operativa procesa XML directamente.
help.format.disabled.sign_soap_wss=La operativa procesa SOAP directamente.
help.format.disabled.verify_soap_wss=La operativa procesa SOAP directamente.
help.format.disabled.random_number_generator=Esta operativa no tiene formato de entrada; el formato de salida sí aplica.

# B01 A001 labels and examples
help.backToOperation=Volver a la ayuda de la operación
help.backToOperation.help=Volver al resumen de la operación.
help.field.details=Detalle del campo
help.options=Opciones disponibles
help.aux.global_formats.purpose=Explica cómo la operativa activa decodifica la entrada y codifica la salida. Las listas mostradas proceden de su perfil de formatos actual.
help.operation.aux_global_formats.title=Selectores globales de formato
help.aux.global_formats.action.input.title=Formato de entrada
help.aux.global_formats.action.input.description=Decodifica la representación de entrada a bytes antes de la operación cuando el perfil activo admite selector de entrada.
help.aux.global_formats.action.input.example=En un perfil que admite Hexadecimal, 4142 representa los bytes A y B; Texto (UTF-8) representa esos caracteres como bytes UTF-8.
help.aux.global_formats.action.output.title=Formato de salida
help.aux.global_formats.action.output.description=Codifica los bytes resultantes en la representación seleccionada cuando el perfil activo admite selector de salida.
help.aux.global_formats.action.output.example=Un resultado de 32 bytes se muestra como 64 dígitos Hex o una cadena Base64; son representaciones de los mismos bytes.
help.aux.global_formats.action.contract.title=Contrato de datos de la operativa
help.aux.global_formats.action.contract.description=Muestra los tipos de datos de entrada y salida de la operativa activa junto con el contrato específico de su perfil.
help.aux.global_formats.action.contract.example=Las operaciones de archivo usan archivos directamente; las operaciones criptográficas con bytes decodifican una representación antes del proceso y codifican el resultado después.
help.aux.global_formats.field.input.label=Formato de entrada
help.aux.global_formats.field.input.description=Representación que se decodifica a bytes antes del proceso solo si aparece en la lista del perfil activo.
help.aux.global_formats.field.output.label=Formato de salida
help.aux.global_formats.field.output.description=Representación usada para mostrar o exportar bytes de resultado solo si aparece en la lista del perfil activo.
help.aux.global_formats.field.contract.label=Contrato de datos
help.aux.global_formats.field.contract.description=Tipos de datos de entrada/salida y significado del procesamiento del perfil activo.
help.aux.global_formats.field.remembered.label=Selección recordada
help.aux.global_formats.field.remembered.description=La selección de entrada se recuerda por operativa durante la sesión; la preferencia de salida se guarda por perfil.
help.aux.global_formats.field.disabled.label=Selector no disponible
help.aux.global_formats.field.disabled.description=Una lista vacía significa que la operativa no expone ese selector global; aplican sus controles propios o los tipos de datos de entrada/salida.

# B01 shared capability rules
help.rule.symmetric.mode.stream_disabled=Los algoritmos de flujo no usan el selector de modo por bloques; la interfaz lo deshabilita y conserva el valor anterior.
help.rule.symmetric.mode.block_selector=El modo por bloques seleccionado se pasa a la transformación criptográfica; el selector no filtra previamente la compatibilidad algoritmo/modo.
help.rule.symmetric.padding.stream_ignored=El padding por bloques no aplica a algoritmos de flujo; el selector se deshabilita y conserva la selección previa.
help.rule.symmetric.padding.selectable=El modo actual permite elegir padding en esta interfaz.
help.rule.symmetric.padding.mode_forces_none=Este modo no usa padding en esta interfaz; el selector se fija en NoPadding y se deshabilita.
help.rule.symmetric.iv.not_applicable=ECB no utiliza IV ni nonce.
help.rule.symmetric.iv.required_or_nonce=Este modo o algoritmo de flujo usa IV/nonce. El número de bytes indicado es la recomendación del generador; el validador del núcleo puede aceptar otros tamaños.
help.rule.symmetric.authentication.authenticated=La variante AEAD seleccionada produce o verifica un tag de autenticación de 16 bytes.
help.rule.symmetric.authentication.none=Esta variante no autentica el ciphertext; un descifrado correcto no prueba por sí solo la integridad.
help.rule.symmetric.aad.not_applicable=AAD no aplica a la selección actual.
help.rule.symmetric.aad.gcm_used=El handler GCM por bloques pasa AAD a la operación; intenta analizar Hex y, si falla, recurre a US-ASCII.
help.rule.symmetric.aad.visible_unused=El handler AEAD dedicado de flujo muestra este campo, pero actualmente no lo pasa a la operación.
help.rule.symmetric.key.length=Los bytes de clave se validan según el algoritmo seleccionado; el contexto de ayuda nunca contiene el contenido de la clave.
help.rule.symmetric.template.allowlist=Las plantillas solo guardan ajustes no secretos aprobados para el módulo, como algoritmo, modo, padding y formatos de bytes. La lista permitida rechaza claves, IV/nonce, tags, AAD, datos de entrada/salida y secretos al guardar o importar. Esta ayuda describe las acciones actuales; la cobertura más amplia de plantillas sigue dentro de A003/B13.
help.symmetric.key.present=Hay material de clave en el origen seleccionado. La ayuda solo guarda este estado sí/no.
help.symmetric.key.absent=No hay material de clave utilizable seleccionado. La ayuda no lee el valor de clave.
help.field.op_sym_ciphers.template_selection.label=Plantilla de cifrado
help.field.op_sym_ciphers.template_selection.description=Selecciona un preset integrado o una plantilla personal. Aplicar un preset puede cambiar algoritmo, modo, padding y formatos; los presets integrados también vacían los campos de clave y parámetros AEAD. Guardar incluye la configuración, pero no clave, IV/nonce, tag, AAD, payload ni resultado.
help.action.op_sym_ciphers.manage_templates.title=Gestionar plantillas
help.action.op_sym_ciphers.manage_templates.description=Abre el menú para guardar, exportar, importar o eliminar plantillas personales. Los presets integrados no se pueden eliminar.
help.action.op_sym_ciphers.manage_templates.example=Abre Manage Template para consultar las acciones disponibles de gestión de plantillas.
help.action.op_sym_ciphers.apply_template.title=Aplicar plantilla
help.action.op_sym_ciphers.apply_template.description=Aplica el preset integrado o la plantilla personal seleccionada. Revisa los parámetros y formatos resultantes antes de cifrar; los presets integrados también vacían los campos de clave y parámetros AEAD.
help.action.op_sym_ciphers.apply_template.example=Selecciona el preset AES-256-GCM y aplícalo; revisa modo y formatos de entrada/salida antes de usarlo.
help.action.op_sym_ciphers.save_template.title=Guardar plantilla personal
help.action.op_sym_ciphers.save_template.description=Guarda localmente la configuración permitida actual. No incluye material de clave, IV/nonce, tag, AAD, payload ni resultado.
help.action.op_sym_ciphers.save_template.example=Guarda una configuración de prueba con un nombre descriptivo y confirma que luego puedes volver a seleccionarla.
help.action.op_sym_ciphers.export_template.title=Exportar plantilla
help.action.op_sym_ciphers.export_template.description=Exporta la plantilla seleccionada mediante el flujo local existente. Revisa destino y contenido del archivo antes de compartirlo.
help.action.op_sym_ciphers.export_template.example=Exporta una plantilla de prueba a una ubicación temporal y confirma que contiene ajustes, pero no clave ni payload.
help.action.op_sym_ciphers.import_template.title=Importar plantilla
help.action.op_sym_ciphers.import_template.description=Importa un archivo de plantilla mediante la validación existente. Los ajustes importados están limitados a una lista permitida; revísalos antes de aplicarlos.
help.action.op_sym_ciphers.import_template.example=Importa una plantilla de prueba exportada antes y revisa su nombre y ajustes en el selector.
help.action.op_sym_ciphers.delete_template.title=Eliminar plantilla personal
help.action.op_sym_ciphers.delete_template.description=Elimina la plantilla personal seleccionada mediante la confirmación existente. Los presets integrados no se pueden eliminar.
help.action.op_sym_ciphers.delete_template.example=Selecciona una plantilla de prueba desechable y usa Delete Selected Personal Template.
help.action.op_sym_ciphers.reset_defaults.title=Restablecer valores del cifrado
help.action.op_sym_ciphers.reset_defaults.description=Restaura la configuración predeterminada existente del formulario y borra clave, IV, tag, AAD y entrada. Confirma los valores resultantes antes de continuar.
help.action.op_sym_ciphers.reset_defaults.example=Usa Reset Defaults y comprueba el algoritmo, modo, padding y formatos mostrados.
help.format.profile.manual_conversion.option.hexadecimal.input=La acción Convert estándar valida primero los dígitos hexadecimales: admite espacios, pero rechaza dos puntos y guiones. Las acciones especializadas que llaman a GenericController.parseEntrada usan el codec, que admite espacios, dos puntos y guiones. Ambas requieren un número par de dígitos.
help.format.profile.manual_conversion.option.binary.input=La acción Convert estándar valida solo dígitos 0/1 y espacios; rechaza dos puntos y guiones. Las acciones especializadas que usan GenericController.parseEntrada sí aceptan esos separadores. Los bits deben formar bytes completos de 8 bits.
help.format.profile.manual_conversion.option.base64.input=La acción Convert estándar elimina espacios para validar y exige alfabeto y padding Base64 estándar canónicos; rechaza marcadores PEM. Las acciones especializadas que usan GenericController.parseEntrada eliminan líneas BEGIN/END PEM reconocidas en mayúsculas y pueden aceptar Base64 sin padding.
help.format.profile.manual_conversion.option.base64url.input=La acción Convert estándar elimina los espacios, acepta Base64URL con padding final opcional y completa el padding que falte antes de decodificar; rechaza alfabeto o padding inválidos. Las acciones explícitas para codificar/decodificar Base64URL usan el codec compartido estricto: la decodificación rechaza espacios y padding, y la codificación no añade padding.
help.format.profile.symmetric_ciphers.option.text_utf_8.input=Cifrados simétricos elimina espacios exteriores de la entrada y convierte el texto Java restante a bytes UTF-8. Esta ruta no usa el codec UTF-8 estricto ni rechaza texto UTF-16 malformado.
help.format.profile.symmetric_ciphers.option.hexadecimal.input=Cifrados simétricos elimina espacios exteriores y valida dígitos hexadecimales ignorando espacios. La validación rechaza dos puntos y guiones aunque el conversor posterior pueda interpretarlos. Exige un número par de dígitos.
help.format.profile.symmetric_ciphers.option.base64.input=Cifrados simétricos elimina espacios exteriores, quita espacios para validar y exige alfabeto y padding Base64 estándar canónicos. Rechaza marcadores PEM antes de llegar al decodificador.
help.format.profile.symmetric_ciphers.option.binary.input=Cifrados simétricos elimina espacios exteriores y valida solo dígitos 0/1 y espacios. Rechaza dos puntos y guiones antes de convertir; los bits deben formar bytes completos.
help.format.profile.symmetric_ciphers.option.text_utf_8.output=Cifrados simétricos convierte los bytes de salida a texto Java UTF-8. Sustituye secuencias de bytes malformadas por U+FFFD en vez de rechazarlas.
help.format.profile.asymmetric_ciphers.option.text_utf_8.input=Cifrados asimétricos elimina espacios exteriores y convierte el texto Java a bytes UTF-8. Esta ruta no usa el codec UTF-8 estricto ni rechaza texto UTF-16 malformado.
help.format.profile.asymmetric_ciphers.option.hexadecimal.input=Cifrados asimétricos elimina espacios exteriores y valida dígitos hexadecimales ignorando espacios. Rechaza dos puntos y guiones antes de convertir; exige un número par de dígitos.
help.format.profile.asymmetric_ciphers.option.base64.input=Cifrados asimétricos elimina espacios exteriores, quita espacios para validar y exige alfabeto y padding Base64 estándar canónicos. El decodificador flexible posterior no admite PEM porque la validación lo rechaza antes.
help.format.profile.asymmetric_ciphers.option.binary.input=Cifrados asimétricos elimina espacios exteriores y valida solo dígitos 0/1 y espacios. Rechaza dos puntos y guiones antes de convertir; los bits deben formar bytes completos.
help.format.profile.asymmetric_ciphers.option.text_utf_8.output=Cifrados asimétricos convierte los bytes a texto Java UTF-8; las secuencias malformadas se sustituyen por U+FFFD en vez de rechazarse.
help.format.profile.digital_signatures.option.text_utf_8.input=Firmas digitales elimina espacios exteriores y convierte el texto Java a bytes UTF-8. Esta ruta no usa el codec UTF-8 estricto ni rechaza texto UTF-16 malformado.
help.format.profile.digital_signatures.option.hexadecimal.input=Firmas digitales valida dígitos hexadecimales ignorando espacios. Rechaza dos puntos y guiones antes de convertir; exige un número par de dígitos.
help.format.profile.digital_signatures.option.base64.input=Firmas digitales elimina espacios para validar y exige alfabeto y padding Base64 estándar canónicos. Rechaza marcadores PEM antes de decodificar.
help.format.profile.digital_signatures.option.text_utf_8.output=Firmas digitales convierte los bytes a texto Java UTF-8; las secuencias malformadas se sustituyen por U+FFFD en vez de rechazarse.
help.format.profile.message_authentication_codes.option.text_utf_8.input=MAC elimina espacios exteriores y convierte el texto Java a bytes UTF-8. Esta ruta no usa el codec UTF-8 estricto ni rechaza texto UTF-16 malformado.
help.format.profile.message_authentication_codes.option.hexadecimal.input=MAC valida dígitos hexadecimales ignorando espacios. Rechaza dos puntos y guiones antes de convertir; exige un número par de dígitos.
help.format.profile.message_authentication_codes.option.base64.input=MAC elimina espacios para validar y exige alfabeto y padding Base64 estándar canónicos. Rechaza marcadores PEM antes de decodificar.
help.format.profile.message_authentication_codes.option.text_utf_8.output=MAC convierte los bytes a texto Java UTF-8; las secuencias malformadas se sustituyen por U+FFFD en vez de rechazarse.
help.format.profile.random_number_generator.option.decimal.output=El generador muestra cada byte sin signo (0–255) con exactamente tres dígitos decimales separados por espacios, por ejemplo: 000 005 255.
help.format.profile.manual_conversion.option.text_utf_8.input=La acción Convert estándar pasa la cadena introducida a la codificación UTF-8 de Java sin recortarla; sustituye texto UTF-16 malformado en vez de rechazarlo. Las acciones especializadas que llaman a GenericController.parseEntrada usan el codec UTF-8 estricto.
help.format.profile.manual_conversion.option.text_utf_8.output=La acción Convert estándar decodifica los bytes de salida como texto Java UTF-8 y sustituye bytes malformados por U+FFFD. Las acciones especializadas que usan GenericController.formatBytes aplican decodificación UTF-8 estricta.
help.format.profile.manual_conversion.option.decimal.input=La acción Convert estándar valida solo dígitos y espacios, por lo que rechaza comas aunque el conversor decimal posterior las admita. Las rutas que usan DecimalCodec aceptan comas o espacios. Los valores son bytes sin signo de 0 a 255.

help.operation.op_pay_clear_pin.title=Bloques PIN en claro
help.operation.op_pay_clear_pin.purpose=Construye o interpreta campos/bloques PIN en claro. El bloque claro no está cifrado; consulta el estado de protección por separado.
help.operation.op_pay_enc_pin.title=Bloques PIN protegidos
help.operation.op_pay_enc_pin.purpose=Construye, protege o interpreta bloques PIN. ISO-4 usa AES; los demás formatos pasan por DES/TDES ECB cuando se aporta una clave.
help.action.op_pay_clear_pin.encode.title=Codificar bloque PIN
help.action.op_pay_clear_pin.encode.description=Construye un campo/bloque en claro; no aplica cifrado.
help.action.op_pay_clear_pin.encode.example=Ejemplo: PIN 1234 en formato ISO-0 y PAN 4761739001010010 produce un campo de 8 bytes; usa el mismo formato y PAN para recuperar 1234.
help.action.op_pay_clear_pin.decode.title=Decodificar bloque PIN
help.action.op_pay_clear_pin.decode.description=Interpreta el campo/bloque en claro con formato independiente y recupera el PIN.
help.action.op_pay_clear_pin.decode.example=Ejemplo: PIN 1234 en formato ISO-0 y PAN 4761739001010010 produce un campo de 8 bytes; usa el mismo formato y PAN para recuperar 1234.
help.action.op_pay_clear_pin.select_format.title=Elegir formato y relleno
help.action.op_pay_clear_pin.select_format.description=El formato determina estructura, uso del PAN y opciones de relleno.
help.action.op_pay_clear_pin.select_format.example=Ejemplo: PIN 1234 en formato ISO-0 y PAN 4761739001010010 produce un campo de 8 bytes; usa el mismo formato y PAN para recuperar 1234.
help.action.op_pay_enc_pin.protect.title=Proteger bloque PIN
help.action.op_pay_enc_pin.protect.description=Construye el campo/bloque del formato y solo lo cifra si el handler acepta la clave proporcionada: AES para ISO-4 o DES/TDES ECB para los demás formatos. Sin clave, la salida queda en claro; que el campo contenga texto no garantiza una clave válida.
help.action.op_pay_enc_pin.protect.example=Ejemplo: un PIN sintético y formato ISO-0 con una clave TDES válida producen un bloque de 8 bytes; sin clave, el resultado es el bloque claro.
help.action.op_pay_enc_pin.decode.title=Descodificar bloque PIN
help.action.op_pay_enc_pin.decode.description=Usa la clave de decodificación, separada de la clave de codificación, para descifrar según la ruta AES ISO-4 o DES/TDES ECB y después recuperar el PIN. Sin clave trata la entrada como campo/bloque claro y la decodifica.
help.action.op_pay_enc_pin.decode.example=Ejemplo: un PIN sintético y formato ISO-0 con una clave TDES válida producen un bloque de 8 bytes; sin clave, el resultado es el bloque claro.
help.action.op_pay_enc_pin.select_format.title=Elegir formato
help.action.op_pay_enc_pin.select_format.description=El selector compartido elige el formato PIN y la ruta DES/TDES o AES.
help.action.op_pay_enc_pin.select_format.example=Ejemplo: un PIN sintético y formato ISO-0 con una clave TDES válida producen un bloque de 8 bytes; sin clave, el resultado es el bloque claro.
help.field.op_pay_clear_pin.pin.label=PIN
help.field.op_pay_clear_pin.pin.description=Introduce entre 4 y 12 dígitos decimales. La UI actual aplica este rango a todos los formatos claros; algunos codificadores exigen menos. Es sensible y no se copia al contexto de ayuda.
help.field.op_pay_clear_pin.pan_encode.label=PAN de codificación
help.field.op_pay_clear_pin.pan_encode.description=Número de cuenta requerido cuando el formato usa PAN. ISO-4 vincula el campo PAN dentro de la transformación AES.
help.field.op_pay_clear_pin.format_encode.label=Formato de codificación
help.field.op_pay_clear_pin.format_encode.description=Elige la construcción del bloque claro para codificar. Este selector es independiente del selector de decodificación.
help.field.op_pay_clear_pin.format_decode.label=Formato de decodificación
help.field.op_pay_clear_pin.format_decode.description=Elige cómo interpretar el bloque claro recibido. Este selector es independiente del selector de codificación.
help.field.op_pay_clear_pin.padding.label=Relleno
help.field.op_pay_clear_pin.padding.description=Elige el nibble solo cuando el formato ofrece opciones. Los valores fijos son hexadecimales; RANDOM_HEX elige 0–F y RANDOM_DECIMAL elige 0–9.
help.field.op_pay_clear_pin.clear_block.label=Bloque PIN en claro
help.field.op_pay_clear_pin.clear_block.description=Representación Hex de un campo/bloque PIN claro. Salvo ISO-4, se esperan 16 caracteres Hex (8 bytes); los campos ISO-4 claros tienen 32 caracteres Hex (16 bytes). No está cifrado.
help.field.op_pay_clear_pin.pan_decode.label=PAN para decodificar
help.field.op_pay_clear_pin.pan_decode.description=PAN de 13–19 dígitos cuando se necesite. Los formatos vinculados al PAN lo requieren; la UI de ISO-4 también exige actualmente PAN no vacío, aunque el decodificador del campo claro lee el propio campo PIN.
help.field.op_pay_clear_pin.result.label=Resultado
help.field.op_pay_clear_pin.result.description=Muestra el campo/bloque claro codificado o el PIN recuperado. Puede contener PIN/PAN sensibles; la ayuda no lee resultados ni entradas.
help.field.op_pay_clear_pin.encode_action.label=Acción de codificar
help.field.op_pay_clear_pin.encode_action.description=Construye un campo/bloque PIN claro a partir del PIN, PAN requerido/opcional y formato elegido.
help.field.op_pay_clear_pin.decode_action.label=Acción de decodificar
help.field.op_pay_clear_pin.decode_action.description=Interpreta el campo/bloque claro con el formato de decodificación y el PAN necesario.
help.field.op_pay_enc_pin.format.label=Formato
help.field.op_pay_enc_pin.format.description=Selector compartido para proteger y decodificar. Elige construcción PIN y ruta AES para ISO-4 o DES/TDES ECB para los demás formatos.
help.field.op_pay_enc_pin.pin.label=PIN
help.field.op_pay_enc_pin.pin.description=Introduce entre 4 y 12 dígitos decimales. La UI actual aplica este rango a todos los formatos claros; algunos codificadores exigen menos. Es sensible y no se copia al contexto de ayuda.
help.field.op_pay_enc_pin.pan_encode.label=PAN para codificar
help.field.op_pay_enc_pin.pan_encode.description=Número de cuenta requerido cuando el formato usa PAN. ISO-4 vincula el campo PAN dentro de la transformación AES.
help.field.op_pay_enc_pin.encrypt_key.label=Clave de protección
help.field.op_pay_enc_pin.encrypt_key.description=Clave codificada en Hex. Fuera de ISO-4: 8 bytes (DES), 16 o 24 bytes (TDES), ECB/NoPadding. ISO-4: AES de 16, 24 o 32 bytes. La clave no entra al contexto de ayuda.
help.field.op_pay_enc_pin.encrypted_block.label=Bloque que se va a decodificar
help.field.op_pay_enc_pin.encrypted_block.description=Bloque Hex para decodificar. Salvo ISO-4 se esperan 8 bytes (16 caracteres Hex); la salida ISO-4 protegida tiene 16 bytes (32 caracteres Hex).
help.field.op_pay_enc_pin.pan_decode.label=PAN para decodificar
help.field.op_pay_enc_pin.pan_decode.description=PAN decimal requerido por el formato. Para ISO-4 debe coincidir con el usado al proteger, ya que se vincula dentro de la transformación AES.
help.field.op_pay_enc_pin.decrypt_key.label=Clave de decodificación
help.field.op_pay_enc_pin.decrypt_key.description=Entrada separada de la clave de codificación. Usa la clave DES/TDES correspondiente (8, 16 o 24 bytes) o AES ISO-4 (16, 24 o 32 bytes). La ayuda solo conoce si está vacío.
help.field.op_pay_enc_pin.result.label=Resultado
help.field.op_pay_enc_pin.result.description=Puede mostrar un bloque protegido tras cifrado exitoso; si se codifica sin clave, muestra el campo/bloque claro y marca «No key supplied»; al decodificar, muestra el PIN recuperado. La clave de decodificación es independiente y su mera presencia no demuestra que sea válida. La ayuda no lee entradas ni resultados.
help.field.op_pay_enc_pin.encode_action.label=Acción de proteger
help.field.op_pay_enc_pin.encode_action.description=Construye el campo/bloque del formato elegido y lo cifra solo si el handler acepta la clave de protección: AES para ISO-4 o DES/TDES ECB para otros formatos. Sin clave deja la salida en claro; la presencia de texto no garantiza que la clave sea válida.
help.field.op_pay_enc_pin.decode_action.label=Acción de decodificar
help.field.op_pay_enc_pin.decode_action.description=Si se proporciona, usa la clave de decodificación independiente para descifrar el bloque y después recuperar el PIN; ISO-4 usa AES con el PAN y otros formatos usan DES/TDES ECB. Sin clave interpreta la entrada como campo/bloque claro y la decodifica.
help.field.op_pay_enc_pin.protected_state.label=Estado de protección
help.field.op_pay_enc_pin.protected_state.description=Indica presencia de clave, no que sea correcta. Sin clave, el resultado es claro y no debe llamarse cifrado.
help.pin.currentFormat=Formato actual
help.pin.format.heading=Comportamiento de formato
help.pin.encryption.aes=Protección: AES para ISO-4; el bloque protegido ocupa 16 bytes (32 caracteres Hex). La clave AES admite 16, 24 o 32 bytes.
help.pin.encryption.tdes=Protección: ECB sin relleno DES con clave de 8 bytes o TDES con clave de 16/24 bytes. Entrada/salida del cifrado: bloque de 8 bytes.
help.pin.key.present=Hay texto de clave en este campo. La ayuda no lo lee ni valida; la operación lo validará al ejecutarse.
help.pin.key.absent=No se ha suministrado clave. La ruta actual deja el bloque en claro; no lo etiquetes como cifrado/protegido.
