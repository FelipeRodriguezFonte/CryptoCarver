help.field.op_gen_clipboard.pin.label=Estado de fijado
help.field.op_gen_clipboard.search.description=Search que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_clipboard.search.label=Buscar
help.field.op_gen_envelope_inspector.envelope.description=Envelope que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_envelope_inspector.envelope.label=Envelope
help.field.op_gen_envelope_inspector.private_key.description=Material privado del destinatario, usado solo al desenvolver de forma explícita; nunca se copia a la ayuda ni a los registros.
help.field.op_gen_envelope_inspector.private_key.label=Clave privada del destinatario
help.field.op_gen_envelope_inspector.profile.description=Unwrap profile que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_envelope_inspector.profile.label=Perfil para desenvolver
help.field.op_gen_envelope_inspector.recovered_key.description=Salida sensible que solo se produce tras desenvolver correctamente; la ayuda nunca la inspecciona.
help.field.op_gen_envelope_inspector.recovered_key.label=Clave recuperada
help.field.op_gen_envelope_inspector.report.description=Inspection report que usa o muestra esta acción. La ayuda contextual nunca lee su valor.
help.field.op_gen_envelope_inspector.report.label=Informe de inspección
help.field.op_gen_file.comparison_path.description=Segundo archivo para comparación binaria. Los formatos seleccionados no cambian la comparación.
help.field.op_gen_file.comparison_path.label=Archivo de comparación
help.field.op_gen_file.destination_path.description=Ruta local para los bytes convertidos. Elija un destino seguro antes de convertir.
help.field.op_gen_file.destination_path.label=Archivo de destino
help.field.op_gen_file.encoding.description=UTF-8, ASCII o ISO-8859-1 se aplican al formato Text; bytes inválidos pueden producir error.
help.field.op_gen_file.encoding.label=Codificación de texto
help.field.op_gen_file.input_format.description=Binary lee bytes directos; Text usa la codificación; Hex elimina espacios; Base64 usa el decoder básico.
help.field.op_gen_file.input_format.label=Formato de entrada
help.field.op_gen_file.output_format.description=Binary, Text, Hex o Base64 determina cómo se escriben los bytes convertidos.
help.field.op_gen_file.output_format.label=Formato de salida
help.field.op_gen_file.result.description=Estado de conversión, comparación, SHA-256 o vista previa, según la acción; ayuda no lee su contenido.
help.field.op_gen_file.result.label=Resultado
help.field.op_gen_file.source_path.description=Ruta local del archivo de entrada. La ayuda no lee ni publica rutas o contenido.
help.field.op_gen_file.source_path.label=Archivo de origen
help.field.op_gen_hash.algorithm.description=Determina la función y el tamaño de salida. CRC32 es checksum; MD4, MD5 y SHA-1 son heredados.
help.field.op_gen_hash.algorithm.label=Algoritmo
help.field.op_gen_hash.input.description=Texto o representación que el parser del formato convierte en bytes. La ayuda nunca lee su valor.
help.field.op_gen_hash.input.label=Entrada
help.field.op_gen_hash.output.description=Huella o error de cálculo. Una huella por sí sola no demuestra autenticidad.
help.field.op_gen_hash.output.label=Resultado
help.field.op_gen_hash.template.description=Ajustes reutilizables no secretos. Aplicar una plantilla no ejecuta el hash.
help.field.op_gen_hash.template.label=Plantilla
help.field.op_gen_manual.code_page.description=Define la tabla EBCDIC usada; caracteres no representables pueden causar error.
help.field.op_gen_manual.code_page.label=Página de códigos
help.field.op_gen_manual.compression.description=Elige gzip, zlib o deflate. Descomprimir debe usar el envoltorio correspondiente; no es cifrado.
help.field.op_gen_manual.compression.label=Envoltorio
help.field.op_gen_manual.ebcdic_direction.description=Selecciona EBCDIC→UTF-8 o UTF-8→EBCDIC; la página elegida debe representar los caracteres.
help.field.op_gen_manual.ebcdic_direction.label=Dirección EBCDIC
help.field.op_gen_manual.input.description=Texto o datos que interpreta la acción activa; algunas acciones especializadas esperan su propio alfabeto.
help.field.op_gen_manual.input.label=Entrada
help.field.op_gen_manual.input_format.description=Selector local usado por Convertir, Endian y compresión; acciones Base, URL, BCD, COMP-3 y shift tienen parser propio.
help.field.op_gen_manual.input_format.label=Formato de entrada
