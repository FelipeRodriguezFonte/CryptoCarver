# module-help:op_pay_thales_key_block begin
help.operation.op_pay_thales_key_block.title=Thales Key Block
help.operation.op_pay_thales_key_block.purpose=Lee los key blocks de Thales, que se parecen a los bloques ANSI X9.143 / TR-31 pero difieren lo bastante como para que un lector TR-31 genérico los rechace. Con la Key Block LMK además recupera la clave.
help.action.op_pay_thales_key_block.inspect.title=Inspeccionar key block
help.action.op_pay_thales_key_block.inspect.description=Decodifica la cabecera y la estructura del bloque. No hace falta LMK y no se verifica nada.
help.action.op_pay_thales_key_block.unwrap.title=Desenvolver key block
help.action.op_pay_thales_key_block.unwrap.description=Autentica el bloque con la Key Block LMK y recupera la clave.
help.action.op_pay_thales_key_block.example.title=Cargar ejemplo del manual
help.action.op_pay_thales_key_block.example.description=Rellena el formulario con un bloque de prueba publicado.
help.field.op_pay_thales_key_block.block.label=Key block
help.field.op_pay_thales_key_block.block.description=Bloque como texto, con o sin su S inicial.
help.field.op_pay_thales_key_block.lmk.label=Key Block LMK
help.field.op_pay_thales_key_block.lmk.description=LMK TDES de longitud triple opcional, 48 caracteres hexadecimales, necesaria solo para desenvolver. Usa solo LMK de prueba.
help.field.op_pay_thales_key_block.result.label=Resultado
help.field.op_pay_thales_key_block.result.description=Cabecera decodificada, y la clave recuperada al desenvolver.
