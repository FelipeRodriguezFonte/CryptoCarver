help.operation.op_keys_rsa.purpose=Generates an RSA key pair for encryption, signatures and certificates, and shows its fingerprint and sizes.
help.action.op_keys_rsa.generate.title=Generate key pair
help.action.op_keys_rsa.generate.description=Creates a new key pair and fills the summary and both PEM tabs.
