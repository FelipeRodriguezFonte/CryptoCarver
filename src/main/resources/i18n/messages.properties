help.action.op_openpgp.paste_public_key.title=Paste public key
help.action.op_openpgp.paste_public_key.description=Pastes clipboard text into the public-key field after the explicit action.
help.action.op_openpgp.paste_public_key.example=Example: copy a public-key armor block, paste it, and confirm the field changes.
help.action.op_openpgp.load_public_key.title=Load public key
help.action.op_openpgp.load_public_key.description=Opens a file chooser and loads selected public OpenPGP material into the public-key field.
help.action.op_openpgp.load_public_key.example=Example: load a public-key file for encryption or signature verification.
help.action.op_openpgp.save_public_key.title=Save public key
help.action.op_openpgp.save_public_key.description=Writes the public-key field to a user-selected file.
help.action.op_openpgp.save_public_key.example=Example: save a generated public key for a separate verification workflow.
help.action.op_openpgp.inspect_public_key.title=Inspect public key
help.action.op_openpgp.inspect_public_key.description=Parses public material and reports public metadata; it does not establish ownership or trust.
help.action.op_openpgp.inspect_public_key.example=Example: inspect a key fingerprint, then verify it through a trusted channel.
help.action.op_openpgp.use_public_key_shelf.title=Use public key from Shelf
help.action.op_openpgp.use_public_key_shelf.description=Copies a selected public-key item from local Shelf into the public-key field.
help.action.op_openpgp.use_public_key_shelf.example=Example: choose a test recipient key from Shelf before encrypting.
help.action.op_openpgp.paste_secret_key.title=Paste secret key
help.action.op_openpgp.paste_secret_key.description=Pastes clipboard text into the secret-key field. Keep this secret material private.
help.action.op_openpgp.paste_secret_key.example=Example: paste a disposable test key, then use it only for an explicit signing action.
help.action.op_openpgp.load_secret_key.title=Load secret key
help.action.op_openpgp.load_secret_key.description=Opens a file chooser and loads selected secret OpenPGP material into the secret-key field.
help.action.op_openpgp.load_secret_key.example=Example: load the matching secret key before an explicit decryption action.
help.action.op_openpgp.save_secret_key.title=Save secret key
help.action.op_openpgp.save_secret_key.description=Writes the secret-key field to a selected file; protect that file as private key material.
help.action.op_openpgp.save_secret_key.example=Example: save a laboratory secret key to a protected test location with restricted access.
help.action.op_openpgp.inspect_secret_key.title=Inspect secret key
help.action.op_openpgp.inspect_secret_key.description=Parses the secret key and reports metadata. Contextual help never exposes private components.
help.action.op_openpgp.inspect_secret_key.example=Example: inspect a test key fingerprint without copying secret material into help.
help.action.op_openpgp.use_secret_key_shelf.title=Use secret key from Shelf
help.action.op_openpgp.use_secret_key_shelf.description=Copies a selected secret-key item from local Shelf into the field for explicit signing or decryption.
help.action.op_openpgp.use_secret_key_shelf.example=Example: choose the matching secret-key Shelf item before signing a test message.

help.rsa.publicFormats=Public key parser priority: SubjectPublicKeyInfo PEM, Hex-encoded X.509 DER, then Base64-encoded X.509 DER. Certificate PEM is not accepted by this panel.
help.rsa.privateFormats=Private key parser priority: PKCS#8 PEM, Hex-encoded PKCS#8 DER, then Base64-encoded PKCS#8 DER. PKCS#1 RSA private-key PEM is not handled by this panel.

