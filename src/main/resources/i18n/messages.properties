icsf.keywrap.mode.CBC=parts chained in TDES CBC with a zero IV (what some non-CCA systems do)
icsf.keywrap.mode.ECB=each 8-byte part on its own, TDES ECB (WRAP-ECB, p. 1713)
icsf.keywrap.note.VERSION_SAYS_DOUBLE=Byte 4 (version) is X''01'' (double or triple) but the key is single-length according to {1}.
icsf.keywrap.note.VERSION_SAYS_SINGLE=Byte 4 (version) is X''00'', which Table 616 assigns to a single-length key, but the key is {0} bytes according to {1}. This is normal in tokens from real hosts: the version is not a reliable statement of length, and here the Control Vector wins.
icsf.keywrap.note.clearKey.text=Flag byte 6 says the key is not enciphered, so what sits at offsets 16, 24 and 48 is the key material itself. No KEK is needed to read it, and none protected it.
icsf.keywrap.note.clearKey.title=The key travels IN THE CLEAR inside the token
icsf.keywrap.note.collapses.text=TDES EDE with two equal components reduces to one DES operation, so the effective strength is 56 bits however long the key looks. Under ECB this is visible in the ciphertext itself.
icsf.keywrap.note.collapses.title=The key {0} collapses to single DES
icsf.keywrap.note.cvHalvesEqual.text=Normal on triple-length keys, where p. 20 says the two control vectors are the same. On a double-length key it is worth checking, because the two halves usually differ in the key-form bits.
icsf.keywrap.note.cvHalvesEqual.title=Both CV halves are the same
icsf.keywrap.note.cvSwapped.text=This is not a CCA scheme: it reproduces the common implementation slip of applying the right-hand CV to the left part and vice versa. Useful to confirm a suspicion, not to hand a key over.
icsf.keywrap.note.cvSwapped.title=CV halves swapped
icsf.keywrap.note.enhancedNothing.text=There is no scheme to try: the enhanced methods cannot be reproduced outside the coprocessor.
icsf.keywrap.note.enhancedNothing.title=Enhanced wrapping: {0}
icsf.keywrap.note.enhancedWhatNow.text=With enhanced wrapping only a CCA coprocessor can open the key. To hand it outside it has to be re-wrapped with WRAP-ECB (by regenerating or translating the token with the WRAP-ECB keyword), or moved to X9.143/TR-31, which is what a non-CCA system does understand.
icsf.keywrap.note.enhancedWhatNow.title=What can be done
icsf.keywrap.note.internalToken.text=An internal token is enciphered under the host''s master key, not under a transport key. Reproducing that here needs the master key in the clear, which is not something a coprocessor will give you: what this pane is for is the external token that Key Export produces.
icsf.keywrap.note.internalToken.title=This is an internal token
icsf.keywrap.note.kcvVsVp.text=The industry KCV is the first 3 bytes of enciphering 8 zero bytes with the key ({0}); CSNBKYT calls it ENC-ZERO and returns 4 ({1}). CSNBKYT''s default verification pattern is a DIFFERENT number ({2} with RN={3}, p. 1720). If each side is looking at a different number the comparison will never agree.
icsf.keywrap.note.kcvVsVp.title=How to reconcile the KCV with the other team
icsf.keywrap.note.noKek.text=The token is enciphered, so this reads only what the token says about itself. To recover the key, supply the KEK in the clear on the Import tab, or use Resolve if you are not sure which scheme was used.
icsf.keywrap.note.noKek.title=No key without the KEK
icsf.keywrap.note.noParity.text=Bytes coming out with even parity usually mean the scheme is wrong: the wrong KEK, a CV that does not apply, or a cryptogram wrapped without a variant (NOCV) being opened with one, or the reverse. Use Resolve to try every combination at once.
icsf.keywrap.note.noParity.title=The recovered key has no DES parity
icsf.keywrap.note.noScheme.text=Neither with a variant nor without, neither in ECB nor CBC. So it is not a CV problem: check that the KEK in the clear is the same one the host has (compare the KEK''s KCV), that the cryptogram was copied whole, and that the token does not carry enhanced wrapping.
icsf.keywrap.note.noScheme.title=No scheme reproduces the reference
icsf.keywrap.note.nocv.text=The transport key is used as-is instead of XORed with the Control Vector. That is what the NOCV bit on an EXPORTER/IMPORTER does (p. 207), and it is how keys are usually handed to a system that has no notion of control vectors. It also means the CV no longer binds the key to its usage.
icsf.keywrap.note.nocv.title=Wrapped with no variant (NOCV)
icsf.keywrap.note.onlyOne.text=It gives the key {0} (KCV {1}). All {2} bytes sharing a parity does not happen by chance, so that is the scheme. To settle it completely, run it again with that key as the reference.
icsf.keywrap.note.onlyOne.title=Only one scheme gives a key with coherent parity: {0}
icsf.keywrap.note.parityEven.text=Every byte sharing a parity does not happen by chance, so this is a real key that nobody parity-adjusted rather than a bad decipherment. Some non-CCA tools reject it, or silently ''fix'' it. Adjusted to odd parity it would be {0}.
icsf.keywrap.note.parityEven.title=DES parity {0}: even in all {1} bytes (key not adjusted)
icsf.keywrap.note.parityMixed.text=Mixed parity is the signature of a wrong scheme far more often than of an odd key: a wrong KEK, the wrong CV, or material wrapped without a variant and opened with one. Adjusted to odd parity it would be {0}.
icsf.keywrap.note.parityMixed.title=DES parity {0}: wrong in {1} of {2} bytes
icsf.keywrap.note.parityOnly.text=The parity of the 8/16/24 bytes is a good sign but not proof. Both odd parity (what DES expects) and even parity in EVERY byte count: the latter is a hand-entered key nobody adjusted, not a bad decipherment. Give the expected key or its KCV and the answer becomes conclusive.
icsf.keywrap.note.parityOnly.title=With no reference only parity can filter
icsf.keywrap.note.schemeFound.text=With that scheme the cryptogram gives the key {0} (KCV {1}). That is exactly what to tell the other team to apply.
icsf.keywrap.note.schemeFound.title=It fits: {0}
icsf.keywrap.note.singleDesKek.text=A single-length KEK protects with 56 bits, so whatever it wraps is worth 56 bits in transit no matter how long the wrapped key is.
icsf.keywrap.note.singleDesKek.title=The KEK is single-length DES
icsf.keywrap.note.tokenCoherence.title=Token coherence
icsf.keywrap.note.tokenNocv.text=Flag byte 6 bit 2 is set, so this token expects the transport key itself rather than its Control Vector variant. Only transport keys carry that bit.
icsf.keywrap.note.tokenNocv.title=The token is marked NOCV
icsf.keywrap.note.tvvAbsent.text=Bytes 60-63 are zero, so there is nothing to check the token''s integrity against.
icsf.keywrap.note.tvvAbsent.title=The token carries no TVV
icsf.keywrap.note.tvvInvalid.text=The token verification value does not match the bytes it covers. Either the token was altered or truncated in transit, or a field was edited without recomputing it. Anything read from it should be treated as suspect.
icsf.keywrap.note.tvvInvalid.title=The TVV does not verify
icsf.keywrap.note.versionHost.text=The token carries the version a real host writes for a double-length key, not the one in Table 616. This is what to use to compare byte for byte against what the host sent you. Note that a tool deducing the length from that byte will read the key as single-length and split the cryptogram down the middle.
icsf.keywrap.note.versionHost.title=Byte 4 at X''00'', like real hosts
icsf.keywrap.note.versionTable616.text=X''01'' is used here because that is what Table 616 says for a double or triple-length key, but real hosts leave that byte at X''00''. Comparing this token against the host''s will show TWO differing bytes: byte 4, and the first byte of the TVV, which sums it. The cryptogram is identical, which is what matters. Tick the version byte option to make them match.
icsf.keywrap.note.versionTable616.title=The host will write X''00'' in byte 4, not X''01''
icsf.keywrap.note.weakKek.text=The protection in transit is worth the KEK, not the key. Wrapping a triple-length key under a double-length KEK does not make the transfer stronger than the KEK.
icsf.keywrap.note.weakKek.title=The KEK ({0} bytes) is shorter than the key it wraps ({1} bytes)
