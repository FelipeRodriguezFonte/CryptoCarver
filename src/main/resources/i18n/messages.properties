icsf.warn.unexpectedLength=A {0} fixed-length token is expected to be 64 bytes; this one is {1}.
icsf.warn.declaredLength=Declared length ({0}) differs from the real one ({1}).
icsf.warn.aesCvFlagWithoutZeroCv=The flag says a Control Vector is applied, but the CV is not all zeros ({0}). In an AES fixed-length token every key is DATA and its CV must be all zeros (p. 1560).
icsf.warn.aesClearLength=Invalid clear key length at offset 56: {0} bits. The manual allows only 0, 128, 192 or 256 (Table 614).
icsf.warn.aesEncryptedLength=Invalid encrypted key length at offset 58: {0} bytes. The manual allows only 0 or 32 (Table 614).
icsf.warn.byte59Version=Table 615 inconsistency: byte 59 = X''{0}'' requires token version X''{1}'' (single = version 0; double/triple = version 1) and the token declares version X''{2}''.
icsf.warn.cvStructure=The Control Vector does not satisfy the manual's structural rules (even parity of zero bits per byte, bit 30 = 0, bit 38 = 1; p. 1678). It may not be a valid CV, in which case reading its bits is not trustworthy.
icsf.warn.cvHalves=The two Control Vector halves disagree on bit 17 (left={0}, right={1}): incoherent token.
icsf.warn.adlMismatch=The declared associated-data length (adl = {0}, offset 32) does not match the sum of its fields ({1} = 16 + kuf*2 + kmf*2 + kl + iead + uad). The token may be truncated or altered.
icsf.warn.adOverflow=The declared associated data (30 + adl = {0}) runs past the token ({1} bytes).
icsf.warn.payloadOverflow=The declared payload ({0} bits from offset {1}) does not fit in the token ({2} bytes).
icsf.warn.managementTruncated=Truncated token: {0} management fields are declared ({1} bytes from offset {2}) but only {3} are present.
icsf.warn.desusecvReserved=DESUSECV token with non-zero management fields ({0}). Table 630 defines them as reserved and zero.
icsf.warn.pkaSectionLength=Section X''{0}'' at offset {1} declares length {2}: it does not fit in the token ({3} bytes). The walk stops there.
icsf.warn.pkaSectionUndocumented=Section X''{0}'' is not documented in Table 637 (offset {1}). Its header is shown but its content is not interpreted.
icsf.warn.pkaTrailing={0} bytes remain after the last section (offset {1}). A PKA token is the exact concatenation of its sections.
icsf.warn.pkaMixedAlgorithms=The token mixes sections of different algorithms ({0}); a PKA token belongs to a single algorithm.
icsf.warn.pkaModulusMismatch=The sections declare different modulus lengths ({0} bits). In a coherent RSA token the public and private sections describe the same modulus.
icsf.warn.pkaInternalNoKvp=Internal PKA token with an encrypted private key but an all-zero verification pattern. An internal token with an encrypted key should carry the MKVP of the master key protecting the OPK.
icsf.warn.pkaKeySourceExternal=Key source flag set in an external token, where Tables 642/645 reserve it.
icsf.warn.pkaOrderRsa=Section order: the public section X'04' appears BEFORE the private one. The manual (p. 1605) requires the prescribed order: header, optional private, public, then the optional sections.
icsf.warn.pkaOrderEcc=Section order: the ECC public section X'21' appears BEFORE the private one X'20'.
icsf.prov.label.raw=raw copy of the {0} data set (read straight from the file)
icsf.prov.label.krr={0} Key Record Read ({1})
icsf.prov.label.infer=inferred from the token state (not declared)
icsf.prov.raw.intro=Raw copy of the CKDS data set: the token arrives AS STORED, without ICSF having materialized it. p. 1560 says "a fixed-length symmetric key token that is STORED IN a non-KDSR CKDS does not have an MKVP or TVV. Before such a key token is used, the MKVP is copied from the CKDS header record and the TVV is calculated and placed in the token".
icsf.prov.raw.externalImpossible=INCONSISTENT PROVENANCE: the CKDS only stores INTERNAL tokens. This one is EXTERNAL (X'02'), so it cannot have come out of a CKDS record.
icsf.prov.raw.expectedState=MKVP zero AND TVV zero: exactly the expected state of a record stored in a non-KDSR CKDS. Nothing is missing and nothing is corrupt; ICSF will set the MKVP and calculate the TVV when it materializes the key.
icsf.prov.raw.kdsr=MKVP and TVV present and correct: consistent with a CKDS in KDSR format, where the stored record already carries both.
icsf.prov.raw.mkvpOnlyMissing=MKVP zero but TVV present: in a non-KDSR CKDS both would be missing, and in a KDSR one both would be there. Check whether the key is in the clear or whether the record has been tampered with.
icsf.prov.raw.tvvOnlyMissing=TVV zero but MKVP present: in a non-KDSR CKDS both would be missing, and in a KDSR one both would be there. Inconsistent state for a stored record.
icsf.prov.tvvWrong=TVV PRESENT but incorrect: this is not the non-KDSR CKDS case, where the TVV is ABSENT (zero). A TVV holding a value that does not add up points to a corrupt or altered record.
icsf.prov.krr.intro=CKDS Key Record Read/Read2 (CSNBKRR/CSNBKRR2), pp. 1257-1262: copies the INTERNAL token from the in-storage CKDS to the application, and other cryptographic services "can then use the copied key token directly", so a complete and usable token is expected. It needs no cryptographic hardware (Read2 requires it only for options such as PROTKEY).
icsf.prov.krr.externalImpossible=INCONSISTENT PROVENANCE: CSNBKRR returns "the 64-byte INTERNAL key token retrieved from the in-storage CKDS" (p. 1258). This token is EXTERNAL (X'02'); it cannot have come from a KRR.
icsf.prov.krr.unmaterialized=MKVP and TVV zero: that is the state of the record AS STORED in a non-KDSR CKDS, not that of a token handed over by KRR to be used. If you pulled the token out of the data set directly, declare the provenance as a raw copy of the CKDS.
icsf.prov.krr.tvvAbsent=TVV zero on a token delivered by KRR: it should arrive already calculated.
icsf.prov.krr.mkvpAbsent=MKVP zero on an internal token delivered by KRR: unless the key is in the clear, it should arrive with the MKVP already set.
icsf.prov.krr.tvvWrong=Invalid TVV on a token delivered by KRR: indicates a corrupt or altered token, since it should arrive with a correct TVV.
icsf.prov.infer.intro=Infer mode: provenance is NOT reliably derivable from the bytes (the same token copied from the CKDS may later be handed over by a reader layer). What can be bounded is the token's STATE:
icsf.prov.infer.rawNonKdsr=\  compatible with: raw copy of a non-KDSR CKDS (MKVP and TVV not set yet)
icsf.prov.infer.notKrr=\  ruled out: CSNBKRR/KRR2, which hands the token over ready to use
icsf.prov.infer.krrOrService=\  compatible with: CSNBKRR/KRR2 or another service that delivers the token materialized
icsf.prov.infer.rawKdsr=\  compatible with: raw copy of a CKDS in KDSR format
icsf.prov.infer.noneCleanly=\  compatible with: none cleanly - the token's MKVP and TVV are in states that do not match each other
icsf.prov.infer.notCkds=\  ruled out: any route through the CKDS, which only stores INTERNAL tokens
icsf.prov.infer.externalDelivery=\  compatible with: an external token handed over by the application or by an export service
icsf.prov.infer.allRuledOut=\  ruled out: every legitimate route - a TVV holding a value that does not add up means a corrupt or altered token
icsf.prov.rkxNotInCkds=RKX tokens (version X'10') are NOT stored in the CKDS; CKDS Key Record Read/Write do not support them. A legitimate RKX token therefore comes from a key-storage or reader flow, never from a CSNBKRR over the CKDS.
icsf.prov.pka.raw=Raw copy of the data set: for a PKA token the data set is the PKDS, not the CKDS. Unlike the CKDS, the manual documents no 'unmaterialized' state for the PKDS: the missing MKVP/TVV note is about fixed-length tokens in a non-KDSR CKDS, and PKA tokens carry no TVV.
icsf.prov.pka.rawZeroKvp=Verification pattern all zeros on an internal token: the manual describes this for keys IN THE CLEAR and for skeletons, not as a state pending materialization.
icsf.prov.pka.krr=Key Record Read over the PKDS: CSNDKRR / CSNDKRR2 (p. 1311) copies a PKA token or a trusted block from the in-storage PKDS to application storage. CSNBKRR / CSNBKRR2 is no use here: that one is for the CKDS and only copies AES/DES/HMAC tokens.
icsf.prov.pka.krrExternal=EXTERNAL token (X'1E'): the PKDS stores both internal and external tokens, so there is no inconsistency, but an external token is an interchange format and may equally have come from another system.
icsf.prov.pka.infer=Infer mode: provenance is not reliably derivable from the bytes. What is known is that a PKA token lives in the PKDS, never in the CKDS, so every route through the CKDS is ruled out (CSNBKRR/KRR2 and a raw copy of the CKDS).
icsf.prov.pka.inferInternal=\  compatible with: this system's PKDS (the private key is bound to its master key), by raw copy of the data set or by CSNDKRR/KRR2
icsf.prov.pka.inferExternal=\  compatible with: this system's PKDS, or an interchange format received from another system; an external token is not bound to this master key
