module.wallet.scaHelp=PSD2 dynamic linking: what the payer authenticates has to be this payment, so a captured authentication cannot be replayed against another. The wallet signs the hash of the transaction inside the Key Binding JWT; verifying that hash is verifying what the user agreed to. Two authentication factors are counted as categories, not as tokens.
module.wallet.adesHelp=XAdES, PAdES, CAdES and ASiC through one validator. The baseline level is the answer, not a detail: B-B proves who signed, B-T adds when, B-LT carries its revocation evidence so it survives the certificate expiring, B-LTA keeps that provable as algorithms age. Without a trust anchor the chain ends nowhere and the result stays INDETERMINATE.
module.wallet.mdocHelp=Claims are taken as JSON, which cannot express CBOR tags, so elements are issued untagged. A real birth date carries tag 1004: documents from here exercise the digest and signature machinery and are not byte-identical to an issuer's.
module.wallet.eidasCertHelp=Reads qcStatements (EN 319 412-5), PSD2 roles (TS 119 495), the PID, Wallet and PSBEAA provider identifiers of TS 119 412-6, and the wallet-relying party access policies of TS 119 411-8. Findings carry the clause identifier they come from. This describes the certificate; qualification is decided by a trusted list.
module.wallet.trustedListHelp=A signature check here establishes that the list is intact, not that its publisher was entitled to publish it: a forged list verifies against its own key just as well. Authority comes from checking the signing certificate against the List of Trusted Lists and the Official Journal, by hand.
