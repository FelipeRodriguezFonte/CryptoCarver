module.keys.keyBlock.title=🧱 Thales Key Block
module.keys.keyBlock.help=Same shape as an ANSI X9.143 / TR-31 block, with three differences that make a generic TR-31 reader refuse it: the version ID is a digit rather than a letter, Thales adds its own key usage codes, and it adds its own optional header blocks. The usage table is not a list of names — it says which algorithms and modes each usage permits, which is what lets a malformed header be called malformed. Give it the Key Block LMK and it also unwraps the key and checks the authenticator, which binds the header to the key: change one character of either and it stops matching.
