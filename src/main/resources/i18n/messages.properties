icsf.token.help=Analyses one IBM z/OS ICSF / CCA native key token: scope, algorithm, key type, length and effective strength, key material state, wrapping, exportability, Control Vector, TVV, MKVP and pedigree. These are CCA native tokens, not TR-31 key blocks.
