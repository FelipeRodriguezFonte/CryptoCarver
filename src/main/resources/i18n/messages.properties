# module-help:op_keys_tr34 begin
help.operation.op_keys_tr34.title=TR-34 Key Distribution
help.operation.op_keys_tr34.purpose=Laboratory key distribution inspired by TR-34: the sender signs the key and envelopes it for the receiver with CMS and RSA, so the receiver gets both confidentiality and proof of the sender. It is not a certified TR-34 implementation.
help.action.op_keys_tr34.distribute.title=Distribute key
help.action.op_keys_tr34.distribute.description=Signs the key with the sender's key and encrypts the result for the receiver's certificate.
help.action.op_keys_tr34.receive.title=Receive key
help.action.op_keys_tr34.receive.description=Decrypts the data with the receiver's key, verifies the sender's signature and recovers the key.
help.action.op_keys_tr34.challenge.title=Generate challenge
help.action.op_keys_tr34.challenge.description=Creates a random nonce for the two-pass flow. Generate it before distributing and copy it into Binding Nonce.
help.action.op_keys_tr34.clear_reset.title=Clear or reset
help.action.op_keys_tr34.clear_reset.description=Clear empties the sender fields; Reset Defaults returns the options to their initial values.
help.field.op_keys_tr34.sender_private_key.label=Sender private key
help.field.op_keys_tr34.sender_private_key.description=PEM private key that signs the distribution.
help.field.op_keys_tr34.sender_cert.label=Sender certificate
help.field.op_keys_tr34.sender_cert.description=Certificate that matches the sender's private key.
help.field.op_keys_tr34.receiver_cert.label=Receiver certificate
help.field.op_keys_tr34.receiver_cert.description=Certificate the key is encrypted for.
help.field.op_keys_tr34.key.label=Key to distribute
help.field.op_keys_tr34.key.description=Symmetric key in hexadecimal.
help.field.op_keys_tr34.key_id.label=Key ID
help.field.op_keys_tr34.key_id.description=Optional label for the key. It is authenticated, so the receiver can trust it.
help.field.op_keys_tr34.binding_nonce.label=Binding nonce
help.field.op_keys_tr34.binding_nonce.description=Nonce taken from the receiver's challenge, which ties this distribution to that request. Leave it empty for the one-pass flow.
help.field.op_keys_tr34.envelope.label=Crypto Envelope
help.field.op_keys_tr34.envelope.description=Wraps the key as a Crypto Envelope before distributing it.
help.field.op_keys_tr34.distribute_result.label=Distribution result
help.field.op_keys_tr34.distribute_result.description=Data to send to the receiver.
help.field.op_keys_tr34.receiver_private_key.label=Receiver private key
help.field.op_keys_tr34.receiver_private_key.description=PEM private key that decrypts the distribution.
help.field.op_keys_tr34.expected_sender_cert.label=Expected sender certificate
help.field.op_keys_tr34.expected_sender_cert.description=Certificate the signature is verified against. A distribution signed by anyone else is rejected.
help.field.op_keys_tr34.distributed_data.label=Distributed data
help.field.op_keys_tr34.distributed_data.description=Data received from the sender, or a Crypto Envelope.
help.field.op_keys_tr34.challenge_nonce.label=Challenge nonce
help.field.op_keys_tr34.challenge_nonce.description=Nonce of the two-pass flow, in hexadecimal. The received distribution must carry the same value.
help.field.op_keys_tr34.receive_result.label=Receive result
help.field.op_keys_tr34.receive_result.description=Recovered key and the outcome of the checks.
# module-help:op_keys_tr34 end
# module-help:op_keys_pkcs11 begin
help.operation.op_keys_pkcs11.title=PKCS#11 Token
help.operation.op_keys_pkcs11.purpose=Connects to a laboratory token or HSM through its native PKCS#11 library and uses its keys where they are. Private keys are never read or exported; the PIN is used for this session only and is not stored.
help.action.op_keys_pkcs11.connect.title=Connect or disconnect
help.action.op_keys_pkcs11.connect.description=Opens a session with the token and lists its public object metadata, or closes the session.
help.action.op_keys_pkcs11.profile.title=Token profiles
help.action.op_keys_pkcs11.profile.description=A profile remembers the library path, slot and name. The PIN is never part of it.
help.action.op_keys_pkcs11.sign.title=Sign or verify
help.action.op_keys_pkcs11.sign.description=Signs the data inside the token with the selected private-key object, or verifies a signature.
help.action.op_keys_pkcs11.certificate.title=Certificate chain
help.action.op_keys_pkcs11.certificate.description=Shows the public certificate chain stored for an alias, or replaces it with the pasted PEM chain.
help.action.op_keys_pkcs11.jwt.title=Create signed JWT
help.action.op_keys_pkcs11.jwt.description=Creates a compact JWS signed by the selected token key.
help.action.op_keys_pkcs11.cms.title=Create CMS SignedData
help.action.op_keys_pkcs11.cms.description=Creates a CMS/PKCS#7 signature with the selected token key and its certificate.
help.action.op_keys_pkcs11.wrap.title=Wrap key
help.action.op_keys_pkcs11.wrap.description=Wraps a token key object under another token key, inside the token. Raw key bytes never reach this application.
help.action.op_keys_pkcs11.unwrap.title=Unwrap key
help.action.op_keys_pkcs11.unwrap.description=Unwraps a key inside the token. The result is a summary; the key material itself is never shown.
help.field.op_keys_pkcs11.saved_profile.label=Saved profiles
help.field.op_keys_pkcs11.saved_profile.description=Profile to load into the form.
help.field.op_keys_pkcs11.name.label=Profile name
help.field.op_keys_pkcs11.name.description=Name for this token configuration.
help.field.op_keys_pkcs11.library.label=PKCS#11 library
help.field.op_keys_pkcs11.library.description=Path of the vendor's native library (.dylib, .so or .dll).
help.field.op_keys_pkcs11.slot.label=Slot
help.field.op_keys_pkcs11.slot.description=Index of the slot where the token is.
help.field.op_keys_pkcs11.pin.label=User PIN
help.field.op_keys_pkcs11.pin.description=PIN of the token. It is not stored. Repeated wrong PINs can lock a real token.
help.field.op_keys_pkcs11.report.label=Token report
help.field.op_keys_pkcs11.report.description=Provider and public object metadata. Keys are not shown.
help.field.op_keys_pkcs11.signing_key.label=Private key alias
help.field.op_keys_pkcs11.signing_key.description=Private-key object in the token used to sign.
help.field.op_keys_pkcs11.signature_algorithm.label=Signature algorithm
help.field.op_keys_pkcs11.signature_algorithm.description=Algorithm for the signature test. It must suit the type of the selected key.
help.field.op_keys_pkcs11.data.label=Data to sign
help.field.op_keys_pkcs11.data.description=Data in hexadecimal.
help.field.op_keys_pkcs11.signature.label=Signature
help.field.op_keys_pkcs11.signature.description=Signature in hexadecimal: produced by Sign, or pasted to verify.
help.field.op_keys_pkcs11.certificate_alias.label=Certificate alias
help.field.op_keys_pkcs11.certificate_alias.description=Alias whose certificate chain is shown or updated.
help.field.op_keys_pkcs11.certificate.label=PEM chain
help.field.op_keys_pkcs11.certificate.description=Certificate chain in PEM.
help.field.op_keys_pkcs11.jwt_algorithm.label=JWT algorithm
help.field.op_keys_pkcs11.jwt_algorithm.description=JWS algorithm, which must match the type of the token key.
help.field.op_keys_pkcs11.jwt_payload.label=Claims
help.field.op_keys_pkcs11.jwt_payload.description=Claims of the token, as a JSON object.
help.field.op_keys_pkcs11.jwt_output.label=Compact JWS
help.field.op_keys_pkcs11.jwt_output.description=The signed token.
help.field.op_keys_pkcs11.cms_data.label=Content to sign
help.field.op_keys_pkcs11.cms_data.description=Content in hexadecimal.
help.field.op_keys_pkcs11.cms_detached.label=Detached CMS
help.field.op_keys_pkcs11.cms_detached.description=Leaves the content out of the CMS; the verifier must then be given the content separately.
help.field.op_keys_pkcs11.cms_output.label=CMS output
help.field.op_keys_pkcs11.cms_output.description=The CMS/PKCS#7 structure in Base64.
help.field.op_keys_pkcs11.wrapping_key.label=Wrapping key
help.field.op_keys_pkcs11.wrapping_key.description=Token key whose public part wraps the other key.
help.field.op_keys_pkcs11.key_to_wrap.label=Key to wrap
help.field.op_keys_pkcs11.key_to_wrap.description=Token key object to wrap.
help.field.op_keys_pkcs11.wrap_transformation.label=Transformation
help.field.op_keys_pkcs11.wrap_transformation.description=Cipher transformation used to wrap. The token must support it.
help.field.op_keys_pkcs11.wrap_result.label=Wrapped key
help.field.op_keys_pkcs11.wrap_result.description=Wrapped key in hexadecimal.
help.field.op_keys_pkcs11.unwrapping_key.label=Unwrapping key
help.field.op_keys_pkcs11.unwrapping_key.description=Token key whose private part unwraps.
help.field.op_keys_pkcs11.unwrap_transformation.label=Transformation
help.field.op_keys_pkcs11.unwrap_transformation.description=Must be the transformation used when wrapping.
help.field.op_keys_pkcs11.wrapped_data.label=Wrapped key
help.field.op_keys_pkcs11.wrapped_data.description=Wrapped key in hexadecimal.
help.field.op_keys_pkcs11.unwrap_algorithm.label=Recovered key algorithm
help.field.op_keys_pkcs11.unwrap_algorithm.description=Algorithm of the key being recovered, for example AES.
help.field.op_keys_pkcs11.unwrap_type.label=Key type
help.field.op_keys_pkcs11.unwrap_type.description=Whether the recovered object is a secret, private or public key.
help.field.op_keys_pkcs11.unwrap_result.label=Unwrap result
help.field.op_keys_pkcs11.unwrap_result.description=Summary of the recovered object.
# module-help:op_keys_pkcs11 end
# module-help:op_pay_thales_lmk begin
help.operation.op_pay_thales_lmk.title=Thales Variant LMK
help.operation.op_pay_thales_lmk.purpose=Reproduces how a payShield protects a key under a variant LMK pair. Two different things are called a variant: the key type variant, which fixes what kind of key it is, and the scheme variant, which fixes how its halves are encrypted.
help.action.op_pay_thales_lmk.encrypt.title=Encrypt under LMK
help.action.op_pay_thales_lmk.encrypt.description=Encrypts the clear key under the LMK pair for the given key type and scheme.
help.action.op_pay_thales_lmk.decrypt.title=Decrypt under LMK
help.action.op_pay_thales_lmk.decrypt.description=Recovers the clear key from its cryptogram under the LMK pair.
help.action.op_pay_thales_lmk.describe.title=Explain wrapping
help.action.op_pay_thales_lmk.describe.description=Describes step by step which LMK pair and variants apply, without needing key values.
help.action.op_pay_thales_lmk.lookup.title=Find key type
help.action.op_pay_thales_lmk.lookup.description=Tries the key types to find which one decrypts the cryptogram to a key with the expected check value.
help.action.op_pay_thales_lmk.example.title=Load manual example
help.action.op_pay_thales_lmk.example.description=Fills the form with a published test example.
help.field.op_pay_thales_lmk.lmk.label=LMK pair
help.field.op_pay_thales_lmk.lmk.description=LMK pair in hexadecimal: 32 characters for double length or 48 for triple length. Use test LMKs only.
help.field.op_pay_thales_lmk.key_type.label=Key type code
help.field.op_pay_thales_lmk.key_type.description=Three-digit code: the first digit is the variant and the other two the LMK pair code.
help.field.op_pay_thales_lmk.scheme.label=Key scheme
help.field.op_pay_thales_lmk.scheme.description=Scheme tag of the encrypted key, which states its length and how it is encrypted.
help.field.op_pay_thales_lmk.clear_key.label=Clear key
help.field.op_pay_thales_lmk.clear_key.description=Key to protect, in hexadecimal.
help.field.op_pay_thales_lmk.cryptogram.label=Key under LMK
help.field.op_pay_thales_lmk.cryptogram.description=Encrypted key, with or without its scheme tag.
help.field.op_pay_thales_lmk.check_value.label=Expected check value
help.field.op_pay_thales_lmk.check_value.description=Check value of the clear key, used by the key type search.
help.field.op_pay_thales_lmk.component.label=Key component
help.field.op_pay_thales_lmk.component.description=Tick it when the value is a component rather than a whole key.
help.field.op_pay_thales_lmk.result.label=Result
help.field.op_pay_thales_lmk.result.description=Outcome of the operation, with the intermediate steps.
# module-help:op_pay_thales_lmk end
# module-help:op_pay_thales_key_block begin
help.operation.op_pay_thales_key_block.title=Thales Key Block
help.operation.op_pay_thales_key_block.purpose=Reads Thales key blocks, which look like ANSI X9.143 / TR-31 blocks but differ enough that a generic TR-31 reader refuses them. With the Key Block LMK it also recovers the key.
help.action.op_pay_thales_key_block.inspect.title=Inspect key block
help.action.op_pay_thales_key_block.inspect.description=Decodes the header and structure of the block. No LMK is needed and nothing is verified.
help.action.op_pay_thales_key_block.unwrap.title=Unwrap key block
help.action.op_pay_thales_key_block.unwrap.description=Authenticates the block with the Key Block LMK and recovers the key.
help.action.op_pay_thales_key_block.example.title=Load manual example
help.action.op_pay_thales_key_block.example.description=Fills the form with a published test block.
help.field.op_pay_thales_key_block.block.label=Key block
help.field.op_pay_thales_key_block.block.description=Block as text, with or without its leading S.
help.field.op_pay_thales_key_block.lmk.label=Key Block LMK
help.field.op_pay_thales_key_block.lmk.description=Optional triple-length TDES LMK, 48 hexadecimal characters, needed only to unwrap. Use test LMKs only.
help.field.op_pay_thales_key_block.result.label=Result
help.field.op_pay_thales_key_block.result.description=Decoded header, and the recovered key when unwrapping.
# module-help:op_pay_thales_key_block end
# module-help:op_keys_icsf_token begin
help.operation.op_keys_icsf_token.title=ICSF / CCA Key Token Analyzer
help.operation.op_keys_icsf_token.purpose=Analyses one IBM z/OS ICSF / CCA native key token and explains what it declares: scope, algorithm, key type, length and effective strength. It decrypts nothing; protected key material is recoverable only inside the coprocessor.
help.action.op_keys_icsf_token.analyze.title=Analyze token
help.action.op_keys_icsf_token.analyze.description=Decodes the token and fills the summary card and the field-by-field detail.
help.action.op_keys_icsf_token.load_save.title=Load file or save report
help.action.op_keys_icsf_token.load_save.description=Loads a token from a binary file, or saves the analysis as a report.
help.action.op_keys_icsf_token.examples.title=Examples
help.action.op_keys_icsf_token.examples.description=Loads a sample token of the named kind so you can see how each one reads.
help.action.op_keys_icsf_token.clear_reset.title=Clear or reset
help.action.op_keys_icsf_token.clear_reset.description=Clear empties the token and the results; Reset Defaults also returns the selectors to their initial values.
help.field.op_keys_icsf_token.origin.label=Provenance
help.field.op_keys_icsf_token.origin.description=Where the token comes from. It cannot be deduced from the bytes, so you declare it; it changes how a missing master-key verification pattern is read.
help.field.op_keys_icsf_token.format.label=Input format
help.field.op_keys_icsf_token.format.description=How the pasted text is read: plain hexadecimal, or the two host rows with high digits above and low digits below.
help.field.op_keys_icsf_token.input.label=Key token
help.field.op_keys_icsf_token.input.description=The token in hexadecimal.
help.field.op_keys_icsf_token.summary.label=Summary card
help.field.op_keys_icsf_token.summary.description=The main facts of the token at a glance.
help.field.op_keys_icsf_token.detail.label=Detail
help.field.op_keys_icsf_token.detail.description=Every field of the token, with provenance notes and warnings.
# module-help:op_keys_icsf_token end
# module-help:op_keys_icsf_batch begin
help.operation.op_keys_icsf_batch.title=ICSF / CCA Batch Analysis
help.operation.op_keys_icsf_batch.purpose=Analyses many ICSF / CCA key tokens at once and produces statistics, audit findings and a normalized inventory. Like the single analyzer, it decrypts nothing.
help.action.op_keys_icsf_batch.analyze.title=Analyze batch
help.action.op_keys_icsf_batch.analyze.description=Reads every token in the input and fills the four result tabs.
help.action.op_keys_icsf_batch.load.title=Load file or example
help.action.op_keys_icsf_batch.load.description=Loads the tokens from a file, or a sample batch to try the screen.
help.action.op_keys_icsf_batch.save.title=Save report or inventory
help.action.op_keys_icsf_batch.save.description=Saves the report as text, or the inventory as CSV for a spreadsheet.
help.action.op_keys_icsf_batch.filter.title=Filter the inventory
help.action.op_keys_icsf_batch.filter.description=Narrows the inventory by text. Double-clicking a finding filters by it; Clear filter shows everything again.
help.action.op_keys_icsf_batch.clear_reset.title=Clear or reset
help.action.op_keys_icsf_batch.clear_reset.description=Clear empties the input and the results; Reset Defaults also returns the selectors to their initial values.
help.field.op_keys_icsf_batch.origin.label=Provenance
help.field.op_keys_icsf_batch.origin.description=Where the token comes from. It cannot be deduced from the bytes, so you declare it; it changes how a missing master-key verification pattern is read.
help.field.op_keys_icsf_batch.reading.label=Reading
help.field.op_keys_icsf_batch.reading.description=How the input is split into tokens. Automatic decides block by block and keeps the shape that yields tokens.
help.field.op_keys_icsf_batch.input.label=Key tokens
help.field.op_keys_icsf_batch.input.description=One token per line, optionally preceded by a label and a bar, or two host rows per token, or a block of stacked hexadecimal. Blank lines separate blocks.
help.field.op_keys_icsf_batch.include_detail.label=Include per-token detail
help.field.op_keys_icsf_batch.include_detail.description=Adds the full detail of every token to the saved text report. Turn it off for large batches, where the file would be very large.
help.field.op_keys_icsf_batch.statistics.label=Statistics
help.field.op_keys_icsf_batch.statistics.description=Counts of the batch by algorithm, key type and other attributes.
help.field.op_keys_icsf_batch.findings.label=Findings
help.field.op_keys_icsf_batch.findings.description=Audit findings. Select one to read what it means and what to do about it.
help.field.op_keys_icsf_batch.filter.label=Filter
help.field.op_keys_icsf_batch.filter.description=Text matched against label, key type and finding.
help.field.op_keys_icsf_batch.inventory.label=Inventory
help.field.op_keys_icsf_batch.inventory.description=One normalized row per token.
help.field.op_keys_icsf_batch.report.label=Report
help.field.op_keys_icsf_batch.report.description=The report as it is saved, without the per-token detail.
# module-help:op_keys_icsf_batch end
# module-help:op_keys_icsf_keywrap begin
help.operation.op_keys_icsf_keywrap.title=ICSF / CCA Key Export / Import
help.operation.op_keys_icsf_keywrap.purpose=Reproduces in the clear what the host does with the CCA Key Export and Key Import verbs, so a token can be checked against known values. Key material is handled in the clear here: use test keys only.
help.action.op_keys_icsf_keywrap.export.title=Export
help.action.op_keys_icsf_keywrap.export.description=Encrypts the key under the EXPORTER key with the Control Vector and builds the external token.
help.action.op_keys_icsf_keywrap.import.title=Import
help.action.op_keys_icsf_keywrap.import.description=Recovers the key from a token or bare cryptogram with the IMPORTER key.
help.action.op_keys_icsf_keywrap.inspect.title=Inspect without KEK
help.action.op_keys_icsf_keywrap.inspect.description=Reads everything the token says about itself when the KEK is not available.
help.action.op_keys_icsf_keywrap.resolve.title=Resolve scheme
help.action.op_keys_icsf_keywrap.resolve.description=Tries the reasonable combinations of KEK variant, cipher mode and Control Vector and reports which one reproduces the expected key.
help.action.op_keys_icsf_keywrap.result_actions.title=Save, copy or reset
help.action.op_keys_icsf_keywrap.result_actions.description=Saves the report, copies the token or the key produced, or returns every tab to its defaults.
help.field.op_keys_icsf_keywrap.export_key.label=Key to export
help.field.op_keys_icsf_keywrap.export_key.description=Clear key in hexadecimal: 8, 16 or 24 bytes.
help.field.op_keys_icsf_keywrap.export_kek.label=KEK / EXPORTER
help.field.op_keys_icsf_keywrap.export_kek.description=Transport key in the clear, in hexadecimal.
help.field.op_keys_icsf_keywrap.export_type.label=Key type
help.field.op_keys_icsf_keywrap.export_type.description=CCA key type, which selects the default Control Vector.
help.field.op_keys_icsf_keywrap.export_cv.label=Control Vector
help.field.op_keys_icsf_keywrap.export_cv.description=Optional. Left blank, the default for the key type is used.
help.field.op_keys_icsf_keywrap.export_variant.label=KEK variant
help.field.op_keys_icsf_keywrap.export_variant.description=How the Control Vector is combined with the KEK before encrypting.
help.field.op_keys_icsf_keywrap.export_mode.label=Cipher mode
help.field.op_keys_icsf_keywrap.export_mode.description=Block mode used to encrypt the key.
help.field.op_keys_icsf_keywrap.export_rn.label=Random number
help.field.op_keys_icsf_keywrap.export_rn.description=Optional 8 bytes for the verification pattern; blank means zeroes.
help.field.op_keys_icsf_keywrap.export_options.label=Token options
help.field.op_keys_icsf_keywrap.export_options.description=Write the version byte as real hosts do, and mark the token NOCV when the key is exported without a Control Vector.
help.field.op_keys_icsf_keywrap.import_input.label=Token or cryptogram
help.field.op_keys_icsf_keywrap.import_input.description=A 64-byte token, or a bare 8, 16 or 24-byte cryptogram, in hexadecimal.
help.field.op_keys_icsf_keywrap.import_kek.label=KEK / IMPORTER
help.field.op_keys_icsf_keywrap.import_kek.description=Transport key in the clear, in hexadecimal.
help.field.op_keys_icsf_keywrap.import_type.label=Key type
help.field.op_keys_icsf_keywrap.import_type.description=CCA key type expected.
help.field.op_keys_icsf_keywrap.import_cv.label=Control Vector
help.field.op_keys_icsf_keywrap.import_cv.description=Optional. Left blank, it is read from the token.
help.field.op_keys_icsf_keywrap.import_variant.label=KEK variant
help.field.op_keys_icsf_keywrap.import_variant.description=Must match the one used on export.
help.field.op_keys_icsf_keywrap.import_mode.label=Cipher mode
help.field.op_keys_icsf_keywrap.import_mode.description=Must match the one used on export.
help.field.op_keys_icsf_keywrap.inspect_input.label=Token
help.field.op_keys_icsf_keywrap.inspect_input.description=The 64-byte token in hexadecimal.
help.field.op_keys_icsf_keywrap.resolve_input.label=Token or cryptogram
help.field.op_keys_icsf_keywrap.resolve_input.description=Value whose scheme you want to find out, in hexadecimal.
help.field.op_keys_icsf_keywrap.resolve_kek.label=KEK
help.field.op_keys_icsf_keywrap.resolve_kek.description=Transport key in the clear, in hexadecimal.
help.field.op_keys_icsf_keywrap.resolve_expected_key.label=Expected key
help.field.op_keys_icsf_keywrap.resolve_expected_key.description=Optional. With it the answer is conclusive.
help.field.op_keys_icsf_keywrap.resolve_expected_kcv.label=Expected KCV
help.field.op_keys_icsf_keywrap.resolve_expected_kcv.description=Optional, 3 or 4 bytes, for when the key itself is not available.
help.field.op_keys_icsf_keywrap.resolve_type.label=Key type
help.field.op_keys_icsf_keywrap.resolve_type.description=Optional. Narrows the Control Vectors tried.
help.field.op_keys_icsf_keywrap.report.label=Result
help.field.op_keys_icsf_keywrap.report.description=Report of the last operation.
# module-help:op_keys_icsf_keywrap end
# module-help:op_cert_gen begin
help.operation.op_cert_gen.title=Generate Certificate
help.operation.op_cert_gen.purpose=Creates a self-signed X.509 certificate with a new key pair, or a PKCS#10 certificate signing request (CSR) to send to a CA. Self-signed certificates are for laboratory use: nobody else trusts them unless they choose to.
help.action.op_cert_gen.generate.title=Generate certificate
help.action.op_cert_gen.generate.description=Generates a key pair and a self-signed certificate with the subject and options given.
help.action.op_cert_gen.generate_csr.title=Generate CSR
help.action.op_cert_gen.generate_csr.description=Creates a signing request for a CA, with a new key pair or with the existing key selected in Key Type. The CSR carries the public key and the subject; the private key stays with you.
help.field.op_cert_gen.subject.label=Subject
help.field.op_cert_gen.subject.description=Identity written in the certificate. CN is the common name; Country is the two-letter ISO code. The other fields are optional.
help.field.op_cert_gen.validity.label=Validity (days)
help.field.op_cert_gen.validity.description=Days the certificate is valid for, counted from now.
help.field.op_cert_gen.key_type.label=Key type
help.field.op_cert_gen.key_type.description=Algorithm and size of the key pair that is generated. For a CSR it can also be an existing key: the private key pasted in the Parse Certificate area, or a key inside the connected PKCS#11 token.
help.field.op_cert_gen.sign_algorithm.label=Signature algorithm
help.field.op_cert_gen.sign_algorithm.description=Algorithm that signs the certificate or CSR. It must suit the key type.
help.field.op_cert_gen.san.label=Subject alternative names
help.field.op_cert_gen.san.description=Host names and IP addresses the certificate is valid for, separated by commas. Clients match these, not the CN.
help.field.op_cert_gen.root_ca.label=Laboratory Root CA
help.field.op_cert_gen.root_ca.description=Marks the certificate as a CA allowed to sign other certificates, so it can be used in Issue Certificate from CSR.
help.field.op_cert_gen.output.label=Output
help.field.op_cert_gen.output.description=The certificate or CSR in PEM. When a key pair is generated, its private key is shown too: keep it safe.
# module-help:op_cert_gen end
# module-help:op_cert_issue begin
help.operation.op_cert_issue.title=Issue Certificate from CSR
help.operation.op_cert_issue.purpose=Acts as a laboratory CA: checks the signature of a CSR and issues a certificate for it, signed with the CA key. Use only a laboratory CA key here.
help.action.op_cert_issue.issue.title=Issue certificate
help.action.op_cert_issue.issue.description=Verifies the CSR and issues the certificate with the selected profile.
help.field.op_cert_issue.csr.label=CSR
help.field.op_cert_issue.csr.description=PKCS#10 request in PEM.
help.field.op_cert_issue.ca_cert.label=CA certificate
help.field.op_cert_issue.ca_cert.description=Certificate of the issuing CA, in PEM.
help.field.op_cert_issue.ca_key.label=CA private key
help.field.op_cert_issue.ca_key.description=Private key of the issuing CA, in PEM. It signs the new certificate.
help.field.op_cert_issue.validity.label=Validity (days)
help.field.op_cert_issue.validity.description=Days the issued certificate is valid for.
help.field.op_cert_issue.signature.label=Signature algorithm
help.field.op_cert_issue.signature.description=Automatic picks one that suits the CA key; otherwise write the algorithm to use.
help.field.op_cert_issue.profile.label=Profile
help.field.op_cert_issue.profile.description=Kind of certificate to issue, which sets its key usages and whether it is a CA.
help.field.op_cert_issue.path_length.label=Path length
help.field.op_cert_issue.path_length.description=For CA profiles, how many further CA levels may follow below this one. 0 means it can issue end-entity certificates only.
help.field.op_cert_issue.result.label=Result
help.field.op_cert_issue.result.description=The issued certificate in PEM.
# module-help:op_cert_issue end
# module-help:op_cert_parse begin
help.operation.op_cert_parse.title=Parse Certificate
help.operation.op_cert_parse.purpose=Decodes an X.509 certificate and shows its subject, issuer, validity, key, extensions and fingerprints. It reads what the certificate says; it does not check whether it is trusted.
help.action.op_cert_parse.parse.title=Parse certificate
help.action.op_cert_parse.parse.description=Decodes the certificate and writes its fields.
help.action.op_cert_parse.apply_template.title=Apply template or reset
help.action.op_cert_parse.apply_template.description=Apply sets the form as the selected template says; Reset Defaults returns it to the initial values.
help.field.op_cert_parse.template.label=Template
help.field.op_cert_parse.template.description=Saved settings for this screen.
help.field.op_cert_parse.format.label=Certificate format
help.field.op_cert_parse.format.description=How the pasted certificate is encoded.
help.field.op_cert_parse.input.label=Certificate
help.field.op_cert_parse.input.description=Certificate to decode.
help.field.op_cert_parse.result.label=Result
help.field.op_cert_parse.result.description=Decoded fields of the certificate.
# module-help:op_cert_parse end
# module-help:op_cert_compare begin
help.operation.op_cert_compare.title=Compare Certificates
help.operation.op_cert_compare.purpose=Compares two X.509 certificates field by field and reports what differs, which helps to tell a renewal from a different certificate.
help.action.op_cert_compare.compare.title=Compare certificates
help.action.op_cert_compare.compare.description=Decodes both certificates and lists their differences.
help.field.op_cert_compare.left.label=Left certificate
help.field.op_cert_compare.left.description=First certificate, in PEM.
help.field.op_cert_compare.right.label=Right certificate
help.field.op_cert_compare.right.description=Second certificate, in PEM.
help.field.op_cert_compare.result.label=Result
help.field.op_cert_compare.result.description=Fields that match and fields that differ.
# module-help:op_cert_compare end
# module-help:op_cert_val begin
help.operation.op_cert_val.title=Validate Certificate
help.operation.op_cert_val.purpose=Checks one certificate on its own: validity dates and, when the issuer is supplied, that the issuer really signed it. It does not build a chain to a trusted root; use Certificate Chain for that.
help.action.op_cert_val.validate.title=Validate certificate
help.action.op_cert_val.validate.description=Runs the checks and writes the validation report.
help.field.op_cert_val.certificate.label=Certificate
help.field.op_cert_val.certificate.description=Certificate to check, in PEM.
help.field.op_cert_val.issuer.label=Issuer certificate
help.field.op_cert_val.issuer.description=Optional. With it, the signature of the certificate is verified against the issuer's key.
help.field.op_cert_val.result.label=Validation report
help.field.op_cert_val.result.description=Outcome of each check.
# module-help:op_cert_val end
# module-help:op_cert_chain begin
help.operation.op_cert_chain.title=Certificate Chain
help.operation.op_cert_chain.purpose=Validates a certificate chain from the end entity up, checking each signature and, when CRLs are supplied, revocation. It also generates and updates offline CRLs for a laboratory CA.
help.action.op_cert_chain.validate_chain.title=Validate chain
help.action.op_cert_chain.validate_chain.description=Validates the chain and writes the result, which can be exported as a Markdown report.
help.action.op_cert_chain.generate_crl.title=Generate empty CRL
help.action.op_cert_chain.generate_crl.description=Creates a CRL signed by the CA with no revoked certificates.
help.action.op_cert_chain.revoke.title=Revoke and update CRL
help.action.op_cert_chain.revoke.description=Adds the serial number to the CRL with the given reason and signs the updated list.
help.field.op_cert_chain.chain.label=Certificate chain
help.field.op_cert_chain.chain.description=Certificates in PEM, one after another, with the end entity first.
help.field.op_cert_chain.crls.label=CRLs
help.field.op_cert_chain.crls.description=Optional revocation lists in PEM. Without them, revocation is not checked.
help.field.op_cert_chain.result.label=Result
help.field.op_cert_chain.result.description=Outcome for each link of the chain.
help.field.op_cert_chain.crl_issuer_cert.label=CRL issuer certificate
help.field.op_cert_chain.crl_issuer_cert.description=CA certificate that issues the CRL, in PEM.
help.field.op_cert_chain.crl_issuer_key.label=CRL issuer key
help.field.op_cert_chain.crl_issuer_key.description=Private key of that CA, in PEM. It signs the CRL.
help.field.op_cert_chain.existing_crl.label=Existing CRL
help.field.op_cert_chain.existing_crl.description=Optional CRL to extend. Left empty, a new one is started.
help.field.op_cert_chain.serial.label=Serial number
help.field.op_cert_chain.serial.description=Serial of the certificate to revoke, in hexadecimal.
help.field.op_cert_chain.reason.label=Reason
help.field.op_cert_chain.reason.description=Revocation reason recorded in the CRL.
help.field.op_cert_chain.crl_result.label=CRL
help.field.op_cert_chain.crl_result.description=The generated or updated CRL in PEM.
# module-help:op_cert_chain end
# module-help:op_cert_cms begin
help.operation.op_cert_cms.title=CMS / PKCS#7 Operations
help.operation.op_cert_cms.purpose=Signs and verifies CMS SignedData and encrypts and decrypts CMS EnvelopedData. Signing proves who produced the content; enveloping keeps it readable only by the recipient. They are independent and can be combined.
help.action.op_cert_cms.sign.title=Sign
help.action.op_cert_cms.sign.description=Creates a SignedData over the input with the signer's key and certificate.
help.action.op_cert_cms.verify.title=Verify
help.action.op_cert_cms.verify.description=Verifies the signatures of the SignedData pasted in the input. For a detached signature, supply the original data.
help.action.op_cert_cms.add_lt.title=Add LT evidence
help.action.op_cert_cms.add_lt.description=Extends a CAdES signature with the validation material needed to verify it in the long term.
help.action.op_cert_cms.encrypt.title=Encrypt
help.action.op_cert_cms.encrypt.description=Creates an EnvelopedData that only the holder of the recipient's private key can open.
help.action.op_cert_cms.decrypt.title=Decrypt
help.action.op_cert_cms.decrypt.description=Opens the EnvelopedData pasted in the input with the recipient's private key.
help.action.op_cert_cms.load_token_keys.title=Load token keys
help.action.op_cert_cms.load_token_keys.description=Lists the keys of the connected PKCS#11 token. Connect it first in PKCS#11 Token.
help.field.op_cert_cms.input.label=Input
help.field.op_cert_cms.input.description=Raw data to sign or encrypt, or a PKCS#7 structure in PEM to verify or decrypt.
help.field.op_cert_cms.sign_source.label=Signing source
help.field.op_cert_cms.sign_source.description=Sign with a PEM key pasted here, or with a key that stays inside a PKCS#11 token.
help.field.op_cert_cms.signer_cert.label=Signer certificate
help.field.op_cert_cms.signer_cert.description=Certificate included in the signature, in PEM.
help.field.op_cert_cms.signer_key.label=Signer private key
help.field.op_cert_cms.signer_key.description=Private key that signs, in PEM.
help.field.op_cert_cms.token_alias.label=Token key alias
help.field.op_cert_cms.token_alias.description=Signing key inside the token.
help.field.op_cert_cms.detached_data.label=Detached data
help.field.op_cert_cms.detached_data.description=Original data, needed only to verify a detached signature.
help.field.op_cert_cms.detached.label=Detached signature
help.field.op_cert_cms.detached.description=Leaves the content out of the signature. The verifier then needs the content separately.
help.field.op_cert_cms.cades.label=CAdES level
help.field.op_cert_cms.cades.description=CAdES-BES adds the signed attributes the standard requires; CAdES-T also adds an RFC 3161 timestamp from a TSA.
help.field.op_cert_cms.tsa_url.label=TSA URL
help.field.op_cert_cms.tsa_url.description=Timestamp authority contacted for CAdES-T. The hash of the signature is sent to it over the network.
help.field.op_cert_cms.encrypt_source.label=Key source
help.field.op_cert_cms.encrypt_source.description=Use PEM material pasted here, or a key inside a PKCS#11 token.
help.field.op_cert_cms.recipient_cert.label=Recipient certificate
help.field.op_cert_cms.recipient_cert.description=Certificate the content is encrypted for, in PEM.
help.field.op_cert_cms.recipient_key.label=Recipient private key
help.field.op_cert_cms.recipient_key.description=Private key that decrypts, in PEM.
help.field.op_cert_cms.encrypt_token_alias.label=Token key alias
help.field.op_cert_cms.encrypt_token_alias.description=Decryption key inside the token.
help.field.op_cert_cms.output.label=Output
help.field.op_cert_cms.output.description=The CMS structure produced, or the outcome of verifying or decrypting.
# module-help:op_cert_cms end
# module-help:op_pades begin
help.operation.op_pades.title=PAdES PDF Signatures
help.operation.op_pades.purpose=Signs PDF files with PAdES and inspects or validates the signatures a PDF already has. It signs incrementally and writes a new file; the input PDF is never overwritten.
help.action.op_pades.sign.title=Sign PDF
help.action.op_pades.sign.description=Signs the PDF as Baseline-B, or Baseline-T when the timestamp is enabled, and writes it to the output path.
help.action.op_pades.inspect.title=Inspect signatures
help.action.op_pades.inspect.description=Lists the signatures in the PDF and what each one covers, without judging trust.
help.action.op_pades.validate.title=Validate PDF
help.action.op_pades.validate.description=Validates the signatures against the local truststore and CRL evidence. The detailed reports can be saved.
help.action.op_pades.choose_files.title=Choose files
help.action.op_pades.choose_files.description=Pick the files this screen works with, or list the keys of the connected token.
help.action.op_pades.clear_reset.title=Clear or reset
help.action.op_pades.clear_reset.description=Clear empties the form and the result; Reset Defaults also returns the options to their initial values.
help.field.op_pades.input.label=Input PDF
help.field.op_pades.input.description=PDF to sign, inspect or validate.
help.field.op_pades.output.label=Output PDF
help.field.op_pades.output.description=Path of the new signed PDF.
help.field.op_pades.key_source.label=Signing key source
help.field.op_pades.key_source.description=A local PKCS#12 file, or a key inside a PKCS#11 token.
help.field.op_pades.pkcs12.label=PKCS#12 and password
help.field.op_pades.pkcs12.description=Signing key file and its password. The password is not saved.
help.field.op_pades.token_alias.label=Token alias
help.field.op_pades.token_alias.description=Signing key inside the token.
help.field.op_pades.timestamp.label=Signature timestamp
help.field.op_pades.timestamp.description=Adds an RFC 3161 timestamp from the TSA at the given URL, which makes the signature PAdES-T. The hash of the signature is sent over the network.
help.field.op_pades.visible.label=Visible signature
help.field.op_pades.visible.description=Draws a text box on the chosen page. Position and size are in PDF points from the lower-left corner. The box is cosmetic; the cryptographic signature is the same without it.
help.field.op_pades.truststore.label=Truststore
help.field.op_pades.truststore.description=Optional keystore with the certificates you trust, and its password. Without it, validation cannot conclude that a signer is trusted.
help.field.op_pades.crl_evidence.label=CRL evidence
help.field.op_pades.crl_evidence.description=Local CRL files used to check revocation. Validation here does not go online.
help.field.op_pades.result.label=Result
help.field.op_pades.result.description=Outcome of signing, inspecting or validating.
# module-help:op_pades end
# module-help:op_asic_s begin
help.operation.op_asic_s.title=ASiC Containers
help.operation.op_asic_s.purpose=Creates and verifies ASiC containers: a ZIP that keeps files together with their CAdES or XAdES signature. ASiC-S holds one file; ASiC-E holds several plus a manifest of their hashes.
help.action.op_asic_s.create.title=Create ASiC-S
help.action.op_asic_s.create.description=Signs the input file and packs it into a new ASiC-S container.
help.action.op_asic_s.create_e.title=Create ASiC-E
help.action.op_asic_s.create_e.description=Signs several payload files together through a SHA-256 manifest and packs them into an ASiC-E container.
help.action.op_asic_s.inspect.title=Inspect or verify
help.action.op_asic_s.inspect.description=Opens the container, lists its contents and verifies its signatures.
help.action.op_asic_s.choose_files.title=Choose files
help.action.op_asic_s.choose_files.description=Pick the files this screen works with, or list the keys of the connected token.
help.action.op_asic_s.clear_reset.title=Clear or reset
help.action.op_asic_s.clear_reset.description=Clear empties the form and the result; Reset Defaults also returns the options to their initial values.
help.field.op_asic_s.input.label=Input file
help.field.op_asic_s.input.description=File to sign, or an existing container to inspect.
help.field.op_asic_s.output.label=Output file
help.field.op_asic_s.output.description=Path of the new container.
help.field.op_asic_s.key_source.label=Signing key source
help.field.op_asic_s.key_source.description=A local PKCS#12 file, or a key inside a PKCS#11 token.
help.field.op_asic_s.pkcs12.label=PKCS#12 and password
help.field.op_asic_s.pkcs12.description=Signing key file and its password. The password is not saved.
help.field.op_asic_s.token_alias.label=Token alias
help.field.op_asic_s.token_alias.description=Signing key inside the token.
help.field.op_asic_s.format.label=Signature format
help.field.op_asic_s.format.description=CAdES or XAdES signature inside the container.
help.field.op_asic_s.level.label=Baseline level
help.field.op_asic_s.level.description=B is the basic signature. T adds a timestamp; LT adds revocation evidence; LTA adds an archive timestamp. T, LT and LTA need a TSA, and LT and LTA also need CRL or OCSP evidence.
help.field.op_asic_s.tsa_url.label=TSA URL
help.field.op_asic_s.tsa_url.description=Timestamp authority used for levels T and above.
help.field.op_asic_s.revocation.label=CRL / OCSP evidence
help.field.op_asic_s.revocation.description=Local revocation files used for LT and LTA and when verifying.
help.field.op_asic_s.online_revocation.label=Online revocation
help.field.op_asic_s.online_revocation.description=Lets verification query OCSP and CRL servers. It is off by default because it contacts third parties.
help.field.op_asic_s.payloads.label=ASiC-E payloads
help.field.op_asic_s.payloads.description=Files that go into the ASiC-E container.
help.field.op_asic_s.truststore.label=Truststore
help.field.op_asic_s.truststore.description=Optional keystore with the certificates you trust, and its password.
help.field.op_asic_s.result.label=Result
help.field.op_asic_s.result.description=Outcome of creating or verifying.
# module-help:op_asic_s end
# module-help:op_cms_inspector begin
help.operation.op_cms_inspector.title=CMS Inspector
help.operation.op_cms_inspector.purpose=Shows the structure of a CMS / PKCS#7 message and validates its SignedData. Inspecting describes what is inside; validating checks the signatures and, with a truststore, the certificate path.
help.action.op_cms_inspector.inspect.title=Inspect CMS
help.action.op_cms_inspector.inspect.description=Decodes the message and lists its content type, signers, certificates and attributes.
help.action.op_cms_inspector.validate.title=Validate SignedData
help.action.op_cms_inspector.validate.description=Verifies each signature; with a truststore it also validates the signer's certificate path.
help.action.op_cms_inspector.load.title=Load files
help.action.op_cms_inspector.load.description=Loads the CMS, the detached content or the truststore from a file.
help.action.op_cms_inspector.export.title=Export report
help.action.op_cms_inspector.export.description=Saves the inspection results to a file.
help.action.op_cms_inspector.clear_reset.title=Clear or reset
help.action.op_cms_inspector.clear_reset.description=Clear empties the form and the result; Reset Defaults also returns the options to their initial values.
help.field.op_cms_inspector.input.label=CMS source
help.field.op_cms_inspector.input.description=CMS message as Base64 or PEM, or loaded from a DER file.
help.field.op_cms_inspector.detached.label=Detached content
help.field.op_cms_inspector.detached.description=Tick it when the signature does not contain the signed content.
help.field.op_cms_inspector.content.label=Content
help.field.op_cms_inspector.content.description=The signed content, needed to verify a detached signature.
help.field.op_cms_inspector.truststore_password.label=Truststore password
help.field.op_cms_inspector.truststore_password.description=Password of the selected truststore. It is not saved.
help.field.op_cms_inspector.report.label=Results
help.field.op_cms_inspector.report.description=Structure of the message and the outcome of validation.
# module-help:op_cms_inspector end
# module-help:op_jose_jwt begin
help.operation.op_jose_jwt.title=JWT (Signed)
help.operation.op_jose_jwt.purpose=Creates signed JSON Web Tokens and verifies them. A JWT is signed, not encrypted: anyone can read its claims, and the signature only proves who issued them and that they were not altered.
help.action.op_jose_jwt.generate.title=Generate signed JWT
help.action.op_jose_jwt.generate.description=Signs the payload with the key and algorithm selected and writes the token.
help.action.op_jose_jwt.apply_claims.title=Apply claims to payload
help.action.op_jose_jwt.apply_claims.description=Writes issuer, subject, audience and expiry into the payload JSON, so you do not have to type them by hand.
help.action.op_jose_jwt.load_signing_key.title=Load signing key
help.action.op_jose_jwt.load_signing_key.description=Fills the signing key from a file or the Clipboard Shelf.
help.action.op_jose_jwt.validate.title=Verify and decode
help.action.op_jose_jwt.validate.description=Verifies the signature with the key given, checks the claims against what you expect and shows the decoded header and payload.
help.action.op_jose_jwt.load_verification_key.title=Load verification key
help.action.op_jose_jwt.load_verification_key.description=Fills the verification key from a file or the Clipboard Shelf.
help.action.op_jose_jwt.detached.title=Detached JWS
help.action.op_jose_jwt.detached.description=Signs or verifies a payload that travels outside the token: the token keeps the header and the signature, with the payload part empty.
help.action.op_jose_jwt.clear_reset.title=Clear or reset
help.action.op_jose_jwt.clear_reset.description=Clear empties the form and the results; Reset Defaults also returns the options to their initial values.
help.field.op_jose_jwt.algorithm.label=Algorithm
help.field.op_jose_jwt.algorithm.description=JWS algorithm. HS* use a shared secret; RS*, PS*, ES* and EdDSA use a private key to sign and the public key to verify. "none" produces an unsigned token.
help.field.op_jose_jwt.template.label=Template
help.field.op_jose_jwt.template.description=Predefined payload and settings for a common kind of token.
help.field.op_jose_jwt.serialization.label=Serialization
help.field.op_jose_jwt.serialization.description=Compact is the usual three-part token. The JSON serializations can carry unprotected headers, and General JSON more than one signature.
help.field.op_jose_jwt.unencoded.label=Unencoded payload
help.field.op_jose_jwt.unencoded.description=Signs the payload as it is instead of its Base64URL form (b64=false, RFC 7797). The verifier must understand that header.
help.field.op_jose_jwt.signing_key.label=Signing key
help.field.op_jose_jwt.signing_key.description=Shared secret for HMAC algorithms, or a private key in PEM for the others.
help.field.op_jose_jwt.secret_format.label=Secret format
help.field.op_jose_jwt.secret_format.description=How the text of an HMAC secret becomes bytes: UTF-8, Hex or Base64. It does not affect PEM keys.
help.field.op_jose_jwt.second_signer.label=Second signer
help.field.op_jose_jwt.second_signer.description=Algorithm and key of a second signature. It is used only with General JSON.
help.field.op_jose_jwt.claims.label=Claims builder
help.field.op_jose_jwt.claims.description=Issuer, subject, audience and validity in hours for the payload.
help.field.op_jose_jwt.payload.label=Payload
help.field.op_jose_jwt.payload.description=Claims of the token, as a JSON object.
help.field.op_jose_jwt.protected_header.label=Additional protected header
help.field.op_jose_jwt.protected_header.description=Optional JSON with extra header parameters, such as kid or typ. They are covered by the signature.
help.field.op_jose_jwt.output.label=Output
help.field.op_jose_jwt.output.description=The signed token.
help.field.op_jose_jwt.token.label=JWT
help.field.op_jose_jwt.token.description=Token to verify.
help.field.op_jose_jwt.verification_key.label=Verification key
help.field.op_jose_jwt.verification_key.description=Shared secret for HMAC algorithms, or the public key in PEM for the others.
help.field.op_jose_jwt.validate_secret_format.label=Secret format
help.field.op_jose_jwt.validate_secret_format.description=How the text of an HMAC secret becomes bytes. It must be the format used when signing.
help.field.op_jose_jwt.expected_claims.label=Expected issuer and audience
help.field.op_jose_jwt.expected_claims.description=Values the iss and aud claims must have. Left empty, they are not checked.
help.field.op_jose_jwt.time_checks.label=Time checks
help.field.op_jose_jwt.time_checks.description=Checks exp, nbf and iat against the current time, allowing the given clock skew in seconds.
help.field.op_jose_jwt.policy.label=Acceptance policy
help.field.op_jose_jwt.policy.description=What the verifier accepts: the list of allowed algorithms, whether unsigned tokens (alg=none) pass, and the stricter OpenID Connect and RFC 9068 access-token profiles. Accepting unsigned tokens removes all protection.
help.field.op_jose_jwt.header_trust.label=Header keys and critical parameters
help.field.op_jose_jwt.header_trust.description=Whether a key carried in the token's own header may be used, the trust anchors and date an x5c chain is validated with, and which crit parameters the verifier understands. A key from the header proves nothing unless it chains to an anchor you trust.
help.field.op_jose_jwt.profile_checks.label=Expected values
help.field.op_jose_jwt.profile_checks.description=Optional values to compare against the token: typ, cty and nonce, the access token and authorization code behind at_hash and c_hash, and the key thumbprints in cnf. Empty fields are not checked.
help.field.op_jose_jwt.decoded.label=Decoded header and payload
help.field.op_jose_jwt.decoded.description=Contents of the token. They are shown even when verification fails, so do not treat them as trusted.
help.field.op_jose_jwt.findings.label=Claim checks
help.field.op_jose_jwt.findings.description=Result of each check on issuer, audience, time and critical headers.
help.field.op_jose_jwt.detached_algorithm.label=Algorithm
help.field.op_jose_jwt.detached_algorithm.description=JWS algorithm for the detached signature.
help.field.op_jose_jwt.detached_serialization.label=Serialization
help.field.op_jose_jwt.detached_serialization.description=Serialization of the detached JWS, and whether the payload is signed unencoded (b64=false).
help.field.op_jose_jwt.detached_payload.label=External payload
help.field.op_jose_jwt.detached_payload.description=Content that is signed but not included in the token. The verifier must have exactly the same bytes.
help.field.op_jose_jwt.detached_keys.label=Keys
help.field.op_jose_jwt.detached_keys.description=Signing key and verification key, with the format of an HMAC secret.
help.field.op_jose_jwt.detached_header.label=Additional protected header
help.field.op_jose_jwt.detached_header.description=Optional JSON with extra header parameters.
help.field.op_jose_jwt.detached_token.label=Detached JWS
help.field.op_jose_jwt.detached_token.description=Token with an empty payload part: produced by Generate, or pasted to verify.
# module-help:op_jose_jwt end
# module-help:op_jose_jwk begin
help.operation.op_jose_jwk.title=JWK (Keys)
help.operation.op_jose_jwk.purpose=Converts keys between PEM and JSON Web Key, computes JWK thumbprints and manages JWK Sets. A private JWK is as sensitive as a private PEM key.
help.action.op_jose_jwk.pem_to_jwk.title=PEM to JWK
help.action.op_jose_jwk.pem_to_jwk.description=Converts the pasted key into a JWK with the metadata given.
help.action.op_jose_jwk.jwk_to_pem.title=JWK to PEM
help.action.op_jose_jwk.jwk_to_pem.description=Converts the pasted JWK into PEM, or into the raw secret for an oct key.
help.action.op_jose_jwk.thumbprint.title=Calculate thumbprint
help.action.op_jose_jwk.thumbprint.description=Computes the RFC 7638 thumbprint, a stable identifier of the key that is often used as kid.
help.action.op_jose_jwk.inspect.title=Inspect metadata
help.action.op_jose_jwk.inspect.description=Describes the JWK: type, size or curve, declared use and whether it contains private parts.
help.action.op_jose_jwk.jwks.title=JWK Set
help.action.op_jose_jwk.jwks.description=Starts or loads a set, adds a newly generated key to it, or shows the set with the private parts removed, which is what you publish.
help.field.op_jose_jwk.key_type.label=Key type
help.field.op_jose_jwk.key_type.description=RSA, EC, OKP (Ed25519, Ed448, X25519, X448) or OCT for a symmetric secret.
help.field.op_jose_jwk.curve.label=OKP curve
help.field.op_jose_jwk.curve.description=Curve of an OKP key. It applies only to that key type.
help.field.op_jose_jwk.kid.label=Key ID
help.field.op_jose_jwk.kid.description=Identifier written as kid. Left empty, one is derived automatically.
help.field.op_jose_jwk.use.label=use
help.field.op_jose_jwk.use.description=Intended use: sig for signatures or enc for encryption.
help.field.op_jose_jwk.key_ops.label=key_ops
help.field.op_jose_jwk.key_ops.description=Optional list of permitted operations, such as sign and verify.
help.field.op_jose_jwk.secret_format.label=Secret format
help.field.op_jose_jwk.secret_format.description=How an OCT secret is written or read: UTF-8, Hex or Base64.
help.field.op_jose_jwk.input.label=Input
help.field.op_jose_jwk.input.description=PEM key or JWK JSON, depending on the direction.
help.field.op_jose_jwk.output.label=Output
help.field.op_jose_jwk.output.description=Result of the conversion or inspection.
help.field.op_jose_jwk.jwks.label=JWK Set
help.field.op_jose_jwk.jwks.description=The working set. It may contain private keys until you export the public version.
help.field.op_jose_jwk.rotate_algorithm.label=Algorithm of the new key
help.field.op_jose_jwk.rotate_algorithm.description=Algorithm the key added to the set is generated for.
# module-help:op_jose_jwk end
# module-help:op_jose_jwa begin
help.operation.op_jose_jwa.title=JWA (Algorithms)
help.operation.op_jose_jwa.purpose=Reference table of the JOSE algorithms this application supports for signatures, key management and content encryption.
help.action.op_jose_jwa.browse.title=Browse algorithms
help.action.op_jose_jwa.browse.description=Read the name, role and description of each algorithm.
help.field.op_jose_jwa.table.label=Algorithms
help.field.op_jose_jwa.table.description=Each row is one algorithm identifier or a family of them.
# module-help:op_jose_jwa end
# module-help:op_jose_insp begin
help.operation.op_jose_insp.title=Token Inspector
help.operation.op_jose_insp.purpose=Breaks any JOSE token, JWS or JWE, into its parts and decodes what can be read without a key. It verifies and decrypts nothing.
help.action.op_jose_insp.analyze.title=Analyze token
help.action.op_jose_insp.analyze.description=Splits the token and shows a visual breakdown of its components.
help.action.op_jose_insp.report.title=Report actions
help.action.op_jose_insp.report.description=Opens the report in a larger window, copies it, or clears the inspector.
help.field.op_jose_insp.input.label=Token
help.field.op_jose_insp.input.description=JWS or JWE to inspect, in compact or JSON form.
# module-help:op_jose_insp end
# module-help:op_cose_sign1 begin
help.operation.op_cose_sign1.title=COSE_Sign1
help.operation.op_cose_sign1.purpose=Signs and verifies COSE_Sign1 messages, the single-signer signature of COSE (RFC 9052), which is the CBOR counterpart of a compact JWS.
help.action.op_cose_sign1.sign.title=Sign
help.action.op_cose_sign1.sign.description=Signs the payload and writes the COSE_Sign1 message in hexadecimal.
help.action.op_cose_sign1.verify.title=Verify
help.action.op_cose_sign1.verify.description=Verifies the signature of the message with the public key.
help.action.op_cose_sign1.clear_reset.title=Clear or reset
help.action.op_cose_sign1.clear_reset.description=Clear empties the form and the results; Reset Defaults also returns the options to their initial values.
help.field.op_cose_sign1.algorithm.label=Algorithm
help.field.op_cose_sign1.algorithm.description=COSE signature algorithm. The key type must match it.
help.field.op_cose_sign1.private_key.label=Private key
help.field.op_cose_sign1.private_key.description=Signing key in PEM, EC or RSA.
help.field.op_cose_sign1.public_key.label=Public key
help.field.op_cose_sign1.public_key.description=Optional but recommended: the matching public key in PEM.
help.field.op_cose_sign1.payload.label=Payload
help.field.op_cose_sign1.payload.description=Text to sign.
help.field.op_cose_sign1.output.label=COSE_Sign1 message
help.field.op_cose_sign1.output.description=The signed message in hexadecimal.
help.field.op_cose_sign1.verify_public_key.label=Public key
help.field.op_cose_sign1.verify_public_key.description=Public key of the signer, in PEM.
help.field.op_cose_sign1.message.label=COSE_Sign1 message
help.field.op_cose_sign1.message.description=Message to verify, in hexadecimal.
help.field.op_cose_sign1.result.label=Result
help.field.op_cose_sign1.result.description=Outcome of the verification.
# module-help:op_cose_sign1 end
# module-help:op_cose_mac0 begin
help.operation.op_cose_mac0.title=COSE_Mac0
help.operation.op_cose_mac0.purpose=Creates and verifies COSE_Mac0 messages: a payload authenticated with a MAC under a key both parties already share.
help.action.op_cose_mac0.create.title=Create MAC
help.action.op_cose_mac0.create.description=Computes the MAC over the payload and writes the COSE_Mac0 message. Generate Key fills a random key of the right size.
help.action.op_cose_mac0.verify.title=Verify MAC
help.action.op_cose_mac0.verify.description=Recomputes the MAC with the key and compares it with the one in the message.
help.action.op_cose_mac0.clear_reset.title=Clear or reset
help.action.op_cose_mac0.clear_reset.description=Clear empties the form and the results; Reset Defaults also returns the options to their initial values.
help.field.op_cose_mac0.algorithm.label=Algorithm
help.field.op_cose_mac0.algorithm.description=COSE MAC algorithm.
help.field.op_cose_mac0.key.label=Key
help.field.op_cose_mac0.key.description=Symmetric key in hexadecimal.
help.field.op_cose_mac0.payload.label=Payload
help.field.op_cose_mac0.payload.description=Text to authenticate.
help.field.op_cose_mac0.output.label=COSE_Mac0 message
help.field.op_cose_mac0.output.description=The message in hexadecimal.
help.field.op_cose_mac0.verify_key.label=Key
help.field.op_cose_mac0.verify_key.description=The same symmetric key, in hexadecimal.
help.field.op_cose_mac0.message.label=COSE_Mac0 message
help.field.op_cose_mac0.message.description=Message to verify, in hexadecimal.
help.field.op_cose_mac0.result.label=Result
help.field.op_cose_mac0.result.description=Outcome of the verification.
# module-help:op_cose_mac0 end
# module-help:op_cose_encrypt0 begin
help.operation.op_cose_encrypt0.title=COSE_Encrypt0
help.operation.op_cose_encrypt0.purpose=Encrypts and decrypts COSE_Encrypt0 messages: content protected with authenticated encryption under a key both parties already share.
help.action.op_cose_encrypt0.encrypt.title=Encrypt
help.action.op_cose_encrypt0.encrypt.description=Encrypts the payload and writes the COSE_Encrypt0 message. Generate Key fills a random key of the right size.
help.action.op_cose_encrypt0.decrypt.title=Decrypt
help.action.op_cose_encrypt0.decrypt.description=Decrypts the message. A wrong key or an altered message is rejected instead of yielding garbage.
help.action.op_cose_encrypt0.clear_reset.title=Clear or reset
help.action.op_cose_encrypt0.clear_reset.description=Clear empties the form and the results; Reset Defaults also returns the options to their initial values.
help.field.op_cose_encrypt0.algorithm.label=Algorithm
help.field.op_cose_encrypt0.algorithm.description=COSE content encryption algorithm.
help.field.op_cose_encrypt0.key.label=Key
help.field.op_cose_encrypt0.key.description=Symmetric key in hexadecimal.
help.field.op_cose_encrypt0.payload.label=Payload
help.field.op_cose_encrypt0.payload.description=Text to encrypt.
help.field.op_cose_encrypt0.output.label=COSE_Encrypt0 message
help.field.op_cose_encrypt0.output.description=The message in hexadecimal.
help.field.op_cose_encrypt0.decrypt_key.label=Key
help.field.op_cose_encrypt0.decrypt_key.description=The same symmetric key, in hexadecimal.
help.field.op_cose_encrypt0.message.label=COSE_Encrypt0 message
help.field.op_cose_encrypt0.message.description=Message to decrypt, in hexadecimal.
help.field.op_cose_encrypt0.result.label=Result
help.field.op_cose_encrypt0.result.description=The decrypted payload.
# module-help:op_cose_encrypt0 end
# module-help:op_asn1_dec begin
help.operation.op_asn1_dec.title=Decode ASN.1
help.operation.op_asn1_dec.purpose=Parses ASN.1 data encoded in BER or DER and shows it as a tree, with OIDs named where they are known. It is the tool to look inside certificates, keys and CMS messages.
help.action.op_asn1_dec.parse.title=Parse ASN.1
help.action.op_asn1_dec.parse.description=Decodes the data and fills the structure tree; select a node to see its details.
help.action.op_asn1_dec.export.title=Export
help.action.op_asn1_dec.export.description=Saves the decoded structure as a text tree, JSON or Markdown.
help.action.op_asn1_dec.canonicalize.title=Canonicalize DER
help.action.op_asn1_dec.canonicalize.description=Re-encodes the data as DER, the single canonical encoding. Useful when a signature depends on exact bytes.
help.action.op_asn1_dec.load_oids.title=Load OID registry
help.action.op_asn1_dec.load_oids.description=Loads a file of OID names to label identifiers the built-in list does not know.
help.action.op_asn1_dec.clear_reset.title=Clear or reset
help.action.op_asn1_dec.clear_reset.description=Clear empties the form and the results; Reset Defaults also returns the options to their initial values.
help.field.op_asn1_dec.input_format.label=Input format
help.field.op_asn1_dec.input_format.description=How the pasted data is encoded: Hex, Base64 or PEM.
help.field.op_asn1_dec.example.label=Example / type
help.field.op_asn1_dec.example.description=Loads a sample structure of the chosen kind.
help.field.op_asn1_dec.input.label=ASN.1 data
help.field.op_asn1_dec.input.description=Data to decode.
help.field.op_asn1_dec.strict_der.label=Strict DER
help.field.op_asn1_dec.strict_der.description=Rejects encodings that are valid BER but not DER, such as non-minimal lengths.
help.field.op_asn1_dec.tree.label=Structure tree
help.field.op_asn1_dec.tree.description=One node per ASN.1 element, nested as in the data.
help.field.op_asn1_dec.details.label=Details
help.field.op_asn1_dec.details.description=Tag, length, value and interpretation of the selected node.
# module-help:op_asn1_dec end
# module-help:op_asn1_enc begin
help.operation.op_asn1_enc.title=Encode ASN.1
help.operation.op_asn1_enc.purpose=Encodes a single ASN.1 value as DER, to build test data or to see how a type is represented.
help.action.op_asn1_enc.encode.title=Encode
help.action.op_asn1_enc.encode.description=Encodes the value as the selected type and writes the DER in hexadecimal.
help.action.op_asn1_enc.copy.title=Copy output
help.action.op_asn1_enc.copy.description=Copies the encoded bytes.
help.field.op_asn1_enc.type.label=ASN.1 type
help.field.op_asn1_enc.type.description=Type to encode, such as INTEGER, OCTET STRING or SEQUENCE.
help.field.op_asn1_enc.value_format.label=Value format
help.field.op_asn1_enc.value_format.description=How the value is written.
help.field.op_asn1_enc.value.label=Value
help.field.op_asn1_enc.value.description=The value for strings and integers, or the hexadecimal content for wrapper types.
help.field.op_asn1_enc.output.label=Encoded output
help.field.op_asn1_enc.output.description=DER encoding in hexadecimal.
# module-help:op_asn1_enc end
# module-help:op_pqc_gen begin
help.operation.op_pqc_gen.title=PQC Key Generation
help.operation.op_pqc_gen.purpose=Generates post-quantum key pairs with the NIST-standardized algorithms and demonstrates key encapsulation. Signature keys (ML-DSA, SLH-DSA) and encapsulation keys (ML-KEM) are different kinds and are not interchangeable.
help.action.op_pqc_gen.generate.title=Generate key pair
help.action.op_pqc_gen.generate.description=Creates a key pair for the selected algorithm.
help.action.op_pqc_gen.import_export.title=Import or export
help.action.op_pqc_gen.import_export.description=Loads keys from PEM files or the Clipboard Shelf, or writes the current keys to PEM files.
help.action.op_pqc_gen.kem.title=KEM demo
help.action.op_pqc_gen.kem.description=Bob encapsulates a shared secret to Alice's public key and Alice decapsulates it with her private key; both end with the same secret. It illustrates the mechanism and is not a communication protocol.
help.action.op_pqc_gen.benchmark.title=Benchmark
help.action.op_pqc_gen.benchmark.description=Measures key generation and operation times of an algorithm on this machine.
help.field.op_pqc_gen.algorithm.label=Algorithm
help.field.op_pqc_gen.algorithm.description=Algorithm and parameter set. Higher parameter sets give more security margin at the cost of larger keys and signatures.
help.field.op_pqc_gen.public_key.label=Public key
help.field.op_pqc_gen.public_key.description=Public key of the pair.
help.field.op_pqc_gen.private_key.label=Private key
help.field.op_pqc_gen.private_key.description=Private key of the pair. Sensitive material.
help.field.op_pqc_gen.details.label=Key details
help.field.op_pqc_gen.details.description=Sizes and parameters of the generated keys.
help.field.op_pqc_gen.kem_algorithm.label=KEM algorithm
help.field.op_pqc_gen.kem_algorithm.description=ML-KEM parameter set of the demo. It needs an ML-KEM key pair generated above.
help.field.op_pqc_gen.kem_ciphertext.label=Encapsulation ciphertext
help.field.op_pqc_gen.kem_ciphertext.description=What Bob sends to Alice. It can travel in the open.
help.field.op_pqc_gen.kem_secrets.label=Shared secrets
help.field.op_pqc_gen.kem_secrets.description=Bob's and Alice's secrets. They must be equal when the exchange worked.
help.field.op_pqc_gen.benchmark_algorithm.label=Algorithm
help.field.op_pqc_gen.benchmark_algorithm.description=Algorithm to measure.
help.field.op_pqc_gen.benchmark.label=Results
help.field.op_pqc_gen.benchmark.description=Measured times. They depend on this machine and its load.
# module-help:op_pqc_gen end
# module-help:op_pqc_sign begin
help.operation.op_pqc_sign.title=PQC Sign / Verify
help.operation.op_pqc_sign.purpose=Signs data and verifies signatures with the post-quantum signature key generated or imported in PQC Key Generation.
help.action.op_pqc_sign.sign.title=Sign data
help.action.op_pqc_sign.sign.description=Signs the text with the current private key.
help.action.op_pqc_sign.verify.title=Verify signature
help.action.op_pqc_sign.verify.description=Verifies the pasted signature over the same text with the current public key.
help.field.op_pqc_sign.algorithm.label=Algorithm
help.field.op_pqc_sign.algorithm.description=Signature algorithm. It must be the one the current key pair was generated for.
help.field.op_pqc_sign.input.label=Data to sign
help.field.op_pqc_sign.input.description=Text, taken as UTF-8.
help.field.op_pqc_sign.signature.label=Signature
help.field.op_pqc_sign.signature.description=Signature in hexadecimal. Post-quantum signatures are much longer than RSA or ECDSA ones.
help.field.op_pqc_sign.verify_signature.label=Signature to verify
help.field.op_pqc_sign.verify_signature.description=Signature in hexadecimal.
# module-help:op_pqc_sign end
