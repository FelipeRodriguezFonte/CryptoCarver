help.node.option.pad.paddingtype.pkcs7=Adds according to PKCS7: Pads to blockSize; every added byte contains N, the number of bytes added. An already aligned input gets a full block.
help.node.option.pad.paddingtype.zero=Adds according to ZERO: Pads with zero bytes only when unaligned; removal strips all trailing zeros, including possible data.
