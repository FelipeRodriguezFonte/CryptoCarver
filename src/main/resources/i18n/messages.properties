icsf.finding.ENTRADA_NO_RECONOCIDA.title=The entry could not be read or analysed
icsf.finding.ENTRADA_NO_RECONOCIDA.detail=Either the hexadecimal is invalid, or the identifier and version match no documented format. Check the extract: the usual cause is a partial copy-paste or an EBCDIC/ASCII conversion.
icsf.finding.TVV_INVALIDO.title=TVV holds a value but it is wrong
icsf.finding.TVV_INVALIDO.detail=Bytes 60-63 have content and do not match the sum of bytes 0-59. That is NOT the normal non-KDSR CKDS case (there the TVV arrives at zero): it points to a token altered or truncated somewhere along the way.
icsf.finding.DES_56_BITS.title=Single-length DES key (56 effective bits)
icsf.finding.DES_56_BITS.detail=A single-length DES key is 56 bits. This is the material that single-DES withdrawal controls reject, so it is worth having the complete list before a host level upgrade.
icsf.finding.DES_FUERZA_SIMPLE.title=Structurally double/triple key that collapses to single DES
icsf.finding.DES_FUERZA_SIMPLE.detail=The components coincide in a way that reduces EDE to a single DES (K1=K2=K3, K1=K2 or K2=K3). It declares 112 or 168 bits and delivers 56. Only reported when the component comparison is RELIABLE.
icsf.finding.MATERIAL_EN_CLARO.title=The key material travels in the clear inside the token
icsf.finding.MATERIAL_EN_CLARO.detail=The token itself carries the key unencrypted. Anyone holding the token holds the key: treat the file as sensitive material.
icsf.finding.CV_INVALIDO.title=Control Vector that breaks its structural rules
icsf.finding.CV_INVALIDO.detail=The CV does not satisfy what p. 1678 requires (even parity of zero bits per byte, bit 30 = 0, bit 38 = 1). If the CV is not valid, this token's type, uses and exportability cannot be read reliably.
icsf.finding.DES_FUERZA_DOBLE.title=Structurally triple key that is equivalent to a double one
icsf.finding.DES_FUERZA_DOBLE.detail=Form K1|K2|K1: it is 2-key TDES (112 bits) even though it occupies 24 bytes. Not a fault, but it does not count as triple in a strength inventory.
icsf.finding.BYTE59_FUERA_DE_TABLA.title=Byte 59 holds a value the current Table 615 does not define
icsf.finding.BYTE59_FUERA_DE_TABLA.detail=Today byte 59 admits only X'00', X'10' and X'20' (single/double/triple). On older ICSF levels that byte was SUBDIVIDED and also carried the algorithm, so a token created back then may legitimately hold a value outside today's table. Check it against the documentation current when the key was created before writing it off as corrupt: the token can be repaired in place by recalculating the TVV, without touching the key.
icsf.finding.BYTE59_INCOHERENTE.title=Byte 59 does not agree with the token version
icsf.finding.BYTE59_INCOHERENTE.detail=Table 615 ties each value to a version: single = version X'00', double and triple = version X'01'. Here they do not match.
icsf.finding.WRAP_ECB.title=Legacy ECB wrapping (original CCA method)
icsf.finding.WRAP_ECB.detail=It is the only method interoperable outside CCA, but also the weakest: no confounder and no chaining. In a host level review this is the list of keys that are candidates for re-wrapping.
icsf.finding.NOCV.title=NOCV key (transport)
icsf.finding.NOCV.detail=Used without a Control Vector variant. It is what makes an EXPORTER interoperable with a non-CCA third party, and at the same time what removes the controls the CV provides: worth knowing how many there are and why.
icsf.finding.CV_CERO.title=All-zero Control Vector (legacy DATA key)
icsf.finding.CV_CERO.detail=No control bits: no type, no uses, no exportability. The token does not say what may be done with the key.
icsf.finding.MKVP_AUSENTE.title=Internal token with an encrypted key and no MKVP
icsf.finding.MKVP_AUSENTE.detail=Normal if this is a RAW copy of a non-KDSR CKDS (p. 1560): the MKVP is copied from the CKDS header before the token is used. Anomalous if the token came from Key Record Read.
icsf.finding.HISTORIA_DEBIL.title=The token declares a degraded security history
icsf.finding.HISTORIA_DEBIL.detail=The management fields say the key was once encrypted under an untrusted KEK, in ECB mode, under a weaker key, or in a format without type and usage attributes. The key carries that past with it even though it is well wrapped now.
icsf.finding.LONGITUD_INESPERADA.title=The token is not the size it should be
icsf.finding.LONGITUD_INESPERADA.detail=A fixed-length token is exactly 64 bytes, and a variable-length one declares its length in bytes 2-3. Here it does not add up.
icsf.finding.DUPLICADO.title=Token repeated in the batch
icsf.finding.DUPLICADO.detail=The same bytes appear more than once. It may be a dump with duplicates, or the same key stored under two labels.
icsf.finding.AVISOS_PARSER.title=The analyser raised warnings about this token
icsf.finding.AVISOS_PARSER.detail=Inconsistencies found while reading it field by field. The full per-token detail at the end of the report lists them one by one.
icsf.finding.WRAP_MEJORADO.title=Enhanced wrapping (WRAP-ENH / WRAPENH2 / WRAPENH3)
icsf.finding.WRAP_MEJORADO.detail=Good from a security standpoint, but NOBODY outside a CCA opens these tokens: if this key has to be handed to a third party, this is not the route.
icsf.finding.ENH_ONLY.title=ENH-ONLY (CV bit 56) is on
icsf.finding.ENH_ONLY.detail=The coprocessor will no longer return a WRAP-ECB token for this key: there is no going back to the legacy method.
icsf.finding.NO_EXPORTABLE.title=The key cannot be exported
icsf.finding.NO_EXPORTABLE.detail=In DES this is decided by CV bit 17 (NO-XPORT) or by the flag byte; in variable-length, by the management fields; in PKA, by NO-XLATE. It matters when planning a migration by export: these keys do not leave.
icsf.finding.COMP_TAG.title=Compliant-tagged key
icsf.finding.COMP_TAG.detail=Use restricted to PCI-HSM compliant applications.
icsf.finding.TVV_AUSENTE.title=TVV at zero (token not materialized)
icsf.finding.TVV_AUSENTE.detail=Bytes 60-63 at zero: this is not corruption, it is the record exactly as stored in a non-KDSR CKDS.
icsf.finding.PKA_EN_PRUEBAS.title=PKA token decoding is in testing
icsf.finding.PKA_EN_PRUEBAS.detail=The PKA decoding is checked against the manual and exercised with synthetic tokens, but not yet against a real token from a PKDS. Treat its fields as provisional.

# ICSF / CCA batch analysis view
icsf.batch.title=🖥 ICSF / CCA Batch Analysis
icsf.batch.help=Analyses many ICSF / CCA key tokens at once and produces statistics, audit findings and a normalized inventory. It reinterprets nothing: every verdict comes from the single-token analyzer, so the two views cannot disagree.
icsf.batch.security=⚠ This batch decrypts nothing: protected key material is only recoverable inside the cryptographic coprocessor, under its master key. Its outputs do carry the tokens in full in hexadecimal, so the files it writes must be handled with the same care as the dump they came from.
icsf.batch.reading=Reading:
icsf.batch.readingHelp=Automatic reading decides block by block, trying all three shapes and keeping the one that produces tokens which genuinely analyse. Force a shape when a block is being read the wrong way.
icsf.batch.inputLabel=Key tokens — one per line, two host rows per token, or one block of stacked hex. Blank lines separate blocks; lines starting with # are ignored; LABEL|hex is accepted.
icsf.batch.inputPrompt=MY.KEY.01|020000000100C000... — one per line, or two host rows, or one stacked block
