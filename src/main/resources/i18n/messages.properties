module.emv.oda.help=Each key is recovered from the certificate above it: the CA key opens tag 90, the issuer key it yields opens tag 9F46, and the ICC key that yields checks the dynamic signature. The static data is part of the ICC certificate's own hash, so an AFL assembled wrongly fails while recovering the key, not where anyone looks for it. SDA proves an issuer signed this data once and nothing about the card in front of you.
