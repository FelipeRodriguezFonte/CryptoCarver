help.action.op_gen_process_designer.zoom_fit.example=Fit to content frames all existing nodes. On an empty canvas it uses 100%.

help.action.op_gen_process_designer.snap_to_grid.title=Snap To Grid

help.action.op_gen_process_designer.snap_to_grid.description=When enabled, newly positioned or dragged nodes align to the canvas grid.

help.action.op_gen_process_designer.snap_to_grid.example=Move a node with Snap to grid enabled; its position aligns to the grid.

help.action.op_gen_process_designer.toggle_inspector.title=Toggle inspector

help.action.op_gen_process_designer.toggle_inspector.description=Shows or hides the node inspector; hiding it does not remove the selected node or its settings.

help.action.op_gen_process_designer.toggle_inspector.example=Hide inspector, then show it again; the selected node and configured fields remain.

help.action.op_gen_process_designer.focus_mode.title=Focus mode

help.action.op_gen_process_designer.focus_mode.description=Toggles focus mode to give the workflow canvas more space by reducing surrounding panels.

help.action.op_gen_process_designer.focus_mode.example=Enable Focus mode to inspect connections; disable it to restore the regular workspace.

help.action.op_gen_process_designer.expand_results.title=Expand results

help.action.op_gen_process_designer.expand_results.description=Opens the current execution trace in an expanded view; it reads displayed results but does not run the process.

help.action.op_gen_process_designer.expand_results.example=After a run, expand the trace to inspect node messages. Before any run, there may be no trace.

help.action.op_gen_process_designer.open_window.title=Open in window

help.action.op_gen_process_designer.open_window.description=Detaches Process Designer into its own window while retaining the current workspace.

help.action.op_gen_process_designer.open_window.example=Open in window, edit a node, and close the window; the same graph remains in the main workspace.

help.action.op_gen_process_designer.save_node_settings.title=Save block settings

help.action.op_gen_process_designer.save_node_settings.description=Applies the selected node’s current inspector fields to its configuration.

help.action.op_gen_process_designer.save_node_settings.example=Change FILE_INPUT readMode, then Save block settings; the selected node keeps that mode.

help.action.op_gen_process_designer.search_palette.title=Search palette

