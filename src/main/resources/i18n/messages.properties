# module-help:op_keys_kex_rsa begin
help.operation.op_keys_kex_rsa.title=RSA Key Exchange
help.operation.op_keys_kex_rsa.purpose=Transports a symmetric key by encrypting it with the recipient's RSA public key; only the matching private key recovers it. It gives confidentiality, not proof of who sent the key.
help.action.op_keys_kex_rsa.export.title=Wrap key (export)
help.action.op_keys_kex_rsa.export.description=Encrypts the key for the recipient in the selected profile.
help.action.op_keys_kex_rsa.import.title=Unwrap key
help.action.op_keys_kex_rsa.import.description=Recovers the key with the recipient's private key.
