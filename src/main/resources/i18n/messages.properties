help.action.op_gen_batch.select_operation.title=Select operation
help.action.op_gen_check_digits.calculate.description=Calculates and appends a check digit using the selected algorithm. Input must contain ASCII decimal digits only.
help.action.op_gen_check_digits.calculate.example=With Luhn, 7992739871 yields digit 3 and complete value 79927398713. A letter or separator is rejected.
help.action.op_gen_check_digits.calculate.title=Calculate
help.action.op_gen_check_digits.select_algorithm.description=Selects a decimal rule: Luhn, AMEX SE (Luhn/Mod 10), Verhoeff or Damm. Selection does not calculate or validate.
help.action.op_gen_check_digits.select_algorithm.example=The same number may pass one rule and fail another; select the rule specified by the numbering system.
help.action.op_gen_check_digits.select_algorithm.title=Select algorithm
help.action.op_gen_check_digits.validate.description=Checks whether the final digit of the complete value matches the selected algorithm; it does not certify origin or authenticity.
help.action.op_gen_check_digits.validate.example=Luhn accepts 79927398713 and rejects 79927398714. At least one base digit and one check digit are required.
help.action.op_gen_check_digits.validate.title=Validate
