help.node.option.console_input.charset.iso_8859_1=ISO-8859-1: Single-byte map for U+0000–U+00FF; it is not Windows-1252.
help.node.option.console_input.charset.us_ascii=US-ASCII: 7-bit map; Java substitutes characters outside ASCII.
help.node.option.console_input.charset.utf_16=UTF-16: Encodes UTF-16 code units using Java’s UTF-16 convention.
help.node.option.console_input.charset.utf_8=UTF-8: Encodes Unicode as 1–4 byte sequences.
help.node.parameter.console_input.value=Multiline literal emitted as bytes using `charset`; catalog default is empty. It does not read the clipboard or other controls.
help.operation.op_gen_batch.title=Batch Runner
help.field.op_gen_batch.record_encoding.label=Record encoding (inactive)
help.option.op_gen_batch.input_format.csv=Parses a header row followed by comma-separated records; quoted fields support escaped quotes and line breaks.
help.option.op_gen_batch.input_format.json_lines_jsonl=Parses one non-empty scalar JSON object per line; a top-level array or nested object/list is rejected.
help.option.op_gen_batch.export_format.csv=Writes one CSV report with row, status, error, input fields and output fields.
help.option.op_gen_batch.export_format.json_lines_jsonl=Writes one JSON object per result row with row number, status, input, output and optional error.

# B05.2a — operation-specific Batch contracts, examples, and failures
help.option.op_gen_batch.operation.utf8-to-hexadecimal=Encodes each string as UTF-8 bytes and returns two hexadecimal digits per byte.
help.option.op_gen_batch.operation.utf8-to-hexadecimal.example=With input=Hola, result=486f6c61; ñ is encoded as two UTF-8 bytes.
help.option.op_gen_batch.operation.utf8-to-hexadecimal.error=Empty text is valid and produces empty output; a missing input column fails in the batch runner.
help.option.op_gen_batch.operation.hexadecimal-to-utf8=Parses the cell as hexadecimal bytes and decodes those bytes as UTF-8.
help.option.op_gen_batch.operation.hexadecimal-to-utf8.example=With input=486f6c61, result=Hola.
help.option.op_gen_batch.operation.hexadecimal-to-utf8.error=input=48Z0 fails as malformed hexadecimal; it is not treated as literal text.

