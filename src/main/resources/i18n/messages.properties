help.action.op_gen_compressed_hex.clear.description=Clears this tool’s input and output. It does not transform data.
help.action.op_gen_compressed_hex.clear.example=Use Clear to remove both areas; copy a value first if you need to keep it.
help.action.op_gen_compressed_hex.clear.title=Clear
help.action.op_gen_compressed_hex.compress.description=Converts conventional Hex into two rows: high nibbles first and low nibbles second. Spaces and line breaks are ignored.
help.action.op_gen_compressed_hex.compress.example=Hex 1A2B3C4D separates into rows “1234” and “ABCD”. A 0x prefix and odd digit count are rejected.
help.action.op_gen_compressed_hex.compress.title=Compress
help.action.op_gen_compressed_hex.expand.description=Reads exactly two non-empty Hex rows from the shared input area; they must have equal length. It interleaves their nibbles into conventional Hex.
help.action.op_gen_compressed_hex.expand.example=Rows “1234” and “ABCD” expand to 1A2B3C4D. Unequal row lengths or any non-Hex character are rejected; a compact single row is not an Expand input.
help.action.op_gen_compressed_hex.expand.title=Expand
help.action.op_gen_envelope_inspector.clear.description=Applies the clear action with the relevant controls on this screen.
help.action.op_gen_envelope_inspector.clear.example=Inspect a synthetic envelope; unwrap is explicit and requires a compatible recipient private key. The example is illustrative; the requirements of the active control apply.
help.action.op_gen_envelope_inspector.clear.title=Clear
help.action.op_gen_envelope_inspector.inspect.description=Applies the inspect action with the relevant controls on this screen.
help.action.op_gen_envelope_inspector.inspect.example=Inspect a synthetic envelope; unwrap is explicit and requires a compatible recipient private key. The example is illustrative; the requirements of the active control apply.
help.action.op_gen_envelope_inspector.inspect.title=Inspect
help.action.op_gen_envelope_inspector.reset.description=Applies the reset action with the relevant controls on this screen.
help.action.op_gen_envelope_inspector.reset.example=Inspect a synthetic envelope; unwrap is explicit and requires a compatible recipient private key. The example is illustrative; the requirements of the active control apply.
help.action.op_gen_envelope_inspector.reset.title=Reset
help.action.op_gen_envelope_inspector.select_profile.description=Controls unwrap interpretation. Structural inspection remains a separate action.
help.action.op_gen_envelope_inspector.select_profile.example=Inspect a synthetic envelope; unwrap is explicit and requires a compatible recipient private key. The example is illustrative; the requirements of the active control apply.
help.action.op_gen_envelope_inspector.select_profile.title=Select unwrap profile
help.action.op_gen_envelope_inspector.unwrap.description=Attempts recovery using the supplied private key and profile; it is distinct from reading public metadata.
help.action.op_gen_envelope_inspector.unwrap.example=Inspect a synthetic envelope; unwrap is explicit and requires a compatible recipient private key. The example is illustrative; the requirements of the active control apply.
help.action.op_gen_envelope_inspector.unwrap.title=Unwrap
help.action.op_gen_file.choose_destination.description=Selects the local path for converted output. It does not overwrite or convert until the relevant action runs.
help.action.op_gen_file.choose_destination.example=Choose a destination separate from the source for a reversible test, then review the format before converting.
help.action.op_gen_file.choose_destination.title=Choose destination file
help.action.op_gen_file.choose_source.description=Selects the local source file. Choosing it does not start conversion or add its path to help context.
help.action.op_gen_file.choose_source.example=Choose a small disposable fixture for conversion. Preview is limited to the first 4 KiB.
help.action.op_gen_file.choose_source.title=Choose source file
help.action.op_gen_file.compare.description=Compares source and comparison files byte-for-byte, independently of format selectors; reports equality or the first differing offset.
help.action.op_gen_file.compare.example=Identical copies compare equal; if byte two differs, the result reports offset 1. Both files are required.
help.action.op_gen_file.compare.title=Compare files
help.action.op_gen_file.convert.description=Converts files among Binary, Text, Hex and Base64. Text uses the selected encoding; Hex removes whitespace from source text.
help.action.op_gen_file.convert.example=Bytes “AB” as UTF-8 Text convert to Hex 4142. Malformed Base64 or odd-length Hex stops conversion.
help.action.op_gen_file.convert.title=Convert
help.action.op_gen_file.hash_file.description=Computes SHA-256 by reading the file in blocks and reports the processed size. Path and contents remain local.
help.action.op_gen_file.hash_file.example=SHA-256 of an empty file is e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855. A readable source is required.
help.action.op_gen_file.hash_file.title=Hash file with SHA-256
help.action.op_gen_file.preview.description=Shows a Hex view of the first 4096 bytes of the source file; it does not convert or write the destination.
help.action.op_gen_file.preview.example=A file larger than 4 KiB is limited to that prefix. A readable source is required.
help.action.op_gen_file.preview.title=Preview (4 KiB)
help.action.op_gen_hash.apply_template.description=Applies preset non-secret settings to the controls; this action does not calculate a digest.
help.action.op_gen_hash.apply_template.example=A built-in template can select SHA-256 and Text→Hex. Review the input, then press Calculate.
help.action.op_gen_hash.apply_template.title=Apply template
help.action.op_gen_hash.calculate.description=Computes a digest over bytes parsed using the input format; it leaves the input unchanged.
help.action.op_gen_hash.calculate.example=With SHA-256 and Text UTF-8 input “abc”, Hex output is ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad. Odd or invalid Hex does not form valid bytes.
help.action.op_gen_hash.calculate.title=Calculate
help.action.op_gen_hash.manage_templates.description=Opens controls for saving or managing non-secret preferences. Personal names are not included in help context.
help.action.op_gen_hash.manage_templates.example=Save an algorithm and format combination for reuse; do not put keys or input data in the template name.
help.action.op_gen_hash.manage_templates.title=Manage templates
help.action.op_gen_hash.select_algorithm.description=The choice changes the algorithm and output size. MD4, MD5 and SHA-1 are legacy; CRC32 detects accidental errors only.
help.action.op_gen_hash.select_algorithm.example=SHA-256 returns 32 bytes (64 Hex digits); SHA-512 returns 64 bytes. Do not use CRC or legacy hashes to authenticate.
help.action.op_gen_hash.select_algorithm.title=Select algorithm
help.action.op_gen_manual.base32_decode.description=Decodes Base32 and converts the resulting bytes to UTF-8 text.
help.action.op_gen_manual.base32_decode.example=IE====== decodes to “A”. Symbols outside the Base32 alphabet are invalid.
help.action.op_gen_manual.base32_decode.title=Decode Base32
help.action.op_gen_manual.base32_encode.description=Encodes UTF-8 text with the Base32 alphabet. This action has its own parser and ignores the toolbar selectors.
help.action.op_gen_manual.base32_encode.example=Text “A” encodes as IE======. The result includes Base32 padding.
help.action.op_gen_manual.base32_encode.title=Encode Base32
help.action.op_gen_manual.base64url_decode.description=Decodes Base64URL to UTF-8 text; input must use the Base64URL alphabet and have a valid length.
help.action.op_gen_manual.base64url_decode.example=QUI decodes to “AB”. A character outside the alphabet, such as “+”, is rejected.
help.action.op_gen_manual.base64url_decode.title=Decode Base64URL
help.action.op_gen_manual.base64url_encode.description=Encodes UTF-8 text as Base64URL with a URL-safe alphabet and no trailing padding. This action has its own parser.
help.action.op_gen_manual.base64url_encode.example=Text “AB” produces QUI. The global format selectors do not apply.
help.action.op_gen_manual.base64url_encode.title=Encode Base64URL
help.action.op_gen_manual.bcd_decode.description=Unpacks BCD nibbles to decimal digits; each nibble must be between 0 and 9.
help.action.op_gen_manual.bcd_decode.example=Hex 012345 becomes 012345. A nibble A–F is not valid BCD.
help.action.op_gen_manual.bcd_decode.title=Decode BCD
help.action.op_gen_manual.bcd_encode.description=Packs decimal digits as BCD: two digits per byte; an odd count is left-padded with zero.
help.action.op_gen_manual.bcd_encode.example=12345 packs as Hex 012345. Signs, decimal points and letters are not accepted.
help.action.op_gen_manual.bcd_encode.title=Encode BCD
help.action.op_gen_manual.comp3_decode.description=Decodes COMP-3 while validating decimal nibbles and the trailing sign nibble.
help.action.op_gen_manual.comp3_decode.example=12345C becomes 12345. An unknown sign nibble or digit A–F is rejected.
help.action.op_gen_manual.comp3_decode.title=Decode COMP-3
help.action.op_gen_manual.comp3_encode.description=Encodes a decimal integer as COMP-3 with a trailing sign nibble: C positive, D negative.
help.action.op_gen_manual.comp3_encode.example=12345 produces 12345C and -12345 produces 12345D. Only a signed or unsigned integer is accepted.
help.action.op_gen_manual.comp3_encode.title=Encode COMP-3
help.action.op_gen_manual.compress.description=Compresses bytes parsed using the local formats with gzip, zlib or deflate. Compression does not encrypt or authenticate.
help.action.op_gen_manual.compress.example=Text “abc” can be compressed with gzip and Hex output. Select the same wrapper to decompress.
help.action.op_gen_manual.compress.title=Compress
help.action.op_gen_manual.convert.description=Parses input with the local formats and re-encodes the same bytes. The EBCDIC checkbox enables the selected code-page conversion.
help.action.op_gen_manual.convert.example=Text UTF-8 “AB” converts to Hex 4142. Odd-length Hex does not represent complete bytes.
help.action.op_gen_manual.convert.title=Convert
help.action.op_gen_manual.decompress.description=Decompresses with the selected wrapper and renders recovered bytes in the output format. Expansion is limited to 64 MiB.
help.action.op_gen_manual.decompress.example=A complete gzip input restores “abc”. Truncated data, a mismatched wrapper or output above the limit is rejected.
help.action.op_gen_manual.decompress.title=Decompress
help.action.op_gen_manual.endian.description=Reverses byte order within each selected word; the input length must divide evenly by the word size.
help.action.op_gen_manual.endian.example=With 32-bit words, Hex 01020304 becomes 04030201. Three bytes do not form a 32-bit word.
help.action.op_gen_manual.endian.title=Reverse bytes per word
help.action.op_gen_manual.extract_trace_hex.description=Finds Hex sequences in trace text: ignores conventional offsets and short groups, returning runs of at least four bytes.
help.action.op_gen_manual.extract_trace_hex.example=A line “00000100: DE AD BE EF” yields DEADBEEF. A trace without a four-byte run produces a warning or error.
help.action.op_gen_manual.extract_trace_hex.title=Extract Hex from trace
help.action.op_gen_manual.manage_templates.description=Opens conversion template controls. Help does not read personal names or saved values.
help.action.op_gen_manual.manage_templates.example=A template can remember input and output formats; applying it does not execute a conversion.
help.action.op_gen_manual.manage_templates.title=Manage templates
help.action.op_gen_manual.shift_left.description=Shifts Hex bits left while preserving width; bits shifted out are lost and zero bits enter.
help.action.op_gen_manual.shift_left.example=Hex 12 shifted left by 1 bit becomes 24. The shift count must be a non-negative integer; non-Hex input is rejected.
help.action.op_gen_manual.shift_left.title=Shift bits left
help.action.op_gen_manual.shift_right.description=Shifts Hex bits right while preserving width; zeros enter from the left.
help.action.op_gen_manual.shift_right.example=Hex 12 shifted right by 1 bit becomes 09 when two digits are preserved. Do not use a 0x prefix or negative shift.
help.action.op_gen_manual.shift_right.title=Shift bits right
help.action.op_gen_manual.url_decode.description=Decodes a URL form component as UTF-8; + is interpreted as a space.
help.action.op_gen_manual.url_decode.example=a+b becomes “a b”. An incomplete percent escape such as %2 causes an error.
help.action.op_gen_manual.url_decode.title=Decode URL component
help.action.op_gen_manual.url_encode.description=Encodes a URL form component using UTF-8; a space is represented as +.
help.action.op_gen_manual.url_encode.example=“a b” produces a+b. A literal + in input is encoded as a plus sign.
help.action.op_gen_manual.url_encode.title=Encode URL component
help.action.op_gen_mod.calculate.description=Computes the selected operation. Operands are parsed as Hex except Decimal XOR; each operation requires only its applicable operands.
help.action.op_gen_mod.calculate.example=In Hex, (03 + 04) mod 0B = 7. The inverse of 6 modulo 9 fails because the values are not coprime.
help.action.op_gen_mod.calculate.title=Calculate
help.action.op_gen_mod.select_operation.description=The operation determines required operands and whether a modulus is used. Standard operations read Hex; XOR choices declare their input base.
help.action.op_gen_mod.select_operation.example=GCD(a,b) needs A and B without a modulus; modular addition needs A, B and m. Decimal XOR requires decimal digits and displays Hex output.
help.action.op_gen_mod.select_operation.title=Select operation
help.action.op_gen_process_designer.node.example=Connect a text input, conversion and output node; dry run checks the graph without executing it. The example is illustrative; the requirements of the active control apply.
help.action.op_gen_random.generate.description=Generates between 1 and 1024 bytes with SecureRandom and renders them in the selected format. The actual value changes each run.
help.action.op_gen_random.generate.example=16 bytes produce 32 Hex characters, 24 Base64 characters, or 16 separated decimal values. Zero, 1025 or non-integer text is rejected.
help.action.op_gen_random.generate.title=Generate
help.action.op_gen_random.select_format.description=Selects the output representation for the next generation: Hexadecimal, Decimal, Base64 or Binary. Changing the selector does not reformat the existing output.
help.action.op_gen_random.select_format.example=If 16 bytes are already shown as 32 Hex digits, selecting Base64 leaves those digits unchanged. Select Generate to draw another 16-byte sequence as 24 Base64 characters.
help.action.op_gen_random.select_format.title=Select format
help.action.op_keys_format_workbench.convert.description=Uses this action’s own parser and formats; specialized actions may not follow the global selectors.
help.action.op_keys_format_workbench.convert.example=Parse a public certificate fixture, inspect metadata, then convert between supported DER and PEM formats. The example is illustrative; the requirements of the active control apply.
help.action.op_keys_format_workbench.convert.title=Convert
help.action.op_keys_format_workbench.copy.description=Applies the copy action with the relevant controls on this screen.
help.action.op_keys_format_workbench.copy.example=Parse a public certificate fixture, inspect metadata, then convert between supported DER and PEM formats. The example is illustrative; the requirements of the active control apply.
help.action.op_keys_format_workbench.copy.title=Copy
help.action.op_keys_format_workbench.load_file.description=Applies the load file action with the relevant controls on this screen.
help.action.op_keys_format_workbench.load_file.example=Parse a public certificate fixture, inspect metadata, then convert between supported DER and PEM formats. The example is illustrative; the requirements of the active control apply.
help.action.op_keys_format_workbench.load_file.title=Load file
help.action.op_keys_format_workbench.load_shelf.description=Applies the load shelf action with the relevant controls on this screen.
help.action.op_keys_format_workbench.load_shelf.example=Parse a public certificate fixture, inspect metadata, then convert between supported DER and PEM formats. The example is illustrative; the requirements of the active control apply.
help.action.op_keys_format_workbench.load_shelf.title=Load from Clipboard Shelf
help.action.op_keys_format_workbench.parse.description=Detects format and extracts available metadata; it does not establish trust or validate a chain.
help.action.op_keys_format_workbench.parse.example=Parse a public certificate fixture, inspect metadata, then convert between supported DER and PEM formats. The example is illustrative; the requirements of the active control apply.
help.action.op_keys_format_workbench.parse.title=Detect and parse
help.action.op_keys_format_workbench.send_to_shelf.description=Applies the send to shelf action with the relevant controls on this screen.
help.action.op_keys_format_workbench.send_to_shelf.example=Parse a public certificate fixture, inspect metadata, then convert between supported DER and PEM formats. The example is illustrative; the requirements of the active control apply.
help.action.op_keys_format_workbench.send_to_shelf.title=Send to Clipboard Shelf
