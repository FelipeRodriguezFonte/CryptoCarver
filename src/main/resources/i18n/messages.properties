help.node.option.unpad.paddingtype.iso_7816_4=Removes according to ISO_7816_4: Implementation adds 80 and zeros (same as ISO 9797-1 M2) and removes by finding that marker.
help.node.option.unpad.paddingtype.iso_9797_m1=Removes according to ISO_9797_M1: Adds zero bytes to the next block; there is no marker, and removal cannot distinguish data zeros.
help.node.option.unpad.paddingtype.iso_9797_m2=Removes according to ISO_9797_M2: Adds 80 followed by zeros to the block; removal searches for 80 before trailing zeros.
help.node.option.unpad.paddingtype.pkcs5=Removes according to PKCS5: Pads with bytes valued as the count added; the handler fixes the block at 8 bytes and ignores blockSize.
help.node.option.unpad.paddingtype.pkcs7=Removes according to PKCS7: Pads to blockSize; every added byte contains N, the number of bytes added. An already aligned input gets a full block.
help.node.option.unpad.paddingtype.zero=Removes according to ZERO: Pads with zero bytes only when unaligned; removal strips all trailing zeros, including possible data.
