# B04 contextual help: format preserving, file, OpenPGP, RSA, and encrypted-file analysis
help.operation.op_fpe.purpose=Apply FF1 or FF3-1 to symbols in a defined ordered alphabet. The output keeps the input length and alphabet; FPE does not authenticate or conceal the alphabet.
help.operation.op_sym_file.purpose=Encrypt or decrypt files through streaming or independent line records. The destination and, for whole-file AEAD, its detached tag file contain the data needed alongside the recipe parameters.
help.operation.op_openpgp.purpose=Use the Java OpenPGP implementation for keys, armored messages, files and signatures. Optional GnuPG checks are a separate external interoperability action.
help.operation.op_asym_ciphers.purpose=Encrypt with an RSA public key and decrypt with its matching private key. Padding sets the plaintext size limit; RSA/ECB in the JCE transformation name is not symmetric ECB.
help.operation.aux_encrypted_file_analysis.purpose=Test explicit hypotheses against an encrypted-file sample. A format hint or plausible plaintext candidate is not proof of the original algorithm or authenticated recovery.

help.action.op_fpe.encrypt.title=Encrypt symbols
help.action.op_fpe.encrypt.description=Encrypts the input with the selected FF1/FF3-1 construction, AES key, tweak and ordered alphabet. Valid output has the same length and uses only that alphabet; FPE does not authenticate the result.
help.action.op_fpe.encrypt.example=Example: choose Decimal (0-9), FF1, a 16-byte test AES key, an optional tweak and a valid decimal input; decrypting the result with the same parameters recovers the input.
help.action.op_fpe.decrypt.title=Decrypt symbols
help.action.op_fpe.decrypt.description=Decrypts using the same algorithm, key, tweak and exact alphabet order used for encryption. A different alphabet order or parameter set does not recover the original.
help.action.op_fpe.decrypt.example=Example: decrypt an accepted decimal FF1 result with the same key and tweak and compare it with the original decimal string.
help.action.op_fpe.select_algorithm.title=Choose algorithm
help.action.op_fpe.select_algorithm.description=FF1 permits the configured tweak length up to the implementation limit; FF3-1 requires exactly seven tweak bytes and has a radix-dependent maximum input length.
help.action.op_fpe.select_algorithm.example=Example: switching to FF3-1 makes a six-byte tweak invalid; the help limit follows the current public alphabet radix.
help.action.op_fpe.select_alphabet.title=Choose alphabet
help.action.op_fpe.select_alphabet.description=The preset supplies an ordered alphabet. Custom accepts the entered symbol order; symbols must be unique, single-byte characters, and the input must use only those symbols.
help.action.op_fpe.select_alphabet.example=Example: alphabet 0123456789 has radix 10; a duplicated symbol or reordered alphabet changes the domain and is rejected or decrypts differently.
help.field.op_fpe.operation.label=Direction
help.field.op_fpe.operation.description=Select Encrypt or Decrypt. It chooses which FPE transformation the Run FPE action calls.
help.field.op_fpe.algorithm.label=Algorithm
help.field.op_fpe.algorithm.description=FF1 or FF3-1 from the implementation. FF3-1 is legacy compatibility and uses its own seven-byte tweak and radix-dependent length bound.
help.field.op_fpe.key.label=AES key
help.field.op_fpe.key.description=Hex-encoded AES key of 16, 24 or 32 bytes (32, 48 or 64 Hex digits). Key text is not copied into help context.
help.field.op_fpe.alphabet_preset.label=Alphabet preset
help.field.op_fpe.alphabet_preset.description=Decimal, alphanumeric, printable ASCII or Custom. Presets set an ordered symbol list; Custom lets you define the order.
help.field.op_fpe.alphabet.label=Ordered alphabet
help.field.op_fpe.alphabet.description=The alphabet's ordered symbols map to digits 0 through radix-1. Radix must be 2..256; symbols must be unique one-byte characters. Custom alphabet text is never copied into help context; only its length may be published as radix.
help.field.op_fpe.tweak.label=Tweak
help.field.op_fpe.tweak.description=Optional Hex context for FF1; FF3-1 requires exactly 7 bytes. It is not a key, IV or authentication tag and must match for decryption.
help.field.op_fpe.input.label=Input
help.field.op_fpe.output.label=Result
help.field.op_fpe.output.description=The transformed string keeps the input length and alphabet. This format-preserving property is not an integrity check; verify by decrypting with the exact original parameters.
help.option.op_fpe.operation.encrypt=Encrypt input symbols.
help.option.op_fpe.operation.decrypt=Decrypt input symbols.
help.option.op_fpe.algorithm.ff1=FF1; tweak is optional, with the implementation's configured maximum.
help.option.op_fpe.algorithm.ff3_1=FF3-1 legacy construction; exactly seven tweak bytes and a radix-dependent maximum length.
help.option.op_fpe.alphabet_preset.decimal_0_9=Ordered symbols 0 through 9; radix 10.
help.option.op_fpe.alphabet_preset.alphanumeric=Ordered digits, uppercase Latin letters, then lowercase Latin letters; radix 62.
help.option.op_fpe.alphabet_preset.ascii_printable=Printable ASCII from space through tilde in code-point order; radix 95.
help.option.op_fpe.alphabet_preset.custom=Uses the exact custom symbol order; accepted only for unique single-byte symbols and radix 2..256.

help.action.op_sym_file.encrypt_file.title=Encrypt whole file
help.action.op_sym_file.encrypt_file.description=Streams source bytes to a new destination. GCM and ChaCha20-Poly1305 write a separate 16-byte tag file; CTR and CBC do not authenticate the ciphertext.
help.action.op_sym_file.encrypt_file.example=Example: AES-256-GCM encrypts a binary source to a ciphertext file and detached tag file; preserve the key, nonce and any AAD for decryption.
help.action.op_sym_file.decrypt_file.title=Decrypt whole file
help.action.op_sym_file.decrypt_file.description=Streams ciphertext to a staged destination and promotes it only after successful processing. AEAD requires the matching detached tag; a failed tag does not leave a completed plaintext destination.
help.action.op_sym_file.decrypt_file.example=Example: decrypt GCM output using the same key, nonce, AAD and detached tag; changing the tag fails authentication.
help.action.op_sym_file.encrypt_lines.title=Encrypt line records
help.action.op_sym_file.encrypt_lines.description=Treats each input line as a separate text record. AEAD records carry fresh per-line nonce/tag data; CBC uses the supplied IV for each line and has no authentication.
help.action.op_sym_file.encrypt_lines.example=Example: select UTF-8 and Base64URL, encrypt two text lines, and inspect that each AEAD record has its own nonce and tag.
help.action.op_sym_file.decrypt_lines.title=Decrypt line records
help.action.op_sym_file.decrypt_lines.description=Parses the selected record encoding and charset, then decrypts each line independently. AEAD authentication applies per record; compact CBC records require the matching compact setting and supplied IV.
help.action.op_sym_file.decrypt_lines.example=Example: decrypt records produced with Base64URL and UTF-8 using the same key and AAD; a modified authenticated record fails.
help.action.op_sym_file.choose_source.title=Choose source file
help.action.op_sym_file.choose_source.description=Selects the file read by the next file-cipher action. Help does not open or inspect the path.
help.action.op_sym_file.choose_source.example=Example: choose a small binary fixture and keep its bytes unchanged while reviewing help.
help.action.op_sym_file.choose_destination.title=Choose destination
help.action.op_sym_file.choose_destination.description=Selects where the output will be staged and promoted. Existing destinations require explicit confirmation; cancellation leaves the job unstarted.
help.action.op_sym_file.choose_destination.example=Example: cancel the overwrite prompt and verify the existing file remains unchanged.
help.action.op_sym_file.choose_tag.title=Choose tag file
help.action.op_sym_file.choose_tag.description=Selects the detached tag path required by whole-file GCM and ChaCha20-Poly1305. Line AEAD stores nonce/tag with each record instead.
help.action.op_sym_file.choose_tag.example=Example: use the tag produced by the matching whole-file encryption when decrypting.
help.action.op_sym_file.generate_nonce.title=Generate IV / nonce
help.action.op_sym_file.generate_nonce.description=Generates fresh random bytes for the selected whole-file profile. In AEAD line mode, each record generates its own nonce; CBC line mode reuses the supplied IV as implemented.
help.action.op_sym_file.generate_nonce.example=Example: generate a fresh GCM nonce for a new file encryption and retain it with the decryption parameters.
help.action.op_sym_file.export_recipe.title=Export recipe
help.action.op_sym_file.export_recipe.description=Exports the selected profile, line settings and optional IV/nonce, AAD and tag reference; the secret key is never included. Export may create a local recipe file after confirmation.
help.action.op_sym_file.export_recipe.example=Example: export a recipe without the key, then provide the key separately when reproducing the operation.
help.action.op_sym_file.import_recipe.title=Import recipe
help.action.op_sym_file.import_recipe.description=Loads a file-cipher recipe into the profile and parameter controls. Review imported settings and supply the secret key separately; help itself does not read a recipe.
help.action.op_sym_file.import_recipe.example=Example: import a recipe and verify the selected profile and line settings before starting a file job.
help.field.op_sym_file.profile.label=File profile
help.field.op_sym_file.profile.description=Selects AES-256-GCM, AES-256-CTR, AES-256-CBC or ChaCha20-Poly1305. The profile determines nonce/IV, authentication and tag requirements.
help.field.op_sym_file.source.label=Source file
help.field.op_sym_file.source.description=Path whose bytes or lines will be read by an explicit file operation. Help never opens or stores the path.
help.field.op_sym_file.destination.label=Destination file
help.field.op_sym_file.destination.description=Path for staged output. Promotion handles existing destinations through its confirmation flow; canceling prevents replacement.
help.field.op_sym_file.tag_file.label=Detached tag file
help.field.op_sym_file.tag_file.description=Separate 16-byte authentication tag for whole-file GCM or ChaCha20-Poly1305. It is required to decrypt those outputs and is not part of the ciphertext file.
help.field.op_sym_file.key.label=Key
help.field.op_sym_file.key.description=Hex key for the selected profile. AES-256 profiles require 32 bytes; ChaCha20-Poly1305 uses the implementation's 32-byte key. Key text is never copied into help context.
help.field.op_sym_file.iv_nonce.label=IV / nonce
help.field.op_sym_file.iv_nonce.description=Hex initialization value used by the selected profile. Whole-file actions require it; AEAD line encryption generates a fresh nonce per record. Preserve the applicable value(s) for decryption.
help.field.op_sym_file.aad.label=Additional authenticated data
help.field.op_sym_file.aad.description=Optional Hex AAD for AEAD profiles only. It is authenticated but not encrypted; the receiver must supply the same bytes.
help.field.op_sym_file.lines_mode.label=Process lines independently
help.field.op_sym_file.lines_mode.description=When checked, treats records as text lines rather than streaming one binary file. Encoding and charset controls apply only here; whole-file encryption preserves arbitrary bytes.
help.field.op_sym_file.line_encoding.label=Record encoding
help.field.op_sym_file.line_encoding.description=Selects Base64URL or Hexadecimal representation for each line record. This is a representation, not a cipher algorithm.
help.field.op_sym_file.charset.label=Text charset
help.field.op_sym_file.charset.description=Selects UTF-8 or one of the supported EBCDIC code pages for line text. It does not transcode whole-file binary mode.
help.field.op_sym_file.compact_cbc.label=Compact CBC records
help.field.op_sym_file.compact_cbc.description=Uses the compact headerless CBC line-record layout. It applies only in line mode with CBC and requires the same compact interpretation and IV at decryption.
help.field.op_sym_file.result.label=Result
help.field.op_sym_file.result.description=Shows job status and byte/record counts, not a verification of ciphertext integrity. AEAD tag validation is the integrity check; CTR and CBC output is unauthenticated.
help.option.op_sym_file.profile.aes_256_gcm=AES-256-GCM; 32-byte key, nonce, optional AAD and detached 16-byte tag for whole-file mode.
help.option.op_sym_file.profile.aes_256_ctr=AES-256-CTR; 32-byte key and IV; ciphertext has no authentication tag.
help.option.op_sym_file.profile.aes_256_cbc=AES-256-CBC; 32-byte key and IV; ciphertext has no authentication tag.
help.option.op_sym_file.profile.chacha20_poly1305=ChaCha20-Poly1305; 32-byte key, nonce, optional AAD and detached 16-byte tag for whole-file mode.
help.option.op_sym_file.line_encoding.base64url=Represent each record using Base64URL.
help.option.op_sym_file.line_encoding.hexadecimal=Represent each record using hexadecimal.

help.action.op_asym_ciphers.encrypt.title=Encrypt with public key
help.action.op_asym_ciphers.encrypt.description=Encrypts decoded input bytes using the selected RSA padding and a public RSA key. The handler's effective OAEP digest and MGF1 digest determine the exact maximum.
help.action.op_asym_ciphers.encrypt.example=Example: an input below the displayed OAEP limit encrypts with a matching RSA public key and decrypts with its private key.
help.action.op_asym_ciphers.decrypt.title=Decrypt with private key
help.action.op_asym_ciphers.decrypt.description=Decrypts ciphertext bytes with the matching RSA private key and selected padding. A family mismatch, wrong key or incompatible ciphertext fails; raw NoPadding is not an integrity check.
help.action.op_asym_ciphers.decrypt.example=Example: decrypt ciphertext produced by the matching public key and OAEP parameters; an unrelated key fails.
help.action.op_asym_ciphers.select_padding.title=Choose RSA padding
help.action.op_asym_ciphers.select_padding.description=Changes the RSA scheme and recalculates the public-key plaintext limit from modulus bytes and the effective scheme parameters. “ECB” in the JCE transformation label is not symmetric ECB.
help.action.op_asym_ciphers.select_padding.example=Example: for a 2048-bit modulus, PKCS#1 v1.5 allows 245 bytes, OAEP-SHA-1 214 bytes, and OAEP-SHA-256 190 bytes.
help.action.op_asym_ciphers.load_public_key.title=Load or paste public key
help.action.op_asym_ciphers.load_public_key.description=Accepts the public RSA key formats handled by this panel, including PEM and supported Hex/Base64 DER input. A certificate may be used only when the current parser accepts it.
help.action.op_asym_ciphers.load_public_key.example=Example: load an RSA SubjectPublicKeyInfo PEM and confirm its key family before encryption.
help.action.op_asym_ciphers.use_public_key_shelf.title=Use public key from Shelf
help.action.op_asym_ciphers.use_public_key_shelf.description=Copies the selected public-key item from the local Shelf into this panel; it does not import a private key.
help.action.op_asym_ciphers.use_public_key_shelf.example=Example: choose an RSA public-key Shelf item, then encrypt a payload within its padding limit.
help.action.op_asym_ciphers.load_private_key.title=Load or paste private key
help.action.op_asym_ciphers.load_private_key.description=Accepts private RSA key material in the formats handled by the panel. The private material remains in the form and is not read by contextual help.
help.action.op_asym_ciphers.load_private_key.example=Example: load the PKCS#8 private key matching the public key used for encryption.
help.action.op_asym_ciphers.use_private_key_shelf.title=Use private key from Shelf
help.action.op_asym_ciphers.use_private_key_shelf.description=Copies a selected private-key item from the local Shelf into this panel for an explicit decryption action.
help.action.op_asym_ciphers.use_private_key_shelf.example=Example: select the matching RSA private-key item and decrypt a compatible ciphertext.
help.field.op_asym_ciphers.padding.label=RSA padding
help.field.op_asym_ciphers.padding.description=PKCS#1 v1.5, OAEP-SHA-1, OAEP-SHA-256 or NoPadding. The BC transformation uses SHA-1/MGF1-SHA-1 for OAEP-SHA-1 and SHA-256/MGF1-SHA-256 for OAEP-SHA-256. PKCS#1 v1.5 and raw mode carry the visible legacy warning.
help.field.op_asym_ciphers.input_format.label=Input format
help.field.op_asym_ciphers.input_format.description=The panel accepts Text (UTF-8), Hexadecimal, Base64, or Binary. Text encodes as UTF-8; Hexadecimal and Base64 decode to bytes; Binary uses the panel's bit-string parser. This is a representation, not an encryption algorithm.
help.field.op_asym_ciphers.output_format.label=Output format
help.field.op_asym_ciphers.output_format.description=The panel renders bytes as Text (UTF-8), Hexadecimal, Base64, or Binary. Text decodes as UTF-8 and Binary renders a bit string. These are the panel's actual choices, not a universal codec list.
help.field.op_asym_ciphers.public_key.label=Public key
help.field.op_asym_ciphers.public_key.description=RSA public material used for encryption; panel text takes precedence over the generated Keys-module pair. Accepted forms are SubjectPublicKeyInfo PEM, Hex-encoded X.509 DER, or Base64-encoded X.509 DER, tried in that order. Help uses only already-loaded public metadata and never parses key text.
help.field.op_asym_ciphers.private_key.label=Private key
help.field.op_asym_ciphers.private_key.description=Matching RSA private material used for decryption; panel text takes precedence over the generated key pair. Accepted forms are PKCS#8 PEM, Hex-encoded PKCS#8 DER, or Base64-encoded PKCS#8 DER, tried in that order. Help never parses private key text.
help.field.op_asym_ciphers.input.label=Payload / ciphertext
help.field.op_asym_ciphers.input.description=Bytes decoded by the selected input representation. Encryption input must fit the current padding limit; decryption input must be compatible with the RSA modulus and padding.
help.field.op_asym_ciphers.max_plaintext.label=Maximum plaintext size
help.field.op_asym_ciphers.max_plaintext.description=Public-key modulus size in bytes minus the scheme overhead: 11 for PKCS#1 v1.5, 42 for OAEP-SHA-1 and 66 for OAEP-SHA-256. NoPadding uses a separate raw-size rule and is not shown as a padded limit.
help.field.op_asym_ciphers.output.label=Result
help.field.op_asym_ciphers.output.description=Ciphertext after encryption or bytes recovered after decryption, rendered using the selected output representation. Successful RSA decryption alone is not an authenticity check.
help.option.op_asym_ciphers.padding.rsa_ecb_pkcs1padding=RSA PKCS#1 v1.5 encryption padding; legacy warning applies.
help.option.op_asym_ciphers.padding.rsa_ecb_oaepwithsha_1andmgf1padding=RSA OAEP with SHA-1 digest and MGF1-SHA-1, as returned by the current BC transformation.
help.option.op_asym_ciphers.padding.rsa_ecb_oaepwithsha_256andmgf1padding=RSA OAEP with SHA-256 digest and MGF1-SHA-256, as returned by the current BC transformation.
help.option.op_asym_ciphers.padding.rsa_ecb_nopadding=Raw RSA without padding; legacy warning applies and plaintext structure must be managed by the caller.




help.action.aux_encrypted_file_analysis.analyze.title=Analyze encrypted sample
help.action.aux_encrypted_file_analysis.analyze.description=Runs the explicit analyzer, which may create a report folder beside the input. Opening help does not read files or start analysis.
help.action.aux_encrypted_file_analysis.analyze.example=Example: run the tutorial 24 fixture with its known parameters and compare the report's candidate and verification evidence.






help.field.aux_encrypted_file_analysis.file_representation.label=File / representation
help.field.aux_encrypted_file_analysis.file_representation.description=Source file bytes or an explicitly supported textual representation. A format hint is a candidate decoding, not evidence of the cipher.
help.field.aux_encrypted_file_analysis.algorithm.label=Algorithm hypothesis
help.field.aux_encrypted_file_analysis.algorithm.description=Candidate symmetric algorithm tested against the sample. A successful-looking plaintext is not confirmation by itself.
help.field.aux_encrypted_file_analysis.mode.label=Mode hypothesis
help.field.aux_encrypted_file_analysis.mode.description=Candidate mode tested by the analyzer. Authentication is available only for supported authenticated profiles with the correct tag and parameters.
help.field.aux_encrypted_file_analysis.padding.label=Padding hypothesis
help.field.aux_encrypted_file_analysis.padding.description=Candidate block padding for modes that use it. CTR and authenticated profiles do not use this CBC-style padding choice.
help.field.aux_encrypted_file_analysis.key.label=Key
help.field.aux_encrypted_file_analysis.key.description=Key material supplied to an explicit analysis attempt. Contextual help never reads or stores the key.
help.field.aux_encrypted_file_analysis.iv_nonce.label=IV / nonce
help.field.aux_encrypted_file_analysis.iv_nonce.description=Public parameter supplied for the candidate mode. It is distinct from a key and must match the encrypted data's original value.
help.field.aux_encrypted_file_analysis.tag.label=Authentication tag
help.field.aux_encrypted_file_analysis.tag.description=Expected tag for authenticated modes. Only a successful cryptographic tag check establishes authenticated recovery for that attempt.
help.field.aux_encrypted_file_analysis.aad.label=Additional authenticated data
help.field.aux_encrypted_file_analysis.aad.description=Optional AAD for an authenticated candidate; it is authenticated but not encrypted and must match exactly.
help.field.aux_encrypted_file_analysis.expected_result.label=Expected result
help.field.aux_encrypted_file_analysis.expected_result.description=Optional criterion used to assess a candidate. A readable result or matching text is not a substitute for cryptographic authentication.
help.field.aux_encrypted_file_analysis.candidates.label=Candidates
help.field.aux_encrypted_file_analysis.candidates.description=Ranked hypotheses from the analyzer, with the evidence and limitations recorded for each attempt. A candidate is not automatically promoted or verified.
help.field.aux_encrypted_file_analysis.report.label=Report
help.field.aux_encrypted_file_analysis.report.description=Generated report artifacts summarize attempts and candidate evidence. They may contain recovered content only where the current report policy allows it.
help.analysis.noRecoveryGuarantee=Candidate, format hint, readable output and unauthenticated decryption do not prove the original parameters or content. Authenticated recovery requires a successful tag check with the matching key, nonce and AAD.
help.analysis.current.format=Current format hypothesis
help.analysis.current.mode=Current mode hypothesis
help.analysis.current.padding=Current padding hypothesis
help.fpe.currentAlgorithm=Selected algorithm code
help.fpe.currentPreset=Selected alphabet preset code
help.fpe.currentRadix=Public alphabet radix
help.fpe.minimumDomain=The selected alphabet and input length must yield a domain of at least 1,000,000 values; input is limited to 4096 symbols.
help.fpe.ff1Limit=FF1 implementation maximum input length
help.fpe.ff3Limit=FF3-1 maximum input length for this radix
help.fpe.ff1Tweak=FF1 accepts an optional tweak of up to 1024 bytes; decryption must use the same tweak.
help.fpe.ff3Tweak=FF3-1 requires exactly seven tweak bytes; decryption must use the same tweak.
help.fileCipher.currentProfile=Selected file profile code
help.fileCipher.linesEnabled=Line mode is active: text charset, record encoding and line-specific layout apply.
help.fileCipher.linesDisabled=Whole-file streaming is active: input is arbitrary bytes and line-record controls do not apply.
help.fileCipher.currentLineEncoding=Record encoding code
help.fileCipher.currentCharset=Text charset code
help.fileCipher.compactCbc=Compact headerless CBC line records are selected; decryption needs the same interpretation and IV.
help.fileCipher.lineAuthentication=AEAD line records authenticate independently; CBC/CTR line records are not authenticated.
help.fileCipher.detachedTag=Whole-file AEAD stores its 16-byte tag in a separate file.
help.fileCipher.ctrIntegrity=CTR provides confidentiality only; it does not authenticate ciphertext.
help.fileCipher.cbcIntegrity=CBC provides confidentiality only; it does not authenticate ciphertext.
help.rsa.currentPadding=Selected RSA padding
help.rsa.currentMaximum=Current maximum plaintext size for this public modulus and padding
help.rsa.legacyWarning=The selected legacy/raw scheme has the warning shown by the current panel; prefer OAEP for new RSA encryption where interoperability permits.
help.openpgp.publicKey.present=Public-key field contains text; help does not parse or validate the key.
help.openpgp.publicKey.absent=Public-key field is empty; no assumption is made from an earlier result.
help.openpgp.secretKey.present=Secret-key field contains text; help does not parse, validate or copy the secret key.
help.openpgp.secretKey.absent=Secret-key field is empty.
help.openpgp.signature.present=Signature field contains text; presence is not signature verification.
help.openpgp.signature.absent=Signature field is empty.
help.openpgp.input.present=Input field contains text; help does not read the payload.
help.openpgp.input.absent=Input field is empty.
help.openpgp.passphrase.present=Passphrase field is non-empty; help does not read or validate it.
help.openpgp.passphrase.absent=Passphrase field is empty.
