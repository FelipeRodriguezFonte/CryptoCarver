# B01 contextual help: symmetric ciphers and global format contracts
help.operation.op_sym_ciphers.purpose=Encrypts or decrypts bytes with a shared key. Authentication depends on the algorithm/mode; check the current selection’s applicability.
help.symmetric.current=Current selection
help.symmetric.iv.recommended=recommended
help.unit.bytes=bytes
help.symmetric.rule.stream=Stream algorithm: mode and padding selectors do not participate; their previous selections are retained.
help.symmetric.rule.block=Block algorithm: the crypto engine/provider determines transformation compatibility; the selector does not filter combinations.
help.symmetric.rule.ecb=ECB does not use an IV and the interface displays a warning.
help.symmetric.rule.iv=This variant uses an IV/nonce.
help.symmetric.rule.padding.selectable=This mode allows padding selection.
help.symmetric.rule.padding.fixed=Padding is not configurable: the selector is fixed to NoPadding or does not apply to a stream algorithm.
help.symmetric.rule.aead=This variant generates/verifies a 16-byte authentication tag.
help.symmetric.rule.no_aead=This variant does not authenticate ciphertext; successful decryption does not verify integrity.
help.symmetric.rule.aad.used=AAD is passed to the block GCM path.
help.symmetric.rule.aad.visible_only=The interface displays AAD, but the current dedicated handler does not pass it to this operation.
help.format.selected=Selected format
help.format.availableOptions=Formats allowed for this operation
help.format.selection.memory=Input selection is remembered per operation during this session; output preference is stored per profile.
help.field.op_sym_ciphers.algorithm.label=Algorithm
help.field.op_sym_ciphers.algorithm.description=Choose a registered block or stream cipher. The key size belongs to the selected algorithm; it is independent of the payload format.
help.field.op_sym_ciphers.mode.label=Mode
help.field.op_sym_ciphers.mode.description=The block-cipher construction applied to the selected algorithm. Stream algorithms do not use this selector; the UI disables it while retaining its prior value.
help.field.op_sym_ciphers.padding.label=Padding
help.field.op_sym_ciphers.padding.description=Block padding used when the chosen mode accepts it. CTR, CFB, OFB and GCM use NoPadding here; stream algorithms ignore block padding.
help.field.op_sym_ciphers.key_source.label=Key source
help.field.op_sym_ciphers.key_source.description=Choose a manually entered hexadecimal key or a key reference from the local simulated Key Lab. A reference is usable only when its material is available.
help.field.op_sym_ciphers.manual_key.label=Manual key
help.field.op_sym_ciphers.manual_key.description=Enter key bytes as hexadecimal, two digits per byte. AES-128/192/256 requires 16/24/32 bytes; DES 8; 3DES 16 or 24; Salsa20 and ChaCha20 variants 32. Key input is separate from global payload formats; help never copies it.
help.field.op_sym_ciphers.key_lab_key.label=Key Lab key
help.field.op_sym_ciphers.key_lab_key.description=Select a local Simulated HSM/Key Lab entry. The selected algorithm still determines the required key size. Help records only whether a selection/material is available, never its identifier or bytes.
help.field.op_sym_ciphers.iv_nonce.label=IV / nonce
help.field.op_sym_ciphers.iv_nonce.description=Enter hexadecimal bytes for the active mode. ECB needs no IV. AES CBC/CTR/CFB/OFB use a 16-byte IV; DES/3DES use 8 bytes. Salsa20 uses an 8-byte nonce; ChaCha20 accepts 8 or 12 bytes (the UI generates 12); ChaCha20-Poly1305 requires 12; XChaCha20-Poly1305 requires 24. GCM accepts 8, 12, or 16 bytes and the UI generates 12. Stream and AEAD variants require their stated nonce lengths.
help.field.op_sym_ciphers.aad.label=Additional authenticated data (AAD)
help.field.op_sym_ciphers.aad.description=Optional authenticated data for the block-cipher GCM path. The handler first parses hexadecimal and falls back to US-ASCII bytes when parsing fails. The ChaCha20-Poly1305 and XChaCha20-Poly1305 UI handlers currently display this field but do not pass it to the operation; other modes do not use AAD.
help.field.op_sym_ciphers.tag.label=Authentication tag
help.field.op_sym_ciphers.tag.description=Detached authentication tag shown as hexadecimal. GCM and the Poly1305 variants use a 16-byte tag in this UI. Decryption requires the matching tag; a mismatch fails authentication. Non-AEAD algorithms do not use it.
help.field.op_sym_ciphers.payload.label=Input payload
help.field.op_sym_ciphers.payload.description=Data to encrypt or decrypt. The global input format decodes it to bytes; that format does not change key parsing.
help.field.op_sym_ciphers.output.label=Output result
help.field.op_sym_ciphers.output.description=The output uses the global output representation. AEAD results also expose the tag separately; retain ciphertext, nonce, tag, and any AAD needed for decryption.
help.action.op_sym_ciphers.encrypt.title=Encrypt
help.action.op_sym_ciphers.encrypt.description=Encrypts decoded input bytes with the selected key and parameters. GCM and the Poly1305 variants authenticate; ECB/CBC/CTR/CFB/OFB and plain Salsa20/ChaCha20 do not authenticate the ciphertext. Never reuse a nonce with the same key for GCM or stream ciphers.
help.action.op_sym_ciphers.encrypt.example=Synthetic example: AES-256/GCM, key 000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F, 12-byte nonce 000102030405060708090A0B, AAD 101112, UTF-8 payload test. Save the returned ciphertext and 16-byte tag with the nonce and AAD. Decrypting those values with the same key must recover UTF-8 test.
help.action.op_sym_ciphers.decrypt.title=Decrypt
help.action.op_sym_ciphers.decrypt.description=Decrypts input bytes with the matching algorithm, key, mode, IV/nonce and padding. For AEAD, supply the matching 16-byte tag and AAD where the active handler uses AAD; an altered tag or wrong key fails authentication.
help.action.op_sym_ciphers.decrypt.example=Negative check: use the preceding synthetic AES-GCM ciphertext and nonce, but change one tag byte. Decryption must fail authentication and must not be treated as recovered plaintext.
help.action.op_sym_ciphers.generate_iv.title=Generate IV / nonce
help.action.op_sym_ciphers.generate_iv.description=Generates random hexadecimal bytes using the current algorithm and mode recommendation. It does not encrypt or change the payload. For ECB the action has no IV to generate.
help.action.op_sym_ciphers.generate_iv.example=For AES/GCM the UI generates 12 random bytes, shown as 24 hexadecimal digits. GCM also accepts 8- and 16-byte nonces; follow the selected algorithm’s requirements.
help.action.op_sym_ciphers.select_key_source.title=Select key source
help.action.op_sym_ciphers.select_key_source.description=Switches between Manual Input and the simulated HSM source. The HSM choice refers to a local Key Lab entry; it does not transmit key material.
help.action.op_sym_ciphers.select_key_source.example=Choose Manual Input, then provide synthetic hexadecimal key bytes in the key field; select Simulated HSM to choose a local stored entry.
help.action.op_sym_ciphers.paste_key.title=Paste key
help.action.op_sym_ciphers.paste_key.description=Pastes clipboard text into the manual key field; normal hexadecimal validation and operation checks still apply. Help does not read the clipboard.
help.action.op_sym_ciphers.paste_key.example=A 16-byte AES-128 key is 32 hexadecimal digits.
help.action.op_sym_ciphers.load_key.title=Load key file
help.action.op_sym_ciphers.load_key.description=Loads key text from a user-selected file into the manual key field. The resulting bytes are still subject to the selected algorithm’s key-length checks.
help.action.op_sym_ciphers.load_key.example=Load a local test file containing 32 hexadecimal digits for AES-128.
help.action.op_sym_ciphers.inspect_key.title=Inspect key
help.action.op_sym_ciphers.inspect_key.description=In Simulated HSM mode, opens local key metadata and availability. In Manual Input mode this action is hidden. Inspection is separate from encryption and help never exposes key bytes.
help.action.op_sym_ciphers.inspect_key.example=Select a test key entry and inspect its algorithm and availability.
help.action.op_sym_ciphers.save_key_lab.title=Save to Key Lab
help.action.op_sym_ciphers.save_key_lab.description=Stores the manual key through the existing local key-lab flow. This is a key-management action, not part of encryption.
help.action.op_sym_ciphers.save_key_lab.example=Use synthetic test material and verify that the new local entry is selectable.
help.action.op_sym_ciphers.use_key_shelf.title=Use key shelf
help.action.op_sym_ciphers.use_key_shelf.description=Selects a key from the local shelf for the manual-key workflow. The value remains key material and is never included in help context.
help.action.op_sym_ciphers.use_key_shelf.example=Choose a synthetic AES key from the shelf and confirm its bytes appear only in the key field.
help.action.op_sym_ciphers.copy_result.title=Copy result
help.action.op_sym_ciphers.copy_result.description=Copies the current result using the existing result action. Consulted help does not copy or alter it.
help.action.op_sym_ciphers.copy_result.example=Copy a completed synthetic ciphertext from the result controls.
help.action.op_sym_ciphers.shelf_result.title=Save result to shelf
help.action.op_sym_ciphers.shelf_result.description=Stores the current result in the local clipboard shelf. This does not change the selected cipher parameters.
help.action.op_sym_ciphers.shelf_result.example=Save a synthetic ciphertext and confirm it appears as a shelf item.
help.action.op_sym_ciphers.expand_result.title=Expand result
help.action.op_sym_ciphers.expand_result.description=Opens the full result view when the result is longer than its compact display.
help.action.op_sym_ciphers.expand_result.example=Expand a long synthetic ciphertext and compare its full text.

help.operation.op_jose_jwe.title=JWE (Encrypted)
help.operation.op_jose_jwe.purpose=Encrypt a payload with separate key management and content encryption choices, or decrypt a JWE you received. Help reads only public selectors and presence flags; it never inspects entered key or payload text.
help.action.op_jose_jwe.encrypt.title=Encrypt and generate JWE
help.action.op_jose_jwe.encrypt.description=Create a JWE from the selected key management algorithm (alg), content encryption (enc), payload, serialization and optional authenticated header values.
help.action.op_jose_jwe.encrypt.example=Choose RSA-OAEP-256 with A256GCM and Compact serialization for a single recipient, then encrypt a synthetic message.
help.action.op_jose_jwe.decrypt.title=Decrypt JWE
help.action.op_jose_jwe.decrypt.description=Parse a Compact or JSON JWE, supply the matching private key, secret or password, then authenticate and decrypt its payload.
help.action.op_jose_jwe.decrypt.example=Paste a test token and provide the matching private key or shared secret in its selected encoding.
help.action.op_jose_jwe.choose_serialization.title=Choose serialization
help.action.op_jose_jwe.choose_serialization.description=Select Compact, Flattened JSON or General JSON serialization. External AAD is supported only by the JSON serializations.
help.action.op_jose_jwe.choose_serialization.example=Choose General JSON to represent multiple recipients; use Compact only for a single recipient without external AAD.
help.action.op_jose_jwe.select_recipients.title=Select recipients
help.action.op_jose_jwe.select_recipients.description=Choose recipient key material. General JSON can represent multiple recipient entries when each supplied JWK declares its key management alg.
help.action.op_jose_jwe.select_recipients.example=For a multi-recipient test, provide a JWKS with at least two compatible keys and select General JSON.
help.action.op_jose_jwe.inspect_breakdown.title=Inspect decoded values and breakdown
help.action.op_jose_jwe.inspect_breakdown.description=Review decoded header and payload plus the serialized protected header, encrypted key, content IV, ciphertext and authentication tag.
help.action.op_jose_jwe.inspect_breakdown.example=Decrypt a test token, then compare its protected header and content encryption fields in the visual breakdown.
help.action.op_jose_jwe.import_public_key.title=Import recipient key
help.action.op_jose_jwe.import_public_key.description=Load public recipient material from a file using the existing JWE import flow. The help action itself does not open a file chooser.
help.action.op_jose_jwe.import_public_key.example=Import a test RSA or EC public key before encrypting.
help.action.op_jose_jwe.use_public_key_shelf.title=Use recipient material from the shelf
help.action.op_jose_jwe.use_public_key_shelf.description=Select previously stored public key material from the existing shelf menu. Help does not read the selected key text.
help.action.op_jose_jwe.use_public_key_shelf.example=Choose a public test key from the shelf, then confirm its encoding in the recipient field.
help.action.op_jose_jwe.import_private_key.title=Import decryption key
help.action.op_jose_jwe.import_private_key.description=Load private key or supported secret material using the existing JWE import flow. Help does not open a file chooser.
help.action.op_jose_jwe.import_private_key.example=Import a test private key that matches the JWE recipient.
help.action.op_jose_jwe.use_private_key_shelf.title=Use decryption material from the shelf
help.action.op_jose_jwe.use_private_key_shelf.description=Select previously stored decryption material from the existing shelf menu. Help never reads or copies its value.
help.action.op_jose_jwe.use_private_key_shelf.example=Choose a test decryption key from the shelf and use the matching secret format.
help.action.op_jose_jwe.copy_result.title=Copy result
help.action.op_jose_jwe.copy_result.description=Uses the existing result copy action for the generated JWE. Opening this help does not copy anything.
help.action.op_jose_jwe.copy_result.example=Copy a completed synthetic JWE from the result controls.
help.action.op_jose_jwe.expand_result.title=Expand result
help.action.op_jose_jwe.expand_result.description=Opens the full result view when the JWE is longer than its compact display.
help.action.op_jose_jwe.expand_result.example=Expand a long JSON serialization to review its full structure.

help.field.op_jose_jwe.key_algorithm.label=Key management (alg)
help.field.op_jose_jwe.key_algorithm.description=Selects how the content encryption key is supplied or protected: RSA, ECDH-ES, AES-KW, AES-GCMKW, PBES2 or direct (dir).
help.field.op_jose_jwe.content_encryption.label=Content encryption (enc)
help.field.op_jose_jwe.content_encryption.description=Selects the authenticated encryption algorithm for the payload. Its key size is distinct from the key management algorithm.
help.field.op_jose_jwe.compression.label=Compression (zip)
help.field.op_jose_jwe.compression.description=When enabled, applies the supported DEF compression before encryption. Avoid compression where secrets and attacker-controlled content are combined.
help.field.op_jose_jwe.secret_format.label=Secret format
help.field.op_jose_jwe.secret_format.description=Local to encryption: controls how shared-secret or PBES2 password text is decoded, independently of the decryption Secret format selector. It is ignored when the selected key management algorithm consumes an RSA or EC key.
help.field.op_jose_jwe.pbes2_iterations.label=PBES2 iterations
help.field.op_jose_jwe.pbes2_iterations.description=Used by PBES2-HS256+A128KW, PBES2-HS384+A192KW, and PBES2-HS512+A256KW. Blank uses 600000; a nonblank value must parse as a whole integer of at least 1000. The current UI validates this field for every encryption algorithm, even when the selected alg is not PBES2.
help.field.op_jose_jwe.public_key.label=Recipient key material
help.field.op_jose_jwe.public_key.description=For encryption, recipient key material may be PEM, an X.509 certificate, Base64 DER, a JWK, or a single-key JWKS; General JSON multi-recipient encryption accepts a JWKS with at least two recipient JWKs, each declaring alg. Symmetric key/password text is decoded using Secret format. Help never reads the material text.
help.field.op_jose_jwe.payload.label=Payload
help.field.op_jose_jwe.payload.description=Text to encrypt. Help reports only whether this field is non-empty and never reads or includes its contents.
help.field.op_jose_jwe.serialization.label=Serialization
help.field.op_jose_jwe.serialization.description=Compact uses five dot-separated parts for one recipient. Flattened JSON represents one recipient; General JSON supports recipient arrays and external AAD.
help.field.op_jose_jwe.aad.label=External AAD
help.field.op_jose_jwe.aad.description=Optional UTF-8 text authenticated with the ciphertext but kept outside the encrypted payload. It requires Flattened JSON or General JSON serialization.
help.field.op_jose_jwe.kid.label=Key ID (kid)
help.field.op_jose_jwe.kid.description=Optional recipient key identifier placed in the JWE header. General JSON with multiple recipients rejects any nonblank global kid, apu, or apv; provide these per-recipient values in the recipient JWKs.
help.field.op_jose_jwe.typ.label=Type (typ)
help.field.op_jose_jwe.typ.description=Optional header value identifying the media type of the JWE object.
help.field.op_jose_jwe.cty.label=Content type (cty)
help.field.op_jose_jwe.cty.description=Optional header value describing the encrypted payload. Use JWT when the encrypted payload is a JWT, such as a nested signed token.
help.field.op_jose_jwe.apu.label=Party U info (apu)
help.field.op_jose_jwe.apu.description=Optional ECDH-ES party information supplied as text and Base64URL-encoded for the JWE header. General JSON with multiple recipients rejects any nonblank global kid, apu, or apv; provide these per-recipient values in the recipient JWKs.
help.field.op_jose_jwe.apv.label=Party V info (apv)
help.field.op_jose_jwe.apv.description=Optional ECDH-ES party information supplied as text and Base64URL-encoded for the JWE header. General JSON with multiple recipients rejects any nonblank global kid, apu, or apv; provide these per-recipient values in the recipient JWKs.
help.field.op_jose_jwe.custom_header.label=Custom header parameters
help.field.op_jose_jwe.custom_header.description=Optional JSON object of additional JOSE header parameters. Reserved names rejected by the composer are alg, enc, zip, epk, iv, tag, p2s, and p2c. For example, {\"note\":\"demo\"} is allowed; {\"alg\":\"dir\"} and {\"p2c\":600000} are rejected.
help.field.op_jose_jwe.output.label=Generated JWE result
help.field.op_jose_jwe.output.description=Displays the generated Compact or JSON JWE. The help context never copies or reads the result.
help.field.op_jose_jwe.input.label=JWE token input
help.field.op_jose_jwe.input.description=Paste a received Compact, Flattened JSON or General JSON JWE for decryption. The contextual help does not parse the token or read its headers when opened; use the displayed decoded-header result after decryption to inspect token values.
help.field.op_jose_jwe.private_key.label=Decryption key material
help.field.op_jose_jwe.private_key.description=Supply the matching RSA/EC private key, shared secret or PBES2 password required by the received token. The private key may be PEM, Base64 DER, or a private JWK in a JWK/single-key JWKS form; an X.509 certificate supplies a public key and cannot replace the private decryption key. Help reports only whether this field is non-empty and never reads its contents.
help.field.op_jose_jwe.decrypt_key_format.label=Decryption secret format
help.field.op_jose_jwe.decrypt_key_format.description=Local to decryption: controls how shared-secret or PBES2 password text is decoded, independently of the encryption Secret format selector. UTF-8 preserves the entered text; Hex ignores whitespace and an optional 0x prefix; Base64/Base64URL ignores whitespace. This selector does not change the token's alg.
help.field.op_jose_jwe.decoded_header.label=Decoded header
help.field.op_jose_jwe.decoded_header.description=Shows the header after successful parsing/decryption. Treat header values as untrusted input.
help.field.op_jose_jwe.decoded_payload.label=Decoded payload
help.field.op_jose_jwe.decoded_payload.description=Shows plaintext after successful authentication and decryption. This value is sensitive; the help service does not read it.
help.field.op_jose_jwe.breakdown_header.label=Protected header
help.field.op_jose_jwe.breakdown_header.description=The protected JOSE header is Base64URL encoded in Compact serialization; JSON serializations expose it as a protected value.
help.field.op_jose_jwe.breakdown_encrypted_key.label=Encrypted key
help.field.op_jose_jwe.breakdown_encrypted_key.description=The key-management output carried for this recipient. Direct (dir) and ECDH-ES direct modes do not wrap a separate content key.
help.field.op_jose_jwe.breakdown_decrypted_cek.label=Recovered content encryption key (CEK)
help.field.op_jose_jwe.breakdown_decrypted_cek.description=The CEK is sensitive key material. Help never retrieves or displays it; inspect only the existing application breakdown behavior.
help.field.op_jose_jwe.breakdown_content_iv.label=Content initialization vector
help.field.op_jose_jwe.breakdown_content_iv.description=The IV for the content encryption step; it is distinct from an AES-GCMKW key-wrap IV.
help.field.op_jose_jwe.breakdown_ciphertext.label=Ciphertext
help.field.op_jose_jwe.breakdown_ciphertext.description=Encrypted payload bytes, normally shown in the existing breakdown in truncated form.
help.field.op_jose_jwe.breakdown_content_tag.label=Content authentication tag
help.field.op_jose_jwe.breakdown_content_tag.description=Authentication tag for content encryption. For AES-GCMKW, its key-wrap tag is a separate value.

help.jwe.current.algorithm=Selected alg
help.jwe.current.contentEncryption=Selected enc
help.jwe.current.serialization=Selected serialization
help.jwe.current.compression=Compression
help.jwe.compression.enabled=enabled
help.jwe.compression.disabled=disabled
help.jwe.rule.pbes2=PBES2-HS256+A128KW, PBES2-HS384+A192KW, and PBES2-HS512+A256KW derive a key-encryption key from a password and salt. A blank iterations field uses 600000; a nonblank field must be a whole integer of at least 1000. The current UI applies that validation for every encryption alg, including non-PBES2 choices; this describes the app's input rule, not a universal policy.
help.jwe.rule.gcmkw=AES-GCM key wrapping has its own wrapping IV and authentication tag, separate from the content IV and tag.
help.jwe.rule.ecdh=ECDH-ES derives key material from an EC or OKP recipient key; apu and apv are optional party information. Direct ECDH-ES is limited to one recipient.
help.jwe.rule.direct.bytes=dir uses the supplied key directly as the CEK; enc requires {0} bytes ({1} bits).
help.jwe.rule.direct.generic=dir uses the supplied key directly as the CEK; its required size depends on enc.
help.jwe.rule.serialization.compact=Compact serialization supports one recipient and does not carry external AAD.
help.jwe.rule.serialization.compact.aad=Compact serialization does not carry external AAD; the current non-empty AAD value is incompatible and encryption is rejected.
help.jwe.rule.serialization.flattened=Flattened JSON represents one recipient and can carry external AAD.
help.jwe.rule.serialization.general=General JSON can carry external AAD and multiple recipients when the selected algorithms support them.
help.jwe.material.public.present=Recipient material field is non-empty. Help has not inspected its contents.
help.jwe.material.public.absent=Recipient material field is empty. Help has not inspected its contents.
help.jwe.material.private.present=Decryption material field is non-empty. Help has not inspected its contents.
help.jwe.material.private.absent=Decryption material field is empty. Help has not inspected its contents.
help.jwe.material.payload.present=Payload field is non-empty. Help has not inspected its contents.
help.jwe.material.payload.absent=Payload field is empty. Help has not inspected its contents.
help.option.op_jose_jwe.key_algorithm.rsa1_5=RSA key transport using the legacy PKCS#1 v1.5 scheme; retain only where compatibility requires it.
help.option.op_jose_jwe.key_algorithm.rsa_oaep=RSA-OAEP key transport using SHA-1 as specified by this JWA identifier.
help.option.op_jose_jwe.key_algorithm.rsa_oaep_256=RSA-OAEP key transport using SHA-256.
help.option.op_jose_jwe.key_algorithm.rsa_oaep_384=RSA-OAEP key transport using SHA-384.
help.option.op_jose_jwe.key_algorithm.rsa_oaep_512=RSA-OAEP key transport using SHA-512.
help.option.op_jose_jwe.key_algorithm.ecdh_es=ECDH-ES derives the content key directly; use a compatible EC or OKP recipient key and one recipient.
help.option.op_jose_jwe.key_algorithm.ecdh_es_a128kw=ECDH-ES derives a 128-bit AES key-encryption key for AES Key Wrap.
help.option.op_jose_jwe.key_algorithm.ecdh_es_a192kw=ECDH-ES derives a 192-bit AES key-encryption key for AES Key Wrap.
help.option.op_jose_jwe.key_algorithm.ecdh_es_a256kw=ECDH-ES derives a 256-bit AES key-encryption key for AES Key Wrap.
help.option.op_jose_jwe.key_algorithm.a128kw=AES Key Wrap with a 128-bit key-encryption key.
help.option.op_jose_jwe.key_algorithm.a192kw=AES Key Wrap with a 192-bit key-encryption key.
help.option.op_jose_jwe.key_algorithm.a256kw=AES Key Wrap with a 256-bit key-encryption key.
help.option.op_jose_jwe.key_algorithm.a128gcmkw=AES-GCM key wrapping with a 128-bit key-encryption key; has a separate wrap IV and tag.
help.option.op_jose_jwe.key_algorithm.a192gcmkw=AES-GCM key wrapping with a 192-bit key-encryption key; has a separate wrap IV and tag.
help.option.op_jose_jwe.key_algorithm.a256gcmkw=AES-GCM key wrapping with a 256-bit key-encryption key; has a separate wrap IV and tag.
help.option.op_jose_jwe.key_algorithm.pbes2_hs256_a128kw=PBES2-HS256 derives a 128-bit key-encryption key for AES Key Wrap from a password.
help.option.op_jose_jwe.key_algorithm.pbes2_hs384_a192kw=PBES2-HS384 derives a 192-bit key-encryption key for AES Key Wrap from a password.
help.option.op_jose_jwe.key_algorithm.pbes2_hs512_a256kw=PBES2-HS512 derives a 256-bit key-encryption key for AES Key Wrap from a password.
help.option.op_jose_jwe.key_algorithm.dir=Uses the supplied symmetric key directly as the content encryption key; its size must match enc.
help.option.op_jose_jwe.content_encryption.a128gcm=AES-GCM with a 128-bit content key.
help.option.op_jose_jwe.content_encryption.a192gcm=AES-GCM with a 192-bit content key.
help.option.op_jose_jwe.content_encryption.a256gcm=AES-GCM with a 256-bit content key.
help.option.op_jose_jwe.content_encryption.a128cbc_hs256=AES-CBC-HMAC-SHA-256 authenticated encryption; CEK size is 256 bits.
help.option.op_jose_jwe.content_encryption.a192cbc_hs384=AES-CBC-HMAC-SHA-384 authenticated encryption; CEK size is 384 bits.
help.option.op_jose_jwe.content_encryption.a256cbc_hs512=AES-CBC-HMAC-SHA-512 authenticated encryption; CEK size is 512 bits.
help.option.op_jose_jwe.serialization.compact=Five-part compact form for one recipient; no external AAD member.
help.option.op_jose_jwe.serialization.flattened_json=JSON form for one recipient; supports an external AAD member.
help.option.op_jose_jwe.serialization.general_json=JSON form with recipients array; supports external AAD and multiple compatible recipients.
help.option.op_jose_jwe.secret_format.utf_8=Encode the entered secret text as UTF-8 bytes.
help.option.op_jose_jwe.secret_format.hex=Decode as hexadecimal bytes; whitespace and an optional 0x prefix are ignored.
help.option.op_jose_jwe.secret_format.base64_base64url=Decode as Base64 or Base64URL bytes; whitespace is ignored.
help.option.op_jose_jwe.decrypt_key_format.utf_8=Encode the entered secret text as UTF-8 bytes.
help.option.op_jose_jwe.decrypt_key_format.hex=Decode as hexadecimal bytes; whitespace and an optional 0x prefix are ignored. This decryption-only selector is independent of the encryption selector.
help.option.op_jose_jwe.decrypt_key_format.base64_base64url=Decode as Base64 or Base64URL bytes; whitespace is ignored. This decryption-only selector is independent of the encryption selector.
help.option.op_jose_jwe.compression.enabled=Compress the payload with the supported DEF option before encryption.
help.option.op_jose_jwe.compression.disabled=Encrypt the payload without the optional DEF compression step.
help.action.op_sym_ciphers.save_result.title=Save result
help.action.op_sym_ciphers.save_result.description=Exports the current result through the existing save action. Help itself does not create a file.
help.action.op_sym_ciphers.save_result.example=Save a synthetic ciphertext to a temporary test location.
help.action.op_sym_ciphers.reuse_result.title=Reuse result
help.action.op_sym_ciphers.reuse_result.description=Loads a prior compatible result and its packaged metadata into this operation when available. Check the displayed parameters before decrypting.
help.action.op_sym_ciphers.reuse_result.example=Reuse an authenticated result package and verify that its ciphertext and tag remain paired.
help.option.op_sym_ciphers.algorithm.des=Legacy 8-byte-key block cipher; available in the selector for compatibility with existing material.
help.option.op_sym_ciphers.algorithm.3des_triple_des=Triple-DES block cipher; the core accepts 16- or 24-byte keys (a 16-byte key is expanded internally).
help.option.op_sym_ciphers.algorithm.aes_128=AES block cipher with a 16-byte key.
help.option.op_sym_ciphers.algorithm.aes_192=AES block cipher with a 24-byte key.
help.option.op_sym_ciphers.algorithm.aes_256=AES block cipher with a 32-byte key.
help.option.op_sym_ciphers.algorithm.salsa20=Unauthenticated stream cipher; 32-byte key and 8-byte nonce. The mode and padding selectors do not apply.
help.option.op_sym_ciphers.algorithm.chacha20=Unauthenticated stream cipher; 32-byte key. The core accepts 8- or 12-byte nonces; the UI generator creates 12 bytes. Mode and padding do not apply.
help.option.op_sym_ciphers.algorithm.chacha20_poly1305=Authenticated stream cipher with 32-byte key, 12-byte nonce and 16-byte tag. The dedicated UI handler currently does not use the visible AAD field.
help.option.op_sym_ciphers.algorithm.xchacha20_poly1305=Authenticated stream cipher with 32-byte key, 24-byte nonce and 16-byte tag. The dedicated UI handler currently does not use the visible AAD field.
help.option.op_sym_ciphers.mode.ecb=No IV; identical plaintext blocks produce identical ciphertext blocks, so the UI displays a warning. Padding applies only when supported by the transformation.
help.option.op_sym_ciphers.mode.cbc=Requires an IV (recommended block size: 16 bytes for AES, 8 for DES/3DES). Padding may be selected. CBC does not authenticate ciphertext.
help.option.op_sym_ciphers.mode.ctr=Uses an IV/counter and does not use padding in this UI. It does not authenticate ciphertext.
help.option.op_sym_ciphers.mode.gcm=Authenticated mode: uses a nonce, optional AAD on the block path and a 16-byte tag. UI generation recommends a 12-byte nonce; core accepts 8, 12 or 16 bytes.
help.option.op_sym_ciphers.mode.cfb=Uses an IV and does not use padding in this UI. It does not authenticate ciphertext.
help.option.op_sym_ciphers.mode.ofb=Uses an IV and does not use padding in this UI. It does not authenticate ciphertext.
help.option.op_sym_ciphers.padding.nopadding=Adds no bytes. The UI forces this setting for CTR, CFB, OFB, GCM, and stream ciphers. For ECB/CBC block transformations, plaintext must already be block-aligned.
help.option.op_sym_ciphers.padding.pkcs5padding=For supported ECB/CBC block transformations, adds a full padding block when already aligned; each padding byte contains the padding length. The provider handles the selected transformation.
help.option.op_sym_ciphers.padding.pkcs7padding=For supported ECB/CBC block transformations, appends N bytes each equal to N, up to one block. This application aliases PKCS7Padding to its PKCS5Padding transformation name.
help.option.op_sym_ciphers.padding.iso10126padding=For supported ECB/CBC block transformations, fills the padding area with random bytes and ends it with the padding length.
help.option.op_sym_ciphers.padding.iso7816_4padding=For supported ECB/CBC block transformations, appends 0x80 followed by zero bytes to the next block boundary.
help.option.op_sym_ciphers.padding.zerobytepadding=For supported ECB/CBC block transformations, appends zero bytes only when needed to reach a block boundary. Because trailing zeros are stripped when decrypting, original data ending in zero bytes is ambiguous.
help.option.op_sym_ciphers.key_source.manual_input=Key entered as hexadecimal in the manual field.
help.option.op_sym_ciphers.key_source.simulated_hsm=Reference to a key stored locally in the simulated HSM.
help.format.contract.hashing=Hashing consumes input bytes and returns digest bytes. Input and output selectors control representations; they do not choose the hash algorithm.
help.format.contract.manual_conversion=Manual Conversion is a suite of paths, not one codec chain. The standard Convert path validates input before its format switch; EBCDIC and other specialized actions may call the shared codecs directly. Check the selected action: their acceptance rules can differ. Output formatting is handled by each path.
help.format.contract.symmetric_ciphers=Symmetric Ciphers decodes the payload to bytes, applies the cipher, then encodes result bytes. Key/IV/tag fields have their own hexadecimal representation.
help.format.contract.file_cipher_streaming=File Cipher (Streaming) reads and writes files directly. Global byte format selectors do not apply.
help.format.contract.asymmetric_ciphers=Asymmetric Ciphers decodes payload bytes, applies the selected RSA operation and encodes result bytes.
help.format.contract.digital_signatures=Digital Signatures signs or verifies bytes. The payload input representation is independent of signature output encoding.
help.format.contract.message_authentication_codes=MAC computes or verifies a message authentication code over bytes; input and result formats are representations.
help.format.contract.jwt_signed=JWT (Signed) operates on a structured token; global payload format selectors are not used.
help.format.contract.jwe_encrypted=JWE (Encrypted) operates on a structured encrypted token; global payload format selectors are not used.
help.format.contract.decode_asn_1=Decode ASN.1 consumes encoded bytes and presents a structured tree using its own controls.
help.format.contract.encode_asn_1=Encode ASN.1 consumes a textual/structured description through its own controls and produces encoded bytes.
help.format.contract.sign_xml_xades=Sign XML operates on an XML structure and its signature policy; global byte format selectors do not apply.
help.format.contract.verify_xml_xades=Verify XML parses and checks an XML signature structure; global byte format selectors do not apply.
help.format.contract.sign_soap_wss=Sign SOAP operates on a SOAP structure and its WS-Security configuration.
help.format.contract.verify_soap_wss=Verify SOAP parses and checks a SOAP WS-Security structure.
help.format.contract.random_number_generator=The generator creates bytes; only the output representation selector applies.
help.format.type.input.bytes=bytes
help.format.type.output.bytes=bytes
help.format.type.input.file=file
help.format.type.output.file=file
help.format.type.input.structure=structured data
help.format.type.output.structure=structured data
help.format.type.input.text=text
help.format.type.output.text=text
help.format.type.input.none=no input bytes
help.format.type.output.none=no input bytes
help.format.option.text_utf_8.input=Decodes valid UTF-8 text into bytes; malformed UTF-8 input is rejected.
help.format.option.text_utf_8.output=Decodes result bytes as strict UTF-8 text; invalid byte sequences are rejected.
help.format.option.hexadecimal.input=Decodes hexadecimal byte pairs; input ignores whitespace, colons, and dashes and must contain an even number of hex digits.
help.format.option.hexadecimal.output=Encodes each byte as two uppercase hexadecimal digits, without separators.
help.format.option.base64.input=Decodes standard Base64 text through the registered codec. It ignores whitespace and strips the codec’s recognized uppercase PEM BEGIN/END lines; other labels or invalid Base64 are rejected.
help.format.option.base64.output=Encodes bytes as standard padded Base64.
help.format.option.base64url.input=Decodes URL-safe Base64 using letters, digits, underscore, and hyphen; padding and whitespace are not accepted.
help.format.option.base64url.output=Encodes bytes as URL-safe Base64 with no padding.
help.format.option.base94.input=Decodes the reversible Base94 text representation using printable ASCII characters ! through ~.
help.format.option.base94.output=Encodes bytes using the reversible Base94 representation with printable ASCII characters ! through ~.
help.format.option.binary.input=Decodes 0 and 1 digits into bytes; whitespace, colons, and dashes are ignored, and the bit count must be a multiple of eight.
help.format.option.binary.output=Encodes each byte as eight binary digits, separated by spaces.
help.format.option.decimal.input=Decodes unsigned byte values from 0 to 255 separated by commas or whitespace.
help.format.option.decimal.output=Encodes bytes as unsigned decimal values from 0 to 255 separated by spaces.
help.format.disabled.fallback=This operation does not use the global format selectors.
help.format.disabled.file_cipher_streaming=The operation processes files directly; global byte conversion does not apply.
help.format.disabled.jwt_signed=JWT uses its own structured editor.
help.format.disabled.jwe_encrypted=JWE uses its own structured fields.
help.format.disabled.decode_asn_1=ASN.1 input is handled by operation-specific controls.
help.format.disabled.encode_asn_1=ASN.1 input is handled by operation-specific controls.
help.format.disabled.sign_xml_xades=The operation processes XML directly.
help.format.disabled.verify_xml_xades=The operation processes XML directly.
help.format.disabled.sign_soap_wss=The operation processes SOAP directly.
help.format.disabled.verify_soap_wss=The operation processes SOAP directly.
help.format.disabled.random_number_generator=This operation has no input format; its output format applies.

# B01 A001 labels and examples
help.backToOperation=Back to operation help
help.backToOperation.help=Return to the operation overview.
help.field.details=Field details
help.options=Available options
help.aux.global_formats.purpose=Explains how the active operation decodes input and encodes output. The lists shown come from its current format profile.
help.operation.aux_global_formats.title=Global format selectors
help.aux.global_formats.action.input.title=Input format
help.aux.global_formats.action.input.description=Decodes the entered representation into bytes before the operation, when the active profile supports an input selector.
help.aux.global_formats.action.input.example=For a profile that allows Hexadecimal, the text 4142 represents the two bytes A and B; Text (UTF-8) represents the characters as UTF-8 bytes.
help.aux.global_formats.action.output.title=Output format
help.aux.global_formats.action.output.description=Encodes result bytes in the selected representation when the active profile supports an output selector.
help.aux.global_formats.action.output.example=A 32-byte result is shown as 64 Hex digits or a Base64 string; those are representations of the same bytes.
help.aux.global_formats.action.contract.title=Operation data contract
help.aux.global_formats.action.contract.description=Shows the input and output data types used by the active operation, together with its profile-specific contract.
help.aux.global_formats.action.contract.example=File operations use files directly; cryptographic byte operations decode a representation before processing and encode the result afterwards.
help.aux.global_formats.field.input.label=Input format
help.aux.global_formats.field.input.description=Representation decoded to bytes before processing, only when listed by this operation profile.
help.aux.global_formats.field.output.label=Output format
help.aux.global_formats.field.output.description=Representation used to display or export result bytes, only when listed by this operation profile.
help.aux.global_formats.field.contract.label=Data contract
help.aux.global_formats.field.contract.description=The input/output data types and processing meaning of the active profile.
help.aux.global_formats.field.remembered.label=Remembered selection
help.aux.global_formats.field.remembered.description=Input selection is remembered per operation during the current app session; output preference is stored per profile.
help.aux.global_formats.field.disabled.label=Unavailable selector
help.aux.global_formats.field.disabled.description=An empty list means this operation does not expose that global format selector; its own controls or input/output data types apply.

# B01 shared capability rules
help.rule.symmetric.mode.stream_disabled=Stream algorithms do not use the block-mode selector; the UI disables it and retains its previous value.
help.rule.symmetric.mode.block_selector=The selected block mode is passed to the crypto transformation; the selector does not pre-filter algorithm/mode compatibility.
help.rule.symmetric.padding.stream_ignored=Block padding does not apply to stream algorithms; the selector is disabled and its prior choice is retained.
help.rule.symmetric.padding.selectable=The current mode permits a padding choice in this UI.
help.rule.symmetric.padding.mode_forces_none=This mode does not use padding in this UI; the selector is set to NoPadding and disabled.
help.rule.symmetric.iv.not_applicable=ECB does not use an IV or nonce.
help.rule.symmetric.iv.required_or_nonce=This mode or stream algorithm uses an IV/nonce. The byte count shown is the generator recommendation; a core validator may accept other lengths.
help.rule.symmetric.authentication.authenticated=The selected AEAD variant produces or verifies a 16-byte authentication tag.
help.rule.symmetric.authentication.none=This variant does not authenticate ciphertext; successful decryption alone does not prove integrity.
help.rule.symmetric.aad.not_applicable=AAD is not applicable to the current selection.
help.rule.symmetric.aad.gcm_used=The block GCM handler passes AAD to the operation; it parses Hex and falls back to US-ASCII if parsing fails.
help.rule.symmetric.aad.visible_unused=The dedicated stream AEAD handler displays this field but currently does not pass it to the operation.
help.rule.symmetric.key.length=Key bytes are validated by the selected algorithm; help context never contains key content.
help.rule.symmetric.template.allowlist=Templates store only module-approved, non-secret settings such as algorithm, mode, padding, and byte-format selections. The allowlist rejects keys, IVs/nonces, tags, AAD, input/output data, and secrets during save and import. Help describes the current template actions; broader template coverage remains part of A003/B13.
help.symmetric.key.present=Key material is present in the selected source. Help stores only this yes/no state.
help.symmetric.key.absent=No usable key material is currently selected. Help does not read the key value.
help.field.op_sym_ciphers.template_selection.label=Cipher template
help.field.op_sym_ciphers.template_selection.description=Select a built-in preset or a personal template. Applying a preset can change the algorithm, mode, padding, and byte formats; built-in presets also clear key and AEAD parameter fields. Saving captures configuration, not key, IV/nonce, tag, AAD, payload, or result.
help.action.op_sym_ciphers.manage_templates.title=Manage templates
help.action.op_sym_ciphers.manage_templates.description=Opens the template menu for saving, exporting, importing, or deleting personal templates. Built-in presets cannot be deleted.
help.action.op_sym_ciphers.manage_templates.example=Open Manage Template to see the available template-management actions.
help.action.op_sym_ciphers.apply_template.title=Apply template
help.action.op_sym_ciphers.apply_template.description=Applies the selected built-in preset or personal template. Review the resulting cipher parameters and formats before encrypting; built-in presets also clear key and AEAD parameter fields.
help.action.op_sym_ciphers.apply_template.example=Select the AES-256-GCM preset and apply it; inspect the resulting mode and input/output formats before use.
help.action.op_sym_ciphers.save_template.title=Save personal template
help.action.op_sym_ciphers.save_template.description=Saves the current allowlisted configuration locally. The template excludes key material, IV/nonce, tag, AAD, payload, and result.
help.action.op_sym_ciphers.save_template.example=Save a test configuration under a descriptive name, then confirm its parameters can be selected again.
help.action.op_sym_ciphers.export_template.title=Export template
help.action.op_sym_ciphers.export_template.description=Exports the selected template through the existing local file flow. Review the file destination and contents before sharing it.
help.action.op_sym_ciphers.export_template.example=Export a test template to a temporary location and confirm it contains settings but no key or payload.
help.action.op_sym_ciphers.import_template.title=Import template
help.action.op_sym_ciphers.import_template.description=Imports a template file through the existing validation flow. Imported settings are allowlisted; inspect them before applying.
help.action.op_sym_ciphers.import_template.example=Import a previously exported test template, then review its name and settings in the selector.
help.action.op_sym_ciphers.delete_template.title=Delete personal template
help.action.op_sym_ciphers.delete_template.description=Deletes the selected personal template through the existing confirmation flow. Built-in presets are not deletable.
help.action.op_sym_ciphers.delete_template.example=Select a disposable test template and use Delete Selected Personal Template.
help.action.op_sym_ciphers.reset_defaults.title=Reset cipher defaults
help.action.op_sym_ciphers.reset_defaults.description=Restores the cipher form’s existing default configuration and clears key, IV, tag, AAD, and input fields. Confirm the resulting values before continuing.
help.action.op_sym_ciphers.reset_defaults.example=Use Reset Defaults and verify the displayed algorithm, mode, padding, and formats.
help.format.profile.manual_conversion.option.hexadecimal.input=The standard Convert path validates hexadecimal digits first: whitespace is allowed, but colons and dashes are rejected before decoding. Specialized paths that call GenericController.parseInput use the codec, which accepts whitespace, colons, and dashes. Both require an even number of digits.
help.format.profile.manual_conversion.option.binary.input=The standard Convert path validates only 0/1 digits and whitespace before decoding; colons and dashes are rejected. Specialized paths using GenericController.parseInput accept those separators. Bits must form complete 8-bit bytes.
help.format.profile.manual_conversion.option.base64.input=The standard Convert path removes whitespace for validation and requires canonical standard Base64 alphabet and padding; PEM markers are rejected. Specialized paths using GenericController.parseInput strip recognized uppercase PEM BEGIN/END lines and may accept unpadded Base64.
help.format.profile.manual_conversion.option.base64url.input=Standard Convert removes whitespace, accepts URL-safe Base64 with optional trailing padding, and supplies missing padding before decoding; invalid alphabet or padding is rejected. The explicit Base64URL encode/decode actions use the strict shared codec: decode rejects whitespace and padding, and encode emits unpadded output.
help.format.profile.symmetric_ciphers.option.text_utf_8.input=Symmetric Ciphers trims leading and trailing input whitespace, then converts the remaining Java text to UTF-8 bytes. This route does not use the strict UTF-8 codec and does not reject malformed UTF-16 input.
help.format.profile.symmetric_ciphers.option.hexadecimal.input=Symmetric Ciphers trims the input and validates hexadecimal digits after ignoring whitespace. Colons and dashes are rejected by validation even though the later converter can parse them. An even number of digits is required.
help.format.profile.symmetric_ciphers.option.base64.input=Symmetric Ciphers trims the input, removes whitespace for validation, and requires canonical standard Base64 alphabet and padding. PEM markers are rejected before the Base64 decoder runs.
help.format.profile.symmetric_ciphers.option.binary.input=Symmetric Ciphers trims the input and validates only 0/1 digits and whitespace. Colons and dashes are rejected before conversion; the bit count must form complete bytes.
help.format.profile.symmetric_ciphers.option.text_utf_8.output=Symmetric Ciphers decodes output bytes with Java UTF-8 string conversion. Malformed byte sequences are replaced with U+FFFD instead of rejected.
help.format.profile.asymmetric_ciphers.option.text_utf_8.input=Asymmetric Ciphers trims leading/trailing whitespace, then converts Java text to UTF-8 bytes. This route does not use the strict UTF-8 codec and does not reject malformed UTF-16 input.
help.format.profile.asymmetric_ciphers.option.hexadecimal.input=Asymmetric Ciphers trims the input and validates hexadecimal digits after ignoring whitespace. Colons and dashes are rejected before conversion; an even number of digits is required.
help.format.profile.asymmetric_ciphers.option.base64.input=Asymmetric Ciphers trims input, removes whitespace for validation, and requires canonical standard Base64 alphabet and padding. The later flexible decoder does not make PEM markers acceptable; validation rejects them first.
help.format.profile.asymmetric_ciphers.option.binary.input=Asymmetric Ciphers trims input and validates only 0/1 digits and whitespace. Colons and dashes are rejected before conversion; the bit count must form complete bytes.
help.format.profile.asymmetric_ciphers.option.text_utf_8.output=Asymmetric Ciphers converts output bytes to a Java UTF-8 string; malformed byte sequences become U+FFFD rather than causing rejection.
help.format.profile.digital_signatures.option.text_utf_8.input=Digital Signatures trims leading/trailing input whitespace, then converts Java text to UTF-8 bytes. This route does not use the strict UTF-8 codec and does not reject malformed UTF-16 input.
help.format.profile.digital_signatures.option.hexadecimal.input=Digital Signatures validates hexadecimal digits after ignoring whitespace. Colons and dashes are rejected before conversion; an even number of digits is required.
help.format.profile.digital_signatures.option.base64.input=Digital Signatures removes whitespace for validation and requires canonical standard Base64 alphabet and padding. PEM markers are rejected before decoding.
help.format.profile.digital_signatures.option.text_utf_8.output=Digital Signatures converts output bytes to a Java UTF-8 string; malformed byte sequences become U+FFFD rather than causing rejection.
help.format.profile.message_authentication_codes.option.text_utf_8.input=MAC trims leading/trailing input whitespace, then converts Java text to UTF-8 bytes. This route does not use the strict UTF-8 codec and does not reject malformed UTF-16 input.
help.format.profile.message_authentication_codes.option.hexadecimal.input=MAC validates hexadecimal digits after ignoring whitespace. Colons and dashes are rejected before conversion; an even number of digits is required.
help.format.profile.message_authentication_codes.option.base64.input=MAC removes whitespace for validation and requires canonical standard Base64 alphabet and padding. PEM markers are rejected before decoding.
help.format.profile.message_authentication_codes.option.text_utf_8.output=MAC converts output bytes to a Java UTF-8 string; malformed byte sequences become U+FFFD rather than causing rejection.
help.format.profile.random_number_generator.option.decimal.output=The random generator displays each unsigned byte (0–255) as exactly three decimal digits, separated by spaces, such as 000 005 255.
help.format.profile.manual_conversion.option.text_utf_8.input=The standard Convert path passes the entered string to Java UTF-8 byte encoding without trimming it; malformed UTF-16 is replaced rather than rejected. Specialized paths that call GenericController.parseInput use the strict UTF-8 codec instead.
help.format.profile.manual_conversion.option.text_utf_8.output=The standard Convert path converts output bytes with Java UTF-8 string decoding, replacing malformed bytes with U+FFFD. Specialized paths that call GenericController.formatBytes use strict UTF-8 decoding.
help.format.profile.manual_conversion.option.decimal.input=The standard Convert path validates digits and whitespace only, so comma separators are rejected even though its later decimal converter supports them. Paths using the shared DecimalCodec accept comma or whitespace separators. Values are unsigned bytes from 0 to 255.

help.operation.op_pay_clear_pin.title=Clear PIN Blocks
help.operation.op_pay_clear_pin.purpose=Builds or interprets clear PIN fields/blocks. A clear block is not encrypted; protection status is described separately.
help.operation.op_pay_enc_pin.title=Protected PIN Blocks
help.operation.op_pay_enc_pin.purpose=Builds, protects or interprets PIN blocks. ISO-4 uses AES; other formats use DES/TDES ECB when a key is supplied.
help.action.op_pay_clear_pin.encode.title=Encode PIN block
help.action.op_pay_clear_pin.encode.description=Builds a clear PIN field/block; it does not encrypt it.
help.action.op_pay_clear_pin.encode.example=Example: PIN 1234 with ISO-0 and PAN 4761739001010010 produces an 8-byte field; use the same format and PAN to recover 1234.
help.action.op_pay_clear_pin.decode.title=Decode PIN block
help.action.op_pay_clear_pin.decode.description=Interprets the clear field/block using its independent format selector and recovers the PIN.
help.action.op_pay_clear_pin.decode.example=Example: PIN 1234 with ISO-0 and PAN 4761739001010010 produces an 8-byte field; use the same format and PAN to recover 1234.
help.action.op_pay_clear_pin.select_format.title=Choose format and padding
help.action.op_pay_clear_pin.select_format.description=The format determines structure, PAN use and available padding choices.
help.action.op_pay_clear_pin.select_format.example=Example: PIN 1234 with ISO-0 and PAN 4761739001010010 produces an 8-byte field; use the same format and PAN to recover 1234.
help.action.op_pay_enc_pin.protect.title=Protect PIN block
help.action.op_pay_enc_pin.protect.description=Builds the selected format field/block and encrypts it only when a valid key is supplied. Without a key, output remains clear.
help.action.op_pay_enc_pin.protect.example=Example: a synthetic PIN with ISO-0 and a valid TDES key produces an 8-byte block; without a key, the result is the clear block.
help.action.op_pay_enc_pin.decode.title=Decode PIN block
help.action.op_pay_enc_pin.decode.description=Uses the separate decode key to decrypt and recover the PIN; without it, treats the input as a clear block.
help.action.op_pay_enc_pin.decode.example=Example: a synthetic PIN with ISO-0 and a valid TDES key produces an 8-byte block; without a key, the result is the clear block.
help.action.op_pay_enc_pin.select_format.title=Choose format
help.action.op_pay_enc_pin.select_format.description=The shared selector chooses the PIN format and the DES/TDES or AES route.
help.action.op_pay_enc_pin.select_format.example=Example: a synthetic PIN with ISO-0 and a valid TDES key produces an 8-byte block; without a key, the result is the clear block.
help.field.op_pay_clear_pin.pin.label=PIN
help.field.op_pay_clear_pin.pin.description=Enter 4–12 decimal digits. The current UI applies this range to all listed clear formats; some format encoders impose a narrower range. The value is sensitive and is not copied into help context.
help.field.op_pay_clear_pin.pan_encode.label=PAN
help.field.op_pay_clear_pin.pan_encode.description=Account number in 13–19 decimal digits when present. Required for formats marked as PAN-using; the current encoder also validates a nonempty PAN even for formats whose engine ignores it.
help.field.op_pay_clear_pin.format_encode.label=Encode format
help.field.op_pay_clear_pin.format_encode.description=Selects the clear PIN-block construction for encoding. This selector is independent of the decode selector.
help.field.op_pay_clear_pin.format_decode.label=Decode format
help.field.op_pay_clear_pin.format_decode.description=Selects how the supplied clear block is interpreted. This selector is independent of the encode selector.
help.field.op_pay_clear_pin.padding.label=Padding
help.field.op_pay_clear_pin.padding.description=Selects the nibble used only when the selected format exposes padding options. Fixed nibbles are hexadecimal; RANDOM_HEX chooses 0–F and RANDOM_DECIMAL chooses 0–9.
help.field.op_pay_clear_pin.clear_block.label=Clear PIN block
help.field.op_pay_clear_pin.clear_block.description=Hex representation of a clear PIN field/block. All formats except ISO-4 expect 16 hex characters (8 bytes); ISO-4 clear fields are 32 hex characters (16 bytes). It is not encrypted.
help.field.op_pay_clear_pin.pan_decode.label=PAN for decoding
help.field.op_pay_clear_pin.pan_decode.description=PAN in 13–19 digits when needed. PAN-based formats require it; the ISO-4 UI also currently requires a nonempty PAN, while the clear PIN-field decoder reads the PIN field itself.
help.field.op_pay_clear_pin.result.label=Result
help.field.op_pay_clear_pin.result.description=Displays the encoded clear field/block or the PIN recovered by decoding. Results can contain sensitive PIN/PAN values; the contextual help reads neither result text nor inputs.
help.field.op_pay_clear_pin.encode_action.label=Encode action
help.field.op_pay_clear_pin.encode_action.description=Builds a clear PIN field/block from the PIN, optional/required PAN and selected format.
help.field.op_pay_clear_pin.decode_action.label=Decode action
help.field.op_pay_clear_pin.decode_action.description=Interprets the supplied clear field/block using the decode format and required PAN data.
help.field.op_pay_enc_pin.format.label=Format
help.field.op_pay_enc_pin.format.description=One shared format selector for protect and decode. It chooses the clear PIN construction and the protection route: AES for ISO-4, DES/TDES ECB for other formats.
help.field.op_pay_enc_pin.pin.label=PIN
help.field.op_pay_enc_pin.pin.description=Enter decimal PIN digits; the engine validates the range required by the selected format. The value is sensitive and is never copied into help context.
help.field.op_pay_enc_pin.pan_encode.label=PAN for encoding
help.field.op_pay_enc_pin.pan_encode.description=Account number required when the selected format uses PAN. ISO-4 binds a PAN field into the AES transformation.
help.field.op_pay_enc_pin.encrypt_key.label=Protection key
help.field.op_pay_enc_pin.encrypt_key.description=Hex-encoded key. For non-ISO-4, the engine accepts 8 bytes (DES), 16 or 24 bytes (TDES) with ECB/NoPadding. ISO-4 uses AES keys of 16, 24 or 32 bytes. Key text is never copied into help context.
help.field.op_pay_enc_pin.encrypted_block.label=Block to decode
help.field.op_pay_enc_pin.encrypted_block.description=Hex block supplied to decode. Non-ISO-4 expects an 8-byte block (16 hex characters); ISO-4 protected output is 16 bytes (32 hex characters).
help.field.op_pay_enc_pin.pan_decode.label=PAN for decoding
help.field.op_pay_enc_pin.pan_decode.description=PAN required by the selected format. ISO-4 decoding needs the same PAN used during protection.
help.field.op_pay_enc_pin.decrypt_key.label=Decoding key
help.field.op_pay_enc_pin.decrypt_key.description=Separate input from the encode key. Supply the matching DES/TDES key (8, 16 or 24 bytes) or ISO-4 AES key (16, 24 or 32 bytes). Only whether this field is empty is exposed to contextual help.
help.field.op_pay_enc_pin.result.label=Result
help.field.op_pay_enc_pin.result.description=Shows a protected block after successful encryption; without an encode key, shows the clear field/block and marks “No key supplied”; on decode, shows the recovered PIN. The separate decode key is used for decryption, and its presence alone does not prove it is valid. Help reads no inputs or results.
help.field.op_pay_enc_pin.encode_action.label=Protect action
help.field.op_pay_enc_pin.encode_action.description=Builds the selected format field/block and encrypts only if the handler accepts the protection key: AES for ISO-4 or DES/TDES ECB for other formats. Without a key, output remains clear; text presence does not guarantee a valid key.
help.field.op_pay_enc_pin.decode_action.label=Decode action
help.field.op_pay_enc_pin.decode_action.description=When supplied, the separate decode key decrypts the block before PIN recovery; ISO-4 uses AES with the PAN, and other formats use DES/TDES ECB. Without a key, the input is treated as a clear field/block and decoded.
help.field.op_pay_enc_pin.protected_state.label=Protection state
help.field.op_pay_enc_pin.protected_state.description=A key-presence status, not proof that the supplied material is correct. With no key, the produced output is clear and must not be called encrypted.
help.pin.currentFormat=Current format
help.pin.format.heading=Format behavior
help.pin.encryption.aes=Protection: AES for ISO-4; the protected block is 16 bytes (32 hex characters). AES keys are 16, 24 or 32 bytes.
help.pin.encryption.tdes=Protection: DES ECB without padding for an 8-byte key, or TDES for 16/24-byte keys. Cipher input/output is an 8-byte block.
help.pin.key.present=This key field contains text. Help does not read or validate it; the operation validates it when run.
help.pin.key.absent=No key was supplied. The current route leaves the block clear; do not label it encrypted/protected.
help.pin.padding=Configurable padding:
help.pin.format.format_0_iso_0.pan=PAN: Uses PAN digits 2–13 from the right (the 12 digits before the check digit), prefixes 0000 and XORs that PAN field with the PIN field.
help.pin.format.format_0_iso_0.block=Block: 8 bytes / 16 hex characters; control nibble 0, PIN length, digits and F fill.
help.pin.format.format_0_iso_0.padding=Padding: Fixed F fill; not selectable.
help.pin.format.format_0_iso_0.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.format_1_iso_1.pan=PAN: Does not use the PAN.
help.pin.format.format_1_iso_1.block=Block: 8 bytes / 16 hex characters; PIN length and digits followed by random hexadecimal fill.
help.pin.format.format_1_iso_1.padding=Padding: Random hexadecimal fill; not selectable.
help.pin.format.format_1_iso_1.fixedPadding=Padding: Random hexadecimal fill; not selectable.
help.pin.format.format_2_iso_2.pan=PAN: Does not use the PAN.
help.pin.format.format_2_iso_2.block=Block: 8 bytes / 16 hex characters; control nibble 2, PIN length, digits and fixed F fill.
help.pin.format.format_2_iso_2.padding=Padding: Fixed F fill; not selectable.
help.pin.format.format_2_iso_2.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.format_3_iso_3.pan=PAN: Uses the 12 rightmost PAN digits before the check digit, prefixes 0000 and XORs the PAN field with the PIN field.
help.pin.format.format_3_iso_3.block=Block: 8 bytes / 16 hex characters; random hexadecimal fill is used in the PIN field before PAN XOR.
help.pin.format.format_3_iso_3.padding=Padding: Random hexadecimal fill; not selectable.
help.pin.format.format_3_iso_3.fixedPadding=Padding: Random hexadecimal fill; not selectable.
help.pin.format.format_4_iso_4.pan=PAN: Uses the whole PAN to construct a 16-byte PAN field: left-pad to 12 decimal digits, then append zero nibbles to 32 hex characters. The check digit is included.
help.pin.format.format_4_iso_4.block=Block: 16 bytes / 32 hex characters per field. Without AES key the UI shows separate 16-byte clear PIN and PAN fields; with AES, ISO-4 produces the protected block.
help.pin.format.format_4_iso_4.padding=Padding: Random hexadecimal fill in the PIN field; not configurable.
help.pin.format.format_4_iso_4.fixedPadding=Padding: Random hexadecimal fill in the PIN field; not configurable.
help.pin.format.ansi_x9_8.pan=PAN: Same implementation as ISO-0: 12 PAN digits from the right before the check digit, prefixed by 0000 and XORed.
help.pin.format.ansi_x9_8.block=Block: 8 bytes / 16 hex characters; ISO-0 structure.
help.pin.format.ansi_x9_8.padding=Padding: Fixed F fill; not selectable.
help.pin.format.ansi_x9_8.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.ibm_3624.pan=PAN: The current block encoder ignores PAN; this field is not used by this format.
help.pin.format.ibm_3624.block=Block: 8 bytes / 16 hex characters; PIN digits followed by F fill, with no length/control nibble.
help.pin.format.ibm_3624.padding=Padding: Fixed F fill; not selectable.
help.pin.format.ibm_3624.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.visa_1.pan=PAN: Same implementation as ISO-0: 12 PAN digits from the right before the check digit, prefixed by 0000 and XORed.
help.pin.format.visa_1.block=Block: 8 bytes / 16 hex characters; ISO-0 structure.
help.pin.format.visa_1.padding=Padding: Fixed F fill; not selectable.
help.pin.format.visa_1.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.visa_2.pan=PAN: The encoder ignores PAN; this field is not used by this format.
help.pin.format.visa_2.block=Block: 8 bytes / 16 hex characters; length nibble, 4–6 PIN digits, zero fill to nibble 6, then repeated decimal padding.
help.pin.format.visa_2.padding=Padding: choose a decimal digit 0–9 or RANDOM_DECIMAL; default is 5.
help.pin.format.visa_2.fixedPadding=Padding: Choose one decimal nibble 0–9 or RANDOM_DECIMAL; default is 5.
help.pin.format.visa_3.pan=PAN: The encoder ignores PAN; this field is not used by this format.
help.pin.format.visa_3.block=Block: 8 bytes / 16 hex characters; 4–12 PIN digits, F delimiter, then repeated padding.
help.pin.format.visa_3.padding=Padding: choose a decimal digit 0–9 or RANDOM_DECIMAL; default is 5.
help.pin.format.visa_3.fixedPadding=Padding: Choose one hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is 5.
help.pin.format.visa_4.pan=PAN: Uses the first 12 PAN digits from the left, excluding the final check digit, prefixed by 0000, then XORed with the PIN field.
help.pin.format.visa_4.block=Block: 8 bytes / 16 hex characters; Plus Network field construction.
help.pin.format.visa_4.padding=Padding: Fixed F fill; not selectable.
help.pin.format.visa_4.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.eci_1.pan=PAN: Same implementation as ISO-0: 12 PAN digits from the right before the check digit, prefixed by 0000 and XORed.
help.pin.format.eci_1.block=Block: 8 bytes / 16 hex characters; ISO-0 structure.
help.pin.format.eci_1.padding=Padding: Fixed F fill; not selectable.
help.pin.format.eci_1.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.eci_2_no_pan_binding.pan=PAN: The encoder ignores PAN; this field is not used by this format.
help.pin.format.eci_2_no_pan_binding.block=Block: 8 bytes / 16 hex characters; exactly 4 PIN digits followed by hexadecimal fill.
help.pin.format.eci_2_no_pan_binding.padding=Padding: Choose a hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is F.
help.pin.format.eci_2_no_pan_binding.fixedPadding=Padding: Choose a hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is F.
help.pin.format.eci_3_no_pan_binding.pan=PAN: The encoder ignores PAN; this field is not used by this format.
help.pin.format.eci_3_no_pan_binding.block=Block: 8 bytes / 16 hex characters; PIN length nibble, 4–6 digits and hexadecimal fill.
help.pin.format.eci_3_no_pan_binding.padding=Padding: Choose a hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is F.
help.pin.format.eci_3_no_pan_binding.fixedPadding=Padding: Choose a hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is F.
help.pin.format.eci_4.pan=PAN: Does not use the PAN.
help.pin.format.eci_4.block=Block: 8 bytes / 16 hex characters; Format 1 style PIN field with random hexadecimal fill.
help.pin.format.eci_4.padding=Padding: Random hexadecimal fill; not selectable.
help.pin.format.eci_4.fixedPadding=Padding: Random hexadecimal fill; not selectable.
help.pin.format.docutel_format_02.pan=PAN: The encoder ignores PAN; this field is not used by this format.
help.pin.format.docutel_format_02.block=Block: 8 bytes / 16 hex characters; 4–6 PIN digits, zero fill to six digits, then nine decimal padding nibbles.
help.pin.format.docutel_format_02.padding=Padding: Choose one decimal nibble 0–9 or RANDOM_DECIMAL; default is RANDOM_DECIMAL.
help.pin.format.docutel_format_02.fixedPadding=Padding: Choose one decimal nibble 0–9 or RANDOM_DECIMAL; default is RANDOM_DECIMAL.
help.pin.format.diebold_format_03.pan=PAN: The encoder ignores PAN; this field is not used by this format.
help.pin.format.diebold_format_03.block=Block: 8 bytes / 16 hex characters; 4–12 PIN digits followed by F nibbles, without a length nibble.
help.pin.format.diebold_format_03.padding=Padding: Choose one hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is F.
help.pin.format.diebold_format_03.fixedPadding=Padding: Choose one hexadecimal nibble 0–F, RANDOM_HEX or RANDOM_DECIMAL; default is F.
help.pin.format.plus_network_format_04.pan=PAN: Uses the first 12 PAN digits from the left, excluding the final check digit, prefixed by 0000, then XORed with the PIN field.
help.pin.format.plus_network_format_04.block=Block: 8 bytes / 16 hex characters; control nibble 0, PIN length, digits and F fill, XORed with PAN field.
help.pin.format.plus_network_format_04.padding=Padding: Fixed F fill; not selectable.
help.pin.format.plus_network_format_04.fixedPadding=Padding: Fixed F fill; not selectable.
help.pin.format.europay_mastercard_pay_now_pay_later.pan=PAN: Uses the same PAN slice as ISO-0: 12 digits from the right before the check digit, prefixed by 0000 and XORed.
help.pin.format.europay_mastercard_pay_now_pay_later.block=Block: 8 bytes / 16 hex characters; ISO-0 structure with control nibble 2.
help.pin.format.europay_mastercard_pay_now_pay_later.padding=Padding: Fixed F fill; not selectable.
help.pin.format.europay_mastercard_pay_now_pay_later.fixedPadding=Padding: Fixed F fill; not selectable.
