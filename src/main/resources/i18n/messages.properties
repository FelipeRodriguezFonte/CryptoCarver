help.option.op_gen_process_designer.menu.edit_menu.undo=Restores the preceding graph edit from the undo history.

help.option.op_gen_process_designer.menu.edit_menu.redo=Reapplies the graph edit most recently reverted by Undo.

help.option.op_gen_process_designer.menu.edit_menu.duplicate=Duplicates the selected node and its configuration as a separate graph node; connections are not implied.

help.option.op_gen_process_designer.menu.edit_menu.layout=Repositions graph nodes into a tidy layout; it does not change node settings or connections.

help.option.op_gen_process_designer.menu.edit_menu.clear=Removes graph nodes and connections from the canvas. Use Reset Defaults to restore the initial preset graph.

help.option.op_gen_process_designer.menu.edit_menu.reset=Clears the current graph and loads the built-in default SHA-256 example.

help.option.op_gen_process_designer.menu.presets.sha256_preset=Loads a sample text input → SHA-256 → console output graph.

help.option.op_gen_process_designer.menu.presets.base64_preset=Loads a text input → Base64 encode → console output sample graph.

help.option.op_gen_process_designer.menu.presets.aes_gcm_preset=Loads a sample AES-GCM encrypt/decrypt round trip. Review key material and nonce requirements in each crypto node before execution.

help.option.op_gen_process_designer.menu.presets.aes_cmac_preset=Loads a sample AES-CMAC graph that computes a message authentication code with a shared key.

module.process.desc.base64=Legacy Base64 catalog node. The current CodecNodeHandler has no BASE64 execution branch; prefer the separate encode/decode nodes, which do have handlers.

help.action.op_gen_process_designer.node.base64.example=The legacy descriptor advertises `input` and BINARY output. Error case (reproducible): with any connected input, `execute` throws `Unknown codec type: BASE64`; use BASE64_ENCODE or BASE64_DECODE.


help.node.parameter.base64_decode.charset=Legacy selector, default UTF-8. The handler decodes the Base64 alphabet to BINARY and does not read this field; no choice changes the bytes.

help.node.parameter.base64url_decode.charset=Legacy selector, default UTF-8. The handler decodes the URL-safe alphabet to BINARY and does not read this field; no choice changes the bytes.

help.node.parameter.hex_decode.charset=Legacy selector, default UTF-8. HEX_DECODE parses hexadecimal pairs to BINARY and does not read this field; no choice changes the bytes.

help.node.parameter.utf8_encode.charset=Catalog selector defaulting to UTF-8, ignored by the handler. UTF8_ENCODE decodes with the charset already carried by the incoming FlowValue (UTF-8 if absent) and re-encodes as UTF-8.

help.node.parameter.utf8_decode.charset=Catalog selector defaulting to UTF-8, ignored by the handler. UTF8_DECODE always uses UTF-8; malformed sequences become U+FFFD instead of being rejected.

help.node.parameter.charset_convert.sourcecharset=Source charset used to decode bytes; default ISO-8859-1. Malformed sequences are replaced; ensure this matches the producer’s byte encoding.


help.node.parameter.pad.blocksize=Block size in bytes for PKCS7 and ISO/zero schemes; default 16, accepted range 1–256 inclusive. PKCS5 keeps its fixed 8-byte block, though this value is still validated.

help.action.op_gen_process_designer.node.check_digit_calc.example=Luhn input `7992739871` produces check digit `3`. Error case: empty input fails; the handler strips non-digit characters before calculation.


help.node.ports.modular_arithmetic=Required input a accepts standard representations. Input b is required for ADD/SUBTRACT/MULTIPLY/EXPONENTIATE/GCD and omitted for ADDITIVE_INVERSE/MULTIPLICATIVE_INVERSE. Output: TEXT_UTF8.

help.node.option.check_digit_calc.algorithm.luhn_mod_10=Alternating mod-10 check digit; doubles alternating digits from the right and sums decimal digits.

help.node.option.check_digit_calc.algorithm.amex_se_luhn_mod_10=This implementation routes AMEX SE to the same Luhn calculation as Luhn (Mod 10); it does not add issuer validation.

help.node.option.check_digit_calc.algorithm.verhoeff=Uses the Verhoeff dihedral multiplication/permutation tables for check-digit calculation.

help.node.option.check_digit_calc.algorithm.damm=Uses the Damm quasigroup table to calculate the check digit.

help.node.option.check_digit_verify.algorithm.luhn_mod_10=Alternating mod-10 check digit; doubles alternating digits from the right and sums decimal digits.

help.node.option.check_digit_verify.algorithm.amex_se_luhn_mod_10=This implementation routes AMEX SE to the same Luhn calculation as Luhn (Mod 10); it does not add issuer validation.

help.node.option.check_digit_verify.algorithm.verhoeff=Uses the Verhoeff dihedral multiplication/permutation tables for check-digit calculation.

help.node.option.check_digit_verify.algorithm.damm=Uses the Damm quasigroup table to calculate the check digit.

help.node.option.modular_arithmetic.operation.add=Adds a and b, then reduces modulo m.

help.node.option.modular_arithmetic.operation.subtract=Subtracts b from a, then reduces modulo m.

help.node.option.modular_arithmetic.operation.multiply=Multiplies a by b, then reduces modulo m.

help.node.option.modular_arithmetic.operation.exponentiate=Computes a raised to exponent b modulo m.

help.node.option.modular_arithmetic.operation.additive_inverse=Computes the additive inverse of a modulo m; only port a is required.

help.node.option.modular_arithmetic.operation.multiplicative_inverse=Computes the modular reciprocal of a; it exists only when a and m are coprime. Only port a is required.

help.node.option.modular_arithmetic.operation.gcd=Computes gcd(a,b); the handler does not use the modulus parameter for this operation.

help.action.op_gen_process_designer.node.console_input.example=Literal `A` with UTF-8 emits byte `41`. Real edge case: `ñ` with US-ASCII emits `3F` because `String.getBytes` substitutes it; no exception is raised.


help.action.op_gen_process_designer.node.file_input.example=Read bytes `41 42` in BINARY mode and the node emits those two bytes. Error case: a missing path stops the node with an I/O error.

help.action.op_gen_process_designer.node.console_output.example=Connect bytes `48 69` (UTF-8 text `Hi`); rendered output is `4869`. Error case: with `input` unconnected, ProcessEngine validation identifies the required port.

help.action.op_gen_process_designer.node.ebcdic_encode.example=Text `A` with IBM037 produces `C1`. Real edge case: a character the page cannot represent is replaced by the Java encoder; this is not reported as a strict error.


help.action.op_gen_process_designer.node.utf8_encode.example=Text `Hi` with UTF-8 input metadata produces `48 69`. Edge case: this node’s charset selector is ignored; an upstream US-ASCII input may already have replaced `ñ` with `3F`.

help.action.op_gen_process_designer.node.utf8_decode.example=`48 69` produces `Hi`. Real edge case, not an exception: malformed bytes `C3 28` decode to `�(` using Java replacement.


help.node.parameter.console_input.charset=Charset that encodes the `value` literal to bytes; default UTF-8. Java replaces unmappable characters (for example, `ñ` in US-ASCII becomes `?`).

help.node.parameter.file_input.charset=Charset for file decoding when `readMode=TEXT`; default UTF-8. Hidden in BINARY mode. Java replaces malformed sequences; this is not strict decoding.

help.node.parameter.file_output.charset=Charset used to encode the text representation (`render()`) when `writeMode=TEXT`; default UTF-8. Hidden in BINARY mode; Java replaces unmappable characters.

help.node.parameter.charset_convert.targetcharset=Target charset used to encode decoded text; default UTF-8. Java replaces unrepresentable characters instead of failing: ISO-8859-1 `E9` → US-ASCII yields `3F` (`?`).

module.process.desc.base64Decode=Decodes standard Base64 to bytes; the exposed charset selector is not read by the current handler.

module.process.desc.hexDecode=Parses Hex text into bytes; the exposed charset selector is not read by the current handler.

module.process.desc.utf8Encode=Normalizes incoming text bytes to UTF-8 using the incoming FlowValue charset metadata; its node-level charset selector is not read.

module.process.desc.utf8Decode=Decodes bytes as UTF-8 using Java replacement behavior; its node-level charset selector is not read.

help.field.op_gen_process_designer.process_file.label=Process file

help.field.op_gen_process_designer.process_file.description=The chosen process definition file for open/save; help never reads, stores, or exposes its path.

help.field.op_gen_process_designer.node_name.label=Node name

help.field.op_gen_process_designer.node_name.description=Display name stored on the selected node; it is descriptive text and is excluded from help context.

help.field.op_gen_process_designer.target_port.label=Target port

help.field.op_gen_process_designer.target_port.description=Target input-port choice for a connection; only the public port ID is used.

help.field.op_gen_process_designer.connection.label=Selected connection

help.field.op_gen_process_designer.connection.description=The directed edge selected for reversal; help does not change its source or target.

help.field.op_gen_process_designer.clear_canvas.label=Clear canvas

help.field.op_gen_process_designer.clear_canvas.description=Clears the current workflow graph when explicitly activated; help does not invoke it.

help.field.op_gen_process_designer.status_summary.label=Run status

help.field.op_gen_process_designer.status_summary.description=Current execution status text; it is shown for explanation only and is not copied into help context.

help.action.op_gen_process_designer.node.base58_encode.example=Bytes `00 61` produce `12g`; the leading zero is preserved as `1`. Error case: with no `input`, preflight identifies the required connection; Base58 needs its own decoder.

help.action.op_gen_process_designer.node.base58_decode.example=`12g` returns bytes `00 61`. Error case: `0OIl` contains characters excluded from the Base58 alphabet.

help.action.op_gen_process_designer.delete.title=Delete selection
help.action.op_gen_process_designer.delete.description=Deletes the selected connection when a connection is selected; otherwise deletes the selected node and every incident connection. The edit is recorded in Undo; it does not delete unrelated nodes or execute the process.
help.action.op_gen_process_designer.delete.example=Select a connection and delete it to remove only that link; Undo restores it. Select a node and delete it to remove that node plus incoming/outgoing links; Undo restores the edit.
help.field.op_gen_process_designer.selection.label=Selection
help.field.op_gen_process_designer.selection.description=Determines what is removed: the active connection, or the active node and all incident links. With no deletable selection, the action does not change the graph.
help.fpe.currentKeyBytes=Derived Hex key size, in bytes
help.fpe.currentTweakBytes=Derived Hex tweak size, in bytes
help.fileCipher.ff1TweakLimit=FF1 accepts an optional tweak of up to 1024 bytes.
help.operation.op_gen_clipboard.title=Clipboard Shelf
# module-help:op_auth_sig begin
help.operation.op_auth_sig.title=Digital Signatures
help.operation.op_auth_sig.purpose=Signs the message with a private key or verifies an existing signature with the public key. A valid signature shows that the holder of the private key signed exactly these bytes; it says nothing about who owns the key.
help.action.op_auth_sig.sign.title=Sign
help.action.op_auth_sig.sign.description=Signs the message bytes with the private key and the selected algorithm and writes the signature to Result. The message is decoded with the global payload format first.
help.action.op_auth_sig.verify.title=Verify signature
help.action.op_auth_sig.verify.description=Checks the pasted signature against the message, the public key and the selected algorithm. Message, algorithm and key must be the ones used to sign; any difference makes verification fail.
help.action.op_auth_sig.load_private_key.title=Load private key
help.action.op_auth_sig.load_private_key.description=Fills the private key from the clipboard, a file or the Clipboard Shelf. The key stays in this form; help never reads it.
help.action.op_auth_sig.load_public_key.title=Load public key
help.action.op_auth_sig.load_public_key.description=Fills the public key from the clipboard, a file or the Clipboard Shelf.
help.action.op_auth_sig.apply_template.title=Apply template or reset
help.action.op_auth_sig.apply_template.description=Apply sets the form to the selected template; Reset Defaults returns it to the initial values. Templates store selector settings, never key material.
help.field.op_auth_sig.input.label=Message
help.field.op_auth_sig.input.description=Data to sign or verify. It is interpreted with the global payload format, so the same text in Hex and in UTF-8 yields different signatures.
help.field.op_auth_sig.algorithm.label=Algorithm
help.field.op_auth_sig.algorithm.description=Signature scheme and hash: Ed25519, RSA with PKCS#1 v1.5 or PSS, or ECDSA. The key type must match the scheme. RSA-SHA1-PKCS1 is offered for compatibility with legacy systems only.
help.field.op_auth_sig.private_key.label=Private key
help.field.op_auth_sig.private_key.description=Private key in PEM, needed to sign. It is sensitive material: anyone holding it can sign in your name.
help.field.op_auth_sig.public_key.label=Public key
help.field.op_auth_sig.public_key.description=Public key in PEM, needed to verify. It must be the pair of the private key that produced the signature.
help.field.op_auth_sig.signature.label=Signature to verify
help.field.op_auth_sig.signature.description=Existing signature, written in the format selected as global output format.
help.field.op_auth_sig.template.label=Template
help.field.op_auth_sig.template.description=Saved combination of settings for this screen. Personal templates can be saved, exported, imported and deleted from Manage Template.
help.field.op_auth_sig.output.label=Result
help.field.op_auth_sig.output.description=Generated signature in the global output format, or the outcome of the verification.
# module-help:op_auth_sig end
# module-help:op_auth_mac begin
help.operation.op_auth_mac.title=Message Authentication Codes
help.operation.op_auth_mac.purpose=Computes or verifies a MAC over the message with a shared secret key. A MAC proves integrity and that the sender knew the key; because both sides share the key, it does not prove which of them produced it.
help.action.op_auth_mac.generate.title=Generate MAC
help.action.op_auth_mac.generate.description=Computes the MAC of the message with the selected algorithm, key and output length and writes it to Result.
help.action.op_auth_mac.verify.title=Verify MAC
help.action.op_auth_mac.verify.description=Recomputes the MAC with the same message, algorithm, key and output length and compares it with the expected value.
help.action.op_auth_mac.load_key.title=Load key
help.action.op_auth_mac.load_key.description=Fills the key from the clipboard, a file or the Clipboard Shelf.
help.action.op_auth_mac.key_lab.title=Key Lab
help.action.op_auth_mac.key_lab.description=Saves the typed key to the Key Lab inventory, or opens the selected Key Lab key for inspection.
help.field.op_auth_mac.input.label=Message
help.field.op_auth_mac.input.description=Data to authenticate, interpreted with the global payload format.
help.field.op_auth_mac.algorithm.label=Algorithm
help.field.op_auth_mac.algorithm.description=MAC construction: HMAC, CMAC, CBC-MAC, the ISO 9797-1 variants, GMAC-AES or Poly1305. The note under the selector states the key size and the cautions that apply to the chosen one.
help.field.op_auth_mac.output_length.label=Output length
help.field.op_auth_mac.output_length.description=Number of bytes kept from the MAC; 0 keeps the full value. A shorter MAC is easier to forge by guessing, so truncate only when the protocol requires it.
help.field.op_auth_mac.key_source.label=Key source
help.field.op_auth_mac.key_source.description=Manual Input uses the typed hexadecimal key; Simulated HSM and PKCS#11 Token use a key selected from the list, without showing its value.
help.field.op_auth_mac.key.label=Key
help.field.op_auth_mac.key.description=Secret key in hexadecimal. The required size depends on the algorithm and is shown under the field.
help.field.op_auth_mac.nonce.label=Nonce / IV
help.field.op_auth_mac.nonce.description=Shown only for algorithms that need one, such as GMAC. It must be unique for every message authenticated with the same key.
help.field.op_auth_mac.expected_mac.label=Expected MAC
help.field.op_auth_mac.expected_mac.description=MAC received with the message, to compare against the recomputed one.
help.field.op_auth_mac.output.label=Result
help.field.op_auth_mac.output.description=Generated MAC in the global output format, or the outcome of the verification.
# module-help:op_auth_mac end
# module-help:op_keys_lab begin
help.operation.op_keys_lab.title=Key Lab
help.operation.op_keys_lab.purpose=Local inventory of symmetric laboratory keys, also used as the Simulated HSM. Each entry keeps a name, algorithm, size, allowed usages, exportability, KCV, origin and status, so other screens can use a key by reference.
help.action.op_keys_lab.find.title=Find a key
help.action.op_keys_lab.find.description=Filters the inventory by text and status; selecting a row shows its details below.
help.action.op_keys_lab.generate.title=Generate key
help.action.op_keys_lab.generate.description=Creates a random key of the chosen algorithm and size and adds it to the inventory under the given name.
help.action.op_keys_lab.import.title=Import key
help.action.op_keys_lab.import.description=Adds a key you already have, pasted as hexadecimal bytes, under the given name and algorithm.
help.action.op_keys_lab.save_metadata.title=Edit metadata
help.action.op_keys_lab.save_metadata.description=Saves the name and allowed usages of the selected key. Copy ID copies its identifier, not its value.
help.action.op_keys_lab.reveal.title=Reveal value
help.action.op_keys_lab.reveal.description=Shows the value of the selected key in clear. Do it only when nobody else can see the screen.
help.action.op_keys_lab.use.title=Use in another screen
help.action.op_keys_lab.use.description=Opens Symmetric Ciphers or MAC with the selected key chosen as Simulated HSM key. The allowed usages decide which of the two is available.
help.action.op_keys_lab.archive_delete.title=Archive or delete
help.action.op_keys_lab.archive_delete.description=Archive hides the key from the active list but keeps it; Delete removes it from the inventory for good.
help.action.op_keys_lab.transfer_metadata.title=Import or export metadata
help.action.op_keys_lab.transfer_metadata.description=Reads or writes a file with the metadata of the inventory entries.
help.field.op_keys_lab.search.label=Search
help.field.op_keys_lab.search.description=Text matched against key names and algorithms.
help.field.op_keys_lab.status_filter.label=Status filter
help.field.op_keys_lab.status_filter.description=Shows active keys, archived keys or all of them.
help.field.op_keys_lab.table.label=Inventory
help.field.op_keys_lab.table.description=One row per key: name, algorithm, bits, KCV, origin and status. The key value is not shown here.
help.field.op_keys_lab.name.label=Name
help.field.op_keys_lab.name.description=Alias you will recognise the key by in other screens.
help.field.op_keys_lab.algorithm.label=Algorithm
help.field.op_keys_lab.algorithm.description=AES, 3DES, DES or ChaCha20. It determines the sizes offered.
help.field.op_keys_lab.size.label=Key size
help.field.op_keys_lab.size.description=Size in bits. For 3DES, 128 means two-key and 192 three-key.
help.field.op_keys_lab.import_bytes.label=Key bytes
help.field.op_keys_lab.import_bytes.description=Raw key in hexadecimal, masked while you type. Its length must fit the algorithm.
help.field.op_keys_lab.detail_name.label=Name of the selected key
help.field.op_keys_lab.detail_name.description=Editable alias of the key selected in the inventory.
help.field.op_keys_lab.usages.label=Allowed usages
help.field.op_keys_lab.usages.description=Operations this key may be used for. Screens that take a key from the Simulated HSM respect these marks.
help.field.op_keys_lab.value.label=Key value
help.field.op_keys_lab.value.description=Hidden until you press Reveal Value.
help.field.op_keys_lab.kcv_length.label=KCV length
help.field.op_keys_lab.kcv_length.description=Shows key check values with 4 bytes instead of 3. It changes only how many bytes are displayed, not the key.
# module-help:op_keys_lab end
# module-help:op_keys_gen begin
help.operation.op_keys_gen.title=Key Generation
help.operation.op_keys_gen.purpose=Generates a random symmetric key of the selected type and shows its KCV and fingerprint so it can be identified without revealing it.
help.action.op_keys_gen.generate.title=Generate key
help.action.op_keys_gen.generate.description=Creates a new random key and fills the summary: length, KCV, SHA-256 fingerprint and parity.
help.action.op_keys_gen.save_to_lab.title=Save to Key Lab
help.action.op_keys_gen.save_to_lab.description=Registers the generated key in the Key Lab with a name, allowed usages and exportability.
help.action.op_keys_gen.copy.title=Copy
help.action.op_keys_gen.copy.description=Copies the key, only its KCV, or the summary. The KCV and the summary can be shared; the key cannot.
help.action.op_keys_gen.open_validation.title=Open Validation & KCV
help.action.op_keys_gen.open_validation.description=Takes the generated key to Validation & KCV to check its parity and check values.
help.field.op_keys_gen.type.label=Type
help.field.op_keys_gen.type.description=Algorithm and length of the key to generate.
help.field.op_keys_gen.odd_parity.label=Force odd parity
help.field.op_keys_gen.odd_parity.description=Adjusts the lowest bit of every byte so each has odd parity, as DES and 3DES keys traditionally require. It does not apply to other algorithms.
help.field.op_keys_gen.generated_key.label=Generated key
help.field.op_keys_gen.generated_key.description=The new key in hexadecimal. It is secret material: copy it only to where it will be used.
help.field.op_keys_gen.kcv_length.label=KCV length
help.field.op_keys_gen.kcv_length.description=Shows key check values with 4 bytes instead of 3. It changes only how many bytes are displayed, not the key.
# module-help:op_keys_gen end
# module-help:op_keys_val begin
help.operation.op_keys_val.title=Validation & KCV
help.operation.op_keys_val.purpose=Checks a symmetric key written in hexadecimal and computes its key check values, which let two parties confirm they hold the same key without exchanging it.
help.action.op_keys_val.validate.title=Validate and calculate KCVs
help.action.op_keys_val.validate.description=Analyses the key and writes the report with its length, parity and check values.
help.field.op_keys_val.key.label=Key
help.field.op_keys_val.key.description=Key in hexadecimal.
help.field.op_keys_val.result.label=Report
help.field.op_keys_val.result.description=Validation outcome and the computed check values.
help.field.op_keys_val.kcv_length.label=KCV length
help.field.op_keys_val.kcv_length.description=Shows key check values with 4 bytes instead of 3. It changes only how many bytes are displayed, not the key.
# module-help:op_keys_val end
# module-help:op_keys_share begin
help.operation.op_keys_share.title=Key Sharing (XOR)
help.operation.op_keys_share.purpose=Splits a key into components whose XOR is the key, or combines components back into the key. Every component is needed: with one missing, the rest reveal nothing about the key.
help.action.op_keys_share.split.title=Split key
help.action.op_keys_share.split.description=Generates the chosen number of random components for the key.
help.action.op_keys_share.combine.title=Combine components
help.action.op_keys_share.combine.description=XORs the components entered and shows the resulting key. All components must have the same length.
help.field.op_keys_share.key.label=Key to split
help.field.op_keys_share.key.description=Key in hexadecimal.
help.field.op_keys_share.parts.label=Parts
help.field.op_keys_share.parts.description=Number of components to create.
help.field.op_keys_share.components.label=Components
help.field.op_keys_share.components.description=Components in hexadecimal. The first two are required; the rest are optional.
help.field.op_keys_share.result.label=Result
help.field.op_keys_share.result.description=Components produced by the split, or the key recovered by combining.
# module-help:op_keys_share end
# module-help:op_keys_kdf begin
help.operation.op_keys_kdf.title=Key Derivation (KDF)
help.operation.op_keys_kdf.purpose=Derives key bytes from input key material with the selected derivation function. The same inputs always give the same output, so every parameter must match on both sides.
help.action.op_keys_kdf.derive.title=Derive key
help.action.op_keys_kdf.derive.description=Runs the derivation and writes the derived bytes to the result.
help.action.op_keys_kdf.generate_salt.title=Generate salt
help.action.op_keys_kdf.generate_salt.description=Fills the salt with random bytes. Keep it with the result: it is needed to derive the same key again.
help.field.op_keys_kdf.algorithm.label=Algorithm
help.field.op_keys_kdf.algorithm.description=Derivation function. It decides which of the fields below apply; those that do not are hidden.
help.field.op_keys_kdf.input_format.label=Input format
help.field.op_keys_kdf.input_format.description=How the input key material is decoded into bytes before deriving.
help.field.op_keys_kdf.input.label=Input key material
help.field.op_keys_kdf.input.description=Password or secret the key is derived from, written in the selected input format.
help.field.op_keys_kdf.iterations.label=Iterations
help.field.op_keys_kdf.iterations.description=Work factor of password-based functions. More iterations make guessing the password slower, and derivation slower too.
help.field.op_keys_kdf.output_length.label=Output length
help.field.op_keys_kdf.output_length.description=Number of bytes to derive.
help.field.op_keys_kdf.salt.label=Salt
help.field.op_keys_kdf.salt.description=Non-secret value that makes derivations from the same input differ. The selector sets the format it is written in.
help.field.op_keys_kdf.info.label=Info
help.field.op_keys_kdf.info.description=Context label used by HKDF to derive independent keys from the same material. Other functions ignore it.
help.field.op_keys_kdf.result.label=Derived key
help.field.op_keys_kdf.result.description=Derived bytes. Treat them as a secret key.
# module-help:op_keys_kdf end
# module-help:op_keys_wrap begin
help.operation.op_keys_wrap.title=AES Key Wrap
help.operation.op_keys_wrap.purpose=Wraps a key under an AES key-encryption key (KEK), or unwraps it, with RFC 3394 or RFC 5649. The wrapped form carries an integrity check, so a wrong KEK or altered data is rejected.
help.action.op_keys_wrap.execute.title=Execute key wrap
help.action.op_keys_wrap.execute.description=Wraps the key data, or unwraps it when Unwrap is ticked, and writes the result.
help.field.op_keys_wrap.mode.label=Mode
help.field.op_keys_wrap.mode.description=RFC 3394 requires key data in multiples of 8 bytes; RFC 5649 adds padding and accepts any length.
help.field.op_keys_wrap.direction.label=Unwrap
help.field.op_keys_wrap.direction.description=Unticked wraps; ticked unwraps.
help.field.op_keys_wrap.kek.label=KEK
help.field.op_keys_wrap.kek.description=AES key-encryption key in hexadecimal: 16, 24 or 32 bytes.
help.field.op_keys_wrap.data.label=Key data
help.field.op_keys_wrap.data.description=Key to wrap, or wrapped data to unwrap, in hexadecimal.
help.field.op_keys_wrap.result.label=Result
help.field.op_keys_wrap.result.description=Wrapped data, or the recovered key.
# module-help:op_keys_wrap end
# module-help:op_keys_tr31 begin
help.operation.op_keys_tr31.title=TR-31 Key Blocks
help.operation.op_keys_tr31.purpose=Builds and opens TR-31 (ANSI X9.143) key blocks: a key wrapped under a Key Block Protection Key together with a header that states what the key may be used for. The header is authenticated, so it cannot be changed without invalidating the block.
help.action.op_keys_tr31.export.title=Wrap key (export)
help.action.op_keys_tr31.export.description=Wraps the key under the KBPK with the header attributes selected and writes the key block.
help.action.op_keys_tr31.import.title=Unwrap key
help.action.op_keys_tr31.import.description=Verifies the block with the KBPK and recovers the key and its header attributes.
help.action.op_keys_tr31.parse_header.title=Parse header
help.action.op_keys_tr31.parse_header.description=Reads the header of the block without a KBPK. It shows the declared attributes but does not verify the block.
help.action.op_keys_tr31.clear_reset.title=Clear or reset
help.action.op_keys_tr31.clear_reset.description=Clear empties the export fields; Reset Defaults returns the selectors to their initial values.
help.field.op_keys_tr31.kbpk_export.label=KBPK
help.field.op_keys_tr31.kbpk_export.description=Key Block Protection Key in hexadecimal. It protects the block; it is not the key being transported.
help.field.op_keys_tr31.key.label=Key to wrap
help.field.op_keys_tr31.key.description=Key to transport, in hexadecimal.
help.field.op_keys_tr31.version.label=Version
help.field.op_keys_tr31.version.description=Key block version, which fixes the protection method and the KBPK algorithm it expects.
help.field.op_keys_tr31.usage.label=Usage
help.field.op_keys_tr31.usage.description=What the wrapped key is for, such as PIN encryption or MAC.
help.field.op_keys_tr31.algorithm.label=Algorithm
help.field.op_keys_tr31.algorithm.description=Algorithm the wrapped key belongs to.
help.field.op_keys_tr31.mode.label=Mode of use
help.field.op_keys_tr31.mode.description=Operations allowed with the key, such as encrypt only or both directions.
help.field.op_keys_tr31.exportability.label=Exportability
help.field.op_keys_tr31.exportability.description=Whether the receiver may export the key again.
help.field.op_keys_tr31.optional_blocks.label=Optional blocks
help.field.op_keys_tr31.optional_blocks.description=Extra header blocks in compact form. Leave empty unless the receiver expects them.
help.field.op_keys_tr31.export_result.label=Export result
help.field.op_keys_tr31.export_result.description=The generated key block.
help.field.op_keys_tr31.kbpk_import.label=KBPK
help.field.op_keys_tr31.kbpk_import.description=Key Block Protection Key the block was created with, in hexadecimal.
help.field.op_keys_tr31.key_block.label=TR-31 key block
help.field.op_keys_tr31.key_block.description=Key block to open, as text.
help.field.op_keys_tr31.expected_length.label=Expected length
help.field.op_keys_tr31.expected_length.description=Optional key length in bytes, used to check the recovered key.
help.field.op_keys_tr31.import_result.label=Import result
help.field.op_keys_tr31.import_result.description=Recovered key and header attributes, or the parsed header.
# module-help:op_keys_tr31 end
# module-help:op_keys_compare begin
help.operation.op_keys_compare.title=Compare Public / Private Key
help.operation.op_keys_compare.purpose=Checks whether a public key, or the one inside a certificate, and a private key belong to the same pair. It proves it cryptographically with a temporary signing challenge instead of comparing PEM text.
help.action.op_keys_compare.compare.title=Compare pair
help.action.op_keys_compare.compare.description=Signs a throwaway challenge with the private key and verifies it with the public key.
help.field.op_keys_compare.public.label=Public key or certificate
help.field.op_keys_compare.public.description=Public key PEM, or an X.509 certificate PEM whose public key is used.
help.field.op_keys_compare.private.label=Private key
help.field.op_keys_compare.private.description=Private key PEM. It is used only for the challenge.
help.field.op_keys_compare.result.label=Result
help.field.op_keys_compare.result.description=Whether the two keys form a pair.
# module-help:op_keys_compare end
# module-help:op_keys_material begin
help.operation.op_keys_material.title=Key Material Inspector
help.operation.op_keys_material.purpose=Reads a PEM public key, private key or X.509 certificate and reports its type, size and fingerprint together with security hints. It inspects; it does not validate trust.
help.action.op_keys_material.inspect.title=Inspect material
help.action.op_keys_material.inspect.description=Parses the pasted PEM and writes the report.
help.field.op_keys_material.input.label=Material
help.field.op_keys_material.input.description=PEM block to inspect.
help.field.op_keys_material.report.label=Report
help.field.op_keys_material.report.description=Fingerprint, size and hints for the material.
# module-help:op_keys_material end
# module-help:op_keys_store begin
help.operation.op_keys_store.title=KeyStore Inspector
help.operation.op_keys_store.purpose=Opens a PKCS#12, JKS or JCEKS keystore and lists its entries. By default it shows metadata only and never exports private or secret keys.
help.action.op_keys_store.inspect.title=Inspect KeyStore
help.action.op_keys_store.inspect.description=Opens the file with the password and lists its entries.
help.action.op_keys_store.choose.title=Browse
help.action.op_keys_store.choose.description=Picks the keystore file.
help.action.op_keys_store.profile.title=Load or save profile
help.action.op_keys_store.profile.description=A profile remembers the file path and type under a name. The password is never saved.
help.field.op_keys_store.path.label=File
help.field.op_keys_store.path.description=Path of the keystore file.
help.field.op_keys_store.type.label=Type
help.field.op_keys_store.type.description=Auto detects the format; choose PKCS12, JKS or JCEKS to force one.
help.field.op_keys_store.password.label=Store password
help.field.op_keys_store.password.description=Password of the keystore. It is used for this inspection only.
help.field.op_keys_store.unsafe_extract.label=Unsafe extraction
help.field.op_keys_store.unsafe_extract.description=Shows exportable private and secret keys in clear. Meant for laboratory keystores only.
help.field.op_keys_store.profile.label=Saved profile
help.field.op_keys_store.profile.description=Profile to load.
help.field.op_keys_store.profile_name.label=Profile name
help.field.op_keys_store.profile_name.description=Name under which the current path and type are saved.
help.field.op_keys_store.report.label=Report
help.field.op_keys_store.report.description=Entries found in the keystore.
# module-help:op_keys_store end
# module-help:op_keys_rsa begin
