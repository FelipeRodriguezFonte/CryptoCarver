help.option.op_gen_batch.operation.sha-256=UTF-8 source text is hashed; output is the 32-byte SHA-256 digest in lowercase hex.
help.option.op_gen_batch.operation.sha-256.example=With input=abc, result=ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad.
help.option.op_gen_batch.operation.sha-256.error=A JSONL row without the configured input source fails before hashing: required field input is missing.
help.option.op_gen_batch.operation.sha-384=Reads UTF-8 and returns the 48-byte SHA-384 digest in lowercase hex.
help.option.op_gen_batch.operation.sha-384.example=With input=abc, the result starts cb00753f and contains 96 hex digits.
help.option.op_gen_batch.operation.sha-384.error=Without input, the row fails the required source-column check before the SHA-384 provider runs.
help.option.op_gen_batch.operation.sha-512=Reads UTF-8 and returns the 64-byte SHA-512 digest in lowercase hex.
help.option.op_gen_batch.operation.sha-512.example=With input=abc, the result starts ddaf35a1 and contains 128 hex digits.
help.option.op_gen_batch.operation.sha-512.error=A row missing the configured input column is reported as an error; hashing does not accept a missing value.
help.option.op_gen_batch.operation.utf8-to-hex=Encodes each string as UTF-8 bytes and returns two hexadecimal digits per byte.
help.option.op_gen_batch.operation.utf8-to-hex.example=With input=Hola, result=486f6c61; ñ is encoded as two UTF-8 bytes.
help.option.op_gen_batch.operation.utf8-to-hex.error=Empty text is valid and produces empty output; a missing input column fails in the batch runner.
help.option.op_gen_batch.operation.hex-to-utf8=Parses the cell as hexadecimal bytes and decodes those bytes as UTF-8.
help.option.op_gen_batch.operation.hex-to-utf8.example=With input=486f6c61, result=Hola.
help.option.op_gen_batch.operation.hex-to-utf8.error=input=48Z0 fails as malformed hexadecimal; it is not treated as literal text.
help.option.op_gen_batch.operation.utf8-to-base64=Encodes the cell's UTF-8 bytes using standard Base64, including padding where required.
help.option.op_gen_batch.operation.utf8-to-base64.example=With input=Hi, result=SGk=.
help.option.op_gen_batch.operation.utf8-to-base64.error=Any UTF-8 text, including empty text, can be encoded; the row fails if input is missing.
help.option.op_gen_batch.operation.base64-to-utf8=Decodes standard Base64 and interprets the resulting bytes as UTF-8 text.
help.option.op_gen_batch.operation.base64-to-utf8.example=With input=SGk=, result=Hi.
help.option.op_gen_batch.operation.base64-to-utf8.error=input=SGk! fails for invalid Base64 characters; byte sequences invalid as UTF-8 may be replaced by Java's decoder.
help.option.op_gen_batch.operation.hexadecimal-to-base64=Parses hexadecimal as bytes and encodes those bytes as standard Base64.
help.option.op_gen_batch.operation.hexadecimal-to-base64.example=With input=4869, result=SGk=.
help.option.op_gen_batch.operation.hexadecimal-to-base64.error=input=48Z0 fails in hexadecimal parsing before Base64 encoding.
help.option.op_gen_batch.operation.base64-to-hexadecimal=Decodes standard Base64 and returns the bytes as lowercase hexadecimal.
help.option.op_gen_batch.operation.base64-to-hexadecimal.example=With input=SGk=, result=4869.
help.option.op_gen_batch.operation.base64-to-hexadecimal.error=input=SGk! is rejected as invalid Base64.
help.option.op_gen_batch.operation.utf8-to-base64url=Encodes UTF-8 text with URL-safe Base64 and omits trailing padding.
help.option.op_gen_batch.operation.utf8-to-base64url.example=With input=Hi, result=SGk (without standard Base64's trailing =).
help.option.op_gen_batch.operation.utf8-to-base64url.error=UTF-8 text can be encoded; a missing input fails the common row validation.
help.option.op_gen_batch.operation.base64url-to-utf8=Decodes Base64URL (not standard Base64) and presents the bytes as UTF-8 text.
help.option.op_gen_batch.operation.base64url-to-utf8.example=With input=SGk, result=Hi.
help.option.op_gen_batch.operation.base64url-to-utf8.error=input=SGk+ is rejected: + belongs to standard Base64, not the accepted Base64URL alphabet.
help.option.op_gen_batch.operation.luhn-mod-10-to-calculate-check-digit=Requires a non-empty base of ASCII digits and returns only the Luhn digit; it does not append the base.
help.option.op_gen_batch.operation.luhn-mod-10-to-calculate-check-digit.example=With input=7992739871, result=3; the completed number would be 79927398713.
help.option.op_gen_batch.operation.luhn-mod-10-to-calculate-check-digit.error=input=79927A fails: the batch calculator requires ASCII digits only.
help.option.op_gen_batch.operation.luhn-mod-10-to-validate-check-digit=Requires at least two ASCII digits, treats the last as the check digit, and returns true or false.
help.option.op_gen_batch.operation.luhn-mod-10-to-validate-check-digit.example=With input=79927398713, result=true; changing the last digit to 4 returns false.
help.option.op_gen_batch.operation.luhn-mod-10-to-validate-check-digit.error=input=79927A is rejected because this input accepts ASCII digits only.
help.option.op_gen_batch.operation.verhoeff-to-calculate-check-digit=Calculates the Verhoeff check digit for a non-empty ASCII-digit base and returns only that digit.
help.option.op_gen_batch.operation.verhoeff-to-calculate-check-digit.example=With input=572, result=7; the completed value would be 5727.
help.option.op_gen_batch.operation.verhoeff-to-calculate-check-digit.error=input=57x fails because this input requires ASCII digits.
help.option.op_gen_batch.operation.verhoeff-to-validate-check-digit=Validates the final digit with Verhoeff; requires at least two ASCII digits and returns true/false.
help.option.op_gen_batch.operation.verhoeff-to-validate-check-digit.example=With input=5727, result=true; 5728 returns false.
help.option.op_gen_batch.operation.verhoeff-to-validate-check-digit.error=input=57x fails because validation accepts ASCII digits only.
help.option.op_gen_batch.operation.damm-to-calculate-check-digit=Calculates the Damm digit for a non-empty ASCII-digit base and returns only that digit.
help.option.op_gen_batch.operation.damm-to-calculate-check-digit.example=With input=572, result=4; the completed value would be 5724.
help.option.op_gen_batch.operation.damm-to-calculate-check-digit.error=input=57x is rejected; Batch does not strip separators or letters.
help.option.op_gen_batch.operation.damm-to-validate-check-digit=Checks the final digit with Damm; requires at least two ASCII digits and returns true/false.
help.option.op_gen_batch.operation.damm-to-validate-check-digit.example=With input=5724, result=true; 5725 returns false.
help.option.op_gen_batch.operation.damm-to-validate-check-digit.error=input=57x is rejected because it is not ASCII digits; 5725 is valid input and returns false.
help.option.op_gen_batch.operation.sha-1=Hashes UTF-8 with SHA-1 and returns the 20-byte digest in lowercase hex; retained for compatibility.
help.option.op_gen_batch.operation.sha-1.example=With input=abc, result=a9993e364706816aba3e25717850c26c9cd0d89d.
help.option.op_gen_batch.operation.sha-1.error=An empty string is valid; if a row omits input, the runner reports the missing source column.
help.option.op_gen_batch.operation.sha-224=Hashes UTF-8 with SHA-224 and returns 28 bytes (56 lowercase hex digits).
help.option.op_gen_batch.operation.sha-224.example=With input=abc, result=23097d223405d8228642a477bda255b32aadbce4bda0b3f7e36c9da7.
help.option.op_gen_batch.operation.sha-224.error=Input is UTF-8 text, not hexadecimal; a row without input fails before digest calculation.
help.option.op_gen_batch.operation.sha3-256=Calculates SHA3-256 (the SHA-3 family) over UTF-8 and returns 32 bytes in lowercase hex.
help.option.op_gen_batch.operation.sha3-256.example=With input=abc, result=3a985da74fe225b2045c172d6bd390bd855f086e3e9d525b46bfe24511431532.
help.option.op_gen_batch.operation.sha3-256.error=Input is not parsed as hex; an empty cell hashes zero bytes, while a missing column fails.
help.option.op_gen_batch.operation.sha3-512=Calculates SHA3-512 over UTF-8 bytes and returns 64 bytes (128 lowercase hex digits).
help.option.op_gen_batch.operation.sha3-512.example=With input=abc, the digest starts b751850b and has 128 hex digits.
help.option.op_gen_batch.operation.sha3-512.error=The operation accepts text; a missing input is reported at row level before hashing.
help.option.op_gen_batch.operation.md5=Calculates MD5 of UTF-8 bytes and returns 16 bytes in lowercase hex; the catalog labels it legacy.
help.option.op_gen_batch.operation.md5.example=With input=abc, result=900150983cd24fb0d6963f7d28e17f72.
help.option.op_gen_batch.operation.md5.error=Empty text is accepted; a missing input column is a row error, not an empty digest.
help.option.op_gen_batch.operation.crc32=Calculates CRC-32/ISO-HDLC over UTF-8 bytes and returns four bytes as lowercase hex.
help.option.op_gen_batch.operation.crc32.example=With input=123456789, result=cbf43926.
help.option.op_gen_batch.operation.crc32.error=This is a checksum of UTF-8 text, not hexadecimal-decoded bytes; a missing input column fails.
help.option.op_gen_batch.operation.crc32c=Calculates CRC-32C/Castagnoli (CRC-32/ISCSI), distinct from CRC-32/ISO-HDLC, over UTF-8.
help.option.op_gen_batch.operation.crc32c.example=With input=123456789, result=e3069283; CRC32 would produce cbf43926.
help.option.op_gen_batch.operation.crc32c.error=A JSONL row without input fails the required source-column check; when present, any UTF-8 text can be checksummed.
help.option.op_gen_batch.operation.utf8-to-base32=Encodes UTF-8 bytes with RFC 4648 Base32 and retains the padding emitted by the codec.
help.option.op_gen_batch.operation.utf8-to-base32.example=With input=foo, result=MZXW6===.
help.option.op_gen_batch.operation.utf8-to-base32.error=Empty text encodes to empty output; a missing source column fails in the runner.
help.option.op_gen_batch.operation.base32-to-utf8=Decodes Base32 using the codec's accepted alphabet/padding and converts bytes to UTF-8.
help.option.op_gen_batch.operation.base32-to-utf8.example=With input=MZXW6===, result=foo.
help.option.op_gen_batch.operation.base32-to-utf8.error=input=MZXW6=! is rejected as malformed Base32.
help.option.op_gen_batch.operation.utf8-to-base58=Converts UTF-8 bytes to the codec's Base58 alphabet; it does not add a Base58Check checksum.
help.option.op_gen_batch.operation.utf8-to-base58.example=With input=Hello World, result=JxF12TrwUP45BMd.
help.option.op_gen_batch.operation.utf8-to-base58.error=A row without input fails before encoding; with text present this Base58 operation encodes and does not add a checksum.
help.option.op_gen_batch.operation.base58-to-utf8=Decodes Base58 without a checksum and presents the resulting bytes as UTF-8.
help.option.op_gen_batch.operation.base58-to-utf8.example=With input=JxF12TrwUP45BMd, result=Hello World.
help.option.op_gen_batch.operation.base58-to-utf8.error=input=0 is rejected because 0 is not part of the codec's Base58 alphabet.
help.option.op_gen_batch.operation.utf8-to-base94=Encodes UTF-8 bytes as Base94 using the printable alphabet defined by the codec.
help.option.op_gen_batch.operation.utf8-to-base94.example=With input=foo, result=)(h".
help.option.op_gen_batch.operation.utf8-to-base94.error=A row without input fails the source-column check; any present UTF-8 text can be encoded.
help.option.op_gen_batch.operation.base94-to-utf8=Decodes this codec's Base94 representation and converts the resulting bytes to UTF-8.
help.option.op_gen_batch.operation.base94-to-utf8.example=With input=)(h", result=foo.
help.option.op_gen_batch.operation.base94-to-utf8.error=input= ! is rejected because it contains a space outside the accepted Base94 alphabet.
help.option.op_gen_batch.operation.decimal-to-packed-bcd-hex=Accepts ASCII decimal digits, packs one digit per nibble, and returns uppercase hex bytes, using F padding when needed.
help.option.op_gen_batch.operation.decimal-to-packed-bcd-hex.example=With input=12345, result=012345; an F nibble pads the final byte internally.
help.option.op_gen_batch.operation.decimal-to-packed-bcd-hex.error=input=12x fails because every position must be a decimal digit.
help.option.op_gen_batch.operation.packed-bcd-hex-to-decimal=Parses the cell as hex bytes containing packed-BCD nibbles and returns the decimal digits as text.
help.option.op_gen_batch.operation.packed-bcd-hex-to-decimal.example=With input=012345, result=012345; the represented leading zero is preserved.
help.option.op_gen_batch.operation.packed-bcd-hex-to-decimal.error=input=0 fails because hex has odd length; non-decimal BCD nibbles are also rejected.
help.option.op_gen_batch.operation.amex-se-to-calculate-check-digit=Returns only a digit using the same Luhn/Mod 10 calculation; the AMEX SE label does not check issuer or range.
help.option.op_gen_batch.operation.amex-se-to-calculate-check-digit.example=With input=7992739871, result=3; it does not validate an American Express prefix.
help.option.op_gen_batch.operation.amex-se-to-calculate-check-digit.error=input=12x is rejected for non-digits; this is not an AMEX account validator.
help.option.op_gen_batch.operation.pan-to-validate-luhn-13-19-digits=Returns true only for 13–19 ASCII digits with a valid Luhn check; it does not validate issuer or account.
help.option.op_gen_batch.operation.pan-to-validate-luhn-13-19-digits.example=With input=4111111111111111, result=true; 4111111111111112 returns false.
help.option.op_gen_batch.operation.pan-to-validate-luhn-13-19-digits.error=input=4111x... returns false for length/characters; it does not return a format diagnostic.
help.option.op_gen_batch.operation.track-2-to-analyze-json=Accepts Track 2 with or without sentinels; maps D/d to =, strips trailing F padding, and extracts PAN, YYMM expiry, and service code.
help.option.op_gen_batch.operation.track-2-to-analyze-json.example=With input=1234567890123456D2512101F, JSON contains pan=1234567890123456, expiry=2512, and serviceCode=101.
help.option.op_gen_batch.operation.track-2-to-analyze-json.error=input=not-track-data fails because the Track 2 separator and required fields are missing.
help.option.op_gen_batch.operation.emv-tlv-to-json=Reads EMV TLV hex and returns the parsed tree/tags as JSON; it does not validate a complete transaction.
help.option.op_gen_batch.operation.emv-tlv-to-json.example=With input=9F0206000000000100, JSON includes tag 9F02 with length 6.
help.option.op_gen_batch.operation.emv-tlv-to-json.error=input=ZZ fails before parsing: the expected representation is pairs of hexadecimal digits.
help.option.op_gen_batch.operation.apdu-status-to-inspect=Interprets a two-byte SW1/SW2 hexadecimal status word and returns its known meaning as JSON.
help.option.op_gen_batch.operation.apdu-status-to-inspect.example=With input=9000, JSON classifies the status as SUCCESS.
help.option.op_gen_batch.operation.apdu-status-to-inspect.error=input=900 is valid hex but has only three digits; an APDU status requires two bytes.
help.option.op_gen_batch.operation.asn-1-to-inspect=Tries hex first, then Base64; parses ASN.1 and returns a JSON tree without verifying signatures.
help.option.op_gen_batch.operation.asn-1-to-inspect.example=With input=3003020101 (a SEQUENCE containing INTEGER 1), JSON contains INTEGER.
help.option.op_gen_batch.operation.asn-1-to-inspect.error=input=ZZ cannot be decoded as hex/Base64 or parsed as ASN.1.
help.option.op_gen_batch.operation.tlv-to-inspect=Parses TLV bytes from hex and returns tags/values as JSON; it does not apply EMV transaction semantics.
help.option.op_gen_batch.operation.tlv-to-inspect.example=With input=5A081234567890123456, JSON includes tag 5A.
help.option.op_gen_batch.operation.tlv-to-inspect.error=input=ZZ fails hexadecimal decoding before TLV structure analysis.
help.option.op_gen_batch.operation.tr-31-to-header-json=Parses only the TR-31 header and its fields; it does not decrypt/authenticate the block or use a KBPK.
help.option.op_gen_batch.operation.tr-31-to-header-json.example=With input=B0016P0TE00E0000, JSON reports version B and usage PIN Encryption Key.
help.option.op_gen_batch.operation.tr-31-to-header-json.error=A header with version Z is rejected as unsupported TR-31; the block MAC is not verified.
help.field.op_gen_batch.input.label=Batch input text
help.field.op_gen_batch.input.description=CSV requires one header row; JSON Lines requires one object of scalar fields per non-empty line. Help never reads the text. CSV and JSONL reject sensitive field names; each cell is capped at 100,000 characters, total input at 100,000,000 characters, and the parser accepts at most 10,000 data rows.
help.field.op_gen_batch.input_format.description=Selects the parser for pasted text. CSV uses comma-delimited rows, double-quoted fields, escaped double quotes, and a required unique header. JSON Lines parses one non-empty object per line; arrays and nested values are rejected. Both formats require safe, non-sensitive column names.
help.field.op_gen_batch.source_column.description=Must exactly match a header/property name in every row. It may not be blank; all input rows must contain it. CSV/JSONL reject names that identify secrets or sensitive data (for example key, password, PIN, PAN, IV, nonce, AAD, token, certificate, signature, or MAC).
help.field.op_gen_batch.destination_column.description=Names the output property added to each successful row result. The input source and output destination are separate names; the selected operation reads only the source value and the result display shows up to 50 rows.
help.field.op_gen_batch.results.description=Shows at most 50 completed row outcomes with row number, OK/ERR, and output or error. A completed report can be exported with all rows; cancelled work has no exportable report.
help.field.op_gen_batch.progress.description=Progress counts rows that completed successfully or with an operation error. It does not count queued rows skipped after cancellation or stop-on-error.
help.field.op_gen_batch.compact.description=This checkbox is only used by the hidden Encrypt Record/Decrypt Record branch, which is not in the selectable catalog. It has no effect on any of the 40 available operations.
help.field.op_gen_batch.record_encoding.description=This selector only formats encrypted record output in the hidden Encrypt Record/Decrypt Record branch. None of the 40 selectable catalog operations uses it.
help.action.op_gen_batch.load_input.description=Reads the chosen file as UTF-8. The dialog accepts CSV, JSONL, NDJSON, or TXT; .csv selects CSV, while the other extensions select JSON Lines. Pasted text is parsed according to the visible input-format selector.
help.action.op_gen_batch.load_input.example=Loading rows.csv chooses CSV; loading rows.ndjson chooses JSON Lines. A file with a different extension also defaults to JSON Lines, so check the selected parser before Dry Run.
help.action.op_gen_batch.dry_run.description=Parses and validates row count, source/destination columns and selected operation. It does not call BatchOperationCatalog.execute, write a file, create history, or change the input text. It previews the plan in the result area.
help.action.op_gen_batch.dry_run.example=With source column payload while each row contains only input, Dry Run identifies the missing source field and leaves the selected conversion uncalled.
help.action.op_gen_batch.run.description=Parses the selected format, verifies each row has the source column, then runs the selected allowlisted stateless operation on each source string. Every attempted row keeps its row number and gets output or a specific error; no selectable operation reads key/IV/AAD fields.
help.action.op_gen_batch.run.example=With Hexadecimal → UTF-8 and input rows 4869, ZZ, and 776f, the report contains Hi, an invalid-hex error, and wo when Stop on error is off. When it is on, the first failing row requests cooperative cancellation; rows already running may finish.
help.action.op_gen_batch.cancel.description=Requests cooperative task cancellation. The coordinator discards the cancelled report and clears the result; partial results cannot be exported.
help.action.op_gen_batch.cancel.example=Cancel while rows are being processed; when the task finishes, status is Cancelled, visible results are cleared and Export has no completed report.
help.action.op_gen_batch.reset.description=Cancels active work and clears input, visible results, progress, report state, and temporary key/IV/AAD controls. It does not execute or export an operation.
help.action.op_gen_batch.reset.example=After entering sample rows, Reset empties the input and results, resets progress to zero, clears crypto scratch fields, and removes any completed report.
help.action.op_gen_batch.export.description=Writes the last completed report as UTF-8 CSV or JSON Lines using the separate export-format selector. Cancelled or absent reports cannot be exported; CSV escaping and JSON scalar serialization are handled by BatchOutputCodec.
help.action.op_gen_batch.export.example=After a completed two-row run, choose JSON Lines to save one result object per row, including row number, status, original row fields, destination field on success, or error text on failure.
help.field.op_gen_batch.export_format.description=Controls only the exported report serialization; it does not change input parsing. CSV is comma-delimited with escaped quoted cells; JSON Lines writes one object per row.

module.process.desc.consoleInput=Supplies a fixed text literal as UTF-8 bytes; its charset parameter controls how characters become bytes.

help.node.ports.console_input=No input port. Output: TEXT_UTF8.



module.process.desc.fileInput=Reads the configured file as raw bytes or decodes it as text using the selected charset.

help.node.ports.file_input=No input port. Output: BINARY.



module.process.desc.consoleOutput=Displays the incoming value in the process result; it is a sink and does not feed another node.

help.node.ports.console_output=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output contract BINARY is unused by the sink.



module.process.desc.fileOutput=Writes the incoming bytes to the configured destination, either unchanged in BINARY mode or encoded as text.

help.node.ports.file_output=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output contract BINARY is unused by the sink.

help.action.op_gen_process_designer.node.file_output.example=Connect `OK`, choose BINARY, and write `4F 4B`. Error case: a missing parent directory causes an I/O error during the write.



help.node.ports.base64=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.



module.process.desc.base64Encode=Encodes input bytes with the standard Base64 alphabet, including padding when required.

help.node.ports.base64_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BASE64.

help.action.op_gen_process_designer.node.base64_encode.example=Bytes `4D 61 6E` produce `TWFu`. Error case: with `input` unconnected, preflight reports the required port; empty input itself is valid and produces empty text.



help.node.ports.base64_decode=Required input accepts BASE64 or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.base64_decode.example=`SGk=` decodes to bytes `48 69` (`Hi`). Error case: `SG!k` contains `!`, outside the Base64 alphabet.


module.process.desc.base64urlEncode=Encodes bytes using the URL-safe Base64 alphabet, replacing `+`/`/` with `-`/`_` and omitting padding.

help.node.ports.base64url_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BASE64URL.

help.action.op_gen_process_designer.node.base64url_encode.example=Bytes `FB FF` produce `-_8`. Error case: leave `input` unconnected; preflight reports the required port. `-_8` must use the Base64URL decoder.


module.process.desc.base64urlDecode=Decodes URL-safe Base64 text into bytes; its accepted alphabet is distinct from standard Base64.

help.node.ports.base64url_decode=Required input accepts BASE64URL or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.base64url_decode.example=`-_8` returns bytes `FB FF`. Error case: `+` and `/` are standard Base64 symbols, not part of the URL-safe alphabet accepted here.


module.process.desc.hexEncode=Renders each input byte as two uppercase hexadecimal digits.

help.node.ports.hex_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output HEX.

help.action.op_gen_process_designer.node.hex_encode.example=Bytes `00 A5 FF` produce `00A5FF`. Error case: an unconnected `input` fails preflight; empty input and empty output are valid.



help.node.ports.hex_decode=Required input accepts HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.hex_decode.example=`4869` produces bytes `48 69` (`Hi`). Error case: `48G1` contains a non-hex digit; odd-length input also fails because it cannot form pairs.



help.node.ports.utf8_encode=Required input accepts TEXT_UTF8; output BINARY.




help.node.ports.utf8_decode=Required input accepts BINARY; output TEXT_UTF8.



module.process.desc.base32Encode=Encodes input bytes using the Base32 alphabet A–Z and 2–7.

help.node.ports.base32_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.base32_encode.example=Byte `66` (`f`) produces `MY======` with the codec’s padding. Error case: preflight identifies a missing required `input` connection.


module.process.desc.base32Decode=Decodes Base32 text into bytes.

help.node.ports.base32_decode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.base32_decode.example=`MY======` returns byte `66`. Error case: `M0======` uses `0`, outside the Base32 alphabet.


module.process.desc.base58Encode=Encodes bytes in the Bitcoin Base58 alphabet, which omits visually ambiguous characters.

help.node.ports.base58_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.



module.process.desc.base58Decode=Decodes Bitcoin-alphabet Base58 text into bytes, preserving leading `1` zero bytes.

help.node.ports.base58_decode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.



module.process.desc.base58checkEncode=Encodes bytes as Base58Check by adding the handler’s checksum before Base58 conversion.

help.node.ports.base58check_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.base58check_encode.example=Encodes the payload and appends a four-byte checksum; the decoder recovers the exact payload. Error case: preflight reports a missing required `input`.


module.process.desc.base58checkDecode=Decodes Base58Check and verifies its checksum before returning payload bytes.

help.node.ports.base58check_decode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.base58check_decode.example=Decodes and verifies the checksum before returning the payload. Error case: `1` does not contain a complete payload and checksum, so the decoder rejects it.


module.process.desc.ebcdicEncode=Encodes text bytes using the selected IBM EBCDIC code page; the chosen page affects character mappings.

help.node.ports.ebcdic_encode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.



module.process.desc.ebcdicDecode=Decodes bytes using the selected IBM EBCDIC code page into UTF-8 text.

help.node.ports.ebcdic_decode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.ebcdic_decode.example=Byte `C1` with IBM037 produces `A`. Error case (reproducible): imported configuration naming a page outside the offered choices fails validation as an unsupported EBCDIC page.


module.process.desc.compress=Compresses input bytes using the selected gzip, zlib or raw deflate wrapper.

help.node.ports.compress=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.compress.example=Compress UTF-8 bytes for `hello` with gzip; DECOMPRESS/gzip restores the same five bytes. zlib and deflate are different wrappers. Error case: validation rejects an unsupported format.


module.process.desc.decompress=Decompresses bytes using the selected gzip, zlib or raw deflate wrapper.

help.node.ports.decompress=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.decompress.example=A gzip stream produced by COMPRESS/gzip restores the original bytes. Error case: selecting zlib for this stream causes a wrapper/compressed-data failure.


module.process.desc.charsetConvert=Decodes bytes with sourceCharset and re-encodes the same text with targetCharset.

help.node.ports.charset_convert=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.charset_convert.example=Byte `E9` with ISO-8859-1 represents `é`; UTF-8 output is `C3 A9`. Real edge case: US-ASCII target yields `?` (byte `3F`) by replacement; the operation completes SUCCESS.


module.process.desc.concat=Appends the bytes from input a followed by input b; this is ordered byte concatenation.

help.node.ports.concat=Required inputs a and b accept BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.concat.example=`a=41`, `b=42` produces `41 42` in that order. Error case: if either required port is missing, validation names the missing port.


module.process.desc.slice=Extracts a byte range beginning at offset; length -1 means continue through the end.

help.node.ports.slice=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.slice.example=For `00 11 22 33`, offset 1 and length 2 (zero-based bytes) produce `11 22`. Error case: offset 5 exceeds the four-byte input.


module.process.desc.pad=Adds the selected padding scheme to reach a block-size boundary; the default block size is 16 bytes.

help.node.ports.pad=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.pad.example=With `41`, PKCS7, block size 4 produces `41 03 03 03`; blockSize accepts 1–256. PKCS5 fixes 8 bytes; ZERO/ISO-M1 have no marker. Error case: blockSize 0 is rejected.


module.process.desc.unpad=Removes and validates the selected trailing padding scheme; it does not decrypt or authenticate the data.

help.node.ports.unpad=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.unpad.example=PKCS7 removes `03 03 03` from `41 03 03 03` and returns `41`. ISO-M1/ZERO strip trailing zeros; M2/7816-4 find `80`. Error case: `41 02 03` has inconsistent PKCS7 bytes.


module.process.desc.xor=XORs two byte sequences position by position; both inputs must have matching lengths.

help.node.ports.xor=Required inputs a and b accept BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.xor.example=`A0 XOR 0F` produces `AF`. Error case: different input lengths are rejected, with both lengths in the diagnostic.


module.process.desc.assertEquals=Compares actual and expected input bytes and reports whether they are equal; it is a check, not a transformation.

help.node.ports.assert_equals=Required inputs actual and expected accept BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output BINARY.

help.action.op_gen_process_designer.node.assert_equals.example=`actual=CAFE` and `expected=CAFE` passes and preserves actual. Error case: `CAFE` versus `CAFF` fails with `Assertion failed`.


module.process.desc.asn1Decode=Parses ASN.1 BER/DER bytes and renders the structure as JSON or Markdown.

help.node.ports.asn1_decode=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.asn1_decode.example=DER `020101` parses as INTEGER 1; JSON returns a machine-readable structure and MARKDOWN a readable hierarchy. Error case: `0202FF` declares two value bytes but supplies one.


module.process.desc.checkDigitCalc=Calculates and appends the check digit for the selected algorithm; it does not establish that an identifier is issued or valid.

help.node.ports.check_digit_calc=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.



module.process.desc.checkDigitVerify=Checks whether the final digit of the input satisfies the selected algorithm; it does not verify issuer assignment.

help.node.ports.check_digit_verify=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.check_digit_verify.example=Luhn `79927398713` returns `true`; edge case: `79927398714` returns `false` without throwing because the check digit does not match.


module.process.desc.modularArithmetic=Computes the selected integer operation, with a hexadecimal modulus where the operation requires one.


help.action.op_gen_process_designer.node.modular_arithmetic.example=ADD with a=`03`, b=`04`, hex modulus `0B` produces 7. Error case: the multiplicative inverse of 6 modulo 9 does not exist because they are not coprime.


module.process.desc.uuidGenerate=Creates a random UUID v4 in the selected textual layout; it does not use input ports.

help.node.ports.uuid_generate=No input port. Output: TEXT_UTF8.

help.action.op_gen_process_designer.node.uuid_generate.example=STANDARD generates a hyphenated hexadecimal UUID v4; version nibble is 4 with the RFC variant. Edge case: each call is random, so no fixed value is predictable and it is not a secret key.


module.process.desc.byteStatistics=Reports descriptive statistics of the input bytes, including byte counts and distribution measures.

help.node.ports.byte_statistics=Required input accepts BASE64, BASE64URL, BINARY, HEX or TEXT_UTF8; output TEXT_UTF8.

help.action.op_gen_process_designer.node.byte_statistics.example=For `00 00 FF`, the report counts three bytes and two distinct values. Error case: required `input` is missing and ProcessEngine detects it before executing the handler.


help.node.parameter.compress.format=Compression wrapper; default gzip. gzip adds its header/trailer, zlib uses the zlib wrapper, and deflate is the raw DEFLATE stream. The node emits bytes; DECOMPRESS must use the same format.

help.node.parameter.decompress.format=Expected wrapper; default gzip. It must match COMPRESS/the source stream: gzip, zlib, or deflate. A wrong wrapper or truncated data fails during decompression.

help.node.parameter.uuid_generate.format=Presentation of a random UUID v4; default STANDARD (lowercase with hyphens). WITHOUT_HYPHENS removes hyphens; UPPERCASE uses uppercase letters. Format does not make it a cryptographic secret.

help.action.op_gen_process_designer.run.title=Run process

help.action.op_gen_process_designer.run.description=Executes the validated graph in dependency order. Node handlers can read configured files and write outputs; help itself never starts a run.

help.action.op_gen_process_designer.run.example=Connect CONSOLE_INPUT → BASE64_ENCODE → CONSOLE_OUTPUT, then Run; `Hi` reaches the output as `SGk=`. Missing required ports or parameters stop preflight.

help.action.op_gen_process_designer.dry_run.title=Dry run

help.action.op_gen_process_designer.dry_run.description=Checks graph connections and required configuration and presents the execution plan without invoking node handlers or producing final output.

help.action.op_gen_process_designer.dry_run.example=Dry-run CONSOLE_INPUT → HEX_ENCODE; the plan lists both nodes but does not produce file output. An unconnected required port is reported.

help.action.op_gen_process_designer.cancel.title=Cancel

help.action.op_gen_process_designer.cancel.description=Requests cancellation of an active run at the engine’s cancellation point; it is available only while work is active.

help.action.op_gen_process_designer.cancel.example=Start a multi-node run and choose Cancel; completed rows remain in the execution report and later nodes stop at a safe point.

help.action.op_gen_process_designer.load.title=Load

help.action.op_gen_process_designer.load.description=Opens a saved process definition and replaces the current graph/configuration after a file is selected.

help.action.op_gen_process_designer.load.example=Open a saved process file to restore its supported graph and parameters; transient secret inputs must be entered again.

help.action.op_gen_process_designer.save.title=Save

help.action.op_gen_process_designer.save.description=Serializes the supported graph and node configuration to a chosen process file. Transient secret values are omitted.

help.action.op_gen_process_designer.save.example=Save a CONSOLE_INPUT → HEX_ENCODE graph; reopening restores configuration but not transient secret inputs.

help.action.op_gen_process_designer.undo.title=Undo

help.action.op_gen_process_designer.undo.description=Restores the preceding graph edit from the undo history.

help.action.op_gen_process_designer.undo.example=Add a node, then Undo; the added node is removed. With no edit history, Undo has no change to apply.

help.action.op_gen_process_designer.redo.title=Redo

help.action.op_gen_process_designer.redo.description=Reapplies the graph edit most recently reverted by Undo.

help.action.op_gen_process_designer.redo.example=Undo an added node, then Redo; the node returns. Redo is unavailable when no edit was undone.

help.action.op_gen_process_designer.duplicate.title=Duplicate

help.action.op_gen_process_designer.duplicate.description=Duplicates the selected node and its configuration as a separate graph node; connections are not implied.

help.action.op_gen_process_designer.duplicate.example=Duplicate a selected HEX_ENCODE node; connect its input/output explicitly. With no selected node, there is nothing to duplicate.

help.action.op_gen_process_designer.layout.title=Layout

help.action.op_gen_process_designer.layout.description=Repositions graph nodes into a tidy layout; it does not change node settings or connections.

help.action.op_gen_process_designer.layout.example=Tidy a three-node graph; the links remain the same while node positions change.

help.action.op_gen_process_designer.clear.title=Clear

help.action.op_gen_process_designer.clear.description=Removes graph nodes and connections from the canvas. Use Reset Defaults to restore the initial preset graph.

help.action.op_gen_process_designer.clear.example=Clear a test graph; the canvas becomes empty. This action discards the current graph edits.

help.action.op_gen_process_designer.reset.title=Reset

help.action.op_gen_process_designer.reset.description=Clears the current graph and loads the built-in default SHA-256 example.

help.action.op_gen_process_designer.reset.example=Reset Defaults replaces a custom graph with the initial input → SHA-256 → output flow.

help.action.op_gen_process_designer.reverse_connection.title=Reverse connection

help.action.op_gen_process_designer.reverse_connection.description=Reverses the selected connection endpoints when the resulting port contracts remain valid; unavailable without a selected connection.

help.action.op_gen_process_designer.reverse_connection.example=Select a valid link and reverse it; the source and target switch. If the new direction violates port compatibility, the change is rejected.

help.action.op_gen_process_designer.connect.title=Connect

help.action.op_gen_process_designer.connect.description=Connects selected nodes or opens the target-port menu when the destination has multiple compatible inputs.

help.action.op_gen_process_designer.connect.example=Connect CONSOLE_INPUT to HEX_ENCODE input; an incompatible target representation is rejected.

help.action.op_gen_process_designer.create_node.title=Create node

help.action.op_gen_process_designer.create_node.description=Adds a node from the searchable palette; double-click a palette entry to place it on the canvas.

help.action.op_gen_process_designer.create_node.example=Search for HEX_ENCODE and double-click its entry; the new node appears on the canvas.

help.action.op_gen_process_designer.configure_node.title=Configure selected node

help.action.op_gen_process_designer.configure_node.description=Shows the selected node’s actual ports, parameters, defaults, option codes and visibility conditions from NodeCatalog.

help.action.op_gen_process_designer.configure_node.example=Select FILE_INPUT and switch readMode to TEXT; charset becomes applicable. A secret parameter value is never copied into help context.

help.action.op_gen_process_designer.edit_menu.title=Edit menu

help.action.op_gen_process_designer.edit_menu.description=Groups Undo/Redo, Duplicate, Tidy, Clear and Reset. With the canvas focused: Delete/Backspace removes the selection; Shortcut+Z undoes, Shortcut+Shift+Z or Shortcut+Y redoes, and Shortcut+D duplicates. Arrow keys move the node; Shift+Arrow moves it 10 px; Escape clears selection/cancels a connection drag.

help.action.op_gen_process_designer.edit_menu.example=Select a node and press Delete to remove it with its links; use Undo or Shortcut+Z to restore it. Shortcut maps to Cmd on macOS and Ctrl on other systems.

help.action.op_gen_process_designer.presets.title=Presets

help.action.op_gen_process_designer.presets.description=Replaces the current graph with one of four sample workflows: SHA-256 text digest, Base64 text encode, AES-GCM round trip or AES-CMAC.

help.action.op_gen_process_designer.presets.example=Choose Base64 text encode to load its sample graph. Preset selection replaces the current graph.

help.action.op_gen_process_designer.sha256_preset.title=SHA-256 text digest

help.action.op_gen_process_designer.sha256_preset.description=Loads a sample text input → SHA-256 → console output graph.

help.action.op_gen_process_designer.sha256_preset.example=Select the preset and run with sample text; the final node reports the digest.

help.action.op_gen_process_designer.base64_preset.title=Base64 text encode

help.action.op_gen_process_designer.base64_preset.description=Loads a text input → Base64 encode → console output sample graph.

help.action.op_gen_process_designer.base64_preset.example=The sample text `Hello` encodes to `SGVsbG8=`.

help.action.op_gen_process_designer.aes_gcm_preset.title=AES-GCM encrypt/decrypt preset

help.action.op_gen_process_designer.aes_gcm_preset.description=Loads a sample AES-GCM encrypt/decrypt round trip. Review key material and nonce requirements in each crypto node before execution.

help.action.op_gen_process_designer.aes_gcm_preset.example=The preset wires encryption output to decryption input; a missing or invalid key/nonce is reported by the node handler.

help.action.op_gen_process_designer.aes_cmac_preset.title=AES-CMAC preset

help.action.op_gen_process_designer.aes_cmac_preset.description=Loads a sample AES-CMAC graph that computes a message authentication code with a shared key.

help.action.op_gen_process_designer.aes_cmac_preset.example=Run the preset with its configured sample; changing the key changes the MAC.

help.action.op_gen_process_designer.zoom_in.title=Zoom in

help.action.op_gen_process_designer.zoom_in.description=Increases canvas scale for closer inspection; it does not change graph coordinates or data.

help.action.op_gen_process_designer.zoom_in.example=Zoom in makes node labels larger while the process graph stays unchanged.

help.action.op_gen_process_designer.zoom_out.title=Zoom out

help.action.op_gen_process_designer.zoom_out.description=Decreases canvas scale to show more of the graph.

help.action.op_gen_process_designer.zoom_out.example=Zoom out shows more nodes at once; node configuration is unchanged.

help.action.op_gen_process_designer.zoom_reset.title=Reset zoom

