help.operation.aux_byte_inspector.purpose=Shows selected bytes in available representations and reports offsets and lengths. A text view is not decryption.
help.operation.aux_epoch.purpose=Converts a Unix timestamp and date/time using the dialog’s selected unit and zone.
help.operation.aux_json.purpose=Changes JSON whitespace and indentation and reports parser errors. It does not validate a business schema or cryptographic claims.
help.operation.aux_uuid.purpose=Generates a random version 4 UUID in canonical format. The version and variant bits are part of its 128 bits; it is not a 128-bit secret key.
help.operation.op_gen_batch.purpose=Applies one selected stateless operation to each CSV or JSON Lines record and reports record-level results and errors.
help.operation.op_gen_check_digits.purpose=Computes or validates decimal check digits with Luhn, AMEX SE, Verhoeff or Damm. They detect some transcription errors; they do not prove identity or authenticity.
help.operation.op_gen_clipboard.purpose=Stores session entries with metadata and optional notes. Visibility and reuse follow entry classification and selected destination.
help.operation.op_gen_compressed_hex.purpose=Converts between conventional Hex and the two-row layout of high and low nibbles. “Compressed” describes the visual format, not data compression.
help.operation.op_gen_envelope_inspector.purpose=Reports envelope structure and public metadata. Unwrap is a separate explicit operation requiring a compatible recipient private key.
help.operation.op_gen_file.purpose=Converts files between formats, compares bytes, computes SHA-256 and shows a bounded preview. Help does not read paths or contents.
help.operation.op_gen_hash.purpose=Computes a digest over bytes. CRC32 detects accidental errors; MD4, MD5 and SHA-1 are legacy algorithms and must not be used for new collision-resistant designs.
help.operation.op_gen_manual.purpose=Converts representations and applies transformations with its own parser. Specialized actions may ignore the global formats; see the details of each button.
help.operation.op_gen_mod.purpose=Operates on big integers. Operands are interpreted as Hex, except XOR Decimal; some operations require a modulus and others do not.
help.operation.op_gen_process_designer.purpose=Connects typed nodes into a workflow. Port compatibility, required parameters and node conditions determine whether the graph can run.
help.operation.op_gen_random.purpose=Generates 1 to 1024 random bytes and presents them in the selected format. This is not equivalent to a UUID v4 and does not certify a key.
help.operation.op_keys_format_workbench.purpose=Detects, parses, converts or compares supported key and certificate formats. Parsing does not establish trust or certificate validity.
help.option.op_gen_check_digits.algorithm.amex_se_luhn_mod_10=The app implements this AMEX SE label with the same Luhn calculation as Luhn (Mod 10); it does not check issuer, card range or AMEX-specific validity.
help.option.op_gen_check_digits.algorithm.damm=Damm folds digits left-to-right through a quasigroup table; the implemented rule detects every single-digit error and adjacent transposition. Example: base 572 → complete value 5724.
help.option.op_gen_check_digits.algorithm.luhn_mod_10=Luhn doubles alternating base digits from the right, subtracts 9 from doubled values above 9, then chooses a digit that makes the total divisible by 10. Example: base 7992739871 → 79927398713.
help.option.op_gen_check_digits.algorithm.verhoeff=Verhoeff combines multiplication, position-dependent permutation and inverse tables; the implemented rule detects every single-digit error and most transpositions. Example: base 572 → complete value 5727.
help.option.op_gen_hash.algorithm.crc32=CRC-32/ISO-HDLC (reflected, init/xor FFFFFFFF). 4-byte checksum, not authentication. Detects accidental changes only.
help.option.op_gen_hash.algorithm.crc_32_bzip2=BZIP2 is not reflected; init and xorout FFFFFFFF. Detects accidental changes only.
help.option.op_gen_hash.algorithm.crc_32_iscsi=iSCSI uses the reflected Castagnoli polynomial; init and xorout FFFFFFFF. Detects accidental changes only.
help.option.op_gen_hash.algorithm.crc_32_iso_hdlc=ISO-HDLC reflects input/output; init and xorout FFFFFFFF. Detects accidental changes only.
help.option.op_gen_hash.algorithm.crc_32_jamcrc=JAMCRC is reflected; init FFFFFFFF and xorout 00000000. Detects accidental changes only.
help.option.op_gen_hash.algorithm.crc_32_mpeg_2=MPEG-2 is not reflected; init FFFFFFFF and xorout 00000000. Detects accidental changes only.
help.option.op_gen_hash.algorithm.crc_32_posix=POSIX is not reflected; init 00000000 and xorout FFFFFFFF. Detects accidental changes only.
