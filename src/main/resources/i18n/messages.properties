help.field.op_keys_kex_rsa.export_profile.description=Output form: Raw OAEP gives the bare RSA ciphertext, JWE Compact a JOSE token and CMS EnvelopedData a CMS structure.
help.field.op_keys_kex_rsa.envelope.label=Crypto Envelope
help.field.op_keys_kex_rsa.envelope.description=Wraps the result in a Crypto Envelope whose header carries the algorithm, key id, KCV and timestamp. Key ID and Key Version are optional labels.
