help.option.op_gen_hash.algorithm.tiger_192=TIGER-192 returns 24 bytes. 24-byte hash; evaluate compatibility before choosing it.
help.option.op_gen_hash.algorithm.whirlpool=WHIRLPOOL returns 64 bytes. 64-byte hash; evaluate compatibility before choosing it.
