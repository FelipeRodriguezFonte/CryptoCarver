help.field.op_keys_kex_rsa.private_key.description=PEM private key that matches the public key used to wrap.
help.field.op_keys_kex_rsa.wrapped.label=Wrapped data
help.field.op_keys_kex_rsa.wrapped.description=Wrapped key in the selected profile, or a Crypto Envelope.
help.field.op_keys_kex_rsa.import_profile.label=Profile
help.field.op_keys_kex_rsa.import_profile.description=Form of the pasted data. It is ignored when the data is a Crypto Envelope, whose own header is used.
help.field.op_keys_kex_rsa.import_result.label=Import result
help.field.op_keys_kex_rsa.import_result.description=The recovered key.
